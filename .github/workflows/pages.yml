# Veröffentlicht das Spiel auf GitHub Pages.
#
# Bei jedem Push auf main laufen zuerst die Playwright-Tests; nur wenn sie grün
# sind, wird manfredville.html als index.html veröffentlicht. Veröffentlicht
# wird bewusst NUR die Spieldatei - Doku, Tests und node_modules gehören nicht
# auf die Seite.
#
# Einmalig nötig: im Repository unter Settings → Pages bei „Source“
# „GitHub Actions“ auswählen.
name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Seite zusammenstellen
        run: |
          mkdir -p _site
          cp manfredville.html _site/index.html
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
