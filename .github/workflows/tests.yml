# Führt die Playwright-Tests bei jedem Push und Pull Request aus.
# Veröffentlicht wird über GitHub Pages direkt aus dem Branch main
# (index.html im Wurzelverzeichnis) - dafür braucht es keinen Workflow.
name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
