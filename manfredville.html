}
// ---- Belebte Landschaft (Hühner, springende Fische, Möwen) -------------------
// Bewusst KOMPLETT ZUSTANDSLOS: jede Bewegung ergibt sich allein aus der
// globalen `animClock` und einem ortsfesten Zufallswert (`hash`). Dadurch
// braucht es kein Update pro Frame, nichts muss beim Speichern mitgeschrieben
// werden, und ein geladener Spielstand sieht sofort genauso lebendig aus.
// (Die Schafe der Schaffarm sind bewusst anders gelöst - sie haben echten
// Zustand, weil der Schäfer ein konkretes Schaf ansteuern können muss.)
const CHICKENS_PER_FARM = 3;
function drawChickens(b) {
  const { tw } = currentTileSize();
  if (tw < 30) return; // aus der Ferne nur unruhige Pixel - dann weglassen
  for (let i = 0; i < CHICKENS_PER_FARM; i++) {
    const r1 = hash(b.x, b.y, 100 + i * 13);
    const r2 = hash(b.x, b.y, 200 + i * 17);
    const r3 = hash(b.x, b.y, 300 + i * 19);
    // Jedes Huhn trippelt auf einem kleinen eigenen Bogen um einen festen
    // Punkt neben dem Hof hin und her.
    const baseX = b.x + (r1 - 0.5) * 2.2;
    const baseY = b.y + 0.6 + (r2 - 0.5) * 1.6;
    const t = animClock / 1000;
    const swing = Math.sin(t * (0.5 + r3 * 0.5) + r1 * 6.283) * 0.35;
    const p = gridToScreen(baseX + swing, baseY - swing * 0.4);
    // Picken: kurze, schnelle Kopfsenkung in unregelmäßigem Takt
    const peckPhase = (t * (0.7 + r2 * 0.6) + r3 * 6.283) % 3;
    const pecking = peckPhase < 0.45;
    const hop = Math.abs(Math.sin(t * 6 + r1 * 6.283)) * (Math.abs(swing) > 0.2 ? 0.9 : 0);
    const scale = camera.zoom * 0.62;
    ctx.save();
    ctx.translate(p.x, p.y - hop * scale);
    ctx.scale(swing < 0 ? -scale : scale, scale);
    ctx.fillStyle = 'rgba(0,0,0,0.2)';
    ctx.beginPath(); ctx.ellipse(0, 1.5, 4.5, 1.6, 0, 0, Math.PI * 2); ctx.fill();
    // Beinchen
    ctx.strokeStyle = '#d99a3a'; ctx.lineWidth = 1; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(-1.2, -2); ctx.lineTo(-1.6, 1); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(1.2, -2); ctx.lineTo(1.6, 1); ctx.stroke();
    ctx.lineCap = 'butt';
    // Körper + Schwanzfeder
    ctx.fillStyle = '#f2ece2'; ctx.strokeStyle = 'rgba(80,70,60,0.55)'; ctx.lineWidth = 0.6;
    ctx.beginPath(); ctx.ellipse(0, -4.2, 3.6, 3, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(-3, -5); ctx.quadraticCurveTo(-6, -8, -4.6, -4.4); ctx.closePath();
    ctx.fill(); ctx.stroke();
    // Kopf (beim Picken abgesenkt und nach vorn geneigt)
    const hx = 3.2, hy = pecking ? -3.4 : -7.4;
    ctx.beginPath(); ctx.arc(hx, hy, 1.9, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#e0503f'; // Kamm
    ctx.beginPath(); ctx.arc(hx - 0.2, hy - 2, 0.9, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#e8a33a'; // Schnabel
    ctx.beginPath();
    ctx.moveTo(hx + 1.6, hy); ctx.lineTo(hx + 3.4, hy + (pecking ? 0.9 : 0.3)); ctx.lineTo(hx + 1.6, hy + 1.1);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#3a3228';
    ctx.beginPath(); ctx.arc(hx + 0.7, hy - 0.4, 0.35, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }
}
// Ein Fisch springt: kurzer Bogen aus dem Wasser plus zwei sich ausbreitende
// Wellenringe an der Eintauchstelle.
const FISH_JUMP_CYCLE = 7000; // ms zwischen zwei Sprüngen an derselben Stelle
const FISH_JUMP_DURATION = 900;
function drawJumpingFish() {
  const { tw, th } = currentTileSize();
  if (tw < 26) return;
  const w = canvas.clientWidth, h = canvas.clientHeight;
  for (const s of fishSpots) {
    const phase = hash(s.x, s.y, 55) * FISH_JUMP_CYCLE;
    const t = (animClock + phase) % FISH_JUMP_CYCLE;
    if (t > FISH_JUMP_DURATION) continue;
    const p = gridToScreen(s.x, s.y);
    if (p.x < -tw || p.x > w + tw || p.y < -th * 3 || p.y > h + th * 3) continue;
    const f = t / FISH_JUMP_DURATION;           // 0..1 über den Sprung
    const arc = Math.sin(f * Math.PI);           // Höhe: 0 -> 1 -> 0
    const z = arc * th * 1.1;
    const dx = (f - 0.5) * tw * 0.35;            // leichter Vorwärtsbogen
    const scale = camera.zoom;
    ctx.save();
    ctx.translate(p.x + dx, p.y - z);
    ctx.rotate((f - 0.5) * 1.6);
    ctx.scale(scale, scale);
    ctx.fillStyle = '#b9d2dd';
    ctx.strokeStyle = 'rgba(40,70,85,0.6)';
    ctx.lineWidth = 0.6;
    ctx.beginPath(); ctx.ellipse(0, 0, 4.2, 2, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(3.4, 0); ctx.lineTo(6, -2.2); ctx.lineTo(6, 2.2); ctx.closePath();
    ctx.fill(); ctx.stroke();
    ctx.restore();
    // Wellenringe am Absprung- und Eintauchpunkt
    ctx.save();
    ctx.strokeStyle = `rgba(226, 242, 250, ${0.5 * (1 - f)})`;
    ctx.lineWidth = 1.1;
    for (const [ringOff, ringF] of [[-tw * 0.17, f], [tw * 0.17, Math.max(0, f - 0.5) * 2]]) {
      if (ringF <= 0) continue;
      ctx.beginPath();
      ctx.ellipse(p.x + ringOff, p.y, tw * 0.1 + ringF * tw * 0.2, th * 0.06 + ringF * th * 0.12, 0, 0, Math.PI * 2);
      ctx.stroke();
    }
    ctx.restore();
  }
}
// Möwen kreisen auf großen, langsamen Ellipsen über der Wasserfläche. Sie
// werden hoch über dem Boden gezeichnet, mit einem kleinen Schatten darunter -
// das erzeugt den Eindruck von Höhe, ohne eine echte dritte Achse zu brauchen.
const GULL_COUNT = 5;
// Möwenpositionen als eigene, rein rechnerische Funktion - sie werden an ZWEI
// Stellen gebraucht: beim Zeichnen (drawGulls) und für die Möwenrufe, die nur
// erklingen sollen, wenn wirklich eine Möwe im Bild ist (updateAmbientSounds).
// Als gemeinsame Quelle statt zweier getrennter Rechnungen, damit Bild und Ton
// gar nicht erst auseinanderlaufen können.
function gullPositions() {
  const out = [];
  if (!sea || sea.tiles < 60) return out;
  const t = animClock / 1000;
  for (let i = 0; i < GULL_COUNT; i++) {
    const r1 = hash(i, 7, 401), r2 = hash(i, 13, 402), r3 = hash(i, 23, 403);
    const rx = sea.rx * (0.25 + r3 * 0.55);
    const ry = sea.ry * (0.25 + r1 * 0.55);
    // Die Winkelgeschwindigkeit wird aus der gewünschten BAHNGESCHWINDIGKEIT
    // abgeleitet, nicht fest vorgegeben: bei einer festen Umdrehungsdauer wäre
    // eine Möwe auf großer Bahn um ein Vielfaches schneller unterwegs als eine
    // auf kleiner (gemessen bis zu 4,3 Kacheln/Sekunde - das wirkte gehetzt).
    // So gleiten alle gleichmäßig mit gut 1 Kachel pro Sekunde, unabhängig
    // davon, wie weit ihre Runde ist.
    const meanR = Math.max(3, (rx + ry) / 2);
    const glideSpeed = 1.0 + r1 * 0.6;                  // Kacheln pro Sekunde
    const speed = glideSpeed / (2 * Math.PI * meanR);   // Umdrehungen pro Sekunde
    const ang = t * speed * Math.PI * 2 + r2 * Math.PI * 2;
    const gx = sea.cx + Math.cos(ang) * rx;
    const gy = sea.cy + Math.sin(ang) * ry;
    if (!inBounds(Math.round(gx), Math.round(gy))) continue;
    out.push({ x: gx, y: gy, ang, r2, r3 });
  }
  return out;
}
function drawGulls() {
  if (!sea || sea.tiles < 60) return;
  const { tw, th } = currentTileSize();
  if (tw < 24) return;
  const t = animClock / 1000;
  for (const gull of gullPositions()) {
    const { x: gx, y: gy, ang, r2, r3 } = gull;
    const p = gridToScreen(gx, gy);
    const height = (th * 2.2) * (0.7 + 0.3 * Math.sin(t * 0.25 + r2 * 6.283));
    const scale = camera.zoom * 0.9;
    // Schatten auf dem Wasser
    ctx.save();
    ctx.fillStyle = 'rgba(0,0,0,0.16)';
    ctx.beginPath(); ctx.ellipse(p.x, p.y, 4 * scale, 1.6 * scale, 0, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
    // Vogel: zwei geschwungene Flügelbögen. Möwen gleiten die meiste Zeit,
    // daher ein gemächlicher, flacher Schlag statt eines hektischen Flatterns.
    const flap = Math.sin(t * 1.1 + r3 * 6.283) * 0.6;
    ctx.save();
    ctx.translate(p.x, p.y - height);
    ctx.scale(Math.cos(ang) < 0 ? -scale : scale, scale);
    ctx.strokeStyle = 'rgba(248, 250, 252, 0.92)';
    ctx.lineWidth = 1.3;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(-5.5, flap * 1.6);
    ctx.quadraticCurveTo(-2.6, -2.2 - flap * 1.2, 0, 0);
    ctx.quadraticCurveTo(2.6, -2.2 - flap * 1.2, 5.5, flap * 1.6);
    ctx.stroke();
    ctx.lineCap = 'butt';
    ctx.restore();
  }
}
function drawAmbientLife() {
  for (const b of buildings) if (b.type === 'farm') drawChickens(b);
  drawJumpingFish();
  drawGulls();
}

// ---- Umgebungsgeräusche (sichtbarkeitsabhängig) ------------------------------
// GRUNDREGEL: Ein Umgebungsgeräusch erklingt nur, wenn die Quelle gerade im
// Fenster zu sehen ist (isOnScreen). Die Karte ist 80x80 Kacheln groß - ohne
// diese Kopplung würde man ein Meer am anderen Kartenende dauerhaft rauschen
// hören, obwohl man in den Bergen baut. Die Kamera ist damit gleichzeitig das
// "Ohr" des Spielers, was sich beim Verschieben der Karte sehr natürlich
// anfühlt: Geräusche schwellen an und ab, während man über die Karte fährt.
//
// Zwei unterschiedliche Arten von Geräuschen:
//  - EINZELEREIGNISSE (Möwenruf, Mühlenklappern): eigener Countdown, der nur
//    läuft, während mindestens eine sichtbare Quelle existiert. Feuert er ab,
//    wird EIN kurzer Klang gespielt und ein neuer, zufälliger Abstand gesetzt.
//  - DAUERKULISSE (Brandung): ein durchgehend laufender Rauschgenerator, dessen
//    Lautstärke stufenlos aus der Menge sichtbarer Uferkacheln folgt (siehe
//    AudioEngine.setSurfLevel) - kein Ein-/Ausschalten, sondern ein weiches
//    Auf- und Abblenden.
const SURF_FULL_TILES = 26;  // ab so vielen sichtbaren Uferkacheln ist die Brandung auf voller Lautstärke
let gullCryTimer = 0;
let millClackTimer = 0;
let ambientCheckTimer = 0;
// Die Sichtbarkeitsprüfung läuft absichtlich NICHT jeden Frame: Uferkacheln
// können in die Hunderte gehen, und für eine Geräuschkulisse reichen ~5
// Aktualisierungen pro Sekunde völlig. Zwischen zwei Prüfungen gelten die
// zuletzt ermittelten Werte weiter.
const AMBIENT_CHECK_INTERVAL = 200;
let visibleShoreTiles = 0;
let visibleGulls = 0;
let visibleMills = 0;
function refreshAmbientVisibility() {
  visibleShoreTiles = 0;
  for (const s of shoreSpots) {
    if (isOnScreen(s.x, s.y, 0.5)) visibleShoreTiles++;
    if (visibleShoreTiles >= SURF_FULL_TILES) break; // mehr als "voll laut" bringt nichts
  }
  visibleGulls = 0;
  for (const g of gullPositions()) if (isOnScreen(g.x, g.y, 0.5)) visibleGulls++;
  visibleMills = 0;
  for (const b of buildings) if (b.type === 'mill' && isOnScreen(b.x, b.y, 0.5)) visibleMills++;
}
function updateAmbientSounds(dt) {
  ambientCheckTimer += dt;
  if (ambientCheckTimer >= AMBIENT_CHECK_INTERVAL) {
    ambientCheckTimer = 0;
    refreshAmbientVisibility();
  }
  // Brandung: stufenlos aus der sichtbaren Ufermenge. Nachts etwas
  // zurückgenommen, damit die ruhigere Nachtstimmung nicht überrauscht wird.
  const surf = Math.min(1, visibleShoreTiles / SURF_FULL_TILES) * (1 - 0.3 * nightFactor());
  AudioEngine.setSurfLevel(surf);

  // Möwenrufe: nur solange mindestens eine Möwe im Bild ist. Möwen schlafen
  // nachts - deshalb tagsüber deutlich häufiger als in der Dämmerung.
  if (visibleGulls > 0 && sunHeight() > -0.1) {
    gullCryTimer -= dt;
    if (gullCryTimer <= 0) {
      AudioEngine.playGullCry();
      gullCryTimer = 3500 + Math.random() * 6000;
    }
  } else {
    // Zeit stehen lassen statt zurückzusetzen, sonst würde eine gerade wieder
    // ins Bild fliegende Möwe sofort losschreien.
    gullCryTimer = Math.max(gullCryTimer, 1200);
  }

  // Mühlenklappern: bewusst NICHT an die Produktion gekoppelt (anders als die
  // übrigen Verarbeiter-Arbeitsklänge, siehe PROCESSOR_WORK) - die Flügel einer
  // Mühle drehen sich im Bild ja auch dann, wenn gerade kein Getreide da ist.
  // Mehrere sichtbare Mühlen klappern nicht mehrfach übereinander, sondern nur
  // etwas dichter und lauter.
  if (visibleMills > 0) {
    millClackTimer -= dt;
    if (millClackTimer <= 0) {
      AudioEngine.playMillClack(Math.min(1, 0.55 + visibleMills * 0.2));
      millClackTimer = (1250 + Math.random() * 500) / Math.min(3, visibleMills);
    }
  } else {
    millClackTimer = Math.max(millClackTimer, 400);
  }
}
function drawCarrier(c) {
  const p0 = gridToScreen(c.path[c.segIndex].x, c.path[c.segIndex].y);
  const nextTile = c.path[c.segIndex + 1];
  const p1 = nextTile ? gridToScreen(nextTile.x, nextTile.y) : p0;
  const x = p0.x + (p1.x - p0.x) * c.segProgress;
  const y = p0.y + (p1.y - p0.y) * c.segProgress;
  // Während der Arbeits-Animation steht die Figur still (p0 === p1); die
  // Blickrichtung wird dann anhand des ursprünglichen Wegs zum Ziel bestimmt,
  // statt anhand der (in diesem Moment nicht vorhandenen) Bewegungsrichtung.
  // `workFacing` erlaubt es der auslösenden Stelle, die Blickrichtung während
  // der Arbeitsphase explizit vorzugeben (beim Scheren muss der Schäfer zum
  // Schaf schauen, das neben und nicht in Laufrichtung von ihm steht).
  const movingLeft = c.phase === 'working'
    ? (c.workFacing !== undefined ? c.workFacing : (c.target.x - c.building.x) < 0)
    : (p1.x - p0.x) < 0;
  const scale = MONSTER_BASE_SCALE * camera.zoom;

  // Fernansicht: ein Punkt statt der ganzen Comicfigur (rund 30 Pfade je
  // Figur). Der Träger bleibt damit als Bewegung auf der Straße sichtbar -
  // genau das, wofür man in der Übersicht hinschaut -, kostet aber fast nichts.
  if (viewDetail === 0) {
    const { th } = currentTileSize();
    ctx.fillStyle = '#8992c9';
    ctx.beginPath();
    ctx.arc(x, y - th * 0.16, Math.max(1.4, th * 0.13), 0, Math.PI * 2);
    ctx.fill();
    return;
  }
  drawMonster(x, y, scale, movingLeft);
  if (c.kind === 'field' && c.phase === 'working') {
    if (c.action === 'chop') drawChopAxe(x, y, scale, movingLeft, c.workTimer || 0);
    else if (c.action === 'mine' || c.action === 'quarry') drawPickaxe(x, y, scale, movingLeft, c.workTimer || 0);
    else if (c.action === 'fish') drawFishingRod(x, y, scale, movingLeft, c.workTimer || 0);
    else if (c.action === 'shear') drawShears(x, y, scale, movingLeft, c.workTimer || 0);
    else if (c.action === 'hunt') drawBow(x, y, scale, movingLeft, c.workTimer || 0);
    else if (c.action === 'trap') drawTrap(x, y, scale, movingLeft, c.workTimer || 0);
  }

  const iconOffset = 44 * scale;
  if (c.kind === 'field') {
    // Auf dem Hinweg trägt der Arbeiter ein Setzling-/Ährensymbol (beim Pflanzen)
    // bzw. läuft leer zum Erntefeld/Erzvorkommen; auf dem Rückweg trägt er beim
    // Ernten/Fällen/Abbauen die eingesammelte Ware, beim Pflanzen nichts mehr.
    const carrying = (c.action === 'plant' && c.phase === 'out') ||
      (c.phase === 'return' && ['harvest', 'chop', 'mine', 'quarry', 'fish', 'shear', 'hunt'].includes(c.action));
    if (carrying) {
      if (c.action === 'chop') {
        ctx.fillStyle = '#8a5a34';
        ctx.fillRect(x - 3, y - iconOffset, 6, 6);
        ctx.strokeStyle = 'rgba(0,0,0,0.35)';
        ctx.lineWidth = 1;
        ctx.strokeRect(x - 3, y - iconOffset, 6, 6);
      } else if (c.action === 'mine') {
        ctx.fillStyle = '#8f8f9a';
        ctx.beginPath();
        ctx.moveTo(x, y - iconOffset - 5);
        ctx.lineTo(x - 4, y - iconOffset - 1);
        ctx.lineTo(x - 2, y - iconOffset + 3);
        ctx.lineTo(x + 3, y - iconOffset + 1);
        ctx.lineTo(x + 3, y - iconOffset - 3);
        ctx.closePath();
        ctx.fill();
        ctx.strokeStyle = 'rgba(0,0,0,0.35)';
        ctx.lineWidth = 1;
        ctx.stroke();
      } else if (c.action === 'quarry') {
        ctx.fillStyle = '#9a958a';
        ctx.fillRect(x - 4, y - iconOffset - 3, 8, 6);
        ctx.strokeStyle = 'rgba(0,0,0,0.35)';
        ctx.lineWidth = 1;
        ctx.strokeRect(x - 4, y - iconOffset - 3, 8, 6);
      } else if (c.action === 'fish') {
        // silbriger Fisch mit Schwanzflosse statt eines abstrakten Kästchens
        ctx.fillStyle = '#a8c4d0';
        ctx.beginPath();
        ctx.ellipse(x - 1, y - iconOffset, 4, 2.2, -0.15, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = 'rgba(0,0,0,0.35)';
        ctx.lineWidth = 1;
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(x + 2.6, y - iconOffset - 0.4);
        ctx.lineTo(x + 5.4, y - iconOffset - 2.4);
        ctx.lineTo(x + 5.4, y - iconOffset + 1.6);
        ctx.closePath();
        ctx.fill(); ctx.stroke();
      } else if (c.action === 'shear') {
        // Wollknäuel: heller Kreis mit angedeuteten Vlies-Bögen
        ctx.fillStyle = '#f0ece0';
        ctx.beginPath();
        ctx.arc(x, y - iconOffset, 4, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = 'rgba(0,0,0,0.35)';
        ctx.lineWidth = 1;
        ctx.stroke();
        ctx.strokeStyle = 'rgba(150,140,120,0.7)';
        ctx.lineWidth = 0.7;
        ctx.beginPath(); ctx.arc(x, y - iconOffset - 1.6, 2.8, 0.25, Math.PI - 0.25); ctx.stroke();
        ctx.beginPath(); ctx.arc(x, y - iconOffset + 1.6, 2.8, 0.25, Math.PI - 0.25); ctx.stroke();
      } else if (c.action === 'hunt') {
        // Fleischstück mit angedeutetem Knochen statt eines abstrakten Kästchens
        ctx.fillStyle = '#a8563c';
        ctx.beginPath();
        ctx.ellipse(x, y - iconOffset, 4, 3, 0.3, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = 'rgba(0,0,0,0.35)';
        ctx.lineWidth = 1;
        ctx.stroke();
        ctx.strokeStyle = '#e8ded0';
        ctx.lineWidth = 1.4;
        ctx.lineCap = 'round';
        ctx.beginPath(); ctx.moveTo(x - 3, y - iconOffset + 3); ctx.lineTo(x - 5, y - iconOffset + 5); ctx.stroke();
        ctx.lineCap = 'butt';
      } else if (c.cropKind === 'tree') {
        ctx.fillStyle = '#4c9a52';
        ctx.beginPath();
        ctx.moveTo(x, y - iconOffset - 5);
        ctx.lineTo(x - 4, y - iconOffset + 1);
        ctx.lineTo(x + 4, y - iconOffset + 1);
        ctx.closePath();
        ctx.fill();
        ctx.strokeStyle = 'rgba(0,0,0,0.35)';
        ctx.lineWidth = 1;
        ctx.stroke();
      } else {
        ctx.fillStyle = '#d9c14c';
        ctx.beginPath();
        ctx.ellipse(x, y - iconOffset - 2, 3, 5, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = 'rgba(0,0,0,0.35)';
        ctx.lineWidth = 1;
        ctx.stroke();
      }
    }
  } else {
    // Warensymbol über dem Bewohner
    const GOOD_COLORS = GOOD_COLOR;
    ctx.fillStyle = GOOD_COLORS[c.good] || '#cccccc';
    ctx.fillRect(x - 3, y - iconOffset, 6, 6);
    ctx.strokeStyle = 'rgba(0,0,0,0.35)';
    ctx.lineWidth = 1;
    ctx.strokeRect(x - 3, y - iconOffset, 6, 6);
  }
}

// ---- Nebel des Krieges / Erkundung (NEU, v34.24) ----------------------------
// Zu Spielbeginn kennt der Spieler nur seine Startinsel. Alles andere liegt
// unter Nebel und wird erst sichtbar, wenn ein SCHIFF in die Nähe fährt
// (FOG_SHIP_RADIUS) - Erkundung ist damit eine eigene Aufgabe der Flotte.
// Auch jedes Gebäude hält seine Umgebung aufgedeckt (FOG_BUILDING_RADIUS).
//
// Unter dem Nebel wird nichts gezeichnet (weder Gelände noch Tiere noch
// Piraten), und gebaut werden kann dort nicht. Einmal aufgedeckt, bleibt
// eine Kachel aufgedeckt - es gibt bewusst keinen "grauen" Zwischenzustand.
//
// Gespeichert als Bitfeld (Base64). Alte Spielstände ohne Nebeldaten werden
// um alle eigenen Gebäude und Schiffe herum sowie auf der Startinsel
// aufgedeckt, der Rest der Karte liegt dann ebenfalls im Nebel.
const FOG_SHIP_RADIUS = 6;
const FOG_BUILDING_RADIUS = 6;
const FOG_TICK = 300;
let explored = new Uint8Array(0);
let fogTimer = 0;
let fogSilent = true; // beim Initialisieren keine "Insel entdeckt"-Meldungen
function isExplored(x, y) {
  x = Math.round(x); y = Math.round(y);
  if (!inBounds(x, y)) return false;
  return explored[y * CFG.mapSize + x] === 1;
}
function revealCircle(cx, cy, r) {
  const n = CFG.mapSize;
  const x0 = Math.max(0, Math.floor(cx - r)), x1 = Math.min(n - 1, Math.ceil(cx + r));
  const y0 = Math.max(0, Math.floor(cy - r)), y1 = Math.min(n - 1, Math.ceil(cy + r));
  let neu = 0;
  for (let y = y0; y <= y1; y++) {
    for (let x = x0; x <= x1; x++) {
      const i = y * n + x;
      if (explored[i]) continue;
      if ((x - cx) * (x - cx) + (y - cy) * (y - cy) > r * r) continue;
      explored[i] = 1;
      neu++;
      if (map[y][x].terrain !== 'water') {
        const id = islandAt(x, y);
        if (id >= 0 && islands[id] && !islands[id].discovered) {
          islands[id].discovered = true;
          if (!fogSilent) {
            logEvent(`🧭 Neue Insel entdeckt: ${islandLabel(id)} (${({ polar: 'Eisinsel im Norden', temperate: 'gemäßigte Insel', arid: 'heiße Insel im Süden' })[islands[id].climate] || 'Insel'}).`, 'discovery', { x, y });
          }
        }
      }
    }
  }
  return neu;
}
function revealAroundOwned() {
  for (const s of ships) revealCircle(s.x, s.y, FOG_SHIP_RADIUS);
  for (const b of buildings) revealCircle(b.x, b.y, FOG_BUILDING_RADIUS);
}
function revealHomeIsland() {
  if (homeIslandId < 0) return;
  const n = CFG.mapSize;
  for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) {
    if (map[y][x].terrain !== 'water' && islandAt(x, y) === homeIslandId) revealCircle(x, y, 3);
  }
}
function initFog() {
  fogSilent = true;
  explored = new Uint8Array(CFG.mapSize * CFG.mapSize);
  for (const isl of islands) isl.discovered = false;
  revealHomeIsland();
  revealAroundOwned();
  fogSilent = false;
}
function updateFog(dt) {
  fogTimer += dt;
  if (fogTimer < FOG_TICK) return;
  fogTimer = 0;
  revealAroundOwned();
}
function encodeFog() {
  const bytes = new Uint8Array(Math.ceil(explored.length / 8));
  for (let i = 0; i < explored.length; i++) if (explored[i]) bytes[i >> 3] |= 1 << (i & 7);
  let bin = '';
  for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
  return btoa(bin);
}
function decodeFog(str) {
  explored = new Uint8Array(CFG.mapSize * CFG.mapSize);
  try {
    const bin = atob(str);
    for (let i = 0; i < explored.length; i++) {
      const byte = bin.charCodeAt(i >> 3) || 0;
      explored[i] = (byte >> (i & 7)) & 1;
    }
    return true;
  } catch (e) { return false; }
}
// Nebelkachel: dunkles Blaugrau mit leichter Streuung und (in der Nahansicht)
// ein paar helleren Dunstschwaden, die über den Kachelrand hinausquellen und
// so die harte Rautenkante zur erkundeten Welt weicher machen.
function drawFogTile(gx, gy, px, py, hw, hh) {
  const v = hash(gx, gy, 151);
  const g = 34 + Math.round(v * 8);
  ctx.fillStyle = `rgb(${g - 8}, ${g}, ${g + 12})`;
  ctx.fill();
  if (viewDetail >= 2) {
    const t = animClock / 1000;
    ctx.fillStyle = 'rgba(120, 132, 150, 0.10)';
    for (let k = 0; k < 2; k++) {
      const ox = (hash(gx, gy, 160 + k) - 0.5) * hw + Math.sin(t * 0.2 + gx + k) * hw * 0.1;
      const oy = (hash(gx, gy, 170 + k) - 0.5) * hh;
      ctx.beginPath(); ctx.ellipse(px + ox, py + oy, hw * 0.75, hh * 0.75, 0, 0, Math.PI * 2); ctx.fill();
    }
  }
}
function drawTile(gx, gy) {
  const tile = map[gy][gx];
  // Die Raute wird hier von Hand aufgebaut statt über tileDiamond(): das
  // spart je Kachel fünf kurzlebige Objekte (Punktliste + Bildschirmpunkt),
  // bei 15000 Kacheln und 60 Bildern je Sekunde also über vier Millionen
  // Objekte pro Sekunde, die sonst nur für den Garbage Collector entstehen.
  const o = getOrigin(), ts = currentTileSize();
  const px = o.x + (gx - gy) * (ts.tw / 2);
  const py = o.y + (gx + gy) * (ts.th / 2);
  const hw = ts.tw / 2, hh = ts.th / 2;
  ctx.beginPath();
  ctx.moveTo(px, py - hh);
  ctx.lineTo(px + hw, py);
  ctx.lineTo(px, py + hh);
  ctx.lineTo(px - hw, py);
  ctx.closePath();
  // Nebel (v34.24): unerforschte Kacheln zeigen nichts von ihrem Inhalt
  if (explored[gy * CFG.mapSize + gx] !== 1) { drawFogTile(gx, gy, px, py, hw, hh); return; }
  // Geländefarben kommen aus der vorberechneten Klimatabelle (siehe
  // buildClimateColors): dieselbe Kachelart sieht im Norden verschneit, in der
  // Mitte grün und im Süden ausgedörrt aus, mit weichem Verlauf dazwischen.
  // Bestellte Felder behalten bewusst ihre eigene, klimaunabhängige Farbe -
  // ein bewirtschaftetes Getreidefeld sieht überall gleich aus, und der
  // Spieler soll seine Anbauflächen in jeder Zone sofort wiedererkennen.
  let base = tile.terrain === 'forest' ? climateColor(gy, 'forest')
    : tile.terrain === 'field' ? FIELD_COLORS[tile.growthKind] || FIELD_COLORS.crop
    : tile.terrain === 'mountain' ? climateColor(gy, 'mountain')
    : tile.terrain === 'water' ? climateColor(gy, tile.shallow ? 'shallow' : 'deep')
    : climateColor(gy, 'grass');
  if ((gx + gy) % 2 === 0) base = shade(base, -8);
  ctx.fillStyle = base;
  ctx.fill();
  // Wasser bekommt bewusst keinen dunklen Kachelrahmen - sonst zerfällt eine
  // zusammenhängende Meeresfläche optisch in ein Gitter aus Einzelkacheln.
  // Weit herausgezoomt (Stufe 0) entfällt der Rahmen ganz: bei 16 Pixel
  // Kachelbreite verschmelzen die Linien ohnehin zu einem grauen Schleier
  // über dem Land, kosten aber einen kompletten Pfad-Strich je Kachel.
  if (tile.terrain !== 'water' && viewDetail > 0) {
    ctx.strokeStyle = 'rgba(0,0,0,0.12)';
    ctx.lineWidth = 1;
    ctx.stroke();
  }
  if (tile.terrain === 'water') { drawWaterSurface(gx, gy, tile); return; }
  if (tile.road) drawRoadOverlay(gx, gy);
  // Bodendetails nur auf freiem, unbebautem Land - unter einer Straße oder
  // einem Gebäude wären sie ohnehin verdeckt und kosteten nur Zeichenzeit.
  else if (tile.terrain === 'grass' && !tile.building && tile.growthStage === undefined) {
    drawGroundDetail(gx, gy, climateAt(gx, gy));
  }
  if (tile.terrain === 'forest' && tile.trees > 0) drawTrees(gx, gy, tile.trees);
  else if (tile.terrain === 'mountain') drawMountainRock(gx, gy, oreOfTile(tile), tile.stone || 0);
  // Junge und reife Feldfrüchte sind aus der Ferne nur noch ein Farbton auf
  // der ohnehin eigenfarbigen Feldkachel - die Halme einzeln zu zeichnen
  // brächte kein sichtbares Bild mehr.
  else if (viewDetail === 0) { /* Feldfrucht-Details entfallen weit draußen */ }
  else if (tile.terrain === 'field' && tile.growthStage === maxGrowthStage(tile.growthKind)) drawRipeCrop(gx, gy, tile.growthKind);
  else if (tile.growthStage !== undefined && tile.growthStage < maxGrowthStage(tile.growthKind)) drawSapling(gx, gy, tile.growthStage, tile.growthKind);
  if (tile.building) drawBuilding(gx, gy, tile.building);
}
// Visualisiert das Einzugsgebiet einer ausgewählten Kapelle als transluzente
// Ellipse (Kreis im Gitterraum wird durch die isometrische Projektion zur
// Ellipse - Radius-Skalierung analog zu gridToScreen: dx/dy werden getrennt
// mit tw/2 bzw. th/2 skaliert, zusätzlich mit sqrt(2), da (gx-gy)/(gx+gy)
// eine um 45° gedrehte, um sqrt(2) gestreckte Basis ist).
// ---- Tag- und Nachtwechsel ---------------------------------------------------
// Ein voller Zyklus dauert DAY_LENGTH Millisekunden. `dayTime` läuft in [0,1):
// 0 = Mitternacht, 0.25 = Sonnenaufgang, 0.5 = Mittag, 0.75 = Sonnenuntergang.
// Das Spiel startet bewusst am frühen Morgen, damit man zuerst bei Tageslicht
// bauen kann und die erste Nacht als Wechsel erlebt.
const DAY_LENGTH = 270000; // 4,5 Minuten pro vollem Tag
let dayTime = 0.3;
function advanceDayTime(dt) {
  dayTime = (dayTime + dt / DAY_LENGTH) % 1;
}
// Sonnenstand von -1 (Mitternacht) über 0 (Auf-/Untergang) bis +1 (Mittag).
function sunHeight() {
  return Math.sin((dayTime - 0.25) * Math.PI * 2);
}
// Wie stark künstliches Licht wirkt (0 am Tag, 1 tief in der Nacht). Steuert
// die Fensterbeleuchtung - bewusst etwas früher einsetzend als die volle
// Dunkelheit, damit abends die Lichter angehen, bevor es stockfinster ist.
function nightLightFactor() {
  return Math.max(0, Math.min(1, (0.15 - sunHeight()) / 0.75));
}
// Wie "Nacht" es gerade ist (0 = heller Tag, 1 = tiefe Nacht) - dieselbe Kurve
// wie beim Fensterlicht, aber als eigene, sprechend benannte Funktion, weil sie
// nicht nur die Beleuchtung, sondern auch die Klangkulisse steuert: die Musik
// wird nachts leiser, dunkler und sparsamer (siehe AudioEngine.setNightFactor),
// und die Brandung nimmt sich etwas zurück (siehe updateAmbientSounds).
function nightFactor() {
  return nightLightFactor();
}

// ---- Leuchtturm & Tran (NEU, v34; Nacht-Beleuchtungseffekt in v34.4 wieder entfernt) --
// Bis v33.1 war Tran (Gut `oil`) nur eines von fünf austauschbaren Luxusgütern
// (siehe LUXURY_GOODS) - eine Insel mit viel Tabak brauchte praktisch nie
// welchen. Der Leuchtturm gibt Tran einen eigenen Zweck: eine Insel mit
// Leuchtturm verbraucht es zusätzlich aus genau demselben Inselvorrat, damit
// Schiffe, die auf einer Frachtroute diese Insel ansteuern, 50% schneller
// sind (siehe lighthouseSpeedBonus, LIGHTHOUSE_SPEED_BONUS).
// V34 hatte hier zusätzlich einen zweiten Effekt: nachts sollten alle
// Gebäude der Insel stärker leuchten und sichtbar ihre Umgebung erhellen
// (`drawLighthouseGlow`, für jedes Gebäude zwei Radialverläufe je Bild).
// Rückmeldung aus dem echten Spielbetrieb: auf einer entwickelten Insel mit
// vielen Gebäuden kostete das spürbar Bildrate (ein Radialverlauf-Fill ist
// nicht billig, hier ZWEI je Gebäude, JEDES Bild), und die sich
// überlappenden Schein-Kreise benachbarter Gebäude sahen eher wie eine
// zusammenhängende Dunstwolke aus, die alles darunter verdeckte, statt wie
// einzelne beleuchtete Häuser. Der Effekt ist deshalb ERSATZLOS entfernt -
// der Leuchtturm wirkt seit v34.4 nur noch über den Geschwindigkeitsbonus,
// `isl.lighthouseFueled` bleibt als Zustand bestehen (wird weiterhin genau
// wie zuvor einmal je Nacht gesetzt), hat aber keine zeichnende Wirkung mehr.
// Verbraucht wird EINMAL JE NACHT (nicht laufend) - genau dann, wenn die Sonne
// untergeht (dayTime kreuzt 0.75, siehe sunHeight). Reicht der Vorrat
// (mindestens 1 Tran), wird die Insel für die kommende Nacht UND den
// folgenden Tag "versorgt" markiert; reicht er nicht, bleiben beide Effekte
// bis zum nächsten Sonnenuntergang aus. Das ist die Umsetzung von "eine
// Einheit versorgt eine komplette Insel über eine Nacht" UND von "wird in
// beiden Fällen sehr sehr langsam verbraucht" (ein DAY_LENGTH-Zyklus dauert
// 4,5 Minuten - "einmal je Nacht" ist damit deutlich langsamer als jede
// andere Verbrauchsgröße im Spiel, siehe POP_CONSUME_INTERVAL & Co.).
let lastDayTimeForLighthouse = dayTime;
function updateLighthouses() {
  const prev = lastDayTimeForLighthouse, cur = dayTime;
  // Nur den normalen Vorwärtsschritt über die Schwelle 0.75 (Sonnenuntergang)
  // werten - NICHT den Sprung von ~0.99 zurück auf ~0.01 (Mitternacht-Wrap,
  // `cur < prev`), sonst würde ein einziger Frame um Mitternacht das Ereignis
  // fälschlich zweimal auslösen.
  const crossedSunset = cur >= prev && prev < 0.75 && cur >= 0.75;
  lastDayTimeForLighthouse = cur;
  if (!crossedSunset) return;
  for (const isl of islands) {
    const hatLeuchtturm = buildings.some(b => b.type === 'lighthouse' && islandOfBuilding(b) === isl.id);
    if (!hatLeuchtturm) { isl.lighthouseFueled = false; continue; }
    if (stockOf(isl.id, 'oil') >= 1) {
      spendFrom(isl.id, 'oil', 1);
      isl.lighthouseFueled = true;
    } else {
      isl.lighthouseFueled = false;
    }
  }
}
// drawLighthouseGlow() (v34: Radialschein um jedes Gebäude einer versorgten
// Insel) ist in v34.4 ersatzlos entfernt - siehe Kommentar oben bei
// updateLighthouses für den Grund (Bildrate + optisch eine Dunstwolke statt
// einzeln erkennbarer Lichter).

// ---- Wetter (v29, lokale Zellen seit v29.3) ---------------------------------
// Vier Wetterlagen. Jede besteht aus ZWEI Bedingungen, die zusammen gelten
// müssen: einer KLIMA-/GELÄNDEBINDUNG (Schneesturm nur über den Eisinseln,
// Nebel nur auf der Nordhälfte, Regen und Sturm nur über Wasser) und einer
// WETTERZELLE - einem begrenzten, runden Gebiet, das langsam über die Karte
// zieht.
//
// Bis v29.2 gab es nur die erste Bedingung, ein Ereignis lag damit über einer
// kompletten Zone - beim Nebel buchstäblich über der halben Karte. Das nahm dem
// Wetter jede Örtlichkeit: es war eher ein Bildschirmfilter als ein Vorgang an
// einer bestimmten Stelle. Eine Zelle ist mit 9-16 Kacheln Radius kaum größer
// als der sichtbare Ausschnitt, sodass man an ihren Rand fahren und aus ihr
// herausfahren kann.
//
// Immer läuft höchstens EINE Zelle gleichzeitig - die wichtigste Vereinfachung
// des Systems. Mehrere überlagerte Wetter wären weder zeichnerisch (zwei
// Partikelschichten übereinander) noch spielerisch (welcher Bremsfaktor gilt?)
// lesbar, und der Spieler soll auf einen Blick sagen können, warum sein Schiff
// gerade kriecht.
//
// Der Zustand ist ECHTER Zustand, wird aber bewusst NICHT gespeichert (wie die
// Rehe, siehe Vier-Kategorien-Lehre): nach dem Laden beginnt schlicht wieder
// eine Schönwetterphase. Das Wetter hat keinerlei dauerhafte Folgen, es
// verlangsamt nur, solange es läuft.
const WEATHER_KINDS = {
  // shipFactor: Anteil der normalen Schiffsgeschwindigkeit im KERN der Zelle.
  // Regen ist bewusst der einzige Effekt ohne Verlangsamung - er ist Stimmung,
  // kein Hindernis (so vom Nutzer gewünscht: Stürme und Nebel bremsen).
  //
  // growthFactor (NEU, v34.14): Anteil des normalen FELDWACHSTUMS im Kern der
  // Zelle - das Gegenstück zu shipFactor an Land. Bis v34.13 wirkte jede
  // Wetterlage ausschließlich auf Schiffe; die Dürre ist die erste, die
  // umgekehrt nur an Land etwas tut und Schiffe völlig unbehelligt lässt.
  rain:      { label: 'Regen',       icon: '🌧️', shipFactor: 1.0,  region: 'sea',   tone: 2600, sound: 0.5 },
  storm:     { label: 'Sturm',       icon: '🌊', shipFactor: 0.5,  region: 'sea',   tone: 700,  sound: 1.0 },
  snowstorm: { label: 'Schneesturm', icon: '🌨️', shipFactor: 0.6,  region: 'polar', tone: 820,  sound: 0.85 },
  fog:       { label: 'Nebel',       icon: '🌫️', shipFactor: 0.55, region: 'north', tone: 420,  sound: 0.22 },
  // Dürre (NEU, v34.14): das südliche Gegenstück zum Schneesturm des Nordens.
  // Region 'arid' meint ausdrücklich nur das LAND der heißen Zone - eine Dürre
  // über offenem Meer wäre ein Widerspruch in sich (siehe weatherZoneAllows).
  // Der Klang ist ein trockenes, leises Wehen: hoher Ton, geringer Pegel.
  drought:   { label: 'Dürre',       icon: '☀️', shipFactor: 1.0,  region: 'arid',  tone: 1900, sound: 0.3, growthFactor: 0.33 },
  // Nordlicht (NEU, v34.21): die erste GUTE Wetterlage. Sie bremst nichts,
  // sondern lässt die Wohnhäuser unter ihr schneller wachsen - die Bewohner
  // der Eisinseln sind nachts draußen und feiern das Schauspiel.
  // popGrowthFactor: Vielfaches des normalen Bevölkerungswachstums im Kern.
  // nightOnly: kann nur bei Dunkelheit beginnen und erlischt bei Tagesanbruch
  // (siehe startWeatherEvent/updateWeather) - ein Nordlicht am Mittag gäbe es
  // nicht zu sehen. Klanglich nur ein sehr leises, hohes Säuseln.
  aurora:    { label: 'Nordlicht',   icon: '🌌', shipFactor: 1.0,  region: 'polar', tone: 3400, sound: 0.08, popGrowthFactor: 2, nightOnly: true }
};
// Ab welcher Dunkelheit (nightLightFactor) ein Nordlicht beginnen darf bzw.
// unter welcher es wieder erlischt. Die Differenz verhindert, dass es in der
// Dämmerung an der Schwelle an- und ausflackert.
const AURORA_START_DARK = 0.55, AURORA_END_DARK = 0.3;
// Chance, dass bei Dunkelheit direkt ein Nordlicht gewählt wird (sonst würde
// es als eine von sechs Lagen UND nur nachts viel zu selten erscheinen).
const AURORA_NIGHT_CHANCE = 0.3;

function updateWeatherParticles(dt) {

  // nur der Bruchteil, der zufällig in der Zelle landete, wurde gezeichnet -

    drift: isSnow ? 18 + Math.random() * 24 : (weather.kind === 'storm' ? 95 : 42),

function weatherScreenBox() {
  if (!weather.kind) return null;
  const c = gridToScreen(weather.cx, weather.cy);
  const { tw } = currentTileSize();
  const rx = weather.radius * (tw / 2) * 1.1;
  const ry = rx * 0.5;
  const w = canvas.clientWidth, h = canvas.clientHeight;
  const x0 = Math.max(-60, c.x - rx), x1 = Math.min(w + 60, c.x + rx);

    g.addColorStop(0.75, `rgba(${tr}, ${tg}, ${tb}, 0.1)`);

    ctx.fillStyle = g;
    for (let x = x0; x < x1; x += strip) {
      const rel = (x - c.x) / rad; // -1..1 über die Zellbreite
      const rand = Math.max(0, 1 - rel * rel); // weich zu den Seiten auslaufen
      // Unterkante wellt sich langsam; zwei überlagerte Sinus wirken wie ein
      // Vorhang im Wind statt wie eine regelmäßige Welle.
      const unten = baseY + Math.sin(x * band.wave + t * band.speed + band.seed) * rad * 0.07
        + Math.sin(x * band.wave * 2.7 - t * band.speed * 1.6) * rad * 0.025;
      const h = hoch * (0.7 + 0.3 * Math.sin(x * band.wave * 1.9 + t * 0.21 + band.seed));
      // Strahlen: helle und dunklere Streifen, die langsam seitwärts wandern
      const strahl = 0.55 + 0.45 * Math.sin(x * 0.09 + t * 0.9 + band.seed * 3) * Math.sin(x * 0.023 - t * 0.35);
      ctx.globalAlpha = Math.max(0, Math.min(1, vis * rand * strahl));
      ctx.fillRect(x, unten - h, strip + 0.5, h + rad * 0.06);
    }
  }
  ctx.restore();
}
// Wetter-Abzeichen in der Titelzeile: erscheint nur, solange etwas los ist.
// Ohne diese Anzeige wäre für den Spieler nicht erklärbar, warum seine
// Frachtroute plötzlich zäh läuft - das Bild allein reicht dafür nicht, weil
// die Kamera ganz woanders stehen kann als das betroffene Schiff.
function updateWeatherUI() {
  const el = document.getElementById('weatherBadge');
  if (!el) return;
  const def = currentWeatherDef();
  const active = !!def && weather.intensity > 0.05;
  el.classList.toggle('active', active);
  if (!active) return;
  const zone = def.region === 'polar' ? 'den Eisinseln im Norden'
    : def.region === 'north' ? 'der Nordhälfte der Karte'
      : def.region === 'arid' ? 'den heißen Inseln im Süden' : 'dem offenen Meer';
  // Eine Lage nennt im Tooltip genau die Wirkung, die sie tatsächlich hat -
  // bei der Dürre (v34.14) ist das die Feld-, nicht die Schiffsbremse.
  const slow = def.shipFactor < 1 ? ` – Schiffe dort bis zu ${Math.round((1 - def.shipFactor) * 100)}% langsamer` : '';
  const dry = def.growthFactor ? ` – Felder und Bäume dort bis zu ${Math.round((1 - def.growthFactor) * 100)}% langsamer im Wachstum` : '';
  const pop = def.popGrowthFactor ? ` – Wohnhäuser dort wachsen bis zu ${def.popGrowthFactor}-mal so schnell (nur nachts sichtbar)` : '';
  // Ortsangabe (v29.3): seit das Wetter eine begrenzte Zelle ist, gehört ins
  // Abzeichen auch, WO sie steht - sonst sucht der Spieler ein Unwetter, das
  // er nirgends findet. Genannt wird die nächstgelegene Insel; liegt die Zelle
  // weit draußen, bleibt es beim offenen Meer. Der Kreis auf der Minimap zeigt
  // dieselbe Stelle grafisch.
  const nahe = islandAt(Math.round(weather.cx), Math.round(weather.cy));
  let ort = '';
  if (nahe >= 0) ort = ` bei ${islandLabel(nahe)}`;
  else {
    let best = -1, bestDist = Infinity;
    for (const isl of islands) {
      const d = Math.hypot(isl.cx - weather.cx, isl.cy - weather.cy);
      if (d < bestDist) { bestDist = d; best = isl.id; }
    }
    if (best >= 0 && bestDist <= weather.radius + 14) ort = ` nahe ${islandLabel(best)}`;
  }
  el.textContent = `${def.icon} ${def.label}${ort}`;
  el.title = `${def.label} über ${zone}${ort ? ',' + ort : ''}${slow}${dry}${pop}. Die gestrichelte Fläche auf der Minimap zeigt, wie weit die Zelle reicht.`;
}
// Farbschleier über die gesamte Karte: nachts kühles Blau, in der Dämmerung
// zusätzlich ein warmer Orangeton. Wird als letzter Schritt über die fertige
// Szene gelegt - dadurch wirkt es auf Gelände, Gebäude, Träger und Schafe
// gleichermaßen, ohne dass eine einzige Zeichenfunktion davon wissen muss.
function drawDaylightOverlay() {
  const sun = sunHeight();
  const w = canvas.clientWidth, h = canvas.clientHeight;
  // Das Abdunkeln beginnt bewusst schon ein Stück VOR dem rechnerischen
  // Sonnenuntergang (sun = 0.12 statt 0) - sonst wäre die Dämmerung genauso
  // hell wie der Mittag und der Unterschied kaum zu sehen.
  const darkness = Math.max(0, Math.min(1, (0.12 - sun) / 0.97));
  if (darkness > 0.005) {
    ctx.save();
    ctx.fillStyle = `rgba(22, 32, 74, ${darkness * 0.5})`;
    ctx.fillRect(0, 0, w, h);
    ctx.restore();
  }
  // Dämmerung: schmales Fenster rund um den Horizontdurchgang (sun ≈ 0).
  // Bewusst als normale Deckfarbe statt im 'overlay'-Modus - der wirkte auf
  // den mittelhellen Grüntönen der Karte fast gar nicht.
  const twilight = Math.max(0, 1 - Math.abs(sun) * 3.2);
  if (twilight > 0.01) {
    ctx.save();
    // morgens kühler-rosa, abends satter orange - so ist erkennbar, welche
    // Tageshälfte gerade läuft
    const evening = dayTime > 0.5;
    ctx.fillStyle = evening
      ? `rgba(255, 122, 38, ${twilight * 0.22})`
      : `rgba(255, 158, 128, ${twilight * 0.16})`;
    ctx.fillRect(0, 0, w, h);
    ctx.restore();
  }
}
// Uhrzeit als "HH:MM" plus passendes Symbol für die Anzeige oben links.
function dayTimeLabel() {
  const totalMin = Math.floor(dayTime * 24 * 60);
  const hh = String(Math.floor(totalMin / 60)).padStart(2, '0');
  const mm = String(totalMin % 60).padStart(2, '0');
  const sun = sunHeight();
  const icon = sun > 0.25 ? '☀️' : (sun > -0.15 ? '🌅' : '🌙');
  return `${icon} ${hh}:${mm}`;
}
function drawRadiusEllipse(gx, gy, radius, fill, stroke) {
  const p = gridToScreen(gx, gy);
  const { tw, th } = currentTileSize();
  const rx = radius * (tw / 2) * Math.SQRT2;
  const ry = radius * (th / 2) * Math.SQRT2;
  ctx.save();
  ctx.beginPath();
  ctx.ellipse(p.x, p.y, rx, ry, 0, 0, Math.PI * 2);
  ctx.fillStyle = fill;
  ctx.fill();
  ctx.strokeStyle = stroke;
  ctx.lineWidth = 2;
  ctx.setLineDash([6, 5]);
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.restore();
}
function drawCoverageRadius(b) {
  drawRadiusEllipse(b.x, b.y, b.def.radius, 'rgba(232, 223, 168, 0.12)', 'rgba(232, 223, 168, 0.65)');
}
// Kleiner, nicht mitzoomender Hinweistext über der Vorschau-Kachel. Erklärt
// direkt am Mauszeiger, WARUM hier (nicht) gebaut werden kann - das ersetzt
// das frühere feste Hilfe-Panel durch Hilfe genau dort, wo man sie braucht.
function drawPreviewLabel(x, y, text, ok) {
  ctx.save();
  ctx.font = 'bold 12px "Trebuchet MS", "Segoe UI", sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  const padX = 8, h = 22;
  const w = ctx.measureText(text).width + padX * 2;
  // am Rand einklemmen, damit das Schild nie halb aus dem Bild ragt
  const cx = Math.max(w / 2 + 4, Math.min(canvas.clientWidth - w / 2 - 4, x));
  const cy = Math.max(h / 2 + 4, y);
  ctx.fillStyle = 'rgba(20, 16, 10, 0.88)';
  ctx.strokeStyle = ok ? 'rgba(120, 210, 140, 0.85)' : 'rgba(232, 110, 96, 0.85)';
  ctx.lineWidth = 1.2;
  ctx.beginPath();
  ctx.roundRect(cx - w / 2, cy - h / 2, w, h, 6);
  ctx.fill();
  ctx.stroke();
  ctx.fillStyle = ok ? '#cdeacd' : '#f2c3bc';
  ctx.fillText(text, cx, cy + 0.5);
  ctx.restore();
}
// Bauvorschau unter dem Mauszeiger: eingefärbte Zielkachel (grün = geht,
// rot = geht nicht), bei Gebäuden zusätzlich eine halbtransparente
// "Geistervorschau" des Gebäudes, sein Arbeits-/Einzugsradius und ein
// Hinweisschild mit dem Grund. Die Baubarkeit kommt aus derselben Funktion
// wie beim echten Bauen (canBuildHere), kann also nicht davon abweichen.
function drawBuildPreview(gx, gy) {
  const check = canBuildHere(gx, gy, currentTool);
  const isDemolish = currentTool === 'demolish';
  const def = buildingTypes[currentTool];

  // Reihenfolge von unten nach oben: Radius (flach auf dem Boden) -> gefärbte
  // Zielkachel -> Geistergebäude -> Hinweisschild. Das Gebäude MUSS über der
  // Farbfläche liegen, sonst übertönt die grüne Füllung es fast vollständig.
  if (def && def.radius && (check.ok || def.needsWater)) {
    // Bei der Fischerhütte zeigt der Radius, in dem Wasser liegen MUSS - auch
    // (und gerade) dann, wenn dort gerade keines liegt; er wird dann blau
    // statt sandfarben eingefärbt.
    const showAsWater = def.needsWater && !check.ok;
    drawRadiusEllipse(gx, gy, def.radius,
      showAsWater ? 'rgba(90, 160, 210, 0.10)' : 'rgba(232, 223, 168, 0.10)',
      showAsWater ? 'rgba(120, 190, 230, 0.55)' : 'rgba(232, 223, 168, 0.5)');
  }

  const pts = tileDiamond(gx, gy);
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(pts[0].x, pts[0].y);
  for (let i = 1; i < 4; i++) ctx.lineTo(pts[i].x, pts[i].y);
  ctx.closePath();
  let fill, stroke;
  if (isDemolish) {
    // Abriss ist bewusst immer rot markiert, wenn er möglich ist ("das hier
    // verschwindet"); ist nichts zu entfernen, bleibt es neutral grau.
    fill = check.ok ? 'rgba(224, 90, 78, 0.32)' : 'rgba(180, 180, 180, 0.15)';
    stroke = check.ok ? '#e05a4e' : 'rgba(210,210,210,0.6)';
  } else if (!check.ok) {
    fill = 'rgba(224, 90, 78, 0.30)';
    stroke = '#e05a4e';
  } else if (check.note) {
    fill = 'rgba(242, 217, 138, 0.20)';
    stroke = '#f2d98a';
  } else {
    fill = 'rgba(96, 200, 120, 0.28)';
    stroke = '#63d17e';
  }
  ctx.fillStyle = fill;
  ctx.fill();
  ctx.strokeStyle = stroke;
  ctx.lineWidth = 2.5;
  ctx.stroke();
  ctx.restore();

  // Halbtransparente "Geistervorschau" des Gebäudes auf der Zielkachel.
  if (def && check.ok) {
    ctx.save();
    ctx.globalAlpha = 0.7;
    drawBuilding(gx, gy, { type: currentTool, x: gx, y: gy, def, blocked: null, population: 1, storage: {} });
    ctx.restore();
  }

  if (check.reason) {
    const { th } = currentTileSize();
    const p = gridToScreen(gx, gy);
    drawPreviewLabel(p.x, p.y - th * 1.6 - 28, check.reason, isDemolish ? true : check.ok);
  }
}
// ---- Fernansicht: das Gelände als EIN Bild (NEU, v31) -----------------------
// Beim Herauszoomen wächst die Zahl sichtbarer Kacheln quadratisch: bei Zoom
// 0,25 sind über 15000 Kacheln im Bild. Selbst wenn jede davon nur noch eine
// gefüllte Raute ist, sind das 15000 Pfade je Bild - gemessen rund 31 ms, also
// weniger als 30 Bilder je Sekunde, und genau das Ruckeln, das der Nutzer beim
// Herauszoomen gemeldet hat.
//
// DIE EINSICHT: die isometrische Projektion ist eine LINEARE Abbildung des
// Kachelgitters. Ein Kachelraster lässt sich damit als gewöhnliches Bild
// (ein Pixel je Kachel) zeichnen und mit EINEM ctx.transform + drawImage in
// die Rautenansicht kippen - statt 15000 Pfaden also ein einziger Aufruf, den
// die Grafikkarte ohnehin am besten kann. Genau dieselbe Idee steckt schon
// seit v24 in der Minimap; neu ist, dass sie auch die Hauptansicht trägt.
//
// Der Puffer wird nicht jedes Bild neu gefüllt (19600 Pixel), sondern höchstens
// alle FAR_TERRAIN_REFRESH Millisekunden - Gelände ändert sich beim Bauen einer
// Straße oder beim Abtragen eines Berges, nicht 60-mal je Sekunde. Eine
// Verzögerung von einem Drittel Sekunde in der Übersicht fällt niemandem auf,
// eine Neuberechnung je Bild dagegen sehr wohl.
const farTerrainCanvas = document.createElement('canvas');
const farTerrainCtx = farTerrainCanvas.getContext('2d');
let farTerrainBuiltAt = -1e9;
let farTerrainSize = -1;
const FAR_TERRAIN_REFRESH = 350;
// Zwei Bildpunkte je Kachelkante statt einem. Das trägt keine zusätzliche
// Information, halbiert aber den Vergrößerungsfaktor beim Zeichnen: die weiche
// Interpolation wirkt dann nur noch im schmalen Saum zwischen zwei Kacheln,
// statt die ganze Fläche zu verwaschen. Kosten: viermal so viele Pixel in
// einem Puffer, der ohnehin nur alle 350 ms neu gefüllt wird.
const FAR_TERRAIN_SCALE = 2;
const FOG_RGB = [30, 36, 48];
function rebuildFarTerrain() {
  const n = CFG.mapSize;
  const w = n * FAR_TERRAIN_SCALE;
  if (farTerrainCanvas.width !== w) { farTerrainCanvas.width = w; farTerrainCanvas.height = w; }
  const img = farTerrainCtx.createImageData(w, w);
  const d = img.data;
  const ROAD = [138, 115, 85], STONE_ROAD = [154, 149, 143];
  const fieldRgb = {};
  for (const k in FIELD_COLORS) fieldRgb[k] = hexToRgb(FIELD_COLORS[k]);
  for (let y = 0; y < n; y++) {
    // Klimafarben einmal je ZEILE auflösen - sie hängen nur von y ab. Es sind
    // exakt dieselben Farben wie in drawTile, damit sich beim Umschalten
    // zwischen Nah- und Fernansicht der Farbton der Karte nicht ändert.
    const deep = hexToRgb(climateColor(y, 'deep'));
    const shallow = hexToRgb(climateColor(y, 'shallow'));
    const forest = hexToRgb(climateColor(y, 'forest'));
    const mountain = hexToRgb(climateColor(y, 'mountain'));
    const grass = hexToRgb(climateColor(y, 'grass'));
    for (let x = 0; x < n; x++) {
      const t = map[y][x];
      let c, tune = 0;
      if (explored[y * n + x] !== 1) c = FOG_RGB; // Nebel (v34.24)
      else if (t.road) c = t.stoneRoad ? STONE_ROAD : ROAD;
      else if (t.terrain === 'water') c = t.shallow ? shallow : deep;
      else if (t.terrain === 'forest') {
        // Dichter Wald dunkler als gelichteter. In der Nahansicht sieht man
        // die einzelnen Bäume; in der Übersicht soll wenigstens erkennbar
        // bleiben, wo schon abgeholzt wurde.
        c = forest; tune = 12 - Math.min(4, t.trees || 0) * 6;
      } else if (t.terrain === 'mountain') {
        c = mountain;
        // Erzadern hellen den Fels auf - dieselbe Aussage wie die Sprenkel in
        // der Nahansicht: hier lohnt eine Mine.
        if ((t.iron | 0) > 0 || (t.gold | 0) > 0) tune = 20;
      } else if (t.terrain === 'field') c = fieldRgb[t.growthKind] || fieldRgb.crop;
      else c = grass;
      const r = Math.max(0, Math.min(255, c[0] + tune));
      const g = Math.max(0, Math.min(255, c[1] + tune));
      const bl = Math.max(0, Math.min(255, c[2] + tune));
      for (let sy = 0; sy < FAR_TERRAIN_SCALE; sy++) {
        let i = ((y * FAR_TERRAIN_SCALE + sy) * w + x * FAR_TERRAIN_SCALE) * 4;
        for (let sx = 0; sx < FAR_TERRAIN_SCALE; sx++) {
          d[i++] = r; d[i++] = g; d[i++] = bl; d[i++] = 255;
        }
      }
    }
  }
  farTerrainCtx.putImageData(img, 0, 0);
  farTerrainBuiltAt = animClock;
  farTerrainSize = n;
}
function drawFarTerrain() {
  if (farTerrainSize !== CFG.mapSize || animClock - farTerrainBuiltAt >= FAR_TERRAIN_REFRESH) rebuildFarTerrain();
  const o = getOrigin(), { tw, th } = currentTileSize();
  ctx.save();
  // Die Matrix bildet Bildpunkt (x,y) auf o + (x-y)*tw/2, (x+y)*th/2 ab - also
  // genau auf gridToScreen. Der halbe Kachelversatz im f-Glied gleicht aus,
  // dass ein Bildpixel die Kachel-FLÄCHE abdeckt, gridToScreen aber ihren
  // MITTELPUNKT liefert.
  // ctx.transform (nicht setTransform!) - die Grundmatrix trägt den
  // Geräte-Pixelfaktor (siehe resizeCanvas); sie zu ÜBERSCHREIBEN würde das
  // Bild auf Retina-Bildschirmen auf halber Größe in die Ecke setzen.
  // Der Puffer hat FAR_TERRAIN_SCALE Bildpunkte je Kachel, die Matrix wird
  // deshalb entsprechend feiner skaliert.
  const s = FAR_TERRAIN_SCALE;
  ctx.transform(tw / (2 * s), th / (2 * s), -tw / (2 * s), th / (2 * s), o.x, o.y - th / 2);
  // Weiche Interpolation: ohne sie zerfällt die Übersicht in harte Farbstufen,
  // mit ihr wirkt sie wie eine gemalte Landkarte.
  ctx.imageSmoothingEnabled = true;
  ctx.drawImage(farTerrainCanvas, 0, 0);
  ctx.restore();
}
// Gebäude in der Fernansicht: nach Tiefe sortiert (vorne zuletzt), damit sich
// dicht stehende Häuser genauso überlappen wie in der Nahansicht.
function drawFarBuildings() {
  const list = buildings.slice().sort((a, b) => (a.x + a.y) - (b.x + b.y));
  for (const b of list) {
    const p = gridToScreen(b.x, b.y);
    drawBuildingFar(p.x, p.y, b);
  }
}
function render() {
  refreshCanvasSize();
  ctx.clearRect(0, 0, _viewCanvasW, _viewCanvasH);
  // EINMAL je Bild bestimmt, wie fein gezeichnet wird (siehe detailLevel).
  viewDetail = detailLevel();
  if (viewDetail === 0) {
    drawFarTerrain();
    drawFarBuildings();
    drawShips();
    drawPirates();
    drawShipWrecks();
    drawCombatFx();
    drawWhaleBoats();
    drawFireUnits();
    for (const c of carriers) drawCarrier(c);
    drawDaylightOverlay();
    drawWeatherOverlay();
    if (selectedBuilding && ['chapel', 'tavern', 'theater', 'cathedral', 'doctor'].includes(selectedBuilding.type)) {
      drawCoverageRadius(selectedBuilding);
    }
    if (hoverTile && inBounds(hoverTile.x, hoverTile.y) && currentTool !== 'pan') {
      drawBuildPreview(hoverTile.x, hoverTile.y);
    }
    return;
  }
  // Bei der jetzt deutlich größeren Karte lohnt es sich, Kacheln weit
  // außerhalb des sichtbaren Bereichs gar nicht erst zu zeichnen.
  const { tw, th } = currentTileSize();
  const marginX = tw * 1.5, marginY = th * 3;
  const w = canvas.clientWidth, h = canvas.clientHeight;
  const maxSum = (CFG.mapSize - 1) * 2;
  const o = getOrigin();
  // Bei 80x80 Kacheln lohnt es sich, den sichtbaren Bereich direkt AUSZURECHNEN,
  // statt für jede der 6400 Kacheln gridToScreen aufzurufen und sie dann zu
  // verwerfen. Beide Screen-Koordinaten hängen linear von (gx+gy) bzw. (gx-gy)
  // ab: y = o.y + sum*(th/2) ist für eine ganze Diagonale konstant (unsichtbare
  // Diagonalen fallen also am Stück weg), und daraus lässt sich der sichtbare
  // gx-Bereich innerhalb der Diagonale geschlossen bestimmen.
  for (let sum = 0; sum <= maxSum; sum++) {
    const rowY = o.y + sum * (th / 2);
    if (rowY < -marginY || rowY > h + marginY) continue;
    // -marginX <= o.x + (2*gx - sum) * (tw/2) <= w + marginX  nach gx aufgelöst
    const loK = (-marginX - o.x) / (tw / 2);
    const hiK = (w + marginX - o.x) / (tw / 2);
    let gxFrom = Math.max(0, Math.ceil((sum + loK) / 2), sum - CFG.mapSize + 1);
    let gxTo = Math.min(CFG.mapSize - 1, Math.floor((sum + hiK) / 2), sum);
    for (let gx = gxFrom; gx <= gxTo; gx++) drawTile(gx, sum - gx);
  }
  // Kleinlebewesen und Träger sind bei Detailstufe 0 kleiner als ein Pixel -
  // Hühner, Rehe, springende Fische, Möwen und Schafe entfallen dort ganz.
  // Schiffe und Träger bleiben: das Schiff ist ein Spielobjekt, das man
  // gerade in der Übersicht sucht, und die Träger zeigen, ob eine Straße
  // wirklich benutzt wird - beide werden dafür nur noch grob gezeichnet
  // (siehe drawCarrier/drawShips).
  if (viewDetail > 0) {
    drawAmbientLife();
    drawAllDeer();
    drawAllElephants();
    drawAllPolarBears();
    drawAllSeals();
  }
  drawWhalePods(); // Walschulen (v34.25) - unter den Schiffen
  drawShips();
  drawPirates(); // Piraten (v34.22) - dieselbe Ebene wie die eigenen Schiffe
  drawShipWrecks();
  drawCombatFx();
  drawHullBars();
  drawWhaleBoats(); // Walfangboote liegen auf derselben Ebene wie die Frachter
  drawFireUnits(); // Löschhelfer (v34.7, seit v34.9 Bewohner statt Kutsche) - dieselbe Ebene, dieselbe Begründung
  if (viewDetail > 0) for (const b of buildings) if (b.sheep) drawSheep(b);
  for (const c of carriers) drawCarrier(c);
  // Der Tageslicht-Schleier kommt über die komplette Szene, aber VOR die
  // Bedien-Overlays (Einzugsradius, Bauvorschau) - die sollen auch nachts
  // gleich gut lesbar bleiben.
  drawDaylightOverlay();
  // Wetter liegt ÜBER dem Tageslicht-Schleier (ein Sturm verdunkelt zusätzlich),
  // aber unter Einzugsradius und Bauvorschau - die müssen auch im Schneetreiben
  // lesbar bleiben.
  drawWeatherOverlay();
  if (selectedBuilding && ['chapel', 'tavern', 'theater', 'cathedral', 'doctor'].includes(selectedBuilding.type)) {
    drawCoverageRadius(selectedBuilding);
  }
  if (hoverTile && inBounds(hoverTile.x, hoverTile.y) && currentTool !== 'pan') {
    drawBuildPreview(hoverTile.x, hoverTile.y);
  }
}

// ---- Minimap ---------------------------------------------------------------
// Einfache, nicht-isometrische Draufsicht der ganzen Karte (quadratisches
// Kachelraster statt Diamant-Projektion - für eine Übersichtskarte deutlich
// einfacher zu lesen als eine verkleinerte iso-Ansicht). Wird gedrosselt über
// einen eigenen Timer neu gezeichnet (siehe update()), nicht jeden Frame, da
// 40x40 Kacheln pro Aufruf sonst unnötig Rechenzeit kosten würden.
const minimapCanvas = document.getElementById('minimap');
const minimapCtx = minimapCanvas.getContext('2d');
// Die Geländeschicht der Minimap wird in einen eigenen, kachelgenau kleinen
// Puffer (1 Pixel je Kachel) geschrieben und beim Zeichnen nur noch
// hochskaliert darüber gelegt.
//
// WARUM (v24): Vorher malte die Minimap für jede Kachel ein fillRect - bei
// 80x80 waren das 6400 Aufrufe, bei 140x140 sind es 19600, und das alle 300ms.
// Gemessen: 4,2 ms je Aufruf, also mehrfach pro Sekunde ein verlorener Frame.
// Ein ImageData-Puffer füllt dieselbe Fläche als reines Typed-Array und ist
// darin um Größenordnungen schneller; das Hochskalieren übernimmt drawImage.
const minimapTerrainCanvas = document.createElement('canvas');
const minimapTerrainCtx = minimapTerrainCanvas.getContext('2d');
function hexToRgb(hex) {
  const n = parseInt(hex.slice(1), 16);
  return [(n >> 16) & 0xff, (n >> 8) & 0xff, n & 0xff];
}
function renderMinimapTerrain() {
  const n = CFG.mapSize;
  if (minimapTerrainCanvas.width !== n) { minimapTerrainCanvas.width = n; minimapTerrainCanvas.height = n; }
  const img = minimapTerrainCtx.createImageData(n, n);
  const d = img.data;
  const FIELD_CROP = [156, 138, 74], FIELD_HOPS = [124, 129, 72];
  const ROAD = [170, 140, 100], STONE_ROAD = [230, 226, 216];
  for (let y = 0; y < n; y++) {
    // Klimafarben einmal JE ZEILE auflösen statt je Kachel - sie hängen
    // ohnehin nur von y ab (siehe buildClimateColors).
    const deep = hexToRgb(climateColor(y, 'deep'));
    const shallow = hexToRgb(climateColor(y, 'shallow'));
    // Wald auf der Minimap bewusst dunkler als auf der Hauptkarte: auf einem
    // Pixel pro Kachel hebt er sich sonst nicht vom offenen Land ab.
    const forest = hexToRgb(shade(climateColor(y, 'forest'), -18));
    const mountain = hexToRgb(climateColor(y, 'mountain'));
    const grass = hexToRgb(climateColor(y, 'grass'));
    for (let x = 0; x < n; x++) {
      const t = map[y][x];
      let c;
      if (explored[y * n + x] !== 1) c = FOG_RGB; // Nebel (v34.24)
      else if (t.road) c = t.stoneRoad ? STONE_ROAD : ROAD;
      else if (t.terrain === 'water') c = t.shallow ? shallow : deep;
      else if (t.terrain === 'forest') c = forest;
      else if (t.terrain === 'mountain') c = mountain;
      else if (t.terrain === 'field') c = t.growthKind === 'hops' ? FIELD_HOPS : FIELD_CROP;
      else c = grass;
      const i = (y * n + x) * 4;
      d[i] = c[0]; d[i + 1] = c[1]; d[i + 2] = c[2]; d[i + 3] = 255;
    }

  minimapTerrainCtx.putImageData(img, 0, 0);
}
function renderMinimap() {
  const w = minimapCanvas.width, h = minimapCanvas.height;
  const cell = w / CFG.mapSize;
  minimapCtx.clearRect(0, 0, w, h);
  renderMinimapTerrain();
  // Kein Weichzeichnen beim Hochskalieren: die Kacheln sollen als klare
  // Farbflächen stehenbleiben, nicht ineinanderlaufen.
  minimapCtx.imageSmoothingEnabled = false;
  minimapCtx.drawImage(minimapTerrainCanvas, 0, 0, w, h);
  // Gebäude als kleine helle Punkte. Die beiden Warenknoten (Lagerhaus und seit

  // sind sie die Ankerpunkte, an denen man seine Stützpunkte wiederfindet.
  for (const b of buildings) {
    const node = isStorageNode(b);
    minimapCtx.fillStyle = b.type === 'kontor' ? '#7ec9f2' : (node ? '#f2d98a' : '#e8dfc0');
    const s = node ? cell + 2.4 : cell + 1;

  }

  // einer NICHT gerade sichtbaren Insel überhaupt bemerkt - ohne diesen
  // Marker müsste man erst über den 🔥-Badge stolpern und dann raten, wo.
  // Walschulen (v34.25) als kleine helle Punkte - nur im erkundeten Meer
  for (const w of whalePods) {

    minimapCtx.fillStyle = 'rgba(220, 240, 250, 0.95)';
    minimapCtx.beginPath(); minimapCtx.arc(w.x * cell, w.y * cell, Math.max(1.5, cell * 1.1), 0, Math.PI * 2); minimapCtx.fill();
    minimapCtx.strokeStyle = 'rgba(40, 70, 100, 0.9)'; minimapCtx.lineWidth = 0.8; minimapCtx.stroke();
  }
  // Kranke Häuser (v34.24) als pulsierende grüne Ringe
  const krankNow = buildings.filter(b => b.type === 'house' && b.sick);
  if (krankNow.length) {
    const pulse = 0.55 + 0.45 * Math.sin(animClock * 0.005);
    minimapCtx.save();
    for (const b of krankNow) {
      minimapCtx.beginPath();
      minimapCtx.arc(b.x * cell, b.y * cell, cell * 1.6 + pulse, 0, Math.PI * 2);
      minimapCtx.strokeStyle = `rgba(140, 220, 90, ${0.5 + 0.5 * pulse})`;
      minimapCtx.lineWidth = 1.3;
      minimapCtx.stroke();
    }
    minimapCtx.restore();
  }
  const burningNow = buildings.filter(b => b.onFire);
  if (burningNow.length) {
    const pulse = 0.55 + 0.45 * Math.sin(animClock * 0.006);
    minimapCtx.save();
    for (const b of burningNow) {
      const px = b.x * cell, py = b.y * cell;
      minimapCtx.beginPath();
      minimapCtx.arc(px, py, cell * 1.8 + pulse * 1.2, 0, Math.PI * 2);
      minimapCtx.fillStyle = `rgba(255, 90, 46, ${0.3 * pulse})`;
      minimapCtx.fill();
      minimapCtx.beginPath();
      minimapCtx.arc(px, py, cell * 1.8, 0, Math.PI * 2);
      minimapCtx.strokeStyle = `rgba(255, 90, 46, ${0.85 * pulse})`;
      minimapCtx.lineWidth = 1.3;
      minimapCtx.stroke();
    }
    minimapCtx.restore();

  // die Minikarte der einzige Ort, an dem man sie findet, wenn sie gerade
  // hinter einer anderen Insel auf Jagd sind.
  if (pirates.length) {
    const pulse = 0.55 + 0.45 * Math.sin(animClock * 0.008);
    minimapCtx.save();
    for (const p of pirates) {
      if (!isExplored(p.x, p.y)) continue; // im Nebel unsichtbar (v34.24)
      minimapCtx.beginPath();
      minimapCtx.arc(p.x * cell, p.y * cell, cell * 1.6 + pulse, 0, Math.PI * 2);
      minimapCtx.fillStyle = '#141212';
      minimapCtx.fill();
      minimapCtx.strokeStyle = `rgba(230, 60, 50, ${0.6 + 0.4 * pulse})`;
      minimapCtx.lineWidth = 1.3;
      minimapCtx.stroke();
    }
    minimapCtx.restore();
  }
  // Frachtrouten als dünne Linien zwischen ihren Kontoren (v26) - so sieht man
  // auf der Übersichtskarte, welche Inseln bereits miteinander handeln.
  if (routes.length) {
    minimapCtx.strokeStyle = 'rgba(126, 201, 242, 0.65)';
    minimapCtx.lineWidth = 1;
    minimapCtx.setLineDash([3, 3]);
    // Seit v32 ist eine Route ein Rundkurs über beliebig viele Stationen - die
    // Linie wird deshalb GESCHLOSSEN gezeichnet (letzte Station zurück zur
    // ersten). Bei zwei Stationen fallen Hin- und Rückweg aufeinander, das
    // Bild bleibt also genau das alte.
    for (const r of routes) {
      minimapCtx.beginPath();
      r.stops.forEach((st, i) => {
        const px = st.x * cell, py = st.y * cell;
        if (i === 0) minimapCtx.moveTo(px, py); else minimapCtx.lineTo(px, py);

      minimapCtx.stroke();
    }
    minimapCtx.setLineDash([]);
  }

  // "wo zieht es gerade?" eine echte Frage - und die Übersichtskarte ist der
  // einzige Ort, an dem sie sich beantworten lässt, ohne die Karte abzufahren.
  // Bewusst nur ein dünner Ring plus schwache Füllung: das Wetter soll die
  // Warenknoten und Routen nicht überdecken.
  if (weatherActive()) {
    const def = currentWeatherDef();
    const farbe = weather.kind === 'storm' ? '90, 130, 190'
      : weather.kind === 'rain' ? '120, 170, 210'
        : weather.kind === 'snowstorm' ? '235, 245, 250'
          : weather.kind === 'drought' ? '240, 196, 110' // warmes Sandgelb, wie der Schleier auf der Karte
            : weather.kind === 'aurora' ? '110, 240, 170' // Nordlichtgrün
              : '225, 232, 238';
    minimapCtx.save();
    minimapCtx.beginPath();
    minimapCtx.arc(weather.cx * cell, weather.cy * cell, weather.radius * cell, 0, Math.PI * 2);
    minimapCtx.fillStyle = `rgba(${farbe}, ${0.18 * weather.intensity})`;
    minimapCtx.fill();
    minimapCtx.strokeStyle = `rgba(${farbe}, ${0.75 * weather.intensity})`;
    minimapCtx.lineWidth = 1;
    minimapCtx.setLineDash([2, 2]);
    minimapCtx.stroke();
    minimapCtx.setLineDash([]);
    minimapCtx.restore();
  }
  // Aktueller Sichtbereich: die 4 Bildschirmecken des Hauptcanvas zurück ins
  // Gitter projiziert ergeben (wegen der iso-Projektion) ein gedrehtes
  // Viereck statt eines achsenparallelen Rechtecks - das exakt nachzuzeichnen
  // gibt einen stimmigen Eindruck vom sichtbaren Kartenausschnitt.
  const cw = canvas.clientWidth, ch = canvas.clientHeight;
  const corners = [screenToGrid(0, 0), screenToGrid(cw, 0), screenToGrid(cw, ch), screenToGrid(0, ch)];
  minimapCtx.strokeStyle = '#f2d98a';
  minimapCtx.lineWidth = 1.4;
  minimapCtx.beginPath();
  corners.forEach((c, i) => {
    const px = c.x * cell, py = c.y * cell;
    if (i === 0) minimapCtx.moveTo(px, py); else minimapCtx.lineTo(px, py);
  });
  minimapCtx.closePath();
  minimapCtx.stroke();
}
// Klick/Tipp auf die Minimap zentriert die Hauptkarte auf die angeklickte Stelle.
function jumpToMinimapPos(clientX, clientY) {
  const r = minimapCanvas.getBoundingClientRect();
  const cell = minimapCanvas.width / CFG.mapSize;
  const mx = (clientX - r.left) * (minimapCanvas.width / r.width);
  const my = (clientY - r.top) * (minimapCanvas.height / r.height);
  const gx = Math.floor(mx / cell), gy = Math.floor(my / cell);
  if (!inBounds(gx, gy)) return;
  const p = gridToScreen(gx, gy);
  const targetX = canvas.clientWidth / 2, targetY = canvas.clientHeight * 0.55;
  camera.panX += targetX - p.x;
  camera.panY += targetY - p.y;
}
minimapCanvas.addEventListener('click', e => jumpToMinimapPos(e.clientX, e.clientY));

});
minimapCanvas.addEventListener('touchstart', e => {

    e.preventDefault();
    jumpToMinimapPos(e.touches[0].clientX, e.touches[0].clientY);

}, { passive: false });

function setStatus(text) {

// ---- Warenbestand JE INSEL (v25) --------------------------------------------
// Bis v24 gab es EINEN dorfweiten Vorrat (`globalStorage`). Seit v25 hat jede
// Insel ihren eigenen: was auf einer Insel produziert wird, ist auf einer
// anderen nicht verfügbar, bis es per Schiff hinübergebracht wird (siehe
// shipLoad/shipUnload). Das bisherige Prinzip „EIN geteiltes Objekt statt
// mehrerer synchronisierter Objekte" bleibt dabei erhalten - es gilt jetzt nur
// je Insel statt kartenweit: alle Lagerhäuser EINER Insel zeigen weiterhin auf
// dasselbe Objekt, es gibt also nach wie vor nichts zu summieren.
//
// Jede Funktion, die Bestand liest oder verbraucht, braucht deshalb ab jetzt
// eine Insel-ID. Woher sie kommt, hängt vom Aufrufer ab: beim Bauen von der
// Zielkachel, bei einem Wohnhaus von seinem eigenen Standort, in der Topbar von
// der gerade betrachteten Insel (siehe activeIslandId).
function stockOf(islandId, good) {
  const s = storageOfIsland(islandId);
  return (s && s[good]) || 0;
}
// Zieht `amount` von einem Gut ab. Nur sinnvoll aufzurufen, nachdem
// stockOf(islandId, good) >= amount bereits geprüft wurde.
function spendFrom(islandId, good, amount) {
  const s = storageOfIsland(islandId);
  if (!s) return;
  s[good] = Math.max(0, (s[good] || 0) - amount);
}
function addTo(islandId, good, amount) {
  const s = storageOfIsland(islandId);
  if (!s) return;
  s[good] = (s[good] || 0) + amount;
}
// Nahrung ist die Summe aller Güter aus POP_FOOD_GOODS (Brot, Fisch, Wildbret) -
// die Bewohner unterscheiden nicht, wovon sie satt werden. Verbraucht wird in
// der Reihenfolge von POP_FOOD_GOODS, also erst Brot, dann Fisch, dann Wildbret.
function foodOf(islandId) {
  let sum = 0;
  for (const g of POP_FOOD_GOODS) sum += stockOf(islandId, g);
  return sum;
}
function spendFoodFrom(islandId, amount) {
  let remaining = amount;
  for (const g of POP_FOOD_GOODS) {
    if (remaining <= 0) break;
    const take = Math.min(stockOf(islandId, g), remaining);
    if (take > 0) { spendFrom(islandId, g, take); remaining -= take; }
  }
}
// Bequemlichkeits-Helfer: die Insel, auf der ein Gebäude steht.
function islandOfBuilding(b) {
  return b ? islandAt(b.x, b.y) : -1;
}
// ---- Gebäude-Infopanel ------------------------------------------------------
// Liefert die anzuzeigenden Zeilen für das per Klick geöffnete Infopanel,
// abgestimmt auf die jeweilige Gebäudekategorie (Erzeuger/Verarbeiter/
// Verbraucher/Lagerhaus) statt pauschal alle 7 Warenfelder der storage
// anzuzeigen (die meisten wären bei den meisten Gebäuden ohnehin immer 0).
// Formatiert eine Millisekunden-Dauer als "M:SS" (z.B. "3:00", "0:47") -
// seit ROAD_DECAY_TIME auf 3 Minuten erhöht wurde, ist eine reine
// Sekundenzahl ("180s") weniger auf einen Blick erfassbar als eine Uhrzeit-
// ähnliche Anzeige.
function formatCountdown(ms) {
  const totalSeconds = Math.max(0, Math.ceil(ms / 1000));
  const m = Math.floor(totalSeconds / 60), s = totalSeconds % 60;
  return `${m}:${String(s).padStart(2, '0')}`;
}
function buildingInfoLines(b) {

  // decayDisconnectedBuildings) - Ausnahme ist das letzte Lagerhaus, das
  // ohnehin nie verfällt (siehe isLastWarehouse) und diese Zeile daher nur
  // verwirren würde.
  // Insel dieses Gebäudes: JEDER Vorratswert im Panel bezieht sich seit v25
  // auf sie, nicht mehr auf einen kartenweiten Bestand.
  const isl = islandOfBuilding(b);
  lines.push({ label: 'Insel', value: islandLabel(isl) });
  if (needsRoadAccess(b)) {
    const connected = hasRoadAccess(b);
    lines.push({
      label: 'Straßenanschluss',
      value: connected ? 'ja' : `nein – verfällt in ${formatCountdown(ROAD_DECAY_TIME - (b.noRoadTimer || 0))}`
    });
  }

  // im Panel ein leeres Eingangslager und ein stehender Arbeiter, ohne dass
  // der Grund dafür irgendwo auftaucht - und der Spieler suchte den Fehler in
  // seiner Warenkette statt bei seinem eigenen Schalter.

  // Feuer (NEU, v34.7): steht bewusst hier, VOR jeder typspezifischen
  // Verzweigung (von denen die meisten mit `return lines` enden) - ein Brand
  // ist für JEDEN Gebäudetyp gleich dringend und soll nicht je nach Typ mal
  // erscheinen und mal fehlen.
  if (b.onFire) {
    const pct = Math.round(100 * Math.min(1, (b.fireProgress || 0) / FIRE_GROW_TIME));
    const unit = fireUnits.find(u => u.target === b);
    const status = (unit && unit.phase === 'dousing')
      ? `Feuerwache vor Ort – wird gelöscht (noch ${pct}% Schaden)`
      : unit
        ? `Feuerwache unterwegs – Brand bei ${pct}%`
        : `keine Feuerwache in der Nähe – Brand bei ${pct}%`;
    lines.push({ label: '🔥 Feuer', value: status });
  }
  if (b.type === 'warehouse') {
    for (const good of Object.keys(GOOD_LABELS)) {
      // Münzen sind seit v29.1 kartenweit - im Lagerhaus-Panel stünde sonst
      // eine Zahl, die der Spieler für den Bestand DIESER Insel hielte.
      const label = good === 'coin' ? 'Münzen (kartenweit)' : GOOD_LABELS[good];
      lines.push({ label, value: Math.floor(b.storage[good] || 0) });
    }

  }
  if (b.type === 'house') {
    const t = tierOf(b);
    const next = HOUSE_TIERS[(b.tier || 0) + 1];
    lines.push({ label: 'Wohnstufe', value: t.name });
    // Zufriedenheit der Insel (v34.26)

    if (mIsl !== null) {
      const ml = moodLabel(mIsl);
      lines.push({ label: 'Stimmung der Insel', value: `${ml.icon} ${Math.round(mIsl)} % – ${ml.text}${mIsl < MOOD_ANGRY ? ', Bewohner wandern aus' : (mIsl >= MOOD_HAPPY ? ', Häuser wachsen schneller' : '')}` });
    }
    lines.push({ label: 'Bewohner', value: `${b.population}/${houseCapacity(b)}` });
    // Steuern (v33): was dieses Haus einbringt, und ob der Satz gerade das
    // Wachstum blockiert. Eingestellt wird er je Insel in der Warenübersicht
    // oder am Kontor - hier steht nur die Wirkung. Ohne Rathaus auf der Insel
    // (NEU, v34.13) wird trotz eingestelltem Satz nichts erhoben - dieselbe
    // Regel wie in taxIncomeOf, hier aber explizit erklärt statt nur mit 0,0
    // Münzen dazustehen, was wie ein Fehler aussähe.
    const satz = taxRateOf(isl);

        : `${satz.label} · ${((b.population || 0) * (TAX_PER_HEAD[Math.min(TAX_PER_HEAD.length - 1, b.tier || 0)] || 0) * satz.factor).toFixed(1)} Münzen/Zyklus`)
        + (satz.growth ? '' : ' – Wachstum gestoppt')

    // Aufstieg: erst was er kostet, dann woran es gerade hakt. Ohne die
    // zweite Zeile stünde der Spieler vor einem Haus, das "einfach nicht"
    // aufsteigt, ohne je zu erfahren, warum.
    if (next) {

    }

    lines.push({ label: 'Nahrung (Insel)', value: `${Math.floor(foodOf(isl))} (${Math.floor(stockOf(isl, 'bread'))} Brot, ${Math.floor(stockOf(isl, 'fish'))} Fisch, ${Math.floor(stockOf(isl, 'meat'))} Wildbret)` });
