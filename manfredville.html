    ctx.beginPath(); ctx.moveTo(cx + 2, s.wallBottom - 7); ctx.lineTo(cx + 9, s.wallBottom - 7); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx + 2, s.wallBottom - 3.5); ctx.lineTo(cx + 9, s.wallBottom - 3.5); ctx.stroke();
    // Wappenschild mit Münze über dem Tor
    ctx.fillStyle = '#3a4550'; ctx.strokeStyle = 'rgba(0,0,0,0.45)'; ctx.lineWidth = 0.8;
    ctx.beginPath();
    ctx.moveTo(cx + 1, s.wallTop + 1); ctx.lineTo(cx + 10, s.wallTop + 1);
    ctx.lineTo(cx + 10, s.wallTop + 7); ctx.lineTo(cx + 5.5, s.wallTop + 10.5);
    ctx.lineTo(cx + 1, s.wallTop + 7); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.fillStyle = colors.accent; ctx.strokeStyle = '#a8892a'; ctx.lineWidth = 0.7;
    ctx.beginPath(); ctx.arc(cx + 5.5, s.wallTop + 5, 3.1, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.strokeStyle = '#8a6a12'; ctx.lineWidth = 0.8;
    ctx.beginPath(); ctx.moveTo(cx + 4.2, s.wallTop + 5); ctx.lineTo(cx + 6.8, s.wallTop + 5); ctx.stroke();
    // Münzsäckchen neben dem Tor
    ctx.fillStyle = '#8a7550'; ctx.strokeStyle = 'rgba(0,0,0,0.45)'; ctx.lineWidth = 0.7;
    ctx.beginPath();
    ctx.moveTo(cx - 20, cy + 9); ctx.quadraticCurveTo(cx - 22, cy + 1, cx - 17.5, cy + 0.5);
    ctx.quadraticCurveTo(cx - 13, cy + 1, cx - 15, cy + 9); ctx.closePath();
    ctx.fill(); ctx.stroke();
    ctx.strokeStyle = '#5c4a2c'; ctx.lineWidth = 0.9;
    ctx.beginPath(); ctx.moveTo(cx - 20.4, cy + 2.4); ctx.lineTo(cx - 14.8, cy + 2.4); ctx.stroke();
    ctx.fillStyle = colors.accent; ctx.strokeStyle = '#a8892a'; ctx.lineWidth = 0.5;
    for (const [mx, my] of [[-11.5, 8.4], [-9, 7.2]]) {
      ctx.beginPath(); ctx.ellipse(cx + mx, cy + my, 2.4, 1.1, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    }
    topY = s.roofApex;
  } else if (b.type === 'kontor') {
    // Kontor (v26): hoher Putzbau mit Staffelgiebel, Ladekran am Giebel und
    // gestapelten Kisten am Kai. Der Kran ist das Erkennungszeichen - er sagt
    // "hier wird umgeschlagen" und unterscheidet das Kontor auf einen Blick
    // vom Hafen, der stattdessen einen Steg und einen Wimpelmast hat.
    const s = drawBuildingShell(cx, cy, colors, { wallW: 16, wallH: 22, roofH: 11, timber: false });
    // Staffelgiebel: drei kleine Stufen über der Dachschräge
    ctx.fillStyle = colors.wall2;
    ctx.strokeStyle = 'rgba(0,0,0,0.35)'; ctx.lineWidth = 0.7;
    for (let i = 0; i < 3; i++) {
      const w = 9 - i * 2.6, yy = s.roofApex + 2 + i * 3.2;
      ctx.fillRect(cx - w / 2, yy, w, 2.6);
      ctx.strokeRect(cx - w / 2, yy, w, 2.6);
    }
    // Zwei Fensterreihen - das Kontor ist als einziges Gebäude zweigeschossig
    drawWindow(cx - 6, s.wallTop + 4, 3.6, 3.6, null);
    drawWindow(cx + 3, s.wallTop + 4, 3.6, 3.6, null);
    drawWindow(cx - 6, s.wallTop + 11, 3.6, 3.6, null);
    // Rundbogen-Ladetor
    ctx.fillStyle = '#4a3524';
    ctx.beginPath();
    ctx.moveTo(cx + 1, s.wallBottom);
    ctx.lineTo(cx + 1, s.wallBottom - 6);
    ctx.arc(cx + 4, s.wallBottom - 6, 3, Math.PI, 0);
    ctx.lineTo(cx + 7, s.wallBottom);
    ctx.closePath(); ctx.fill();
    // Kranausleger mit Seil und Haken, leicht pendelnd
    const swing = Math.sin(animC * 0.0011 + seed * 5) * 1.6;
    // Der Ausleger ragt bewusst deutlich über die Hauswand hinaus (bis cx-21) -
    // ein Kran, der innerhalb der Silhouette bleibt, liest sich aus der Ferne
    // wie ein schiefer Kamin. Nach OBEN darf eine Requisite über die Kachel
    // hinausragen, nach unten nicht (siehe Technischer Hinweis zur Zeichenreihenfolge).
    ctx.strokeStyle = '#6b4a2f'; ctx.lineWidth = 2.2; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(cx - 1, s.roofApex + 5); ctx.lineTo(cx - 21, s.roofApex - 5); ctx.stroke();
    ctx.lineWidth = 0.7; ctx.strokeStyle = 'rgba(240,236,224,0.8)';
    ctx.beginPath(); ctx.moveTo(cx - 21, s.roofApex - 5); ctx.lineTo(cx - 21 + swing, s.roofApex + 8); ctx.stroke();
    // Ladekiste am Haken - hängt frei neben der Wand, nicht auf Dachhöhe
    ctx.fillStyle = '#a8813f'; ctx.strokeStyle = 'rgba(0,0,0,0.4)'; ctx.lineWidth = 0.7;
    ctx.fillRect(cx - 24.5 + swing, s.roofApex + 8, 7, 5.5);
    ctx.strokeRect(cx - 24.5 + swing, s.roofApex + 8, 7, 5.5);
    ctx.lineCap = 'butt';
    // Kisten und ein Fass auf dem Kai vor dem Tor
    ctx.fillStyle = '#a8813f';
    ctx.fillRect(cx + 10, cy + 4, 7, 5.5); ctx.strokeRect(cx + 10, cy + 4, 7, 5.5);
    ctx.fillRect(cx + 12, cy - 1.5, 6, 5);  ctx.strokeRect(cx + 12, cy - 1.5, 6, 5);
    ctx.fillStyle = '#7a5a34';
    ctx.beginPath(); ctx.ellipse(cx + 5, cy + 8, 3, 3.6, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    // Wappenschild neben dem Tor - macht aus dem Lagerhaus ein Handelshaus
    ctx.fillStyle = colors.accent;
    ctx.beginPath();
    ctx.moveTo(cx - 12, s.wallTop + 12); ctx.lineTo(cx - 7, s.wallTop + 12);
    ctx.lineTo(cx - 7, s.wallTop + 16); ctx.lineTo(cx - 9.5, s.wallTop + 18.5);
    ctx.lineTo(cx - 12, s.wallTop + 16); ctx.closePath();
    ctx.fill(); ctx.stroke();
    topY = s.roofApex - 4;
  } else if (b.type === 'rathaus') {
    // Rathaus (NEU, v34.13): das Kontor als bautechnisches Vorbild - hoher
    // Putzbau mit Staffelgiebel -, aber mit eigenen Erkennungszeichen: eine
    // Turmuhr im Giebel statt des Kontor-Krans, ein mittiges Rundbogenportal
    // mit Pilastern statt des seitlichen Ladetors, und ein Wimpelmast auf dem
    // First. Das Rathaus ist das Gebäude, das Steuererhebung auf einer Insel
    // erst ermöglicht (siehe hasRathaus) - es soll auf den ersten Blick als
    // "das Amtsgebäude" lesbar sein, nicht als weiteres Lagerhaus.
    const s = drawBuildingShell(cx, cy, colors, { wallW: 17, wallH: 23, roofH: 11, timber: false });
    // Staffelgiebel wie beim Kontor (gleiche Technik, eigene Wandfarbe)
    ctx.fillStyle = colors.wall2;
    ctx.strokeStyle = 'rgba(0,0,0,0.35)'; ctx.lineWidth = 0.7;
    for (let i = 0; i < 3; i++) {
      const w = 9 - i * 2.6, yy = s.roofApex + 2 + i * 3.2;
      ctx.fillRect(cx - w / 2, yy, w, 2.6);
      ctx.strokeRect(cx - w / 2, yy, w, 2.6);
    }
    // Wimpelmast auf dem First, wie beim Hafen - Rathaus und Hafen sind die
    // einzigen Gebäude mit Flagge. Wird ABSICHTLICH VOR der Turmuhr gezeichnet
    // (siehe dort) und reicht bis zu deren Mittelpunkt hinunter, damit die
    // gleich folgende, undurchsichtige Turmuhr den unteren, "eingesteckten"
    // Teil des Mastes überdeckt - sichtbar bleibt so nur das Stück OBERHALB
    // der Uhr, sauber an ihr angesetzt statt mit Lücke darüber zu schweben
    // oder sichtbar als Strich über das Zifferblatt zu laufen.
    // BUGFIX: der zunächst gewählte Wert `clockY - 11` ließ nur rund 6,8
    // Einheiten Mast sichtbar oberhalb der Uhr - bei normalem Spielzoom eine
    // hauchdünne, kaum erkennbare Linie, in der Praxis quasi unsichtbar.
    // `clockY - 17` (Höhe der ursprünglichen, nur eben freischwebenden
    // Fassung) macht den sichtbaren Teil mit rund 12,8 Einheiten deutlich
    // erkennbar, ohne die inzwischen saubere Verbindung zur Uhr zu verlieren.
    const clockY = s.roofApex - 2;
    const clockR = 4.2;
    const mastTop = clockY - 17;
    ctx.strokeStyle = colors.foundation; ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.moveTo(cx, clockY); ctx.lineTo(cx, mastTop); ctx.stroke();
    ctx.fillStyle = colors.accent;
    ctx.beginPath();
    ctx.moveTo(cx, mastTop); ctx.lineTo(cx + 7, mastTop + 3); ctx.lineTo(cx, mastTop + 6);
    ctx.closePath(); ctx.fill();
    // Turmuhr im Giebel - das Erkennungszeichen, das das Rathaus vom Kontor
    // unterscheidet (dort sitzt an dieser Stelle stattdessen der Kranausleger).
    // Wird NACH dem Mast gezeichnet, damit ihr undurchsichtiges Zifferblatt
    // dessen unteres Ende überdeckt (siehe Kommentar oben beim Mast).
    ctx.fillStyle = '#f2ecd8'; ctx.strokeStyle = '#2a2420'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(cx, clockY, clockR, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(cx, clockY); ctx.lineTo(cx + 1.6, clockY - 2.2); ctx.stroke();
    ctx.lineWidth = 0.8;
    ctx.beginPath(); ctx.moveTo(cx, clockY); ctx.lineTo(cx + 2.8, clockY + 0.6); ctx.stroke();
    // Zwei symmetrische Fensterreihen
    drawWindow(cx - 10, s.wallTop + 4, 3.6, 3.6, null);
    drawWindow(cx + 6.4, s.wallTop + 4, 3.6, 3.6, null);
    drawWindow(cx - 10, s.wallTop + 12, 3.6, 3.6, null);
    drawWindow(cx + 6.4, s.wallTop + 12, 3.6, 3.6, null);
    // Mittiges Rundbogenportal mit zwei flankierenden Pilastern - anders als
    // das seitliche Ladetor des Kontors sitzt der Zugang hier repräsentativ
    // in der Mitte der Fassade.
    ctx.fillStyle = '#e8e0c8'; ctx.strokeStyle = 'rgba(0,0,0,0.3)'; ctx.lineWidth = 0.7;
    ctx.fillRect(cx - 6.5, s.wallBottom - 13, 2, 13); ctx.strokeRect(cx - 6.5, s.wallBottom - 13, 2, 13);
    ctx.fillRect(cx + 4.5, s.wallBottom - 13, 2, 13); ctx.strokeRect(cx + 4.5, s.wallBottom - 13, 2, 13);
    ctx.fillStyle = '#4a3524';
    ctx.beginPath();
    ctx.moveTo(cx - 4, s.wallBottom);
    ctx.lineTo(cx - 4, s.wallBottom - 6);
    ctx.arc(cx, s.wallBottom - 6, 4, Math.PI, 0);
    ctx.lineTo(cx + 4, s.wallBottom);
    ctx.closePath(); ctx.fill();
    topY = mastTop;
  } else if (b.type === 'lighthouse') {
    // Leuchtturm (NEU, v34): die einzige Bauform ohne die übliche Fachwerk-
    // Kiste aus drawBuildingShell - ein schlanker, sich nach oben leicht
    // verjüngender Steinturm mit rot-weißem Ring, verglaster Laterne und
    // Kuppel. Ob er gerade eine Fahrrinne markiert, sieht man am Lichtstrahl:
    // der dreht sich nachts nur, solange die Insel Tran hat (siehe
    // updateLighthouses/isl.lighthouseFueled) - ohne Tran steht er nachts
    // ebenso dunkel da wie jedes andere Gebäude ohne Leuchtturm-Bonus.
    const topT = cy - 30; // Fußpunkt der Laterne
    ctx.fillStyle = 'rgba(0,0,0,0.22)';
    ctx.beginPath(); ctx.ellipse(cx + 1, cy + 7, 9, 3, 0, 0, Math.PI * 2); ctx.fill();
    // Turmschaft, leicht konisch
    const towerGrad = ctx.createLinearGradient(cx - 7, 0, cx + 7, 0);
    towerGrad.addColorStop(0, shade(colors.wall, -14));
    towerGrad.addColorStop(0.5, colors.wall);
    towerGrad.addColorStop(1, shade(colors.wall, -20));
    ctx.fillStyle = towerGrad; ctx.strokeStyle = colors.wall2; ctx.lineWidth = 0.9;
    ctx.beginPath();
    ctx.moveTo(cx - 4.6, cy + 7); ctx.lineTo(cx - 6.6, cy - 3); ctx.lineTo(cx - 4.8, topT + 6);
    ctx.lineTo(cx + 4.8, topT + 6); ctx.lineTo(cx + 6.6, cy - 3); ctx.lineTo(cx + 4.6, cy + 7);
    ctx.closePath(); ctx.fill(); ctx.stroke();
    // Roter Ring - das Erkennungszeichen jedes Leuchtturms
    ctx.fillStyle = colors.roof;
    ctx.beginPath();
    ctx.moveTo(cx - 5.9, cy - 0.5); ctx.lineTo(cx - 5.4, cy - 8); ctx.lineTo(cx + 5.4, cy - 8); ctx.lineTo(cx + 5.9, cy - 0.5);
    ctx.closePath(); ctx.fill();
    // Umlaufende Galerie unter der Laterne
    ctx.fillStyle = colors.foundation;
    ctx.fillRect(cx - 6.2, topT + 5, 12.4, 2.2);
    ctx.strokeStyle = 'rgba(0,0,0,0.3)'; ctx.lineWidth = 0.6; ctx.strokeRect(cx - 6.2, topT + 5, 12.4, 2.2);
    // Laterne: verglaster Aufbau mit Kuppeldach. BUGFIX (v34.4): die Laterne
    // stand vorher auf `topT - 6` bis `topT + 1.2` - die Galerie darunter
    // beginnt aber erst bei `topT + 5`. Zwischen Laternenboden (topT+1.2) und
    // Galerie (topT+5) klaffte dadurch eine sichtbare Lücke von 3,8px: die
    // Laterne samt Kuppel schwebte frei über dem Turm, statt auf der Galerie
    // zu stehen. Die gesamte Laternen-Baugruppe (Laterne, Kuppel, Kugel,
    // Sprossen, Lampenkern/Lichtstrahl-Ursprung) ist deshalb um genau diese
    // 3,8px nach unten verschoben, sodass ihr Boden exakt auf `topT + 5`
    // (Galerie-Oberkante) sitzt - dieselbe Fehlerklasse wie beim Hafen-Mast
    // (v34.1): ein Aufbauteil, dessen Anker nicht auf der tatsächlichen
    // Oberfläche des darunterliegenden Bauteils lag.
    ctx.fillStyle = 'rgba(255,236,190,0.9)'; ctx.strokeStyle = '#3a2c1c'; ctx.lineWidth = 0.8;
    ctx.fillRect(cx - 4, topT - 2.2, 8, 7.2); ctx.strokeRect(cx - 4, topT - 2.2, 8, 7.2);
    ctx.beginPath(); ctx.moveTo(cx, topT - 2.2); ctx.lineTo(cx, topT + 5); ctx.moveTo(cx - 4, topT + 1.4); ctx.lineTo(cx + 4, topT + 1.4); ctx.stroke();
    ctx.fillStyle = colors.roof;
    ctx.beginPath(); ctx.moveTo(cx - 5, topT - 2.2); ctx.quadraticCurveTo(cx, topT - 9.2, cx + 5, topT - 2.2); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.arc(cx, topT - 8.8, 1.3, 0, Math.PI * 2); ctx.fill();
    // Lichtstrahl und Lampenkern - NUR solange die Insel Tran hat.
    const lhIsl = islands[islandOfBuilding(b)];
    const night = nightFactor();
    if (lhIsl && lhIsl.lighthouseFueled && night > 0.05) {
      const beamAngle = (animClock * 0.0016 + seed * 6.283) % (Math.PI * 2);
      ctx.save();
      ctx.translate(cx, topT + 1.4);
      ctx.rotate(beamAngle);
      const beamLen = 60;
      const beamGrad = ctx.createLinearGradient(0, 0, beamLen, 0);
      beamGrad.addColorStop(0, `rgba(255,238,180,${(0.5 * night).toFixed(3)})`);
      beamGrad.addColorStop(1, 'rgba(255,238,180,0)');
      ctx.fillStyle = beamGrad;
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(beamLen, -7); ctx.lineTo(beamLen, 7); ctx.closePath(); ctx.fill();
      ctx.restore();
      ctx.save();
      ctx.globalAlpha = 0.85;
      ctx.fillStyle = '#fff3c9';
      ctx.beginPath(); ctx.arc(cx, topT + 1.4, 2.2, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }
    topY = topT - 9.2;
  } else if (b.type === 'firestation') {
    // Feuerwache (NEU, v34.7; Tor+Glockenstuhl überarbeitet v34.12): ein
    // schlichtes Gerätehaus mit zweiflügeligem Scheunentor, aus dem der
    // Löschhelfer (siehe drawFireUnitOne, seit v34.9 ein Bewohner mit Eimer
    // statt einer Kutsche) bei Alarm läuft, und einer Alarmglocke unter einem
    // kleinen Holzdach über dem First - unverkennbar rot, damit sie auf der
    // Karte sofort als "hier gibt es Hilfe" auffällt (siehe auch
    // buildingColors.firestation).
    const s = drawBuildingShell(cx, cy, colors, { wallW: 16, wallH: 19, roofH: 14, timber: false });
    // Zweiflügeliges Holztor MIT SENKRECHTEN BOHLEN und diagonalen
    // Riegelstreben statt eines Rolltors mit waagerechten Lamellen (bis
    // v34.11) - Letzteres wirkte wie ein modernes Garagentor und passte nicht
    // ins mittelalterliche Setting. Jeder Flügel bekommt eine schmiedeeiserne
    // Diagonalstrebe von der äußeren Unterkante zur inneren Oberkante, dazu
    // zwei kleine Nietenreihen an den Bandscharnieren.
    const doorW = 18, doorH = 15, doorX = cx - doorW / 2, doorY = s.wallBottom - doorH;
    ctx.fillStyle = '#3a2c1c';
    ctx.fillRect(doorX, doorY, doorW, doorH);
    ctx.strokeStyle = 'rgba(0,0,0,0.45)'; ctx.lineWidth = 0.8;
    ctx.strokeRect(doorX, doorY, doorW, doorH);
    // Senkrechte Bretterfugen (Bohlen), statt waagerechter Lamellen.
    ctx.strokeStyle = 'rgba(0,0,0,0.28)'; ctx.lineWidth = 0.6;
    for (let i = 1; i < 6; i++) {
      const lx = doorX + (doorW / 6) * i;
      ctx.beginPath(); ctx.moveTo(lx, doorY + 1); ctx.lineTo(lx, doorY + doorH - 1); ctx.stroke();
    }
    // Mittelfuge - macht aus der einen Fläche sichtbar zwei Torflügel.
    ctx.strokeStyle = 'rgba(0,0,0,0.55)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(cx, doorY); ctx.lineTo(cx, doorY + doorH); ctx.stroke();
    // Diagonale Eisenstreben je Flügel.
    ctx.strokeStyle = colors.accent; ctx.lineWidth = 1.1;
    ctx.beginPath(); ctx.moveTo(doorX + 1, doorY + doorH - 1); ctx.lineTo(cx - 1, doorY + 1); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(doorX + doorW - 1, doorY + doorH - 1); ctx.lineTo(cx + 1, doorY + 1); ctx.stroke();
    // Kleine Nieten an den vier Torecken.
    ctx.fillStyle = colors.accent;
    for (const [nx, ny] of [[doorX + 1.5, doorY + 1.5], [doorX + doorW - 1.5, doorY + 1.5], [doorX + 1.5, doorY + doorH - 1.5], [doorX + doorW - 1.5, doorY + doorH - 1.5]]) {
      ctx.beginPath(); ctx.arc(nx, ny, 0.8, 0, Math.PI * 2); ctx.fill();
    }
    // Alarmglocke an einem Holzpfosten über dem First. BUGFIX/Korrektur
    // innerhalb v34.12: ein erster Versuch setzte ein kleines Satteldach über
    // die Glocke - das las sich aus der Ferne wie eine Straßenlaterne statt
    // wie eine Glocke, also GENAU die Modernität, die diese Runde beheben
    // sollte. Jetzt eine echte Kelchform (schmal oben, ausladend unten, mit
    // Klöppel) frei am Pfosten, ohne umschließendes Dach.
    ctx.strokeStyle = colors.foundation; ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.moveTo(cx, s.roofApex); ctx.lineTo(cx, s.roofApex - 7); ctx.stroke();
    ctx.fillStyle = colors.accent;
    ctx.beginPath();
    ctx.moveTo(cx - 1, s.roofApex - 7);
    ctx.lineTo(cx - 3.2, s.roofApex - 2.3);
    ctx.quadraticCurveTo(cx - 3.6, s.roofApex - 0.6, cx, s.roofApex - 0.4);
    ctx.quadraticCurveTo(cx + 3.6, s.roofApex - 0.6, cx + 3.2, s.roofApex - 2.3);
    ctx.lineTo(cx + 1, s.roofApex - 7);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,0.45)'; ctx.lineWidth = 0.6; ctx.stroke();
    ctx.fillStyle = 'rgba(0,0,0,0.55)';
    ctx.beginPath(); ctx.arc(cx, s.roofApex + 0.4, 0.7, 0, Math.PI * 2); ctx.fill();
    // Ist gerade ein Löschhelfer im Einsatz, bleibt das Tor "offen" (dunkler,
    // ohne die Bohlenfugen sichtbar) - ein kleiner, aber lesbarer Hinweis
    // direkt am Gebäude, zusätzlich zum Infopanel-Status.
    if (b.busy) {
      ctx.fillStyle = 'rgba(0,0,0,0.55)';
      ctx.fillRect(doorX, doorY, doorW, doorH);
    }
    topY = s.roofApex - 7;
  }

  // Ortsfester Arbeiter vor einem gerade produzierenden Verarbeiter (siehe
  // PROCESSOR_WORK). Bewusst NACH der gebäudespezifischen Zeichnung, damit die
  // Figur vor dem Haus steht statt dahinter zu verschwinden - und vor dem
  // Auswahlring/Badge, die immer obenauf gehören.
  const work = PROCESSOR_WORK[b.type];
  if (work && b.working) {
    drawMonster(cx + work.dx, cy + work.dy, PROCESSOR_WORKER_SCALE, work.flip);
    work.draw(cx + work.dx, cy + work.dy, PROCESSOR_WORKER_SCALE, work.flip, b.workAnim || 0, work.period);
  }

  if (selectedBuilding === b) {
    // dezenter Auswahlring um das gerade im Infopanel angezeigte Gebäude
    ctx.strokeStyle = '#f2d98a';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.ellipse(cx, cy + 2, 22, 11, 0, 0, Math.PI * 2);
    ctx.stroke();
  }
  // Von Hand gestoppt (v31.1): ein ruhiges, GRAUES Pausenzeichen statt des
  // gelben Alarms. Der Unterschied ist wichtig - ein "!" heißt "hier stimmt
  // etwas nicht" und schickt den Spieler auf Fehlersuche, während der Stopp
  // seine eigene Entscheidung war. Er steht trotzdem sichtbar auf der Karte,
  // sonst sucht man Wochen später vergeblich, warum die Kette hakt.
  //
  // Brand (NEU, v34.7): geht ALLEM anderen vor - Flammen sind selbst schon
  // die Warnung, ein zusätzliches Pausenzeichen oder "!" wäre daneben nur
  // Ballast. `drawFireFlames` ist generisch (siehe dort) und funktioniert für
  // JEDEN Gebäudetyp, unabhängig davon, welche Zeichnung oben stand.
  if (b.onFire) {
    drawFireFlames(cx, topY, seed);
    smokeSuppressed = false;
    ctx.restore();
    return;
  }
  // Der fehlende Straßenanschluss geht dem Pausenzeichen VOR: ein gestopptes
  // Gebäude, das gerade verfällt, muss den Alarm zeigen - sonst verschwindet
  // es kommentarlos, während auf der Karte ein harmloses Pausenzeichen stand.
  if (b.paused && b.blocked !== 'noRoad') {
    const py = topY - 13;
    ctx.fillStyle = 'rgba(30,28,24,0.72)';
    ctx.beginPath(); ctx.arc(cx, py, 7, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#dcd6c4';
    ctx.fillRect(cx - 3.1, py - 3.6, 2.2, 7.2);
    ctx.fillRect(cx + 0.9, py - 3.6, 2.2, 7.2);
  } else if (b.blocked) {
    // Rot nur für Bedürfnisse, die tatsächlich Bewohner kosten. Fehlende
    // Kleidung stoppt nur das Wachstum und bekommt deshalb bewusst das
    // gelbe "Hinweis"-Ausrufezeichen wie ein Produktionsengpass.
    ctx.fillStyle = (b.type === 'house' && b.blocked !== 'noClothes' && b.blocked !== 'noLuxury' && b.blocked !== 'noNobleLux') ? (b.blocked === 'sick' ? '#7ccf5a' : '#e85a4a') : '#e8d24a';
    ctx.font = 'bold 14px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('!', cx, topY - 8);
  }
  smokeSuppressed = false; // Rauchsperre gilt immer nur für DIESES Gebäude
  ctx.restore();
}
// Comicfigur-Bewohner (Vektorzeichnung im Spielstil, angelehnt an das blaue
// Plüschmonster: Hörnchen, schläfriges Gesicht, Fangzähnchen, minzgrüner
// Wolken/Herz-Bauchfleck, baumelnde Ärmchen). (ox,oy) ist der Bodenpunkt
// (Standfläche auf der Kachel), scale bereits inkl. Zoom.
function drawMonster(ox, oy, scale, flip) {
  ctx.save();
  ctx.translate(ox, oy);
  ctx.scale(flip ? -scale : scale, scale);
  ctx.translate(0, -16); // (0,0) im Funktionskörper -> Boden bei lokal y=16

  const bodyFill = '#8992c9';
  const bodyLine = '#3f4570';
  const mint = '#9fe3c8';
  const mintLine = '#3c8267';
  const ink = '#33324a';

  // Bodenschatten
  ctx.beginPath();
  ctx.ellipse(0, 16.5, 12, 3, 0, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(0,0,0,0.25)';
  ctx.fill();

  // Ärmchen auf halber Körperhöhe ausgestreckt (hinter dem Körper) - Spitzen
  // ragen seitlich auf Höhe der Körpermitte (zwischen Schulteransatz y=1 und
  // Kopf-Scheitel y=-19, also etwa y=-9) deutlich über den Körperumriss
  // (Rand dort bei x≈∓14) hinaus, statt ganz nach oben zum Kopf zu reichen
  // oder nach unten zu hängen.
  ctx.fillStyle = bodyFill;
  ctx.strokeStyle = bodyLine;
  ctx.lineWidth = 1.2;
  ctx.beginPath();
  ctx.moveTo(-12, 1);
  ctx.quadraticCurveTo(-22, -3, -19, -9);
  ctx.quadraticCurveTo(-17, -12.5, -14, -9);
  ctx.quadraticCurveTo(-14, -3, -8, 0);
  ctx.closePath();
  ctx.fill(); ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(12, 1);
  ctx.quadraticCurveTo(22, -3, 19, -9);
  ctx.quadraticCurveTo(17, -12.5, 14, -9);
  ctx.quadraticCurveTo(14, -3, 8, 0);
  ctx.closePath();
  ctx.fill(); ctx.stroke();

  // Hörner
  ctx.fillStyle = mint;
  ctx.strokeStyle = mintLine;
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(-8, -13);
  ctx.quadraticCurveTo(-12.5, -20.5, -9.5, -25.5);
  ctx.quadraticCurveTo(-6.5, -21.5, -5.5, -14);
  ctx.closePath();
  ctx.fill(); ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(8, -13);
  ctx.quadraticCurveTo(12.5, -20.5, 9.5, -25.5);
  ctx.quadraticCurveTo(6.5, -21.5, 5.5, -14);
  ctx.closePath();
  ctx.fill(); ctx.stroke();

  // runder, flauschiger Körper
  ctx.beginPath();
  ctx.moveTo(-16, 3);
  ctx.bezierCurveTo(-17, -11, -9, -19, 0, -19);
  ctx.bezierCurveTo(9, -19, 17, -11, 16, 3);
  ctx.bezierCurveTo(16, 12, 9, 16, 0, 16);
  ctx.bezierCurveTo(-9, 16, -16, 12, -16, 3);
  ctx.closePath();
  ctx.fillStyle = bodyFill;
  ctx.fill();
  ctx.strokeStyle = bodyLine;
  ctx.lineWidth = 1.5;
  ctx.stroke();

  // Bauchfleck (Wolke/Herz)
  ctx.beginPath();
  ctx.moveTo(-8.5, 4.5);
  ctx.quadraticCurveTo(-10, -2, -5, -3.5);
  ctx.quadraticCurveTo(-2.5, -6.5, 0, -3.2);
  ctx.quadraticCurveTo(2.5, -6.5, 5, -3.5);
  ctx.quadraticCurveTo(10, -2, 8.5, 4.5);
  ctx.quadraticCurveTo(9, 10, 0, 10.5);
  ctx.quadraticCurveTo(-9, 10, -8.5, 4.5);
  ctx.closePath();
  ctx.fillStyle = mint;
  ctx.fill();
  ctx.strokeStyle = mintLine;
  ctx.lineWidth = 1;
  ctx.stroke();

  // Füße
  ctx.fillStyle = mint;
  ctx.strokeStyle = mintLine;
  ctx.beginPath(); ctx.ellipse(-7, 15.5, 4.3, 2.6, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.ellipse(7, 15.5, 4.3, 2.6, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();

  // dezente Schattierung unten für Volumen
  ctx.beginPath();
  ctx.moveTo(-15, 5);
  ctx.quadraticCurveTo(0, 15, 15, 5);
  ctx.quadraticCurveTo(9, 13, 0, 13.5);
  ctx.quadraticCurveTo(-9, 13, -15, 5);
  ctx.closePath();
  ctx.fillStyle = 'rgba(0,0,0,0.08)';
  ctx.fill();

  // kleine Fell-Tupfer am Kopf
  ctx.strokeStyle = bodyLine;
  ctx.lineWidth = 1;
  ctx.lineCap = 'round';
  ctx.globalAlpha = 0.55;
  const tufts = [[-11, -16, -13, -19], [-4, -19, -5, -22.5], [4, -19, 5, -22.5], [11, -16, 13, -19], [-14, -6, -17, -7], [14, -6, 17, -7]];
  for (const [x1, y1, x2, y2] of tufts) { ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); }
  ctx.globalAlpha = 1;

  // schläfrige Augen
  ctx.strokeStyle = ink;
  ctx.lineWidth = 1.4;
  ctx.lineCap = 'round';
  ctx.beginPath(); ctx.arc(-5.5, -10, 3.2, Math.PI * 0.1, Math.PI * 0.9); ctx.stroke();
  ctx.beginPath(); ctx.arc(5.5, -10, 3.2, Math.PI * 0.1, Math.PI * 0.9); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-8.5, -12.5); ctx.lineTo(-7, -13.5); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(8.5, -12.5); ctx.lineTo(7, -13.5); ctx.stroke();

  // Nase
  ctx.beginPath();
  ctx.ellipse(0, -5.5, 2.3, 1.6, 0, 0, Math.PI * 2);
  ctx.fillStyle = '#eef0ee';
  ctx.fill();

  // Mund
  ctx.beginPath();
  ctx.arc(0, -6, 5, 0.12 * Math.PI, 0.88 * Math.PI);
  ctx.strokeStyle = ink;
  ctx.lineWidth = 1.3;
  ctx.stroke();

  // Fangzähnchen
  ctx.fillStyle = '#ffffff';
  ctx.strokeStyle = ink;
  ctx.lineWidth = 0.6;
  ctx.beginPath(); ctx.moveTo(-3.6, -1.8); ctx.lineTo(-2.6, 1.4); ctx.lineTo(-1.6, -1.6); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(3.6, -1.8); ctx.lineTo(2.6, 1.4); ctx.lineTo(1.6, -1.6); ctx.closePath(); ctx.fill(); ctx.stroke();

  ctx.restore();
}
// Zeichnet eine schwingende Axt in der Hand eines Holzfällers, der gerade am
// Baum steht (Fäll-Animation). Nutzt dasselbe lokale Koordinatensystem wie
// drawMonster, damit die Axt korrekt an der Hand ansetzt. (x,y) ist der
// Bodenpunkt der Figur, chopTimer läuft von 0 bis CHOP_DURATION hoch und
// treibt einen sich wiederholenden Schwung im Takt von CHOP_SWING_PERIOD an.
function drawChopAxe(x, y, scale, flip, chopTimer) {
  const p = (chopTimer % CHOP_SWING_PERIOD) / CHOP_SWING_PERIOD;
  // Schwungkurve: aus erhobener Stellung nach vorn/unten zum Hieb und zurück
  const angle = -1.15 + 1.9 * (0.5 - 0.5 * Math.cos(p * Math.PI * 2));
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(flip ? -scale : scale, scale);
  ctx.translate(0, -16); // gleiches lokales Koordinatensystem wie drawMonster
  ctx.translate(14, 4); // Anfasspunkt an der Hand (siehe Hinweis zur Figurengröße bei MONSTER_BASE_SCALE)
  ctx.rotate(angle);
  // Stiel
  ctx.strokeStyle = '#6b4a2f';
  ctx.lineWidth = 1.6;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.lineTo(0, -13);
  ctx.stroke();
  // Axtkopf
  ctx.fillStyle = '#b7b7b7';
  ctx.strokeStyle = '#4a4a4a';
  ctx.lineWidth = 0.8;
  ctx.beginPath();
  ctx.moveTo(0, -13);
  ctx.lineTo(5.5, -10.5);
  ctx.lineTo(4.5, -6.5);
  ctx.lineTo(0, -7.5);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();
  ctx.restore();
}
// Zeichnet eine schwingende Spitzhacke in der Hand eines Minenarbeiters, der
// gerade am Erzvorkommen steht (Abbau-Animation). Analog zu drawChopAxe, nur
// mit einem quer stehenden, doppelt spitzen Hackenkopf statt einer Axtklinge.
function drawPickaxe(x, y, scale, flip, workTimer) {
  const p = (workTimer % MINE_SWING_PERIOD) / MINE_SWING_PERIOD;
  const angle = -1.15 + 1.9 * (0.5 - 0.5 * Math.cos(p * Math.PI * 2));
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(flip ? -scale : scale, scale);
  ctx.translate(0, -16); // gleiches lokales Koordinatensystem wie drawMonster
  ctx.translate(14, 4); // Anfasspunkt an der Hand (siehe Hinweis zur Figurengröße bei MONSTER_BASE_SCALE)
  ctx.rotate(angle);
  // Stiel
  ctx.strokeStyle = '#6b4a2f';
  ctx.lineWidth = 1.6;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.lineTo(0, -13);
  ctx.stroke();
  // Spitzhacken-Kopf: quer zum Stiel, beidseitig spitz zulaufend
  ctx.strokeStyle = '#6a6a72';
  ctx.lineWidth = 2.6;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(-6.5, -15);
  ctx.lineTo(6.5, -11.5);
  ctx.stroke();
  ctx.restore();
}
// Angelrute: die Rute wippt bewusst langsam und weich (statt zu schlagen wie
// Axt/Spitzhacke) und hat eine durchhängende Schnur bis knapp unter die
// Kachelkante - der Fischer steht ja am Ufer und angelt ins Wasser daneben.
function drawFishingRod(x, y, scale, flip, workTimer) {
  const p = (workTimer % FISH_SWING_PERIOD) / FISH_SWING_PERIOD;
  const angle = -0.55 + 0.28 * Math.sin(p * Math.PI * 2);
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(flip ? -scale : scale, scale);
  ctx.translate(0, -16); // gleiches lokales Koordinatensystem wie drawMonster
  ctx.translate(14, 4); // Anfasspunkt an der Hand (siehe Hinweis zur Figurengröße bei MONSTER_BASE_SCALE)
  ctx.rotate(angle);
  ctx.strokeStyle = '#7a5c3a';
  ctx.lineWidth = 1.3;
  ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(2, -20); ctx.stroke();
  // Schnur mit durchhängendem Bogen und kleinem Schwimmer am Ende
  ctx.strokeStyle = 'rgba(240, 246, 250, 0.8)';
  ctx.lineWidth = 0.6;
  ctx.beginPath();
  ctx.moveTo(2, -20);
  ctx.quadraticCurveTo(11, -12, 13, 4);
  ctx.stroke();
  ctx.fillStyle = '#e05a4e';
  ctx.beginPath(); ctx.arc(13, 4.5, 1.5, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}
// Schafschere: zwei Klingen, die sich im Takt öffnen und schließen. Sie zeigt
// schräg nach unten-vorn zum Schaf am Boden (nicht nach oben wie Axt oder
// Spitzhacke) und ist bewusst kräftig mit dunklem Rand gezeichnet - eine
// zarte Linie wäre in der Iso-Ansicht neben der Figur nicht zu erkennen.
function drawShears(x, y, scale, flip, workTimer) {
  const p = (workTimer % SHEAR_SWING_PERIOD) / SHEAR_SWING_PERIOD;
  const open = 0.1 + 0.34 * (0.5 - 0.5 * Math.cos(p * Math.PI * 2));
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(flip ? -scale : scale, scale);
  ctx.translate(0, -16);
  ctx.translate(14, 4); // Anfasspunkt an der Hand (siehe Hinweis zur Figurengröße bei MONSTER_BASE_SCALE)
  ctx.rotate(1.05); // nach unten-vorn geneigt, Richtung Schaf
  ctx.lineCap = 'round';
  for (const dir of [-1, 1]) {
    ctx.save();
    ctx.rotate(dir * open);
    // dunkler Konturstrich unter der hellen Klinge -> klarer Kontrast gegen
    // Gras und gegen die Figur
    ctx.strokeStyle = 'rgba(30,32,38,0.55)';
    ctx.lineWidth = 3.4;
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, -12); ctx.stroke();
    ctx.strokeStyle = '#dde4ea';
    ctx.lineWidth = 1.9;
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, -12); ctx.stroke();
    ctx.restore();
  }
  // Griff/Bügel unterhalb des Drehpunkts
  ctx.strokeStyle = '#6b4a2f';
  ctx.lineWidth = 2.4;
  ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, 5); ctx.stroke();
  ctx.restore();
}
// Tellereisen des Pelzjägers (v27): liegt vor der knienden Figur am Boden und
// klappt im Takt von TRAP_SWING_PERIOD auf und zu. Bewusst FLACH gezeichnet und
// vor die Figur gelegt statt in die Hand genommen - eine Falle wird gestellt,
// nicht geschwungen, und ein Gegenstand in Kopfhöhe wäre bei der kleinen
// Figurengröße ohnehin nicht als Falle zu erkennen (siehe Technischer Hinweis
// zum Werkzeug-Handpunkt).
function drawTrap(x, y, scale, flip, workTimer) {
  const p = (workTimer % TRAP_SWING_PERIOD) / TRAP_SWING_PERIOD;
  // schnell zuschnappen, langsam wieder öffnen - das Zuschnappen fällt mit dem
  // Klack-Geräusch zusammen
  const open = p < 0.15 ? (1 - p / 0.15) : ((p - 0.15) / 0.85);
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(flip ? -scale : scale, scale);
  ctx.translate(0, -16);
  ctx.translate(14, 4); // Anfasspunkt an der Hand (siehe Hinweis zur Figurengröße bei MONSTER_BASE_SCALE)
  ctx.translate(4, 9);  // von der Hand hinunter auf den Boden vor der Figur
  // Bewusst großzügig dimensioniert und kräftig konturiert: im ersten Bildtest
  // war eine kleinere, feiner gestrichelte Falle neben der Figur praktisch
  // unsichtbar - dieselbe Lehre wie bei den Feldwerkzeugen in v23.
  // Grundplatte und Kette
  ctx.fillStyle = '#3a3a42'; ctx.strokeStyle = 'rgba(12,14,18,0.8)'; ctx.lineWidth = 1.2;
  ctx.beginPath(); ctx.ellipse(0, 0, 9.5, 4.2, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  ctx.strokeStyle = '#8a8a94'; ctx.lineWidth = 1.4;
  ctx.beginPath(); ctx.moveTo(8.5, 1); ctx.quadraticCurveTo(14, 3.6, 18, 1.4); ctx.stroke();
  // Zwei Bügel, die sich über der Platte schließen
  ctx.lineCap = 'round';
  for (const dir of [-1, 1]) {
    ctx.save();
    ctx.rotate(dir * open * 1.2);
    ctx.strokeStyle = 'rgba(12,14,18,0.75)'; ctx.lineWidth = 4.6;
    ctx.beginPath(); ctx.moveTo(dir * 8, 0); ctx.lineTo(dir * 3, -11); ctx.stroke();
    ctx.strokeStyle = '#e2e8ee'; ctx.lineWidth = 2.6;
    ctx.beginPath(); ctx.moveTo(dir * 8, 0); ctx.lineTo(dir * 3, -11); ctx.stroke();
    ctx.restore();
  }
  ctx.lineCap = 'butt';
  // Erbeutetes Fell daneben, sobald die Falle einmal zugeschnappt ist
  if (workTimer > TRAP_SWING_PERIOD) {
    ctx.fillStyle = '#7a5230'; ctx.strokeStyle = 'rgba(16,12,8,0.7)'; ctx.lineWidth = 1.1;
    ctx.beginPath(); ctx.ellipse(-15, -2.5, 7, 4.6, -0.25, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.strokeStyle = 'rgba(210,190,170,0.5)'; ctx.lineWidth = 0.7;
    ctx.beginPath(); ctx.moveTo(-20, -3); ctx.quadraticCurveTo(-15, -1, -10, -3.4); ctx.stroke();
  }
  ctx.restore();
}
// Harpune des Walfängers (v29): der Arbeiter holt weit aus und stößt sie im
// Takt von WHALE_SWING_PERIOD nach vorn ins Wasser. Bewusst LANG und mit
// kräftiger Spitze gezeichnet - ein dünner Stab neben der Figur wäre von einer
// Angelrute nicht zu unterscheiden, und genau die steht ein paar Kacheln
// weiter an der Fischerhütte (dieselbe Lehre wie Falle/Feldwerkzeuge).
// Nach dem ersten Stoß taucht zusätzlich eine dunkle Walflosse im Wasser auf,
// damit auch ohne Ton erkennbar ist, worauf hier gezielt wird.
function drawHarpoon(x, y, scale, flip, workTimer) {
  const p = (workTimer % WHALE_SWING_PERIOD) / WHALE_SWING_PERIOD;
  // weit ausholen (langsam), dann kurz und hart zustoßen
  const thrust = p < 0.7 ? -(p / 0.7) * 0.55 : ((p - 0.7) / 0.3) * 1.1 - 0.55;
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(flip ? -scale : scale, scale);
  ctx.translate(0, -16);
  ctx.translate(13, 3); // Anfasspunkt an der Hand (siehe Hinweis bei MONSTER_BASE_SCALE)
  ctx.save();
  ctx.rotate(-0.35 + thrust * 0.5);
  ctx.translate(thrust * 5, 0);
  // Schaft
  ctx.strokeStyle = '#6b4a2f'; ctx.lineWidth = 2.2; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(-9, 5); ctx.lineTo(15, -7); ctx.stroke();
  // Spitze mit Widerhaken
  ctx.fillStyle = '#dfe6ec'; ctx.strokeStyle = 'rgba(14,18,24,0.85)'; ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(15, -7); ctx.lineTo(22, -10.5); ctx.lineTo(18.5, -5.5); ctx.closePath();
  ctx.fill(); ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(16.5, -8.6); ctx.lineTo(14, -12); ctx.stroke();
  // Leine, die am Schaftende herunterhängt
  ctx.strokeStyle = 'rgba(232,226,208,0.75)'; ctx.lineWidth = 0.8; ctx.lineCap = 'butt';
  ctx.beginPath(); ctx.moveTo(-8, 5); ctx.quadraticCurveTo(-12, 9, -7, 12); ctx.stroke();
  ctx.restore();
  if (workTimer > WHALE_SWING_PERIOD) {
    // Walflosse vor der Figur: dunkler Rücken, der aus dem Wasser bricht
    ctx.fillStyle = '#2f3f4c'; ctx.strokeStyle = 'rgba(10,16,22,0.8)'; ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(20, 14);
    ctx.quadraticCurveTo(26, 12, 29, 6);
    ctx.quadraticCurveTo(33, 9, 34, 14);
    ctx.quadraticCurveTo(28, 16, 20, 15);
    ctx.closePath();
    ctx.fill(); ctx.stroke();
    ctx.strokeStyle = 'rgba(226,238,244,0.7)'; ctx.lineWidth = 1.1;
    ctx.beginPath(); ctx.moveTo(17, 16); ctx.quadraticCurveTo(26, 18.5, 36, 15.5); ctx.stroke();
  }
  ctx.restore();
}
// Jagdbogen: die Sehne wird über die gesamte Arbeitsdauer gleichmäßig
// gespannt (statt periodisch zu schwingen wie Axt/Spitzhacke/Schere) - erst
// kurz vor Ende erscheint der Pfeil, der Bogenschuss-Sound (siehe
// AudioEngine.playBowShot) fällt genau auf den Moment der vollen Spannung
// (duration===swing bei HUNT_DURATION/HUNT_SWING_PERIOD).
function drawBow(x, y, scale, flip, workTimer) {
  const draw = Math.min(1, workTimer / HUNT_SWING_PERIOD);
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(flip ? -scale : scale, scale);
  ctx.translate(0, -16);
  ctx.translate(13, 3); // Anfasspunkt an der Hand (siehe Hinweis zur Figurengröße bei MONSTER_BASE_SCALE)
  ctx.rotate(-0.15);
  ctx.strokeStyle = '#5c3f28';
  ctx.lineWidth = 1.5;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(0, -10);
  ctx.quadraticCurveTo(4 + draw * 1.5, 0, 0, 10);
  ctx.stroke();
  ctx.lineCap = 'butt';
  ctx.strokeStyle = 'rgba(230,226,214,0.85)';
  ctx.lineWidth = 0.6;
  ctx.beginPath();
  ctx.moveTo(0, -10);
  ctx.lineTo(-5 * draw, 0);
  ctx.lineTo(0, 10);
  ctx.stroke();
  if (draw > 0.2) {
    ctx.strokeStyle = '#8a6a44'; ctx.lineWidth = 1; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(-5 * draw, 0); ctx.lineTo(7, 0); ctx.stroke();
    ctx.fillStyle = '#3a2c1c';
    ctx.beginPath(); ctx.moveTo(7, 0); ctx.lineTo(4, -1.4); ctx.lineTo(4, 1.4); ctx.closePath(); ctx.fill();
    ctx.lineCap = 'butt';
  }
  ctx.restore();
}

// ---- Werkzeuge der ortsfesten Verarbeiter-Arbeiter (siehe PROCESSOR_WORK) ----
// Alle folgen exakt demselben Aufbau wie drawChopAxe & Co. (translate/scale/
// translate(0,-16)/Handpunkt) und nutzen daher AUSSCHLIESSLICH relative
// Transformationen - dadurch funktionieren sie unverändert auch innerhalb des
// bereits verschobenen und gezoomten Koordinatensystems von drawBuilding.
// Einheitliche Signatur (x, y, scale, flip, t, period), damit PROCESSOR_WORK
// sie generisch aufrufen kann.
//
// ZWEI bewusste Unterschiede zu den Feldwerkzeugen, beide aus dem ersten
// Bildtest gelernt:
//  1. Der Handpunkt liegt hier bei (14, 4) statt (12, -1) - also weiter außen
//     und tiefer. Bei der deutlich kleineren Arbeiterfigur
//     (PROCESSOR_WORKER_SCALE) lag am alten Handpunkt JEDES Werkzeug mitten im
//     großen, runden Kopf und war als eigenständiger Gegenstand nicht mehr zu
//     erkennen - es sah aus wie ein Fleck im Gesicht.
//  2. Alle Schwünge gehen nach VORNE (positive Winkel = in +x-Richtung, also in
//     Blickrichtung der Figur), statt wie beim Axthieb erst weit nach hinten
//     über die Schulter auszuholen. Ein Arbeiter, der ortsfest an seiner
//     Werkbank hantiert, holt nicht aus - und ein nach hinten schwingendes
//     Werkzeug verschwände bei dieser Figurengröße ohnehin hinter dem Körper.

// Sägewerk: Handsäge, die waagerecht vor- und zurückgezogen wird.
function drawSawTool(x, y, scale, flip, t, period) {
  const p = (t % period) / period;
  const push = Math.sin(p * Math.PI * 2) * 3.6;
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(flip ? -scale : scale, scale);
  ctx.translate(0, -16);
  ctx.translate(14, 4); // Handpunkt bewusst weiter außen/tiefer als bei den Feldwerkzeugen - siehe Kommentar oben
  ctx.translate(push, 0);
  ctx.fillStyle = '#6b4a2f';
  ctx.fillRect(-2, -3, 3.6, 6);
  ctx.fillStyle = '#c9cdd2'; ctx.strokeStyle = '#5a5f66'; ctx.lineWidth = 0.7;
  ctx.beginPath();
  ctx.moveTo(1.6, -2.6); ctx.lineTo(14, -1.8); ctx.lineTo(14, 1.2); ctx.lineTo(1.6, 2.2);
  ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.strokeStyle = '#7a8087'; ctx.lineWidth = 0.5;
  for (let i = 0; i < 8; i++) {
    const sx = 2.6 + i * 1.5;
    ctx.beginPath(); ctx.moveTo(sx, 2); ctx.lineTo(sx + 0.8, 3.1); ctx.stroke();
  }
  ctx.restore();
}
// Mühle: der Müller wuchtet einen prallen Mehlsack hoch und wieder ab.
function drawFlourSack(x, y, scale, flip, t, period) {
  const p = (t % period) / period;
  const lift = -Math.abs(Math.sin(p * Math.PI)) * 5.5;
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(flip ? -scale : scale, scale);
  ctx.translate(0, -16);
  ctx.translate(14, 4); // Handpunkt bewusst weiter außen/tiefer als bei den Feldwerkzeugen - siehe Kommentar oben
  ctx.translate(4, 6 + lift); // vor dem Bauch getragen statt am Kopf
  ctx.fillStyle = '#e6dcc4'; ctx.strokeStyle = '#a3937a'; ctx.lineWidth = 0.8;
  ctx.beginPath();
  ctx.moveTo(-4.4, -1.5);
  ctx.quadraticCurveTo(-6.2, -10, -2.4, -12.5);
  ctx.lineTo(2.8, -12.5);
  ctx.quadraticCurveTo(6.2, -9.5, 4.4, -1.5);
  ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.strokeStyle = '#8a6a44'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(-2.6, -12.1); ctx.lineTo(3, -12.1); ctx.stroke();
  // aufstiebender Mehlstaub am obersten Punkt des Hubs
  const dust = Math.max(0, Math.sin(p * Math.PI) - 0.6) * 2.5;
  if (dust > 0) {
    ctx.fillStyle = `rgba(245,240,228,${(0.5 * dust).toFixed(2)})`;
    for (let i = 0; i < 3; i++) {
      ctx.beginPath(); ctx.arc(-2 + i * 2.6, -14 - dust * 3 - i, 1 + dust, 0, Math.PI * 2); ctx.fill();
    }
  }
  ctx.restore();
}
// Bäckerei: langer Brotschieber, der ein Laib in den Ofen schiebt und leer
// wieder herauskommt.
function drawBakerPeel(x, y, scale, flip, t, period) {
  const p = (t % period) / period;
  const push = 0.5 - 0.5 * Math.cos(p * Math.PI * 2); // 0 -> 1 -> 0
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(flip ? -scale : scale, scale);
  ctx.translate(0, -16);
  ctx.translate(14, 4); // Handpunkt bewusst weiter außen/tiefer als bei den Feldwerkzeugen - siehe Kommentar oben
  ctx.rotate(0.6 + push * 0.5);
  ctx.strokeStyle = '#6b4a2f'; ctx.lineWidth = 1.5; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, -16); ctx.stroke();
  ctx.lineCap = 'butt';
  ctx.fillStyle = '#c9a878'; ctx.strokeStyle = '#8a6a44'; ctx.lineWidth = 0.7;
  ctx.beginPath(); ctx.ellipse(0, -18.5, 4, 3, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  if (push < 0.55) {
    ctx.fillStyle = '#c98a4a';
    ctx.beginPath(); ctx.ellipse(0, -19, 2.6, 1.8, 0, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();
}
// Schmelzhütte: Zange mit glühendem Barren, die rhythmisch zum Ofen und
// zurück geführt wird.
function drawTongs(x, y, scale, flip, t, period) {
  const p = (t % period) / period;
  const swing = Math.sin(p * Math.PI * 2);
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(flip ? -scale : scale, scale);
  ctx.translate(0, -16);
  ctx.translate(14, 4); // Handpunkt bewusst weiter außen/tiefer als bei den Feldwerkzeugen - siehe Kommentar oben
  ctx.rotate(0.5 + swing * 0.32);
  ctx.strokeStyle = '#5a5f66'; ctx.lineWidth = 1.2; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(1.2, -11); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(-1.6, -11); ctx.stroke();
  ctx.lineCap = 'butt';
  const glow = 0.55 + 0.45 * (0.5 + 0.5 * swing);
  const g = ctx.createRadialGradient(0, -13.5, 0, 0, -13.5, 6);
  g.addColorStop(0, `rgba(255,214,120,${(0.75 * glow).toFixed(2)})`);
  g.addColorStop(1, 'rgba(242,144,58,0)');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(0, -13.5, 6, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = `rgb(255,${Math.round(110 + 90 * glow)},60)`;
  ctx.fillRect(-2.8, -15, 5.6, 3);
  ctx.restore();
}
// Brauerei: langes Rührpaddel, das gemächlich durch den Sudkessel zieht.
function drawStirPaddle(x, y, scale, flip, t, period) {
  const p = (t % period) / period;

}
// Weberei: Webschiffchen, das über die aufgespannten Kettfäden hin- und
// herflitzt.
function drawShuttle(x, y, scale, flip, t, period) {
  const p = (t % period) / period;
  const slide = Math.sin(p * Math.PI * 2) * 5.5;
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(flip ? -scale : scale, scale);
  ctx.translate(0, -16);
  ctx.translate(14, 4); // Handpunkt bewusst weiter außen/tiefer als bei den Feldwerkzeugen - siehe Kommentar oben
  ctx.translate(5, 1); // Webrahmen vor die Figur, nicht über den Körper
  ctx.strokeStyle = 'rgba(240,236,224,0.85)'; ctx.lineWidth = 0.55;

    ctx.beginPath(); ctx.moveTo(-4 + i * 2.6, -10); ctx.lineTo(-4 + i * 2.6, 2); ctx.stroke();
  }

  ctx.beginPath(); ctx.moveTo(-5.5, -10.5); ctx.lineTo(7, -10.5); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-5.5, 2.5); ctx.lineTo(7, 2.5); ctx.stroke();
  ctx.save();
  ctx.translate(slide + 1, -4);
  ctx.fillStyle = '#8a6a44'; ctx.strokeStyle = '#3a2c1c'; ctx.lineWidth = 0.6;
  ctx.beginPath(); ctx.ellipse(0, 0, 4, 1.6, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#c96a8a';

  ctx.restore();
  ctx.restore();
}
// Schmiede: Hammer, der auf den Amboss niedergeht - dieselbe Schwungkurve wie
// Axt/Spitzhacke, nur kürzer und wuchtiger.
function drawSmithHammer(x, y, scale, flip, t, period) {
  const p = (t % period) / period;
  // Hebt nur leicht nach hinten an (-0.3) und schlägt dann weit nach vorn
  // durch (+1.25) - der Amboss steht ja unmittelbar vor der Figur.
  const angle = -0.3 + 1.55 * (0.5 - 0.5 * Math.cos(p * Math.PI * 2));
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(flip ? -scale : scale, scale);
  ctx.translate(0, -16);
  ctx.translate(14, 4); // Handpunkt bewusst weiter außen/tiefer als bei den Feldwerkzeugen - siehe Kommentar oben
  ctx.rotate(angle);
  ctx.strokeStyle = '#6b4a2f'; ctx.lineWidth = 1.5; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, -12); ctx.stroke();
  ctx.lineCap = 'butt';
  ctx.fillStyle = '#4a4a52'; ctx.strokeStyle = '#26262c'; ctx.lineWidth = 0.7;
  ctx.fillRect(-3.6, -15.6, 7.2, 4.2);
  ctx.strokeRect(-3.6, -15.6, 7.2, 4.2);
  ctx.restore();
}
// Goldschmiede (v29): kleiner Ziselierhammer über einem Schmuckstück auf dem
// Amboss-Klötzchen. Bewusst eine ANDERE Bewegung als die Schmiede - dort holt
// der Hammer weit aus, hier tickt er nur in kurzen, feinen Schlägen, weil an
// einem Ohrring nicht geschmiedet, sondern getrieben wird.
function drawJewelChisel(x, y, scale, flip, t, period) {
  const p = (t % period) / period;
  const tap = 0.35 * (0.5 - 0.5 * Math.cos(p * Math.PI * 2));
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(flip ? -scale : scale, scale);
  ctx.translate(0, -16);
  ctx.translate(14, 4); // Handpunkt wie bei den übrigen Werkstatt-Werkzeugen
  // Werkbank-Klötzchen mit dem Schmuckstück davor
  ctx.fillStyle = '#6b4a2f'; ctx.strokeStyle = 'rgba(0,0,0,0.4)'; ctx.lineWidth = 0.7;
  ctx.fillRect(1, 4, 11, 4.5); ctx.strokeRect(1, 4, 11, 4.5);
  ctx.fillStyle = '#f0c419'; ctx.strokeStyle = '#8a6a12'; ctx.lineWidth = 0.6;
  ctx.beginPath(); ctx.arc(6.5, 3.2, 2.6, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#9a6ad8';
  ctx.beginPath(); ctx.arc(6.5, 3.2, 1.1, 0, Math.PI * 2); ctx.fill();
  // kleiner Hammer, der darüber tickt
  ctx.save();
  ctx.translate(6.5, -1.5);
  ctx.rotate(-0.5 + tap);
  ctx.strokeStyle = '#6b4a2f'; ctx.lineWidth = 1.2; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, -8); ctx.stroke();
  ctx.lineCap = 'butt';
  ctx.fillStyle = '#c9ccd4'; ctx.strokeStyle = '#5a5d66'; ctx.lineWidth = 0.6;
  ctx.fillRect(-2.4, -10.4, 4.8, 2.8); ctx.strokeRect(-2.4, -10.4, 4.8, 2.8);
  ctx.restore();
  ctx.restore();
}
// Münzprägerei (v29): der Präger schlägt einen Stempel auf einen Rohling; bei
// jedem Schlag springt eine fertige Münze aus der Presse. Die Bewegung ist
// kurz und schwer (Presse), nicht schwingend wie ein Hammer.
function drawCoinPunch(x, y, scale, flip, t, period) {
  const p = (t % period) / period;
  // schnelles Herunterdrücken, langsames Anheben - das Gegenteil des Ausholens
  const press = p < 0.25 ? (p / 0.25) : (1 - (p - 0.25) / 0.75);
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(flip ? -scale : scale, scale);
  ctx.translate(0, -16);
  ctx.translate(14, 4);
  // Prägeblock
  ctx.fillStyle = '#4a4a52'; ctx.strokeStyle = '#26262c'; ctx.lineWidth = 0.7;
  ctx.fillRect(0, 4, 12, 5); ctx.strokeRect(0, 4, 12, 5);
  // Rohling darauf
  ctx.fillStyle = '#d4af37'; ctx.strokeStyle = '#8a6a12'; ctx.lineWidth = 0.6;
  ctx.beginPath(); ctx.ellipse(6, 3.6, 3, 1.3, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  // Stempel, der darauf niedergeht
  ctx.save();
  ctx.translate(6, -10 + press * 8);
  ctx.fillStyle = '#8a8a94'; ctx.strokeStyle = '#3a3a42'; ctx.lineWidth = 0.8;
  ctx.fillRect(-2.6, 0, 5.2, 9); ctx.strokeRect(-2.6, 0, 5.2, 9);
  ctx.fillStyle = '#6b4a2f';
  ctx.fillRect(-3.8, -3.4, 7.6, 3.6); ctx.strokeRect(-3.8, -3.4, 7.6, 3.6);
  ctx.restore();
  // frisch geprägte Münzen, die neben der Presse liegen
  if (t > period) {
    ctx.fillStyle = '#f7e07a'; ctx.strokeStyle = '#a8892a'; ctx.lineWidth = 0.5;
    for (const [mx, my] of [[16, 7.4], [18.6, 6.2], [15.2, 5.6]]) {
      ctx.beginPath(); ctx.ellipse(mx, my, 2.4, 1.1, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    }
  }
  ctx.restore();
}
// Schneiderei: Nadel mit Faden, die in kleinen Stichen durch das über den
// Knien liegende Stoffstück geführt wird.
function drawNeedleWork(x, y, scale, flip, t, period) {
  const p = (t % period) / period;
  const stitch = p < 0.5 ? p * 2 : (1 - p) * 2;
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(flip ? -scale : scale, scale);
  ctx.translate(0, -16);
  ctx.translate(14, 4); // Handpunkt bewusst weiter außen/tiefer als bei den Feldwerkzeugen - siehe Kommentar oben
  ctx.translate(5, 1); // Stoffstück vor die Figur, nicht über den Körper
  ctx.fillStyle = '#5fb9a4'; ctx.strokeStyle = 'rgba(0,0,0,0.3)'; ctx.lineWidth = 0.6;
  ctx.beginPath();
  ctx.moveTo(-4, 0);
  ctx.quadraticCurveTo(2, -4, 8, -1.5);
  ctx.lineTo(7, 4.5);
  ctx.quadraticCurveTo(2, 2, -4, 5);
  ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.save();
  ctx.translate(2 + stitch * 3.4, -3.5 - stitch * 4);
  ctx.rotate(-0.7);
  ctx.strokeStyle = '#dfe3e7'; ctx.lineWidth = 0.9; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(0, 1.5); ctx.lineTo(0, -4.5); ctx.stroke();
  ctx.strokeStyle = '#c96a8a'; ctx.lineWidth = 0.5;
  ctx.beginPath(); ctx.moveTo(0, -4.5); ctx.quadraticCurveTo(2.4, -2.4, 1.6, 1.8); ctx.stroke();
  ctx.lineCap = 'butt';
  ctx.restore();
  ctx.restore();
}
// Kürschnerei (v27): das Fell ist über einen Spannrahmen gezogen, der Kürschner
// schabt es mit dem Schabeisen ab. Der Rahmen ist bewusst das GRÖSSTE Element -
// er ist das Erkennungsmerkmal, das Schabeisen selbst wäre bei dieser
// Figurengröße nur ein Strich (siehe Technischer Hinweis zu Werkzeugen).
function drawHideScraper(x, y, scale, flip, t, period) {
  const p = (t % period) / period;
  // gleichmäßiges Hin und Her über die Fläche, mit kurzem Halt an den Enden
  const stroke = 0.5 - 0.5 * Math.cos(p * Math.PI * 2);
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(flip ? -scale : scale, scale);
  ctx.translate(0, -16);
  ctx.translate(14, 4); // Handpunkt bewusst weiter außen/tiefer als bei den Feldwerkzeugen - siehe Kommentar oben
  ctx.translate(6, -2); // Rahmen vor die Figur, leicht angehoben
  // Spannrahmen aus vier Stangen
  ctx.strokeStyle = '#6b4a2f'; ctx.lineWidth = 1.4; ctx.lineJoin = 'round';
  ctx.strokeRect(-5, -8, 13, 13);
  // Aufgespanntes Fell mit Fleischseite nach vorn
  ctx.fillStyle = '#8a6242'; ctx.strokeStyle = 'rgba(30,22,14,0.45)'; ctx.lineWidth = 0.6;
  ctx.beginPath();
  ctx.moveTo(-3, -6.5);
  ctx.quadraticCurveTo(1.5, -8, 6, -6);
  ctx.quadraticCurveTo(7.5, -1, 6, 3.5);
  ctx.quadraticCurveTo(1.5, 5, -3, 3);
  ctx.quadraticCurveTo(-4.5, -1.5, -3, -6.5);
  ctx.closePath(); ctx.fill(); ctx.stroke();
  // Spannschnüre an den Ecken
  ctx.strokeStyle = 'rgba(240,236,224,0.6)'; ctx.lineWidth = 0.45;
  for (const [sx, sy, ex, ey] of [[-5, -8, -3, -6.5], [8, -8, 6, -6], [8, 5, 6, 3.5], [-5, 5, -3, 3]]) {
    ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(ex, ey); ctx.stroke();
  }
  // Schabeisen, das über die Fläche zieht
  ctx.save();
  ctx.translate(-2 + stroke * 6, -4 + stroke * 5);
  ctx.rotate(0.5);
  ctx.fillStyle = '#6b4a2f';
  ctx.fillRect(-0.9, -0.6, 3.4, 1.8);
  ctx.strokeStyle = 'rgba(20,22,26,0.5)'; ctx.lineWidth = 1.8; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(-1, 0.3); ctx.lineTo(-4.4, 0.3); ctx.stroke();
  ctx.strokeStyle = '#dde4ea'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(-1, 0.3); ctx.lineTo(-4.4, 0.3); ctx.stroke();
  ctx.lineCap = 'butt';
  ctx.restore();
  ctx.lineJoin = 'miter';
  ctx.restore();
}
// Zigarrenroller (NEU, v34.14): niedriger Rolltisch, darauf ein Deckblatt, das

function drawCigarRoller(x, y, scale, flip, t, period) {

  ctx.fillStyle = '#e8d9a8'; ctx.fillRect(9.7, 1.1, 1.6, 0.8);

  ctx.restore();

// Schleifstein des Waffenschmieds (NEU, v34.18): ein sich drehendes Rad im
// Gestell, darüber die Klinge, aus dem Berührungspunkt stieben Funken. Die
// Drehung kommt aus der Animationsphase selbst (ein durchlaufender Winkel),
// die Funken aus derselben Phase mit Versatz - dadurch sprühen sie genau dann,
// wenn das Rad läuft, ohne dass es dafür eigenen Zustand am Gebäude braucht.
function drawGrindstone(x, y, scale, flip, t, period) {
  const p = (t % period) / period;
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(flip ? -scale : scale, scale);
  ctx.translate(0, -16);
  ctx.translate(14, 4); // Handpunkt wie bei den übrigen Werkstatt-Werkzeugen
  ctx.translate(8, -2); // Gestell VOR die Figur, sonst verdeckt ihr Körper das halbe Rad
  // Gestell
  ctx.strokeStyle = '#5a4a34'; ctx.lineWidth = 1.2; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(0, 8); ctx.lineTo(3, 2); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(10, 8); ctx.lineTo(7, 2); ctx.stroke();
  ctx.lineCap = 'butt';
  // Schleifrad mit Speichen - die Speichen sind das, was die Drehung sichtbar
  // macht; ein glatter Kreis sähe stillstehend aus.
  const rad = 4.2, cxw = 5, cyw = 1.5;
  ctx.fillStyle = '#9a958a'; ctx.strokeStyle = 'rgba(0,0,0,0.45)'; ctx.lineWidth = 0.7;
  ctx.beginPath(); ctx.arc(cxw, cyw, rad, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  ctx.strokeStyle = 'rgba(60,56,50,0.7)'; ctx.lineWidth = 0.6;
  for (let i = 0; i < 4; i++) {
    const a = p * Math.PI * 2 + i * Math.PI / 2;
    ctx.beginPath();
    ctx.moveTo(cxw, cyw);
    ctx.lineTo(cxw + Math.cos(a) * rad * 0.85, cyw + Math.sin(a) * rad * 0.85);
    ctx.stroke();
  }
  ctx.fillStyle = '#5a5248';
  ctx.beginPath(); ctx.arc(cxw, cyw, 0.9, 0, Math.PI * 2); ctx.fill();
  // Klinge, die schräg auf dem Rad aufliegt
  ctx.fillStyle = '#c9ccd4'; ctx.strokeStyle = 'rgba(30,34,40,0.55)'; ctx.lineWidth = 0.5;
  ctx.beginPath();

// spart aber die aufwendige Einsortierung frei beweglicher Objekte.
function drawSheep(b) {
  if (!b.sheep) return;
  const scale = camera.zoom;
  for (const s of b.sheep) {
    const p = gridToScreen(s.x, s.y);
    const moving = s.tx !== null && !s.held;
    // leichtes Auf-und-ab beim Trotten; grasende Schafe senken den Kopf
    const bob = moving ? Math.abs(Math.sin(animClock / 190 + s.bob)) * 1.2 : 0;
    const grazing = !moving && !s.held;
    ctx.save();
    ctx.translate(p.x, p.y - bob * scale);
    ctx.scale(s.flip ? -scale : scale, scale);

    const stride = moving ? Math.sin(animClock / 150 + s.bob) * 1.1 : 0;

    ctx.beginPath(); ctx.moveTo(2.5, -3); ctx.lineTo(2.5 + stride, 1); ctx.stroke();

    ctx.lineWidth = 0.7;

// ---- Walfangboote (NEU, v29.1) ----------------------------------------------
// Die Walfängerhütte stellt keinen Harpunier ans Ufer mehr, sondern schickt ein
// BOOT hinaus: hinausrudern, jagen, zurückkehren - erst bei der Rückkehr wird
// der Tran verbucht. Damit ist der Walfang der einzige Erzeuger, dessen Arbeit
// auf dem WASSER stattfindet, und der mit Abstand langsamste: eine volle Fahrt
// dauert je nach Entfernung rund 25-40 Sekunden.

// mitten auf der Jagd raus, startet die Hütte nach dem Laden einfach eine neue
// Fahrt. `b.busy` wird beim Laden ohnehin auf false gesetzt.

let whaleBoats = [];

const WHALE_HUNT_TIME = 9000;    // ms auf dem Fanggrund, bis der Wal erlegt ist

// Sucht einen Fanggrund: eine Wasserkachel in Reichweite, die von der
// Anlegestelle der Hütte aus auf GERADER Linie über Wasser erreichbar ist
// (pathAllWater, dieselbe Prüfung wie beim Schiffskurs). Bewusst keine
// Breitensuche wie bei den Frachtrouten: ein Walfangboot soll aufs offene Meer
// hinaus, nicht um den halben Archipel herumkurven - findet es keinen freien
// Weg, ist die Bucht schlicht kein Walfanggebiet.
function findWhalingGrounds(b) {
  const dock = findNearestWaterTile(b.x, b.y, 3);
  if (!dock) return null;
  let best = null, bestDist = -1;
  // Acht Richtungen abtasten und die weiteste freie Wasserstrecke nehmen -
  // dadurch fährt das Boot verlässlich aufs offene Meer statt in eine Ecke.
  for (let i = 0; i < 8; i++) {
    const ang = (i / 8) * Math.PI * 2;
    for (let d = WHALE_GROUND_MAX; d >= WHALE_GROUND_MIN; d--) {
      const gx = Math.round(dock.x + Math.cos(ang) * d);
      const gy = Math.round(dock.y + Math.sin(ang) * d);
      if (!inBounds(gx, gy) || !isWater(gx, gy)) continue;
      if (!pathAllWater(dock.x, dock.y, gx, gy)) continue;
      if (d > bestDist) { bestDist = d; best = { x: gx, y: gy }; }
      break; // in dieser Richtung reicht der weiteste gültige Punkt
    }
  }
  if (!best) return null;
  // Walwanderung (v34.25): liegt eine Walschule in Reichweite und auf freiem
  // Wasserweg, fährt das Boot DORTHIN, und der Fang ist fast sicher - je
  // näher, desto sicherer. Sonst fährt es wie früher aufs offene Meer, kommt
  // aber meist leer zurück.
  let pod = null, podDist = Infinity;
  for (const w of whalePods) {
    const d = Math.hypot(w.x - dock.x, w.y - dock.y);
    if (d > WHALE_POD_REACH || d >= podDist) continue;
    const gx = Math.round(w.x), gy = Math.round(w.y);
    if (!isWater(gx, gy) || !pathAllWater(dock.x, dock.y, gx, gy)) continue;
    pod = w; podDist = d;
  }
  if (pod) {
    const chance = podDist <= WHALE_POD_NEAR ? 0.95
      : 0.95 - (podDist - WHALE_POD_NEAR) / (WHALE_POD_REACH - WHALE_POD_NEAR) * 0.4;
    return { dock, ground: { x: Math.round(pod.x), y: Math.round(pod.y) }, chance, podDist };
  }
  return { dock, ground: best, chance: WHALE_NO_POD_CHANCE, podDist: null };
}

const WHALE_POD_COUNT = 3;

  for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) {
    const t = map[y][x];
    if (t.terrain === 'water' && !t.shallow && climateAt(x, y) === 'polar' && hash(x, y, 181) < 0.2) whaleWaterSpots.push({ x, y });
  }
  if (!whaleWaterSpots.length) return;
  for (let i = 0; i < WHALE_POD_COUNT; i++) {
    const s = whaleWaterSpots[Math.floor(Math.random() * whaleWaterSpots.length)];
    whalePods.push({ x: s.x, y: s.y, tx: null, ty: null, wait: Math.random() * WHALE_POD_STAY_MAX,

function updateWhalePods(dt) {
  for (const w of whalePods) {

      // neues Ziel: erreichbar auf gerader Wasserlinie, 8-25 Felder entfernt
      for (let k = 0; k < 30; k++) {
        const s = whaleWaterSpots[Math.floor(Math.random() * whaleWaterSpots.length)];
        const d = Math.hypot(s.x - w.x, s.y - w.y);
        if (d < 8 || d > 25 || !pathAllWater(w.x, w.y, s.x, s.y)) continue;
        w.tx = s.x; w.ty = s.y; break;

// Wale einer Schule: zwei bis drei Tiere, die zeitversetzt auftauchen und

function drawWhalePods() {

    for (let i = 0; i < w.size; i++) {

      const whaleAngle = i * 1.3 + w.seed;

      const p = { x: c.x + ox - Math.cos(whaleAngle) * 46 * scale, y: c.y + oy - Math.sin(whaleAngle) * 20 * scale };

function launchWhaleBoat(b, grounds) {
  b.busy = true;
  whaleBoats.push({
    building: b,
    x: grounds.dock.x, y: grounds.dock.y,
    homeX: grounds.dock.x, homeY: grounds.dock.y,
    tx: grounds.ground.x, ty: grounds.ground.y,
    phase: 'out',       // 'out' -> 'hunt' -> 'home'
    timer: 0,
    // Walwanderung (v34.25): schon beim Auslaufen entschieden, ob es klappt -
    // ein erfolgloses Boot sucht auf dem Fanggrund vergeblich (kein Wal).
    lucky: Math.random() < (grounds.chance ?? 1),
    flip: false,
    bob: Math.random() * 6.28,

}

// Ein Boot verliert seine Hütte (Abriss oder Verfall) - dann verschwindet es
// mit ihr, statt weiter Tran in ein nicht mehr vorhandenes Lager zu bringen.
// Gegenstück zum Lösen der `held`-Sperre eines Rehs in removeBuilding.
function removeWhaleBoatsOf(b) {
  whaleBoats = whaleBoats.filter(bo => bo.building !== b);
}

function updateWhaleBoats(dt) {
  const dtSec = dt / 1000;
  for (let i = whaleBoats.length - 1; i >= 0; i--) {
    const bo = whaleBoats[i];
    // Sicherheitsnetz: Hütte inzwischen weg? Dann auch das Boot.
    if (!buildings.includes(bo.building)) { whaleBoats.splice(i, 1); continue; }
    if (bo.phase === 'hunt') {
      bo.timer += dt;
      // Der Harpunenstoß fällt mit dem Klang zusammen - aber nur, wenn das Boot
      // auch im Bild ist (dieselbe Regel wie bei allen Umgebungsgeräuschen).
      const period = WHALE_SWING_PERIOD;
      if (Math.floor(bo.timer / period) !== Math.floor((bo.timer - dt) / period) && isOnScreen(bo.x, bo.y)) {
        AudioEngine.playHarpoon();
      }
      if (bo.timer >= WHALE_HUNT_TIME) {
        bo.phase = 'home';
        bo.timer = 0;
        bo.tx = bo.homeX; bo.ty = bo.homeY;

      continue;
    }
    // Fahrt: Wetter bremst das Walfangboot genauso wie einen Frachter (v29) -
    // ein Sturm über See soll nicht nur die Handelsrouten treffen.
    const dx = bo.tx - bo.x, dy = bo.ty - bo.y;
    const dist = Math.hypot(dx, dy);
    const step = Math.min(dist, WHALE_BOAT_SPEED * weatherShipFactor(bo.x, bo.y) * dtSec);
    if (dist > 0.05) {
      bo.x += (dx / dist) * step;
      bo.y += (dy / dist) * step;
      bo.flip = (dx - dy) < 0;
      continue;
    }
    if (bo.phase === 'out') {
      bo.phase = 'hunt';
      bo.timer = 0;
    } else {

      // wie ein Feldarbeiter seine Ware erst bei der Rückkehr abliefert, damit
      // die Logistik nicht schon Träger losschickt, während das Boot noch fährt.
      const b = bo.building;
      if (bo.lucky !== false) {
        b.storage.oil = (b.storage.oil || 0) + 1;
        recordProduced('oil', 1);
      }
      // Fangbilanz der letzten zehn Fahrten fürs Infopanel (v34.25)
      b.whaleLog = (b.whaleLog || []).concat(bo.lucky !== false ? 1 : 0).slice(-10);
      b.busy = false;
      whaleBoats.splice(i, 1);
    }
  }
}

function drawWhaleBoats() {
  for (const bo of whaleBoats) drawWhaleBoatOne(bo);
}
function drawWhaleBoatOne(bo) {

    if (islandOfBuilding(st) !== isl) continue;

// Zentrale Update-Funktion, aus der Hauptschleife aufgerufen (siehe update()):
// 1) würfelt in seltenen, zufälligen Abständen einen neuen Brand aus, aber
//    NUR, sobald die Bevölkerung FIRE_MIN_POPULATION erreicht hat (das
//    Ereignis ist also erst ab dem mittleren Spielverlauf überhaupt möglich -
//    derselbe Freischalt-Gedanke wie bei BUILD_UNLOCKS, nur ohne Bau-Knopf);
// 2) lässt jeden laufenden Brand wachsen oder (falls eine Feuerwache vor Ort
//    löscht) schrumpfen, und entscheidet damit direkt das Wettrennen "brennt
//    das Gebäude ab, oder wird es gerettet?";

//    Abzeichen aktuell.
// ---- Seuche (NEU, v34.24) ----------------------------------------------------
// Ein Zufallsereignis nach dem Vorbild des Feuers, aber mit anderem Charakter:
// es trifft Wohnhäuser, kostet BEWOHNER statt Gebäude und kann sich ausbreiten.
// Ab DISEASE_MIN_POPULATION Einwohnern erkrankt alle 5-9 Minuten ein
// zufälliges Wohnhaus. Solange es krank und unbehandelt ist, stirbt alle
// DISEASE_DEATH_INTERVAL ein Bewohner, und alle DISEASE_SPREAD_INTERVAL kann
// die Krankheit auf ein Nachbarhaus überspringen.
//
// Gegenmittel ist der MEDICUS: liegt ein krankes Haus in seiner Reichweite
// und hat er Heilkräuter vorrätig (aus dem Kräutergarten, per Träger
// geliefert - siehe CONSUMERS), verbraucht er EINE und behandelt das Haus.
// Während der Behandlung stirbt niemand und nichts breitet sich aus; danach
// ist das Haus genesen und für eine Weile immun.
const DISEASE_MIN_POPULATION = 50;
const DISEASE_INTERVAL_MIN = 300000, DISEASE_INTERVAL_MAX = 540000;
const DISEASE_DEATH_INTERVAL = 15000;
const DISEASE_SPREAD_INTERVAL = 20000;
const DISEASE_SPREAD_CHANCE = 0.4;
const DISEASE_SPREAD_RADIUS = 4;
const DISEASE_CURE_TIME = 12000;
const DISEASE_IMMUNE_TIME = 240000;
let diseaseTimer = DISEASE_INTERVAL_MIN + Math.random() * (DISEASE_INTERVAL_MAX - DISEASE_INTERVAL_MIN);
function hasDoctorCoverage(house) {
  return buildings.some(d => d.type === 'doctor' && Math.hypot(d.x - house.x, d.y - house.y) <= d.def.radius);
}
function infectHouse(h, ausbruch) {
  h.sick = true; h.sickTimer = 0; h.treatTimer = 0; h.spreadTimer = 0;
  if (ausbruch) {
    logEvent(`🤒 Seuche! Ein ${tierOf(h).name} auf ${islandLabel(islandOfBuilding(h))} ist erkrankt – ohne Medicus mit Heilkräutern sterben Bewohner.`, 'danger', h);
    AudioEngine.playPlagueBell();
  }
}
function updateDisease(dt) {
  diseaseTimer -= dt;
  if (diseaseTimer <= 0) {
    diseaseTimer = DISEASE_INTERVAL_MIN + Math.random() * (DISEASE_INTERVAL_MAX - DISEASE_INTERVAL_MIN);
    if (populationInTier(0) >= DISEASE_MIN_POPULATION) {
      const kandidaten = buildings.filter(h => h.type === 'house' && h.population > 0 && !h.sick && !(h.immuneTimer > 0));
      if (kandidaten.length) infectHouse(kandidaten[Math.floor(Math.random() * kandidaten.length)], true);
    }
  }
  for (const h of buildings) {
    if (h.type !== 'house') continue;
    if (h.immuneTimer > 0) h.immuneTimer = Math.max(0, h.immuneTimer - dt);
    if (!h.sick) continue;
    if (h.population <= 0) { h.sick = false; h.treatTimer = 0; continue; } // leeres Haus: niemand mehr krank
    // In Behandlung
    if (h.treatTimer > 0) {
      h.treatTimer += dt;
      if (h.treatTimer >= DISEASE_CURE_TIME) {
        h.sick = false; h.treatTimer = 0; h.sickTimer = 0;
        h.immuneTimer = DISEASE_IMMUNE_TIME;
        if (!buildings.some(o => o.type === 'house' && o.sick)) logEvent('💊 Die Seuche ist besiegt – alle Häuser sind genesen.', 'danger', h);
      }
      continue;
    }

    const arzt = buildings.find(d => d.type === 'doctor' && (d.storage.herbs || 0) >= 1 &&
      Math.hypot(d.x - h.x, d.y - h.y) <= d.def.radius);
    if (arzt) {
      arzt.storage.herbs -= 1;
      arzt.lastTreat = animClock;
      h.treatTimer = 1;
      continue;
    }
    // Unbehandelt: Sterben und Ausbreitung
    h.sickTimer += dt;
    if (h.sickTimer >= DISEASE_DEATH_INTERVAL) {
      h.sickTimer -= DISEASE_DEATH_INTERVAL;
      h.population -= 1;
      h.diedRecently = animClock;
    }
    h.spreadTimer += dt;
    if (h.spreadTimer >= DISEASE_SPREAD_INTERVAL) {
      h.spreadTimer -= DISEASE_SPREAD_INTERVAL;
      if (Math.random() < DISEASE_SPREAD_CHANCE) {
        const nachbarn = buildings.filter(o => o.type === 'house' && o !== h && !o.sick && !(o.immuneTimer > 0) &&
          o.population > 0 && Math.hypot(o.x - h.x, o.y - h.y) <= DISEASE_SPREAD_RADIUS);
        if (nachbarn.length) infectHouse(nachbarn[Math.floor(Math.random() * nachbarn.length)], false);

function updatePlagueBadge() {

  el.classList.toggle('active', kranke.length > 0);
  if (!kranke.length) return;
  const inseln = new Set(kranke.map(h => islandOfBuilding(h)));
  el.textContent = `🤒 Seuche${inseln.size === 1 ? ' auf ' + islandLabel([...inseln][0]) : ''} (${kranke.length} ${kranke.length === 1 ? 'Haus' : 'Häuser'})`;

function updateFires(dt) {
  fireEventTimer -= dt;
  if (fireEventTimer <= 0) {
    fireEventTimer = randomFireInterval();
    if (populationInTier(0) >= FIRE_MIN_POPULATION) {
      const targets = eligibleFireTargets();
      if (targets.length) igniteFire(targets[Math.floor(Math.random() * targets.length)]);
    }
  }
  const burnedDown = [];
  for (const b of buildings) {
    if (!b.onFire) continue;
    const responder = fireUnits.find(u => u.target === b && u.phase === 'dousing');
    if (responder) {
      // Löschen wirkt schneller, als das Feuer von selbst wächst
      // (FIRE_DOUSE_RATE) - eine rechtzeitig eingetroffene Feuerwache rettet
      // das Gebäude also praktisch immer, eine zu spät eingetroffene nicht
      // mehr (siehe den Totalschaden-Check gleich darunter).
      b.fireProgress = Math.max(0, (b.fireProgress || 0) - dt * FIRE_DOUSE_RATE);
      if (b.fireProgress <= 0) {
        b.onFire = false;
        b.fireProgress = 0;
        logEvent(`💧 Die Feuerwache hat den Brand im ${b.def.name} auf ${islandLabel(islandOfBuilding(b))} gelöscht.`, 'danger', b);
        AudioEngine.playFireExtinguish();
      }
      continue;
    }
    b.fireProgress = (b.fireProgress || 0) + dt;
    if (b.fireProgress >= FIRE_GROW_TIME) { burnedDown.push(b); continue; }
    // Noch kein Löschversuch für diesen Brand unterwegs? Bei jedem Tick neu
    // versuchen (siehe tryDispatchFirefighters) statt nur einmal bei Ausbruch.
    if (!fireUnits.some(u => u.target === b)) tryDispatchFirefighters(b);
  }
  for (const b of burnedDown) {
    const name = b.def.name, loc = islandLabel(islandOfBuilding(b)), ort = { x: b.x, y: b.y };
    removeBuilding(b);
    logEvent(`🔥 ${name} auf ${loc} ist bis auf die Grundmauern niedergebrannt!`, 'danger', ort);
    AudioEngine.playFireBurnDown();
  }
  updateFireUnits(dt);
  updateFireBadge();
}

  // einzelnen Koordinate unten im Code einen Faktor einzurechnen.
  const typ = SHIP_TYPES[s.shipType] || SHIP_TYPES.small;
  const isWar = typ === SHIP_TYPES.warship;
  if (typ === SHIP_TYPES.galleon) { drawGalleonBody(s, moving); ctx.restore(); return; }
  if (typ === SHIP_TYPES.large) ctx.scale(1.35, 1.35);
  else if (isWar) ctx.scale(1.12, 1.12); // etwas größer als das Kleine, deutlich schlanker als das Große
  // Auswahlring auf dem Wasser darunter, damit klar ist, welches Schiff reagiert.
  if (s.selected) {
    ctx.strokeStyle = 'rgba(255,255,255,0.85)';
    ctx.lineWidth = 1.4;
    ctx.setLineDash([2.5, 2.5]);
    ctx.beginPath(); ctx.ellipse(0, 6, 12, 4.5, 0, 0, Math.PI * 2); ctx.stroke();
    ctx.setLineDash([]);
  }
  ctx.fillStyle = 'rgba(0,0,0,0.2)';
  ctx.beginPath(); ctx.ellipse(0, 6, 10, 3, 0, 0, Math.PI * 2); ctx.fill();
  // Rammsporn am Bug - nur beim Kriegsschiff, und bewusst VOR dem Rumpf
  // gezeichnet, damit die Rumpfkante darüber liegt und beides wie ein Stück
  // wirkt. Er ist zusammen mit den Schilden das, was das Schiff auf Entfernung
  // als Kriegsschiff lesbar macht: die Silhouette wird vorne spitz.
  if (isWar) {
    ctx.fillStyle = '#3a2c1c';
    ctx.beginPath();
    ctx.moveTo(10, 2.4); ctx.lineTo(16.5, 4.2); ctx.lineTo(10, 5.4);
    ctx.closePath(); ctx.fill();
  }
  // Rumpf - beim Kriegsschiff dunkel geteert statt hell gekalkt
  ctx.fillStyle = isWar ? '#4a3b2e' : '#7a4f2c'; ctx.strokeStyle = '#3a2c1c'; ctx.lineWidth = 0.9;
  ctx.beginPath();
  ctx.moveTo(-11, 2); ctx.lineTo(11, 2); ctx.lineTo(8, 6); ctx.lineTo(-8, 6); ctx.closePath();
  ctx.fill(); ctx.stroke();
  ctx.strokeStyle = 'rgba(0,0,0,0.25)'; ctx.lineWidth = 0.6;
  ctx.beginPath(); ctx.moveTo(-9, 3.6); ctx.lineTo(9, 3.6); ctx.stroke();
  // Mast & Segel - beim Fahren leicht gebläht, sonst locker hängend
  ctx.strokeStyle = '#4a3320'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(0, 2); ctx.lineTo(0, -13); ctx.stroke();
  // Kriegsschiffe führen ein dunkelrotes Segel statt des hellen Frachtersegels
  ctx.fillStyle = isWar ? '#8c3a34' : '#e8e2d0';
  ctx.strokeStyle = 'rgba(60,40,20,0.5)'; ctx.lineWidth = 0.6;
  const billow = moving ? 3.5 : 1;
  ctx.beginPath();
  ctx.moveTo(0, -12); ctx.quadraticCurveTo(billow, -6, 0, 0); ctx.quadraticCurveTo(0.6, -6, 0, -12);
  ctx.closePath(); ctx.fill(); ctx.stroke();
  // Wimpel am Mast - Schiffe im Frachtdienst führen einen blauen Handelswimpel
  // (v26). So sieht man auf einen Blick, welches Schiff einer Route zugeteilt
  // ist und welches noch frei zur Verfügung steht.
  // Geleitschutz (v34.24) führt einen grünen Wimpel
  ctx.fillStyle = s.escortRouteId ? '#4fae5a' : (s.routeId ? '#3f86c9' : '#8a2f2f');
  ctx.beginPath(); ctx.moveTo(0, -13); ctx.lineTo(4, -11.5); ctx.lineTo(0, -10.5); ctx.closePath(); ctx.fill();
  // Ladung an Deck (v25): bis zu drei gestapelte Kisten, deren Zahl mit der
  // Auslastung wächst. Ohne dieses Zeichen sähe man einem Schiff nicht an, ob
  // es voll oder leer unterwegs ist - und genau das ist beim Inselhandel die
  // Information, auf die es ankommt.
  const load = cargoTotal(s);
  if (load > 0) {
    const crates = Math.min(3, Math.ceil(load / (shipCapacity(s) / 3)));
    ctx.fillStyle = '#8a5a34'; ctx.strokeStyle = '#3a2c1c'; ctx.lineWidth = 0.6;
    for (let i = 0; i < crates; i++) {
      const bx = -7 + i * 4.6, by = 1.4 - (i === 1 ? 3.2 : 0);
      ctx.fillRect(bx, by - 3.4, 4, 3.6);
      ctx.strokeRect(bx, by - 3.4, 4, 3.6);
      ctx.beginPath(); ctx.moveTo(bx, by - 1.6); ctx.lineTo(bx + 4, by - 1.6); ctx.stroke();
    }

  // Kriegsschiffs: fünf runde Schilde mit Buckel, abwechselnd in zwei Farben,
  // auf der Rumpfkante und leicht darüber hinausragend wie an einem Langschiff.
  //
  // Steht ABSICHTLICH ganz am Ende der Zeichnung (v34.20). Zuerst standen die
  // Schilde direkt nach dem Rumpf - dort malte das später gezeichnete Segel sie
  // teilweise zu, und vom mittleren Schild blieb nichts übrig. Das war nicht
  // nur unschön, sondern verkehrt herum: die Schilde hängen AUSSEN am Rumpf,
  // also vor allem, was an Deck steht. Zuletzt gezeichnet liegen sie jetzt vor
  // Segel UND Ladekisten - genau in dieser Reihenfolge stimmt auch die Tiefe.
  if (isWar) {
    for (let i = 0; i < 5; i++) {
      const sx = -8 + i * 4;
      ctx.fillStyle = i % 2 === 0 ? '#8c3a34' : '#d8cdb4';
      ctx.strokeStyle = '#2a2018'; ctx.lineWidth = 0.5;
      ctx.beginPath(); ctx.arc(sx, 2.6, 1.9, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      ctx.fillStyle = 'rgba(40,32,24,0.75)';
      ctx.beginPath(); ctx.arc(sx, 2.6, 0.6, 0, Math.PI * 2); ctx.fill();
    }
  }
