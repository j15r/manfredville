    // nicht hat. Stattdessen EINE Zeile, die sagt, ab wann es zählt.
    if (tierNeeds(b, 'beer')) {
      lines.push({ label: 'Wirtshaus in Reichweite', value: hasTavernCoverage(b) ? 'ja' : 'nein' });
      lines.push({ label: 'Bier (Insel)', value: Math.floor(stockOf(isl, 'beer')) });
      lines.push({ label: 'Zufriedenheit', value: (b.unhappyStreak || 0) > 0 ? 'unzufrieden – zieht bald aus' : (b.satisfied ? 'versorgt' : '–') });
    } else {
      lines.push({ label: 'Wirtshaus & Bier', value: 'erst als Bürgerhaus nötig' });
    }
    // Schule (NEU, v34.11): wie Wirtshaus eine Abdeckungszeile plus eine
    // Statuszeile - "ja, aber unbezahlt" ist hier ein dritter, eigener Fall
    // (Schule zwar in Reichweite, aber gerade nicht finanziert), den
    // hasSchoolCoverage schon selbst mit einrechnet.
    if (tierNeeds(b, 'school')) {
      const schoolNearby = buildings.some(sb => sb.type === 'school' && Math.sqrt((sb.x - b.x) ** 2 + (sb.y - b.y) ** 2) <= sb.def.radius);
      lines.push({
        label: 'Schule in Reichweite',
        value: !schoolNearby ? 'nein' : (hasSchoolCoverage(b) ? 'ja' : 'ja, aber unbezahlt')
      });
      lines.push({ label: 'Bildung', value: (b.schoolStreak || 0) > 0 ? 'unterrichtslos – zieht bald aus' : (b.educated ? 'versorgt' : '–') });
    } else {
      lines.push({ label: 'Schule & Bildung', value: 'erst als Bürgerhaus nötig' });
    }
    // Kleidung ist bewusst KEIN Auszugsgrund, sondern nur eine Wachstums-
    // schranke (siehe resolveClothesNeeds) - der Text muss das klar sagen,
    // sonst liest sich die Zeile wie die drei darüber und wirkt bedrohlicher
    // als sie ist.
    lines.push({ label: 'Kleidung (Insel)', value: Math.floor(stockOf(isl, 'clothes')) });
    lines.push({
      label: 'Kleidung',
      value: b.population < CLOTHES_GROWTH_THRESHOLD
        ? `erst ab ${CLOTHES_GROWTH_THRESHOLD} Bewohnern nötig`
        : (b.clothesShort ? 'fehlt – Wachstum gestoppt' : (b.wellDressed !== false ? 'versorgt' : '–'))
    });
    if (tierNeeds(b, 'luxury')) {
      // Seit v34.14 datengetrieben aus LUXURY_GOODS statt fest verdrahtet auf
      // "Tabak, Gewürze": die Zeile nannte seit v29 nur zwei der inzwischen
      // fünf Luxusgüter, ein Haus konnte also mit Pelzmantel oder Tran im
      // Lager versorgt sein, während hier "0 Tabak, 0 Gewürze" stand. Genannt
      // wird jetzt, was tatsächlich auf der Insel liegt.
      const vorrat = LUXURY_GOODS
        .map(g => ({ g, n: Math.floor(stockOf(isl, g)) }))
        .filter(e => e.n > 0);
      lines.push({
        label: 'Luxus (Insel)',
        value: vorrat.length ? vorrat.map(e => `${e.n} ${GOOD_LABELS[e.g]}`).join(', ') : 'nichts vorrätig'
      });
      lines.push({
        label: 'Luxus',
        value: b.luxuryShort ? 'fehlt – Wachstum gestoppt' : (b.hasLuxury !== false ? 'versorgt' : '–')
      });
    } else if (!tierNeeds(b, 'noble')) {
      lines.push({ label: 'Luxusgüter', value: 'erst als Kaufmannshaus nötig' });
    }
    // Adelsstufe (v34.24)
    if (tierNeeds(b, 'culture')) {
      lines.push({ label: 'Theater/Kathedrale in Reichweite', value: hasCultureCoverage(b) ? 'ja' : 'nein' });
      lines.push({ label: 'Kultur', value: (b.cultureStreak || 0) > 0 ? 'fehlt – zieht bald aus' : (b.cultured ? 'versorgt' : '–') });
    }
    if (tierNeeds(b, 'noble')) {
      const vorrat = NOBLE_LUXURY.map(g => ({ g, n: Math.floor(stockOf(isl, g)) })).filter(e => e.n > 0);
      lines.push({ label: 'Adelsluxus (Insel)', value: (vorrat.length ? vorrat.map(e => `${e.n} ${GOOD_LABELS[e.g]}`).join(', ') : 'kein Schmuck, Pelzmantel oder Wein') + ` · ${Math.floor(stockOf(isl, 'gem'))} Geschmeide` });
      lines.push({ label: 'Adelsluxus', value: b.nobleShort ? 'fehlt – Wachstum gestoppt' : (b.hasNobleLux !== false ? 'versorgt' : '–') });
    }
    // Seuche (v34.24)
    if (b.sick) {
      lines.push({ label: 'Gesundheit', value: b.treatTimer > 0 ? `krank – wird vom Medicus behandelt (${Math.max(0, Math.ceil((DISEASE_CURE_TIME - b.treatTimer) / 1000))} s)` : (hasDoctorCoverage(b) ? 'krank – der Medicus hat keine Heilkräuter!' : 'krank – kein Medicus in Reichweite, Bewohner sterben!') });
    } else if (b.immuneTimer > 0) {
      lines.push({ label: 'Gesundheit', value: 'genesen – vorerst immun' });
    }
    return lines;
  }
  if (b.type === 'chapel' || b.type === 'tavern' || b.type === 'theater' || b.type === 'cathedral') {
    lines.push({ label: 'Einzugsradius', value: `${b.def.radius} Felder` });
    if (b.type === 'theater' || b.type === 'cathedral') lines.push({ label: 'Versorgt', value: 'Adlige mit Kultur' });
    return lines;
  }
  if (b.type === 'whaler') {
    // Walwanderung (v34.25): wo die nächste Schule steht und wie gut es läuft
    const g = findWhalingGrounds(b);
    lines.push({
      label: 'Walschule',
      value: !g ? 'kein Weg aufs offene Meer'
        : g.podDist !== null ? `in ${Math.round(g.podDist)} Feldern – Fangchance ${Math.round(g.chance * 100)}%`
          : `keine in Reichweite (${WHALE_POD_REACH} Felder) – Fangchance ${Math.round(WHALE_NO_POD_CHANCE * 100)}%`
    });
    const log = b.whaleLog || [];
    if (log.length) lines.push({ label: 'Letzte Fahrten', value: `${log.filter(v => v).length} von ${log.length} mit Fang` });
  }
  if (b.type === 'doctor') {
    lines.push({ label: 'Einzugsradius', value: `${b.def.radius} Felder` });
    lines.push({ label: 'Heilkräuter', value: `${Math.floor(b.storage.herbs || 0)} / ${b.def.inputCapacity}` });
    const kranke = buildings.filter(h => h.type === 'house' && h.sick && Math.hypot(h.x - b.x, h.y - b.y) <= b.def.radius);
    lines.push({ label: 'Kranke Häuser in Reichweite', value: kranke.length ? `${kranke.length} (${kranke.filter(h => h.treatTimer > 0).length} in Behandlung)` : 'keine' });
    return lines;
  }
  if (b.type === 'school') {
    // Schule (v34.11): einziges Gebäude mit Radius UND laufendem Geldunterhalt
    // gleichzeitig - beide Zeilen gehören hier zusammen ins Infopanel.
    lines.push({ label: 'Einzugsradius', value: `${b.def.radius} Felder` });
    lines.push({
      label: 'Status',
      value: b.funded ? 'bezahlt – unterrichtet' : 'kein Geld für den Unterhalt – ohne Wirkung, bis wieder genug Münzen da sind'
    });
    lines.push({ label: 'Unterhalt', value: `${SCHOOL_UPKEEP} Münzen je Zyklus (aus der Kasse)` });
    return lines;
  }
  if (b.type === 'rathaus') {
    // Rathaus (NEU, v34.13): kein Radius wie Kapelle/Wirtshaus/Schule, sondern
    // wie das Kontor ein Gebäude, das für die GANZE Insel wirkt (siehe
    // hasRathaus/taxIncomeOf) - darum hier die inselweite Einnahme statt
    // einer Reichweitenangabe.
    lines.push({ label: 'Wirkung', value: `Ermöglicht Steuererhebung auf ${islandLabel(isl)} (ganze Insel)` });
    lines.push({ label: 'Steuereinnahmen hier', value: `${taxIncomeOf(isl).toFixed(1)} Münzen je ${Math.round(TAX_INTERVAL / 1000)} s` });
    return lines;
  }
  if (b.type === 'harbor') {
    lines.push({ label: 'Gebaute Schiffe', value: b.ships || 0 });
    lines.push({ label: 'Werft', value: b.shipyard ? 'ausgebaut – baut auch Galeonen' : 'nein' });
    lines.push({ label: 'Holz (Insel)', value: Math.floor(stockOf(isl, 'wood')) });
    lines.push({ label: 'Werkzeuge (Insel)', value: Math.floor(stockOf(isl, 'tools')) });
    return lines;
  }
  if (b.type === 'lighthouse') {
    // Status statt Radius (v34): der Leuchtturm wirkt nicht über eine
    // Reichweite, sondern für die GANZE Insel, und nur so lange, wie Tran
    // reicht - siehe updateLighthouses. Genau das muss die eine Zeile sagen,
    // sonst steht ein Leuchtturm ohne Tran wortlos und wirkungslos da.
    const fueled = !!(islands[isl] && islands[isl].lighthouseFueled);
    lines.push({ label: 'Tran (Insel)', value: Math.floor(stockOf(isl, 'oil')) });
    lines.push({
      label: 'Status',
      value: fueled
        ? 'versorgt – Schiffe zur Insel +50% schnell'
        : 'kein Tran an Bord – ohne Wirkung, bis wieder welcher da ist'
    });
    lines.push({ label: 'Verbrauch', value: '1 Tran je Nacht, sofern vorhanden' });
    return lines;
  }
  if (b.type === 'firestation') {
    // Feuerwache (v34.7): kein Radius, keine Warenproduktion - die einzige
    // interessante Frage ist, ob der Löschhelfer gerade in der Wache steht
    // oder unterwegs zu einem Brand ist.
    lines.push({
      label: 'Status',
      value: b.busy ? 'im Einsatz – Löschhelfer unterwegs' : 'einsatzbereit'
    });
    lines.push({ label: 'Löschradius', value: 'gesamte Insel' });
    return lines;
  }
  const prodGoods = producerGoodsOf(b.type);
  if (prodGoods.length) {
    // Die Mine kann Eisen ODER Gold liefern - angezeigt wird, was sie hier
    // tatsächlich fördert (v29.2). Vorher stand dort stur „Eisen", auch wenn
    // im Berg Gold lag: eine falsche Angabe, die zusätzlich den Verdacht
    // bestätigte, dass etwas nicht stimmt.
    const shown = currentProducerGood(b);
    for (const good of prodGoods) {
      // Waren ohne Bestand nur zeigen, wenn es die gerade geförderte ist -
      // sonst stünden an jeder Mine immer beide Zeilen.
      if (good !== shown && (b.storage[good] || 0) <= 0) continue;
      lines.push({ label: GOOD_LABELS[good] + ' (Lager)', value: `${Math.floor(b.storage[good] || 0)} / ${b.def.capacity}` });
    }
    // Restvorrat des Vorkommens (v30). Seit Erz und Stein endlich sind, ist das
    // die wichtigste Zahl an einer Mine oder einem Steinbruch: sie sagt, wie
    // lange dieser Betrieb überhaupt noch etwas zu tun hat.
    if (b.type === 'mine' || b.type === 'quarry') {
      const spot = b.type === 'mine'
        ? findNearestOreVein(b.x, b.y, b.def.radius)
        : findNearestQuarriableRock(b.x, b.y, b.def.radius);
      if (!spot) {
        lines.push({ label: 'Vorkommen', value: b.type === 'mine' ? 'erschöpft – keine Ader mehr' : 'abgetragen – kein Fels mehr' });
      } else {
        const rest = b.type === 'mine' ? map[spot.y][spot.x][spot.ore] : map[spot.y][spot.x].stone;
        const was = b.type === 'mine' ? GOOD_LABELS[spot.ore] : 'Stein';
        lines.push({ label: `${was} im Boden`, value: `noch ${Math.floor(rest)}` });
      }
    }
    if (b.sheep) lines.push(sheepInfoLine(b));
    return lines;
  }
  const proc = PROCESSORS.find(p => p.type === b.type);
  if (proc) {
    lines.push({ label: GOOD_LABELS[proc.input] + ' (Rohstoff)', value: `${Math.floor(b.storage[proc.input] || 0)} / ${b.def.inputCapacity}` });
    lines.push({ label: GOOD_LABELS[proc.output] + ' (fertig)', value: `${Math.floor(b.storage[proc.output] || 0)} / ${b.def.outputCapacity}` });
    return lines;
  }
  if (b.type === 'forester') {
    lines.push({ label: 'Pflanzradius', value: `${b.def.radius} Felder` });
  }
  return lines;
}
// Ergänzt bei der Schaffarm die Herdengröße unter dem Wollbestand (die
// Wollzeile selbst kommt schon generisch über PRODUCERS).
function sheepInfoLine(b) {
  return { label: 'Schafe auf der Weide', value: (b.sheep || []).length };
}

  if (!inBounds(gx, gy)) { selectedBuilding = null; renderBuildingInfo(); return; }
  const tile = map[gy][gx];
  selectedBuilding = tile.building || null;
  renderBuildingInfo();
}

// Warenarten aufzulisten wäre eine unlesbare Wand, in der fast jede Zeile 0/0
// stünde. Je Zeile vier Knöpfe: 5 und 1 in jede Richtung; bei 20 Einheiten
// Laderaum sind Fünferschritte die passende grobe Stufe.
function renderShipInfo() {
  const panel = document.getElementById('buildingInfo');
  const ship = selectedShip;
  const harbor = dockNear(ship);
  const isl = harbor ? islandOfBuilding(harbor) : -1;
  const load = cargoTotal(ship);
  const capacity = shipCapacity(ship);
  let body = `<div class="bi-line"><span>${(SHIP_TYPES[ship.shipType] || SHIP_TYPES.small).name}</span><span>Laderaum ${load} / ${capacity}</span></div>`;
  // Tempo nur dort nennen, wo es vom Normalfall abweicht (v34.19): das
  // Kriegsschiff ist das einzige mit einem anderen `speed`-Faktor, und weil man
  // ihm seine Geschwindigkeit nicht ansieht, gehört sie ins Panel. Bei den
  // beiden Frachtern (Faktor 1) wäre die Zeile nur Rauschen.
  const tempo = (SHIP_TYPES[ship.shipType] || SHIP_TYPES.small).speed || 1;
  if (tempo !== 1) {
    body += `<div class="bi-line"><span>Tempo</span><span>${Math.round((tempo - 1) * 100)}% schneller als ein Frachter</span></div>`;
  }
  // Rumpf und Gefecht (v34.22)
  const maxHp = shipMaxHp(ship);
  const hp = Math.max(0, Math.round(ship.hp ?? maxHp));
  const beschossen = animClock - (ship.lastHit ?? -1e9) < 4000;
  body += `<div class="bi-line"><span>Rumpf</span><span>${hp} / ${maxHp}${beschossen ? ' – wird beschossen!' : (hp < maxHp && harbor ? ' – wird repariert' : '')}</span></div>`;
  if (ship.shipType === 'warship') {
    const waffen = ship.cargo.weapon || 0;
    const lage = ship.combatTarget ? 'im Gefecht mit Piraten'
      : waffen > 0 ? `bereit – greift Piraten im Umkreis von ${WARSHIP_ENGAGE_RADIUS} Feldern an` : 'keine Waffen an Bord – kann nicht feuern';
    body += `<div class="bi-line"><span>Waffen an Bord</span><span>${waffen} (je Salve 1)</span></div>`;
    body += `<div class="bi-line"><span>Lage</span><span>${lage}</span></div>`;
  } else if (pirateUnlocked) {
    body += `<div class="cargo-hint">Handelsschiffe können sich nicht wehren – gegen Piraten hilft nur ein Kriegsschiff in der Nähe.</div>`;
  }
  // ---- Frachtroute (v26) -------------------------------------------------
  // Ganz oben, noch vor der Ladung: die Route bestimmt, was das Schiff
  // überhaupt tut - alles darunter ist nur noch Handbetrieb.
  const myRoute = ship.routeId ? routeById(ship.routeId) : null;
  if (myRoute) {
    body += `<div class="bi-line"><span>Frachtroute</span><span>${routeLabel(myRoute)}</span></div>`;
    // Die Stationen einzeln, mit dem nächsten Halt hervorgehoben: bei bis zu

    myRoute.stops.forEach((st, i) => {
      const marke = i === naechste ? '▶ ' : `${i + 1}. `;
      const ladeListe = Object.keys(st.loads).map(g => `${st.loads[g]} ${GOOD_LABELS[g]}`);
      const was = ladeListe.length ? `lädt ${ladeListe.join(', ')}` : 'lädt nichts';
      body += `<div class="bi-line"><span>${marke}${stopLabel(st)}</span><span>${was}</span></div>`;
    });
    body += `<div class="bi-line"><span>Gerade</span><span>${ship.routeStatus || '–'}</span></div>`;
    body += `<button class="route-btn" data-act="unassign">✕ Route beenden</button>`;
  } else if (ship.shipType === 'warship' && ship.escortRouteId && routeById(ship.escortRouteId)) {
    // Geleitschutz (v34.24)
    body += `<div class="bi-line"><span>Geleitschutz</span><span>${routeLabel(routeById(ship.escortRouteId))}</span></div>`;
    body += `<div class="bi-line"><span>Gerade</span><span>${ship.escortStatus || '–'}</span></div>`;
    body += `<button class="route-btn" data-act="unescort">✕ Geleitschutz beenden</button>`;
  } else if (routes.length) {
    if (ship.shipType === 'warship') {
      body += `<div class="route-assign"><span>🛡️ Geleit</span><select id="escortAssign">`
        + `<option value="">– kein Geleitschutz –</option>`
        + routes.map(r => {
          const n = ships.filter(o => o.escortRouteId === r.id).length;
          return `<option value="${r.id}">${routeLabel(r)}${n ? ` (${n} Geleitschiff${n > 1 ? 'e' : ''})` : ''}</option>`;
        }).join('')
        + `</select></div>`;
      body += `<div class="cargo-hint">Als Geleitschutz fährt das Kriegsschiff neben einem Handelsschiff der Route her und verteidigt es gegen Piraten. Mit „Route“ darunter fährt es stattdessen selbst Fracht.</div>`;
    }
    // Mehrere Schiffe je Route (v34): JEDE Route ist wählbar, nicht mehr nur
    // die "freien" - eine Route ohne Schiff gibt es zwar weiterhin, aber eine
    // mit Schiff ist längst keine Sackgasse mehr. Die Anzahl bereits
    // eingeteilter Schiffe steht der Übersicht halber gleich mit dabei.
    body += `<div class="route-assign"><span>Route</span><select id="routeAssign">`
      + `<option value="">– keine –</option>`
      + routes.map(r => {
        const n = shipsOnRoute(r).length;
        return `<option value="${r.id}">${routeLabel(r)}${n ? ` (${n} Schiff${n > 1 ? 'e' : ''} im Einsatz)` : ''}</option>`;
      }).join('')
      + `</select></div>`;

  const spot = kontorSpotForShip(ship);
  if (spot) {
    const affordable = shipCanAffordKontor(ship);
    const target = islandLabel(islandAt(spot.x, spot.y));
    body += `<button id="foundKontorBtn" class="route-btn${affordable ? '' : ' disabled'}">🏛️ Kontor auf ${target} gründen <span class="cost">${kontorCostLabel()}</span></button>`;

    body += Object.keys(ship.cargo || {}).filter(g => ship.cargo[g] > 0)
      .map(g => `<div class="bi-line"><span>${GOOD_LABELS[g] || g}</span><span>${ship.cargo[g]}</span></div>`).join('');
  } else {

    if (goods.length === 0) {
      body += '<div class="cargo-hint">Auf dieser Insel liegt nichts auf Lager, und das Schiff ist leer.</div>';
    } else {

        const canUnload = onShip > 0;
        return `<div class="cargo-row">`
          + `<button class="cargo-btn" data-act="load" data-good="${g}" data-n="5"${canLoad ? '' : ' disabled'}>◀◀</button>`
          + `<button class="cargo-btn" data-act="load" data-good="${g}" data-n="1"${canLoad ? '' : ' disabled'}>◀</button>`
          + `<span class="cargo-name">${GOOD_LABELS[g] || g}</span>`
          + `<span class="cargo-num">${onIsland} / ${onShip}</span>`
          + `<button class="cargo-btn" data-act="unload" data-good="${g}" data-n="1"${canUnload ? '' : ' disabled'}>▶</button>`
          + `<button class="cargo-btn" data-act="unload" data-good="${g}" data-n="5"${canUnload ? '' : ' disabled'}>▶▶</button>`

  panel.style.display = 'block';
  panel.scrollTop = keepScroll;
  panel.querySelectorAll('.cargo-btn').forEach(btn => {
    btn.addEventListener('click', (e) => {

      if (btn.dataset.act === 'load') shipLoad(ship, good, n); else shipUnload(ship, good, n);

  if (unescort) unescort.addEventListener('click', (e) => {

  if (esel) esel.addEventListener('change', (e) => {

    ship.escortRouteId = id && routeById(id) ? id : null;
    ship.escortOf = null;
    setStatus(ship.escortRouteId ? 'Kriegsschiff gibt der Route Geleitschutz.' : 'Kriegsschiff fährt frei.');

  });
  const sel = document.getElementById('routeAssign');
  if (sel) sel.addEventListener('change', (e) => {
    e.stopPropagation();

    setStatus(ship.routeId ? 'Schiff der Frachtroute zugeteilt.' : 'Schiff fährt frei.');
    renderShipInfo();

  const found = document.getElementById('foundKontorBtn');
  if (found) found.addEventListener('click', (e) => {

// Infopanel des Kontors: Warenknoten seiner Insel UND Routenverwaltung. Bewusst

// stehen statt der sonst üblichen reinen Label/Wert-Zeilen.
// Ist der Handelsbereich im Kontor-Panel aufgeklappt? Wie beim Infopanel-Fokus
// eine Modulvariable statt eines DOM-Zustands: das Panel baut sich alle 400 ms

function renderKontorInfo(b) {

  // Das Kontor verfällt nie (siehe needsRoadAccess) - die Zeile darf hier also

  // sagen, was eine Straße hier stattdessen bringt: Anbindung an die

  const connected = hasRoadAccess(b);

  body += `<div class="cargo-hint">Das Kontor ist Anlegestelle und Warenlager seiner Insel zugleich – hier angelandete Ware steht der ganzen Insel zur Verfügung. Es verfällt auch ohne Straße nicht.${connected ? '' : ' Ohne Straßenanschluss findet allerdings kein Träger her: die Inselbetriebe können nichts hierher liefern und nichts von hier abholen.'}</div>`;

    + `<span>💰 Handel · Kasse ${Math.floor(treasury)}</span><span class="trade-caret">▾</span></div>`;
  if (kontorTradeOpen) {
    body += `<div class="cargo-hint">Preise gelten für ${islandLabel(isl)}: was hier wächst, bringt beim Verkauf wenig und ist im Einkauf günstig – was hier fehlt, ist teuer. <span class="sell" style="color:#9fd88a">grün</span> = Verkauf, <span class="buy" style="color:#e0a07c">orange</span> = Kauf, je Einheit. Jeder Verkauf drückt den Preis, jeder Kauf hebt ihn – nach ein paar Minuten erholt er sich wieder (▼/▲).</div>`;
    for (const good of Object.keys(GOOD_LABELS)) {

      const bestand = Math.floor(stockOf(isl, good));

      const ek = buyPriceAt(isl, good);
      const kannVerkaufen = bestand > 0;
      const kannKaufen = treasury >= ek;

        + `<span class="swatch ${good}"></span>`
        + `<span class="trade-name">${GOOD_LABELS[good]}</span>`
        + `<span class="trade-stock">${bestand}</span>`
        + `<button class="trade-btn" data-trade="sell" data-good="${good}" data-n="10"${kannVerkaufen ? '' : ' disabled'} title="10 verkaufen">−10</button>`
        + `<button class="trade-btn" data-trade="sell" data-good="${good}" data-n="1"${kannVerkaufen ? '' : ' disabled'} title="1 verkaufen">−1</button>`
        + `<span class="trade-price" title="${marktText(isl, good)}"><span class="sell">${fmtPrice(vk)}</span>/<span class="buy">${fmtPrice(ek)}</span>${marktPfeil(isl, good)}</span>`
        + `<button class="trade-btn" data-trade="buy" data-good="${good}" data-n="1"${kannKaufen ? '' : ' disabled'} title="1 kaufen">+1</button>`
        + `<button class="trade-btn" data-trade="buy" data-good="${good}" data-n="10"${kannKaufen ? '' : ' disabled'} title="10 kaufen">+10</button>`

      // Eine Zeile je Station (v32). Dort steht NUR, was geladen wird -
      // abgeladen wird an jeder Station automatisch alles andere, und das sagt

            + `<span class="route-amount">${st.loads[g]}</span>`

        });

        if (nochMoeglich.length) {
          body += `<div class="route-row">`
            + `<select class="route-addload" data-route="${r.id}" data-stop="${i}">`
            + `<option value="">${geladeneWaren.length ? '+ weitere Ware laden …' : '– nichts laden –'}</option>`

      if (r.stops.length < ROUTE_MAX_STOPS) {
        const letzte = r.stops[r.stops.length - 1], erste = r.stops[0];
        const moeglich = buildings.filter(o => o.type === 'kontor'
          && !(o.x === letzte.x && o.y === letzte.y)
          && !(o.x === erste.x && o.y === erste.y));
        if (moeglich.length) {
          body += `<div class="route-row">`
            + `<select class="route-addstop" data-route="${r.id}">`
            + `<option value="">+ Station anhängen …</option>`
            + moeglich.map(o => `<option value="${o.x},${o.y}">${islandLabel(islandOfBuilding(o))}</option>`).join('')
            + `</select></div>`;

      }

        ? `${shipsHere.length} Schiff${shipsHere.length > 1 ? 'e bedienen' : ' bedient'} diese Route: ` + shipsHere.map(sh => sh.routeStatus || 'unterwegs').join(' · ') + '.'
        : 'Kein Schiff eingeteilt – ein Schiff anklicken und dort die Route wählen.';
      body += `<div class="cargo-hint">An jeder Station wird alles abgeladen, was dort nicht geladen werden soll; mehrere Waren gleichzeitig sind möglich, bis der Laderaum voll ist. ${flotteHinweis}</div>`;

    body += others.map(o => `<button class="route-btn" data-newroute="${o.x},${o.y}">→ ${islandLabel(islandOfBuilding(o))}</button>`).join('');
  } else {
    body += `<div class="cargo-hint">Für eine Route braucht es ein zweites Kontor. Ein Schiff mit ${kontorCostLabel()} an Bord kann eines an einer fremden Küste gründen.</div>`;

  const keepScroll = panel.scrollTop;
  panel.innerHTML = `<div id="buildingInfoHeader"><b>🏛️ ${b.def.name}</b><span id="buildingInfoClose">✕</span></div>${body}`;
  panel.style.display = 'block';
  panel.scrollTop = keepScroll;
  panel.querySelectorAll('[data-act]').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();

      const st = r.stops[Number(btn.dataset.stop)];
      if (!st) return;
      const good = btn.dataset.good;
      // Ladeauftrag in Fünferschritten, gedeckelt durch den größten Laderaum,
      // den es gibt (SHIP_TYPES.large - v34): eine Station kennt nicht, welcher
      // Schiffstyp als Nächstes anlegt, ein kleineres Schiff kappt sich beim
      // tatsächlichen Laden ohnehin selbst auf seine eigene Kapazität (siehe
      // shipLoad/shipCapacity). Jede Ware der Station hat seit v34.5 ihren
      // EIGENEN Mengenregler (`data-good` sagt, welche); `removegood` nimmt
      // eine Ware ganz aus der Liste, statt sie nur auf 5 herunterzuregeln.
      if (btn.dataset.act === 'plus' && good) st.loads[good] = Math.min(SHIP_TYPES.large.capacity, (st.loads[good] || 0) + 5);
      if (btn.dataset.act === 'minus' && good) st.loads[good] = Math.max(5, (st.loads[good] || 5) - 5);
      if (btn.dataset.act === 'removegood' && good) delete st.loads[good];

  panel.querySelectorAll('.tax-btn').forEach(btn => {
    btn.addEventListener('click', (e) => {

      const n = Number(btn.dataset.n) || 1;
      if (btn.dataset.trade === 'sell') {
        const verkauft = tradeSell(b, good, n);

        const gekauft = tradeBuy(b, good, n);

          AudioEngine.playCoins();

          setStatus('Nicht genug Münzen in der Kasse.');

  // dauerhafte Anzeige des "aktuellen Werts" wie das alte Einzel-Auswahlfeld.
  // Startmenge 10 wie beim Anlegen einer Route, danach per +/− in
  // Fünferschritten anpassbar.
  panel.querySelectorAll('.route-addload').forEach(sel => {
    sel.addEventListener('change', (e) => {
      e.stopPropagation();
      const r = routeById(Number(sel.dataset.route));
      const st = r && r.stops[Number(sel.dataset.stop)];
      if (st && sel.value) st.loads[sel.value] = 10;
      renderKontorInfo(b);
    });
  });
  panel.querySelectorAll('.route-addstop').forEach(sel => {
    sel.addEventListener('change', (e) => {
      e.stopPropagation();
      const r = routeById(Number(sel.dataset.route));
      if (!r || !sel.value) return;
      const [x, y] = sel.value.split(',').map(Number);
      const k = kontorAt(x, y);
      if (addRouteStop(r, k)) setStatus(`Station ${r.stops.length} angehängt: ${islandLabel(islandOfBuilding(k))}.`);
      else setStatus(`Mehr als ${ROUTE_MAX_STOPS} Stationen fasst eine Route nicht.`);
      renderKontorInfo(b);
    });
  });
  panel.querySelectorAll('[data-newroute]').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const [x, y] = btn.dataset.newroute.split(',').map(Number);
      const other = kontorAt(x, y);
      if (!other) return;
      createRoute(b, other);
      setStatus('Frachtroute angelegt. Jetzt noch ein Schiff dafür einteilen.');
      renderKontorInfo(b);
    });
  });
}
function renderBuildingInfo() {
  const panel = document.getElementById('buildingInfo');
  // Ein ausgewähltes Schiff hat Vorrang: Gebäude und Schiff schließen sich
  // gegenseitig aus (siehe onPointerUp), beide teilen sich dasselbe Panel.
  if (selectedShip && ships.includes(selectedShip)) { renderShipInfo(); return; }
  panel.className = '';
  if (!selectedBuilding || !buildings.includes(selectedBuilding)) {
    selectedBuilding = null;
    panel.style.display = 'none';
    return;
  }
  const b = selectedBuilding;
  // Das Kontor hat wie das Schiff ein eigenes, interaktives Panel (Routen
  // anlegen, Ware und Menge einstellen) statt reiner Label/Wert-Zeilen.
  if (b.type === 'kontor') { renderKontorInfo(b); return; }
  const lines = buildingInfoLines(b);
  const rows = lines.length
    ? lines.map(l => `<div class="bi-line"><span>${l.label}</span><span>${l.value}</span></div>`).join('')
    : '<div class="bi-line"><span>Keine Lagerdaten für diesen Gebäudetyp.</span></div>';
  // Der Hafen ist das einzige Gebäude mit einer eigenen, interaktiven Aktion im
  // Infopanel (Schiffsbau) statt nur Lagerdaten anzuzeigen - siehe buildShip().
  // Zwei Schiffstypen (NEU, v34, siehe SHIP_TYPES): je ein Knopf, jeder mit
  // eigenem Preis/eigener Kapazität und eigenem Freischalt-Zustand.
  let extra = '';
  if (b.type === 'harbor') {
    extra = Object.keys(SHIP_TYPES).map(type => {
      const t = SHIP_TYPES[type];
      // Galeone nur mit Werft (v34.25) - ohne sie steht der Knopf gar nicht da,
      // dafür der Ausbau-Knopf darunter
      if (t.needsShipyard && !b.shipyard) return '';
      const afford = Object.keys(t.cost).every(g => stockOf(islandOfBuilding(b), g) >= t.cost[g]);
      const costLabel = Object.keys(t.cost).map(g => `${t.cost[g]} ${GOOD_LABELS[g]}`).join(', ');
      return `<button id="buildShipBtn-${type}" class="tool-btn${afford ? '' : ' disabled'}">${t.icon || '⛵'} ${t.name} bauen <span class="cost">${costLabel} · ${t.capacity} Ladung</span></button>`;
    }).join('');
    if (!b.shipyard) {
      const isl = islandOfBuilding(b);
      const afford = Object.keys(SHIPYARD_COST).every(g => stockOf(isl, g) >= SHIPYARD_COST[g]);
      const costLabel = Object.keys(SHIPYARD_COST).map(g => `${SHIPYARD_COST[g]} ${GOOD_LABELS[g]}`).join(', ');
      extra += `<button id="shipyardBtn" class="tool-btn${afford ? '' : ' disabled'}">🛠️ Zur Werft ausbauen <span class="cost">${costLabel} · ermöglicht die Galeone</span></button>`;
    }
  }
  // Wohnhäuser: Schalter, um den Aufstieg dieses einen Hauses anzuhalten
  // (v31). Gedacht für den Fall, dass eine Insel bewusst auf Siedler-Niveau
  // bleiben soll - etwa weil dorthin kein Tabak fährt und Kaufleute dort nur
  // stillstünden. Der Aufstieg selbst läuft automatisch.
  if (b.type === 'house' && HOUSE_TIERS[(b.tier || 0) + 1]) {
    extra = `<button id="lockUpgradeBtn" class="tool-btn">${b.upgradeLocked ? '🔓 Aufstieg wieder erlauben' : '🔒 Aufstieg stoppen'}</button>`;
  }
  // Erzeuger und Verarbeiter: Produktion von Hand anhalten (v31.1).
  if (canPause(b)) {
    extra = `<button id="pauseProdBtn" class="tool-btn">${b.paused ? '▶️ Produktion fortsetzen' : '⏸️ Produktion stoppen'}</button>`;
  }
  // Die Überschrift nennt bei Wohnhäusern die Stufe statt des Gattungsnamens -
  // "Wohnhaus" stünde sonst über drei sichtbar verschiedenen Gebäuden.
  const title = b.type === 'house' ? tierOf(b).name : (b.type === 'harbor' && b.shipyard ? 'Werft (Hafen)' : b.def.name);
  panel.innerHTML = `<div id="buildingInfoHeader"><b>${title}</b><span id="buildingInfoClose">✕</span></div>${rows}${extra}`;
  panel.style.display = 'block';
  if (b.type === 'harbor') {
    for (const type of Object.keys(SHIP_TYPES)) {
      const btn = document.getElementById(`buildShipBtn-${type}`);
      if (btn) btn.addEventListener('click', () => buildShip(b, type));
    }
    const yardBtn = document.getElementById('shipyardBtn');
    if (yardBtn) yardBtn.addEventListener('click', () => upgradeToShipyard(b));
  }
  const pauseBtn = document.getElementById('pauseProdBtn');
  if (pauseBtn) pauseBtn.addEventListener('click', () => {
    b.paused = !b.paused;
    if (b.paused) {
      // Der Arbeiter verschwindet sofort aus dem Bild, der laufende Takt wird
      // zurückgesetzt - sonst produzierte das Gebäude nach dem Fortsetzen
      // sekundenschnell die angefangene Ware, was wie ein Fehler aussähe.
      b.working = false;
      b.timer = 0;
      b.blocked = null;
    }
    setStatus(b.paused
      ? `${b.def.name}: Produktion gestoppt – es kommt auch kein Nachschub mehr.`
      : `${b.def.name}: Produktion läuft wieder.`);
    renderBuildingInfo();
  });
  const lockBtn = document.getElementById('lockUpgradeBtn');
  if (lockBtn) lockBtn.addEventListener('click', () => {
    b.upgradeLocked = !b.upgradeLocked;
    if (b.upgradeLocked) { b.upgradeTimer = 0; b.upgradeDue = 0; }
    setStatus(b.upgradeLocked ? 'Aufstieg für dieses Haus gestoppt.' : 'Aufstieg für dieses Haus wieder erlaubt.');
    renderBuildingInfo();
  });
}
// Kauft ein Schiff am Hafen gegen Holz und Werkzeuge aus dem Insel-Vorrat
// (siehe SHIP_TYPES). b.ships bleibt als reiner Zähler (Anzeige/
// Abwärtskompatibilität) erhalten, das eigentliche, sicht- und bewegbare
// Schiff ist ein eigener Eintrag in `ships` (siehe updateShips/drawShips).
// `type` ('small'/'large', NEU v34) bestimmt Preis, Kapazität und Aussehen
// (siehe shipCapacity/drawShipOne) - unbekannt oder fehlend fällt auf 'small'
// zurück, damit ein alter Aufruf ohne zweites Argument weiterhin funktioniert.
// ---- Werft (NEU, v34.25) ----------------------------------------------------
// Ein Hafen lässt sich einmalig zur Werft ausbauen (b.shipyard). Sie baut
// weiterhin alle bisherigen Schiffe und zusätzlich die Galeone. Optisch kommt
// eine Helling mit einem halb beplankten Schiffsgerippe und ein Holzkran dazu.
const SHIPYARD_COST = { plank: 30, stone: 15, tools: 10 };
function upgradeToShipyard(b) {
  if (b.shipyard) return;

    if (typeof isl.mood !== 'number') isl.mood = ziel; // erste Messung: gleich übernehmen
    const vorher = isl.mood;
    isl.mood += (ziel - isl.mood) * MOOD_FOLLOW;
    // Wechsel zwischen den Stimmungsstufen ins Protokoll
    const a = moodLabel(vorher).cls, b = moodLabel(isl.mood).cls;
    if (a !== b) {
      if (b === 'angry') logEvent(`😠 Die Bewohner von ${islandLabel(isl.id)} sind unzufrieden (${Math.round(isl.mood)} %) – erste Familien denken ans Auswandern.`, 'mood', islandCenterPos(isl.id));
      else if (b === 'happy') logEvent(`😊 ${islandLabel(isl.id)} ist zufrieden (${Math.round(isl.mood)} %) – die Häuser wachsen schneller.`, 'mood', islandCenterPos(isl.id));
      else if (a === 'angry') logEvent(`😐 Die Stimmung auf ${islandLabel(isl.id)} hat sich beruhigt (${Math.round(isl.mood)} %).`, 'mood', islandCenterPos(isl.id));
    }
    // Auswanderung
    if (isl.mood < MOOD_ANGRY) {
      isl.emigTimer = (isl.emigTimer || 0) + tick;
      if (isl.emigTimer >= EMIGRATION_INTERVAL) {
        isl.emigTimer -= EMIGRATION_INTERVAL;
        // je schlechter, desto wahrscheinlicher: bei 35 % gut ein Drittel, bei 0 % fast sicher
        const chance = 0.35 + 0.6 * (MOOD_ANGRY - isl.mood) / MOOD_ANGRY;
        if (Math.random() < chance) {
          const haeuser = buildings.filter(h => h.type === 'house' && islandOfBuilding(h) === isl.id && h.population > 0);
          if (haeuser.length) {
            const h = haeuser[Math.floor(Math.random() * haeuser.length)];
            const n = Math.min(h.population, 1 + (isl.mood < 15 ? 1 : 0));
            h.population -= n;
            isl.emigrated = (isl.emigrated || 0) + n;
            logEvent(`🧳 ${n === 1 ? 'Ein Bewohner verlässt' : n + ' Bewohner verlassen'} ${islandLabel(isl.id)} – die Stimmung ist schlecht (${Math.round(isl.mood)} %).`, 'mood', h);
          }
        }
      }
    } else isl.emigTimer = 0;

}

// Die Statuszeile zeigt immer nur die LETZTE Meldung - bei Feuer, Piraten,

// logEvent schreibt die Meldung wie bisher in die Statuszeile UND in eine

const EVENT_LOG_MAX = 100;

// ---- Bau-Aktionen -----------------------------------------------------------
// Zentrale Baubarkeits-Prüfung für ALLE Bauwerkzeuge. Liefert
// `{ ok, reason, note }` zurück, statt direkt zu bauen oder eine Statusmeldung
// zu setzen. Genau dieselbe Funktion nutzen sowohl die tatsächliche Bau-Aktion
// (tryPlaceBuilding/paintRoadAt/...) ALS AUCH die Bauvorschau unter dem
// Mauszeiger - so können Vorschau und Wirklichkeit gar nicht auseinanderlaufen.
// `note` ist ein Hinweis für den Sonderfall "erlaubt, aber ändert nichts"
// (z. B. Straße auf bestehende Straße).
// `opts.ignoreCost` überspringt NUR die Bezahlprüfung, nicht die Geländeregeln.
// Gebraucht für die Kontor-Gründung vom Schiff aus (v26): dort wird nicht aus
// dem Inselvorrat bezahlt (die fremde Insel hat ja keinen), sondern aus der
// Ladung - alle übrigen Bedingungen müssen aber unverändert gelten, und zwar
// aus DERSELBEN Funktion, damit Vorschau, Handbau und Ferngründung gar nicht
// erst auseinanderlaufen können.
function canBuildHere(gx, gy, tool, opts = {}) {
  if (!inBounds(gx, gy)) return { ok: false, reason: 'Außerhalb der Karte.' };
  const tile = map[gy][gx];

  if (tool === 'demolish') {
    if (tile.building) {
      if (tile.building.type === 'warehouse' && buildings.filter(b => b.type === 'warehouse').length <= 1) {
        return { ok: false, reason: 'Das letzte Lagerhaus kann nicht abgerissen werden.' };
      }
      return { ok: true, reason: `${tile.building.def.name} abreißen.` };
    }
    if (tile.road) return { ok: true, reason: tile.stoneRoad ? 'Steinweg entfernen.' : 'Straße entfernen.' };
    if (tile.terrain === 'forest') return { ok: true, reason: 'Wald roden.' };
    if (tile.terrain === 'field') return { ok: true, reason: 'Feld roden.' };
    return { ok: false, reason: 'Hier gibt es nichts zum Abreißen.' };
  }

  // Gemeinsame Geländeprüfung für Straßen, Steinwege und Gebäude.
  if (!isExplored(gx, gy)) return { ok: false, reason: 'Unerforschtes Gebiet – erst mit einem Schiff erkunden.' };
  if (tile.building) return { ok: false, reason: 'Hier steht bereits ein Gebäude.' };
  if (tile.terrain === 'water') return { ok: false, reason: 'Über das Meer führt kein Weg – hier kann nicht gebaut werden.' };
  if (tile.terrain === 'mountain') return { ok: false, reason: 'Hier ist Gebirge – hier kann nicht gebaut werden.' };
  if (tile.terrain === 'forest') return { ok: false, reason: 'Hier steht Wald im Weg – erst mit „Abreißen“ roden.' };
  if (tile.terrain === 'field') return { ok: false, reason: 'Hier wächst etwas – erst mit „Abreißen“ roden.' };

  if (tool === 'road') {
    if (tile.road) return { ok: true, note: true, reason: 'Hier verläuft bereits eine Straße.' };
    return { ok: true, reason: 'Straße bauen (kostenlos).' };
  }
  if (tool === 'stoneroad') {
    if (tile.stoneRoad) return { ok: true, note: true, reason: 'Hier verläuft bereits ein Steinweg.' };
    if (stockOf(islandAt(gx, gy), 'stone') < STONE_ROAD_COST) return { ok: false, reason: `Nicht genug Stein auf dieser Insel (benötigt ${STONE_ROAD_COST}).` };
    return { ok: true, reason: tile.road ? `Straße zum Steinweg ausbauen (${STONE_ROAD_COST} Stein).` : `Steinweg bauen (${STONE_ROAD_COST} Stein).` };
  }

  const def = buildingTypes[tool];
  if (!def) return { ok: false, reason: 'Unbekanntes Werkzeug.' };
  // Freischaltung über die Bevölkerung (v31). Bewusst HIER und nicht nur im
  // Baumenü: canBuildHere ist die eine Prüfstelle, durch die auch die
  // Bauvorschau und die Ferngründung vom Schiff aus laufen.
  const unlock = unlockInfo(tool);
  if (unlock && !unlock.ok) {
    return { ok: false, reason: `${def.name} ist noch nicht freigeschaltet (${unlock.text}, jetzt ${unlock.have}).` };
  }
  if (tile.road) return { ok: false, reason: 'Hier verläuft eine Straße – Gebäude brauchen freien Grund.' };
  // Umgebungs-Bauvoraussetzung (aktuell nur die Fischerhütte): das Gebäude
  // ergibt nur an der passenden Umgebung Sinn und wird sonst gar nicht erst
  // gesetzt, statt später dauerhaft mit einem "!" blockiert dazustehen.
  if (def.needsWater && !hasWaterNearby(gx, gy, def.radius)) {
    return { ok: false, reason: `${def.name} muss näher am Wasser stehen (Meer im Umkreis von ${def.radius} Feldern).` };
  }
  // Küstenpflicht (v26, nur das Kontor): Wasser muss unmittelbar angrenzen.
  if (def.needsCoast && !isCoastTile(gx, gy)) {
    return { ok: false, reason: `${def.name} muss unmittelbar an der Küste stehen – eine Wasserkachel direkt daneben.` };
  }
  // Eines je Insel (v26, nur das Kontor): sonst wäre "das Kontor von Aldfell"
  // als Routenziel nicht mehr eindeutig.
  if (def.oncePerIsland) {
    const isl = islandAt(gx, gy);
    const existing = buildings.find(b => b.type === tool && islandOfBuilding(b) === isl);
    if (existing) return { ok: false, reason: `Auf ${islandLabel(isl)} steht bereits ein ${def.name}.` };
  }
  // Klimabindung (v25, nur Feldbau): auf Eisinseln lässt sich überhaupt nichts
  // anbauen, Getreide und Hopfen brauchen den gemäßigten Gürtel, Tabak und
  // Gewürze die Hitze des Südens. Bewusst hier in canBuildHere statt in der
  // Produktionslogik - so sagt schon die Bauvorschau, warum es nicht geht,
  // statt dass ein gebauter Hof später wortlos nie etwas erntet.
  if (def.climates && !def.climates.includes(climateAt(gx, gy))) {
    const zoneName = { polar: 'auf den Eisinseln im Norden', temperate: 'im gemäßigten Gürtel', arid: 'auf den heißen Inseln im Süden' };
    return { ok: false, reason: `${def.name}: gedeiht nur ${def.climates.map(c => zoneName[c]).join(' oder ')}.` };
  }
  // Baukosten (v34 verallgemeinert): bis dahin zahlte JEDES Gebäude
  // ausschließlich in Brettern, deshalb prüfte und nannte dieser Block nur
  // `def.cost.plank`. Der Leuchtturm ist das erste Gebäude mit einer zweiten
  // Ware im Preis (zusätzlich Stein) - statt eines Sonderfalls nur für ihn
  // läuft die Prüfung jetzt über ALLE Waren in `def.cost`. Für jedes
  // bestehende Gebäude (nur `{ plank: N }`) ändert das am Verhalten nichts.
  const fehlend = [];
  for (const good in def.cost) {
    const need = def.cost[good] || 0;
    if (need > 0 && !opts.ignoreCost && stockOf(islandAt(gx, gy), good) < need) fehlend.push(`${need} ${GOOD_LABELS[good]}`);
  }
  if (fehlend.length) return { ok: false, reason: `Nicht genug ${fehlend.join(' und ')} auf dieser Insel.` };
  const costLabel = Object.keys(def.cost).map(g => `${def.cost[g]} ${GOOD_LABELS[g]}`).join(', ');
  return { ok: true, reason: `${def.name} hier bauen (${costLabel}).` };
}
function paintRoadAt(gx, gy) {
  const check = canBuildHere(gx, gy, 'road');
  if (!check.ok) { setStatus(check.reason); return; }
  if (check.note) return; // liegt schon eine Straße - stillschweigend nichts tun
  map[gy][gx].road = true;
  setStatus('Straße gebaut.');
}
// Baut einen Steinweg: entweder wie eine normale Straße auf freiem,
// bebaubarem Boden, oder als Ausbau (Upgrade) einer bereits vorhandenen
// normalen Straßenkachel zum schnelleren Steinweg. Kostet (anders als die
// gratis Straße) STONE_ROAD_COST Stein pro Kachel aus dem dorfweiten Vorrat.
function paintStoneRoadAt(gx, gy) {
  const check = canBuildHere(gx, gy, 'stoneroad');
  if (!check.ok) { setStatus(check.reason); return; }
  if (check.note) return; // schon ein Steinweg
  spendFrom(islandAt(gx, gy), 'stone', STONE_ROAD_COST);
  const tile = map[gy][gx];
  tile.road = true;
  tile.stoneRoad = true;
  setStatus('Steinweg gebaut.');
}
function tryPlaceBuilding(gx, gy, type) {
  const check = canBuildHere(gx, gy, type);
  if (!check.ok) { setStatus(check.reason); return; }
  // Verallgemeinert wie die Prüfung in canBuildHere (v34): über alle Waren im
  // Baupreis, nicht mehr nur `plank`.
  const isl = islandAt(gx, gy);
  const cost = buildingTypes[type].cost;
  for (const good in cost) if (cost[good] > 0) spendFrom(isl, good, cost[good]);
  const b = createBuilding(gx, gy, type);
  setStatus(b.def.name + ' gebaut!');
  AudioEngine.playBuild();

    // im Baumenü freigeschaltet ist. Gespeichert wird der HÖCHSTSTAND, damit
    // eine Hungersnot dem Spieler keine bereits erreichte Baumöglichkeit
    // wieder wegnimmt.
    popPeak: popPeak.slice(),
    // Steuersatz und eigener Name je Insel (v33), in ID-Reihenfolge - dieselbe
    // Annahme wie bei den Beständen: die IDs ergeben sich reproduzierbar aus
    // dem gespeicherten Gelände (siehe computeIslands).
    islandTaxRates: islands.map(i => (i.taxRate !== undefined ? i.taxRate : TAX_RATE_DEFAULT)),
    islandMoods: islands.map(i => (typeof i.mood === 'number' ? Math.round(i.mood * 10) / 10 : null)), // Zufriedenheit (v34.26)
    // Marktlage je Insel und Ware (v34.24) - nur die Abweichungen von 1
    islandMarkets: islands.map(i => (i.market ? Object.assign({}, i.market) : null)),
    // Statistikverlauf (v34.24)
    stats: { t: stats.t, pop: stats.pop, coins: stats.coins, prod: stats.prod, mood: stats.mood, clock: Math.round(statsClock) },
    islandNames: islands.map(i => i.customName || null),
    // Schiffe sind erkaufter, dauerhafter Spielerbesitz (anders als die Rehe,
    // die bewusst nicht gespeichert werden, siehe Kommentar bei `let deer`).
    ships: ships.map(s => ({
      x: s.x, y: s.y, tx: s.tx, ty: s.ty, harborX: s.harborX, harborY: s.harborY, cargo: s.cargo || {},
      // Schiffstyp (NEU, v34) - fehlt er beim Laden (älterer Stand), gilt das
      // Schiff als 'small' (siehe applySave), genau die frühere feste Kapazität.
      shipType: s.shipType || 'small',
      // Routen-Einteilung eines Schiffs ist echter Spielerbesitz und wird
      // gespeichert; die aktuell berechneten Wegpunkte NICHT - die sind reine
      // Zwischenrechnung und werden nach dem Laden beim nächsten Leerlauf
      // ohnehin neu bestimmt (siehe updateRoutes).
      routeId: s.routeId || null, routeStop: s.routeStop || 0,
      hp: Math.round(s.hp ?? shipMaxHp(s)), // Rumpfschaden (v34.22)
      escortRouteId: s.escortRouteId || null // Geleitschutz (v34.24)
    })),
    // Piraten (v34.22): nur Freischaltung und Zeitgeber, nicht die Schiffe selbst
    pirateUnlocked, pirateTimer: Math.round(pirateTimer),
    explored: encodeFog(), // Nebel (v34.24)
    eventLog: eventLog.slice(-EVENT_LOG_MAX), // Ereignisprotokoll (v34.26)
    // Frachtrouten (v26, mehrstufig seit v32): eigenständige Spieler-
    // entscheidungen, die weder aus der Karte noch aus den Gebäuden ableitbar
    // sind - also gespeichert. Die Stationen stehen als Koordinatenliste drin;
    // beim Laden bleiben nur die Halte, an denen wieder ein Kontor steht.
    routes: routes.map(r => ({
      id: r.id,
      // Seit v34.5: `loads` statt einer einzelnen `load`/`amount` - eine
      // Kopie des Objekts, damit spätere Änderungen am Original nicht
      // rückwirkend den bereits geschriebenen Spielstand verändern.
      stops: r.stops.map(st => ({ x: st.x, y: st.y, loads: { ...st.loads } }))
    }))
  };
}

function applySave(data) {
  if (!data || typeof data !== 'object') throw new Error('Datei enthält keinen Spielstand.');
  if (data.version !== SAVE_VERSION) throw new Error(`Spielstand-Version ${data.version} passt nicht zu dieser Spielversion (${SAVE_VERSION}).`);
  const n = data.mapSize;
  if (!n || !data.map || !Array.isArray(data.map.terrain) || data.map.terrain.length !== n) {
    throw new Error('Spielstand ist unvollständig oder beschädigt.');
  }
  CFG.mapSize = n;
  // Klimatabelle NACH dem Setzen der Kartengröße neu aufbauen - die Zonen sind
  // eine reine Funktion der Kartenhöhe (siehe climateMix), deshalb bekommt auch
  // ein älterer, kleinerer Spielstand seine drei Zonen im richtigen Verhältnis,
  // ohne dass im Speicherformat etwas dafür stünde.
  buildClimateColors();
  map = [];
  for (let y = 0; y < n; y++) {
    const row = [];
    for (let x = 0; x < n; x++) {
      const rd = data.map.roads[y][x];
      row.push({
        terrain: CODE_TERRAIN[data.map.terrain[y][x]] || 'grass',
        trees: Number(data.map.trees[y][x]) || 0,
        // Vorräte kommen unten aus `deposits` bzw. aus den alten Ziffernreihen.
        iron: 0, gold: 0, copper: 0, diamond: 0, stone: 0,
        road: rd !== '0',
        stoneRoad: rd === '2',
        shallow: false,
        building: null
      });
    }
    map.push(row);
  }
  // Bodenschätze (v30). Format: eine Liste [x, y, stein, eisen, gold] und seit
  // v34.16 zusätzlich [..., kupfer, diamant]. Ein Stand von vor v34.16 hat die
  // beiden letzten Felder nicht - `Number(undefined) || 0` liefert dort sauber
  // 0, die Karte lädt also unverändert als reine Eisen/Gold-Welt.
  if (Array.isArray(data.map.deposits)) {
    for (const [x, y, st, ir, go, cu, di] of data.map.deposits) {
      if (!inBounds(x, y)) continue;
      map[y][x].stone = Number(st) || 0;
      map[y][x].iron = Number(ir) || 0;
      map[y][x].gold = Number(go) || 0;
      map[y][x].copper = Number(cu) || 0;
      map[y][x].diamond = Number(di) || 0;
    }
  } else if (data.map.iron) {
    // ÄLTERER SPIELSTAND (bis v29.3): Erz stand als EINE ZIFFER je Kachel und
    // war unerschöpflich, Stein gab es als Vorrat noch gar nicht. Die Ziffer
    // (4-7 Reichhaltigkeit) wird deshalb auf die neue Größenordnung
    // hochgerechnet, und jede Gebirgskachel bekommt einen Steinvorrat - sonst
    // stünde in einem geladenen Spiel ein Gebirge, das sofort verschwindet.
    for (let y = 0; y < n; y++) {
      for (let x = 0; x < n; x++) {
        const t = map[y][x];
        const ir = Number(data.map.iron[y][x]) || 0;
        const go = data.map.gold ? (Number(data.map.gold[y][x]) || 0) : 0;
        if (ir > 0) t.iron = ir * 25;
        if (go > 0) t.gold = go * 25;
        if (t.terrain === 'mountain') {
          t.stone = STONE_PER_MOUNTAIN_MIN + Math.floor(Math.random() * (STONE_PER_MOUNTAIN_MAX - STONE_PER_MOUNTAIN_MIN + 1));
        }
      }
    }
  }
  growingTiles = [];
  for (const [x, y, stage, timer, kind] of (data.map.growth || [])) {
    if (!inBounds(x, y)) continue;
    map[y][x].growthStage = stage;
    map[y][x].growthTimer = timer;
    map[y][x].growthKind = kind || undefined;
    markGrowing(x, y); // geladene Setzlinge/Felder müssen weiterwachsen (siehe updateGrowth)
  }
  markShallowWater();

  // Träger werden bewusst NICHT gespeichert: sie verweisen auf Gebäude-Objekte,
  // was beim Serialisieren aufwendige Index-Verweise bräuchte, und ein
  // abgebrochener Transportweg kostet höchstens eine einzelne Ware. Stattdessen
  // starten alle Gebäude nach dem Laden mit freiem Arbeiter neu.
  carriers = [];
  // Löschhelfer und der Countdown bis zum nächsten möglichen Brand sind wie
  // die Träger reiner Zwischenzustand (siehe Kommentar oben) - ein neu
  // gewürfelter Countdown nach dem Laden ist unauffälliger als ein exakt
  // mitgespeicherter, der beim nächsten Laden immer an derselben Stelle
  // stünde. Bereits brennende Gebäude (onFire, s.o.) sind davon unberührt:
  // ihre Feuerwache wird ganz normal binnen des nächsten Tick neu entsandt
  // (siehe updateFires -> tryDispatchFirefighters).
  fireUnits = [];
  fireEventTimer = randomFireInterval();
  buildings = [];
  // Inseln aus dem gerade geladenen Gelände neu bestimmen und ihre Bestände
  // füllen - beides muss VOR der Gebäudeschleife passieren, damit jedes
  // Lagerhaus unten direkt auf den Bestand seiner Insel zeigen kann.
  computeIslands();
  const savedStores = data.islandStorages;
  // Die globale Kasse (v29.1). Ein v29-Stand kennt sie noch nicht, dort standen
  // die Münzen je Insel - deren Summe wird zur Kasse. Das ist die einzige
  // ehrliche Migration: kein Geld verschwindet, und der Spieler findet exakt
  // den Betrag wieder, den er vorher über alle Inseln verteilt hatte.
  if (typeof data.treasury === 'number') {
    treasury = Math.max(0, data.treasury);
  } else if (Array.isArray(savedStores)) {
    treasury = savedStores.reduce((sum, st) => sum + (Number(st && st.coin) || 0), 0);
  } else {
    treasury = Number(data.globalStorage && data.globalStorage.coin) || 0;
  }
  if (Array.isArray(savedStores)) {
    islands.forEach((isl, i) => { isl.storage = makeIslandStorage(savedStores[i] || {}); });
  } else if (data.globalStorage) {
    // ÄLTERER SPIELSTAND (bis v24): dort gab es genau einen kartenweiten
    // Vorrat. Er wandert vollständig auf die Insel des ersten Lagerhauses -
    // ihn stattdessen auf alle Inseln zu verteilen oder zu verwerfen wäre für
    // den Spieler beides überraschend, und genau dort stand ja auch sein Dorf.
    const firstWh = (data.buildings || []).find(b => b.type === 'warehouse');
    const targetId = firstWh ? islandAt(firstWh.x, firstWh.y) : -1;
    if (targetId >= 0) islands[targetId].storage = makeIslandStorage(data.globalStorage);
  }
  // Steuersätze und eigene Inselnamen (v33), beide rein additiv: ein Stand bis
  // v32 kennt sie nicht und lädt mit "normal" und den Generatornamen.
  if (Array.isArray(data.islandTaxRates)) {
    islands.forEach((isl, i) => {
      const v = data.islandTaxRates[i];
      isl.taxRate = (typeof v === 'number' && TAX_RATES[v]) ? v : TAX_RATE_DEFAULT;
    });
  }
  // Ereignisprotokoll (v34.26)
  eventLog = Array.isArray(data.eventLog) ? data.eventLog.filter(e => e && typeof e.text === 'string').slice(-EVENT_LOG_MAX) : [];
  eventLogUnread = 0; updateEventLogButton();
  if (eventLogOpen) renderEventLog();
  // Statistik (v34.24): ältere Stände beginnen mit leerem Verlauf
  resetStats();
  if (data.stats && Array.isArray(data.stats.t)) {
    const d = data.stats;
    stats.t = d.t.slice(-STATS_MAX);
    const n = stats.t.length;
    const fit = a => { const r = Array.isArray(a) ? a.slice(-n) : []; while (r.length < n) r.unshift(0); return r; };
    stats.pop = [0, 1, 2, 3].map(i => fit(d.pop && d.pop[i]));
    stats.coins = fit(d.coins);
    stats.mood = fit(d.mood);
    stats.prod = {};
    if (d.prod) for (const g of Object.keys(d.prod)) stats.prod[g] = fit(d.prod[g]);
    statsClock = typeof d.clock === 'number' ? d.clock : (n ? stats.t[n - 1] * 1000 : 0);
  }
  // Zufriedenheit (v34.26): fehlt sie, wird sie beim ersten Takt aus dem Zielwert übernommen
  islands.forEach((isl, i) => {
    const v = Array.isArray(data.islandMoods) ? data.islandMoods[i] : null;
    isl.mood = typeof v === 'number' ? Math.max(0, Math.min(100, v)) : undefined;
    isl.emigTimer = 0;
  });
  // Marktlage (v34.24): ältere Stände starten überall ausgeglichen
  islands.forEach((isl, i) => {
    const m = Array.isArray(data.islandMarkets) ? data.islandMarkets[i] : null;
    isl.market = {};
    if (m && typeof m === 'object') {
      for (const g of Object.keys(m)) if (isTradeable(g) && typeof m[g] === 'number') isl.market[g] = Math.max(MARKET_MIN, Math.min(MARKET_MAX, m[g]));
    }
  });
  if (Array.isArray(data.islandNames)) {
    islands.forEach((isl, i) => {
      const n = data.islandNames[i];
      if (typeof n === 'string' && n.trim()) isl.customName = n.trim().slice(0, ISLAND_NAME_MAX);
    });
  }
  for (const sb of (data.buildings || [])) {
    const def = buildingTypes[sb.type];
    if (!def || !inBounds(sb.x, sb.y)) continue;
    const b = {
      type: sb.type, x: sb.x, y: sb.y, def,
      storage: (sb.type === 'warehouse' || sb.type === 'kontor') ? storageOfIsland(islandAt(sb.x, sb.y)) : Object.assign(emptyStorage(), sb.storage || {}),
      // noRoadTimer wird bewusst NICHT gespeichert (wie der Träger-Zustand) -
      // jedes geladene Gebäude startet mit der vollen Gnadenfrist neu (siehe
      // ROAD_DECAY_TIME), statt evtl. mitten in einem alten Zerfalls-Countdown
      // wieder aufzuwachen.
      // paused (v31.1): additiv, ein älterer Stand kennt das Feld nicht und
      // lädt damit als laufender Betrieb - genau richtig, denn dort konnte
      // nichts angehalten sein.
      timer: sb.timer || 0, blocked: sb.blocked || null, paused: !!sb.paused, pendingOut: false, busy: false, noRoadTimer: 0,
      // Brandstatus (v34.7): additiv wie `paused` - ein Stand von vor v34.7
      // kennt `onFire` nicht und lädt damit als unversehrt, genau richtig.
      onFire: !!sb.onFire, fireProgress: sb.onFire ? (Number(sb.fireProgress) || 0) : 0
    };
    if (sb.type === 'house') {
      for (const f of HOUSE_FIELDS) b[f] = sb[f];
      if (typeof b.population !== 'number') b.population = 1;
      // Defaults für Felder, die ein älterer (aber formatgleicher) Spielstand
      // noch nicht enthält - ohne sie liefe der Kleidungs-Timer auf NaN.
      if (typeof b.clothesTimer !== 'number') b.clothesTimer = 0;
      if (typeof b.wellDressed !== 'boolean') b.wellDressed = true;
      if (typeof b.clothesShort !== 'boolean') b.clothesShort = false;
      if (typeof b.luxuryTimer !== 'number') b.luxuryTimer = 0;
      if (typeof b.hasLuxury !== 'boolean') b.hasLuxury = true;
      if (typeof b.luxuryShort !== 'boolean') b.luxuryShort = false;
      // Wohnstufen (v31): ein Stand ohne `tier` besteht aus Siedlerkaten. Die
      // Kapazität hängt seit v31 an der Stufe (6/12/20) statt an der
      // Gebäudedefinition (10) - ein geladenes Haus mit mehr Bewohnern als
      // seine Stufe fasst, wird auf die Kapazität gestutzt, statt dauerhaft
      // überfüllt dazustehen.
      if (typeof b.tier !== 'number' || !HOUSE_TIERS[b.tier]) b.tier = 0;
      if (typeof b.upgradeTimer !== 'number') b.upgradeTimer = 0;
      if (typeof b.upgradeDue !== 'number') b.upgradeDue = 0;
      if (typeof b.upgradeLocked !== 'boolean') b.upgradeLocked = false;
      // Bildungsbedürfnis (v34.11): additiv wie Kleidung/Luxus.
      if (typeof b.schoolTimer !== 'number') b.schoolTimer = 0;
      if (typeof b.schoolStreak !== 'number') b.schoolStreak = 0;
      if (typeof b.educated !== 'boolean') b.educated = true;
      initHouseV3424Fields(b, true); // Adelsstufe + Seuche (v34.24), nur fehlende Felder
      b.population = Math.min(b.population, HOUSE_TIERS[b.tier].capacity);
    }
    if (sb.sheep) {
      b.sheep = sb.sheep.map(s => ({ ...s, held: false }));
    } else if (sb.type === 'sheepfarm') {
      initSheep(b); // älterer/beschädigter Stand ohne Herde - dann neu anlegen
    }
    if (sb.type === 'harbor') { b.ships = sb.ships || 0; b.shipyard = !!sb.shipyard; }
    // Schule (v34.11): b.funded ist reiner Laufzeitzustand (siehe oben) - jede
    // geladene Schule startet unbezahlt, bis updateSchoolUpkeep sie im nächsten
    // Zyklus neu prüft, GENAU wie ein Leuchtturm ohne bekanntes lighthouseFueled.
    if (sb.type === 'school') b.funded = false;
    map[b.y][b.x].building = b;
    buildings.push(b);
  }
  warehouse = buildings.find(b => b.type === 'warehouse') || null;
  homeIslandId = warehouse ? islandAt(warehouse.x, warehouse.y) : -1;
  activeIslandId = homeIslandId;
  // Freischaltungen (v31): der gespeicherte Höchststand gilt weiter, mindestens
  // aber das, was das geladene Dorf gerade hergibt. Ein v30-Stand hat kein
  // popPeak - dort ergibt sich die Freischaltung aus der Bevölkerung selbst,
  // sonst stünde ein großes Dorf plötzlich ohne sein Wirtshaus da.
  popPeak = [0, 0, 0, 0];
  if (Array.isArray(data.popPeak)) for (let t = 0; t < 4; t++) popPeak[t] = Math.max(0, data.popPeak[t] || 0);
  refreshPopPeak();
  lockBtnState.tavern = lockBtnState.brewery = lockBtnState.hopfarm = undefined;
  lockBtnState.tobaccofarm = lockBtnState.spicefarm = undefined;

  if (data.camera) camera = { panX: data.camera.panX || 0, panY: data.camera.panY || 0, zoom: data.camera.zoom || 1 };
  if (typeof data.dayTime === 'number') dayTime = data.dayTime;
  // Referenzwert für die Sonnenuntergangs-Erkennung des Leuchtturms (v34) auf
  // die geladene Uhrzeit zurücksetzen - sonst könnte ein Sprung über die
  // 0.75-Schwelle beim Laden fälschlich einen Tran-Verbrauch auslösen (oder,
  // seltener, einen echten Sonnenuntergang direkt nach dem Laden verpassen).
  lastDayTimeForLighthouse = dayTime;
  collectAmbientSpots();
  initDeer(); // Rehe werden bewusst nicht gespeichert (siehe Kommentar bei `let deer`) - nach jedem Laden neu ausgesetzt
  initElephants(); // dasselbe für die Elefanten (v34.14) - reines Ambiente, kein Spielstand-Inhalt
  initPolarBears(); // ...und für Eisbären und Robben (v34.21)
  initSeals();
  initWhalePods(); // Walschulen (v34.25) - wie das Wetter nicht gespeichert
  // Schiffe sind erkaufter Spielerbesitz und werden daher (anders als die Rehe) geladen.
  ships = (data.ships || []).map(s => ({
    x: s.x, y: s.y, tx: s.tx ?? null, ty: s.ty ?? null,
    harborX: s.harborX, harborY: s.harborY, selected: false,
    // Ladung ist echter, dauerhafter Spielerbesitz und wird deshalb - wie das
    // Schiff selbst - gespeichert. Ältere Stände ohne Ladung starten leer.
    cargo: Object.assign({}, s.cargo || {}),
    // Schiffstyp (NEU, v34): ein Stand bis v33.1 kennt kein `shipType` - fällt
    // in shipCapacity()/SHIP_TYPES[...] automatisch auf 'small' zurück, exakt
    // die frühere feste Kapazität von 20. Ein unbekannter/beschädigter Wert
    // wird hier ausdrücklich verworfen statt ihn unbesehen zu übernehmen.
    shipType: SHIP_TYPES[s.shipType] ? s.shipType : 'small',
    // Ältere Stände (bis v25) kennen keine Routen - dort fährt jedes Schiff frei.
    // `routeLeg` ('a'/'b') war bis v31.1 der Zustand des Zwei-Bein-Automaten;
    // seit v32 ist es die Stationsnummer (siehe updateRoutes). 'b' war das
    // Zielkontor, also Station 1.
    routeId: s.routeId || null,
    routeStop: typeof s.routeStop === 'number' ? s.routeStop : (s.routeLeg === 'b' ? 1 : 0),
    routeStatus: null, routeWait: 0, waypoints: [],
    hp: 0 // wird direkt darunter gesetzt, sobald shipType feststeht
  }));
  // Rumpfstärke (v34.22): ältere Stände kennen sie nicht - dann ist das Schiff heil.
  (data.ships || []).forEach((raw, i) => {
    const sh = ships[i];
    const max = shipMaxHp(sh);
    sh.hp = typeof raw.hp === 'number' ? Math.max(1, Math.min(max, raw.hp)) : max;
    sh.escortRouteId = sh.shipType === 'warship' && raw.escortRouteId ? raw.escortRouteId : null;
    sh.escortOf = null;
  });
  pirates = []; shipWrecks = []; cannonShots = []; combatPuffs = [];
  // Nebel (v34.24): gespeichertes Bitfeld, sonst um Besitz und Startinsel aufdecken
  fogSilent = true;
  for (const isl of islands) isl.discovered = false;
  if (typeof data.explored === 'string' && data.explored.length && decodeFog(data.explored)) {
    for (let i = 0; i < explored.length; i++) {
      if (!explored[i]) continue;
      const x = i % CFG.mapSize, y = (i / CFG.mapSize) | 0;
      if (map[y][x].terrain !== 'water') { const id = islandAt(x, y); if (id >= 0) islands[id].discovered = true; }
    }
  } else {
    explored = new Uint8Array(CFG.mapSize * CFG.mapSize);
    revealHomeIsland();
    for (const b of buildings) revealCircle(b.x, b.y, 10);
    for (const sh of ships) revealCircle(sh.x, sh.y, FOG_SHIP_RADIUS);
  }
  fogSilent = false;
  // Freischaltung: ein Stand vor v34.22 mit bereits vorhandenem Kriegsschiff
  // gilt ebenfalls als freigeschaltet - sonst kämen dort nie Piraten.
  pirateUnlocked = !!data.pirateUnlocked || ships.some(sh => sh.shipType === 'warship');
  pirateTimer = typeof data.pirateTimer === 'number' ? data.pirateTimer
    : PIRATE_FIRST_DELAY_MIN + Math.random() * (PIRATE_FIRST_DELAY_MAX - PIRATE_FIRST_DELAY_MIN);
  // Routen NACH den Gebäuden und Schiffen wiederherstellen: erst dann lässt
  // sich prüfen, ob an den Stationen noch Kontore stehen. Halte ohne Kontor
  // (etwa aus einem manipulierten Stand) fallen weg, statt später bei jedem
  // Tick ins Leere zu zeigen; bleibt weniger als ein Paar übrig, fällt die
  // ganze Route weg.
  //
  // MIGRATION (v32): ein Stand bis v31.1 hat statt `stops` die vier
  // Koordinaten ax/ay/bx/by plus Hin- und Rückfracht. Daraus werden ZWEI
  // Stationen - und weil an jeder Station alles abgeladen wird, was dort nicht
  // geladen werden soll, verhält sich die migrierte Route exakt wie vorher.
  //
  // MIGRATION (v34.5): ein Stand bis v34.4 hat pro Station statt `loads`
  // (mehrere Waren gleichzeitig) nur ein einzelnes `load`/`amount`-Paar.
  // Das wird hier in ein `loads`-Objekt mit genau einem Eintrag umgewandelt,
  // damit alte Spielstände unverändert weiterlaufen.
  routes = (data.routes || [])
    .map(r => {
      const roh = Array.isArray(r.stops) ? r.stops : [
        { x: r.ax, y: r.ay, load: r.good || 'plank', amount: r.amount || 10 },
        { x: r.bx, y: r.by, load: r.returnGood || null, amount: r.returnAmount || 10 }
      ];
      return {
        id: r.id,
        stops: roh
          .filter(st => st && kontorAt(st.x, st.y))
          // Nur Waren zulassen, die es auch wirklich gibt - sonst könnte ein
          // beschädigter Stand eine Station mit einem unbekannten Gut erzeugen,
          // die dann bei jedem Halt ins Leere lädt.
          .map(st => {
            const loads = {};
            if (st.loads && typeof st.loads === 'object') {
              for (const g of Object.keys(st.loads)) {
                if (GOOD_LABELS[g] && isShippable(g)) {
                  loads[g] = Math.max(5, Math.min(SHIP_TYPES.large.capacity, st.loads[g] || 10));
                }
              }
            } else if (st.load && GOOD_LABELS[st.load] && isShippable(st.load)) {
              loads[st.load] = Math.max(5, Math.min(SHIP_TYPES.large.capacity, st.amount || 10));
            }
            return { x: st.x, y: st.y, loads };
          })
      };
    })
    .filter(r => r.stops.length >= 2);
  for (const r of routes) entdoppeln(r);
  routes = routes.filter(r => r.stops.length >= 2);
  nextRouteId = routes.reduce((m, r) => Math.max(m, r.id), 0) + 1;
  for (const s of ships) if (s.routeId && !routeById(s.routeId)) clearShipRoute(s);
  selectedShip = null;
  selectedBuilding = null;
  renderBuildingInfo();
  updateResourceUI();
  renderMinimap();
}

// ---- Automatische Zwischenspeicherung (NEU, v33) ----------------------------
// Der Serialisierer lag seit v20 fertig da und wurde nur für den Datei-Download
// benutzt - ein abgestürzter oder versehentlich geschlossener Tab kostete
// bisher die ganze Sitzung. Gespeichert wird jetzt zusätzlich alle 30 Sekunden
// still in den Browser-Speicher.
//
// Die Datei wird per Doppelklick geöffnet (file://). Dort ist localStorage in
// manchen Browsern gesperrt; JEDER Zugriff steckt deshalb in try/catch, und
// nach dem ersten Fehlschlag wird es nicht wieder versucht - eine
// Fehlermeldung alle 30 Sekunden wäre schlimmer als kein Autosave.
const AUTOSAVE_KEY = 'manfredville-autosave-v1';
const AUTOSAVE_INTERVAL = 30000;
let autosaveBroken = false;
function autosaveNow() {
  if (autosaveBroken) return false;
  try {
    localStorage.setItem(AUTOSAVE_KEY, JSON.stringify({ savedAt: Date.now(), game: serializeGame() }));
    return true;
  } catch (e) {
    autosaveBroken = true;
    setStatus('Automatisches Speichern ist in diesem Browser nicht möglich – bitte gelegentlich von Hand speichern.');
    return false;
  }
}
function readAutosave() {
  try {
    const roh = localStorage.getItem(AUTOSAVE_KEY);
    if (!roh) return null;
    const o = JSON.parse(roh);
    return (o && o.game) ? o : null;
  } catch (e) {
    return null;
  }
}
function clearAutosave() {
  try { localStorage.removeItem(AUTOSAVE_KEY); } catch (e) { /* egal */ }
}
function autosaveZeitText(ts) {
  const d = new Date(ts);
  const heute = new Date();
  const gleich = d.toDateString() === heute.toDateString();
  const uhr = d.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });
  if (gleich) return `heute ${uhr} Uhr`;
  const gestern = new Date(heute.getTime() - 86400000);
  if (d.toDateString() === gestern.toDateString()) return `gestern ${uhr} Uhr`;
  return `${d.toLocaleDateString('de-DE')} ${uhr} Uhr`;
}
function saveGameToFile() {
  const json = JSON.stringify(serializeGame());
  const blob = new Blob([json], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const stamp = new Date().toISOString().slice(0, 16).replace(/[:T]/g, '-');
  a.href = url;
  a.download = `manfredville-${stamp}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  // Freigeben erst nach dem Klick, sonst bricht der Download in manchen Browsern ab.
  setTimeout(() => URL.revokeObjectURL(url), 2000);
  setStatus('Spielstand gespeichert (als Datei heruntergeladen).');
}

function loadGameFromText(text) {
  try {
    applySave(JSON.parse(text));
    setStatus('Spielstand geladen.');
    return true;
  } catch (err) {
    setStatus('Laden fehlgeschlagen: ' + err.message);
    return false;
  }
}

// ---- Eingabe / Kamera ---------------------------------------------------------
function getEventPos(e) {
  const raw = (e.touches && e.touches[0]) || (e.changedTouches && e.changedTouches[0]) || e;
  const r = canvas.getBoundingClientRect();
  return { x: raw.clientX - r.left, y: raw.clientY - r.top };
}
// Manche Browser feuern nach einem echten Touch-Tap zusätzlich synthetische
// Maus-Events ("Ghost Clicks") auf derselben Stelle ab. Ohne Schutz könnte das
// z.B. ein Gebäude doppelt auslösen. Wir merken uns den letzten Touch-Zeitpunkt
// und ignorieren Maus-Events, die kurz danach eintreffen.
let lastTouchAt = 0;
function isGhostMouseEvent(e) {
  return e.type.indexOf('mouse') === 0 && (Date.now() - lastTouchAt) < 800;
}
// ---- Pinch-to-Zoom (zwei Finger) -------------------------------------------
// Läuft parallel zur normalen Ein-Finger-Pan-/Werkzeug-Logik: sobald ein
// zweiter Finger dazukommt, wird in den Pinch-Modus gewechselt (kein Pan/
// Werkzeug-Klick mehr, bis wieder nur noch 0-1 Finger aktiv sind).
let pinchActive = false;
let pinchStartDist = 0;
let pinchStartZoom = 1;
let lastPinchEndAt = -Infinity; // verhindert einen ungewollten Klick beim Loslassen des zweiten Fingers
// WICHTIG: `mouseup`/`touchend` hängen bewusst am `window` und nicht am Canvas,
// damit ein Ziehen auch dann sauber endet, wenn der Zeiger dabei über den
// Canvas-Rand hinausläuft. Dadurch erreichen aber AUCH Loslass-Ereignisse von
// Bedienelementen (Baumenü-Knopf, Minimap, Audio-Menü, Topbar) diesen Handler.
// `pointerActive` merkt sich deshalb, ob die aktuelle Geste überhaupt AUF DEM
// CANVAS begonnen hat - nur dann darf ein Loslassen als Bau-/Werkzeug-Klick
// gewertet werden. Ohne diese Prüfung landete z. B. beim Umschalten von einem
// Bauwerkzeug auf ein anderes ein Gebäude an der Bildschirmposition des
// Menüknopfs, also scheinbar willkürlich irgendwo auf der Karte.
let pointerActive = false;
// Zeigt der Zeiger gerade auf die Karte - also nicht nur INNERHALB des
// Canvas-Rechtecks, sondern auch nicht auf ein darüberliegendes Bedienelement?
// Eine reine Rechteckprüfung reicht nicht: der Canvas füllt das ganze Fenster,
// Baumenü, Minimap und Topbar liegen darüber. `elementFromPoint` liefert das
// oberste Element an dieser Stelle und beantwortet die Frage direkt.
function isEventOverCanvas(e) {
  const raw = (e.touches && e.touches[0]) || (e.changedTouches && e.changedTouches[0]) || e;
  if (raw.clientX === undefined) return false;
  const top = document.elementFromPoint(raw.clientX, raw.clientY);
  return top === canvas;
}
function touchDist(t0, t1) {
  return Math.hypot(t1.clientX - t0.clientX, t1.clientY - t0.clientY);
}
function touchMidpoint(t0, t1) {
  const r = canvas.getBoundingClientRect();
  return { x: (t0.clientX + t1.clientX) / 2 - r.left, y: (t0.clientY + t1.clientY) / 2 - r.top };
}
// Zoomt zentriert auf `pos` (Bildschirmkoordinaten relativ zum Canvas) - der
// Punkt unter `pos` bleibt dabei fix. Gemeinsam genutzt von Mausrad-Zoom und
// Pinch-Zoom, damit beide exakt dasselbe Zentrier-Verhalten haben.
function applyZoomAt(pos, newZoomRaw) {
  const o = getOrigin();
  const oldZoom = camera.zoom;
  const newZoom = Math.max(ZOOM_MIN, Math.min(ZOOM_MAX, newZoomRaw));
  const ratio = newZoom / oldZoom;
  if (ratio === 1) return;
  const offsetX = pos.x - o.x, offsetY = pos.y - o.y;
  const newOriginX = pos.x - offsetX * ratio;
  const newOriginY = pos.y - offsetY * ratio;
  camera.zoom = newZoom;
  camera.panX = newOriginX - canvas.clientWidth / 2;
  camera.panY = newOriginY - 110;
}
function onPointerDown(e) {
  // Rechtsklick (Maustaste 2) löst kein Pan/Bau/Auswahl aus, sondern nur das
  // Schiffs-Bewegungskommando über den eigenen 'contextmenu'-Listener.
  if (e.type === 'mousedown' && e.button === 2) return;
  if (e.type === 'touchstart') lastTouchAt = Date.now();
  else if (isGhostMouseEvent(e)) return;
  if (e.type === 'touchstart' && e.touches && e.touches.length >= 2) {
    // Zweiter Finger kommt dazu: in den Pinch-Modus wechseln, laufendes
    // Ein-Finger-Pan/Werkzeug abbrechen.
    if (e.cancelable) e.preventDefault();
    isDragging = false;
    // Die Ein-Finger-Geste ist damit beendet - der später hochgehende zweite
    // Finger darf keinen Klick mehr auslösen.
    pointerActive = false;
    pinchActive = true;
    pinchStartDist = touchDist(e.touches[0], e.touches[1]);
    pinchStartZoom = camera.zoom;
    return;
  }
  if (e.cancelable) e.preventDefault();
  const pos = getEventPos(e);
  dragStart = pos;
  isDragging = true;
  dragMoved = false;
  pointerActive = true; // die Geste hat auf dem Canvas begonnen
  if (currentTool === 'pan') canvas.classList.add('panning');
  if (currentTool === 'road') {
    const g = screenToGrid(pos.x, pos.y);
    paintRoadAt(g.x, g.y);
  } else if (currentTool === 'stoneroad') {
    const g = screenToGrid(pos.x, pos.y);
    paintStoneRoadAt(g.x, g.y);
  }
}
function onPointerMove(e) {
  if (pinchActive && e.touches && e.touches.length >= 2) {
    if (e.cancelable) e.preventDefault();
    const newDist = touchDist(e.touches[0], e.touches[1]);
    const mid = touchMidpoint(e.touches[0], e.touches[1]);
    applyZoomAt(mid, pinchStartZoom * (newDist / pinchStartDist));
    return;
  }
  const pos = getEventPos(e);
  // Bauvorschau nur zeigen, solange der Zeiger tatsächlich über der Karte ist -
  // sonst klebte beim Überfahren des Baumenüs eine Vorschau an einer zufälligen
  // Kachel unter dem Menü.
  hoverTile = (isDragging || isEventOverCanvas(e)) ? screenToGrid(pos.x, pos.y) : null;
  if (!isDragging) return;
  if (e.cancelable) e.preventDefault();
  const dx = pos.x - dragStart.x, dy = pos.y - dragStart.y;
  if (Math.abs(dx) > 3 || Math.abs(dy) > 3) dragMoved = true;
  if (currentTool === 'pan') {
    camera.panX += dx;
    camera.panY += dy;
    dragStart = pos;
  } else if (currentTool === 'road' && dragMoved) {
    const g = screenToGrid(pos.x, pos.y);
    paintRoadAt(g.x, g.y);
  } else if (currentTool === 'stoneroad' && dragMoved) {
    const g = screenToGrid(pos.x, pos.y);
    paintStoneRoadAt(g.x, g.y);
  }
}
// Sucht das Schiff am nächsten zu einer Bildschirmposition (Klick-Hit-Test) -
// analog zu screenToGrid, aber schiffsgenau statt kachelgenau, weil ein
// Schiff frei zwischen Kacheln steht statt fest auf einer zu sitzen.
function findShipAtScreenPos(pos) {
  const { tw } = currentTileSize();
  const hitRadius = Math.max(16, tw * 0.5);
  let best = null, bestDist = Infinity;
  for (const s of ships) {
    const p = gridToScreen(s.x, s.y);
    const dist = Math.hypot(p.x - pos.x, p.y - pos.y);
    if (dist <= hitRadius && dist < bestDist) { bestDist = dist; best = s; }
  }
  return best;
}
function onPointerUp(e) {
  // Siehe onPointerDown: Rechtsklick wird komplett dem 'contextmenu'-Listener
  // überlassen, sonst würde dieses Mouseup die gerade getroffene Schiffsauswahl
  // sofort wieder aufheben (handleClick auf der angeklickten Wasserkachel).
  if (e.type === 'mouseup' && e.button === 2) return;
  if (e.type === 'touchend' && pinchActive && (!e.touches || e.touches.length < 2)) {
    // Pinch endet, sobald weniger als zwei Finger übrig sind - der jetzt
    // noch aufliegende (oder gar keine) Finger soll nicht sofort als
    // Klick/Pan-Start missverstanden werden.
    pinchActive = false;
    lastPinchEndAt = Date.now();
    isDragging = false;
    dragMoved = false;
    pointerActive = false;
    return;
  }
  if (e.type !== 'touchend' && isGhostMouseEvent(e)) return;
  // Loslassen ohne zugehöriges Drücken AUF DEM CANVAS (z. B. Klick auf einen
  // Menüknopf, die Minimap oder das Audio-Menü) darf nichts bauen oder abreißen.
  if (!pointerActive) {
    isDragging = false;
    dragMoved = false;
    canvas.classList.remove('panning');
    return;
  }
  const pos = getEventPos(e);
  const justFinishedPinch = (Date.now() - lastPinchEndAt) < 400;
  if (!dragMoved && currentTool !== 'road' && currentTool !== 'stoneroad' && !justFinishedPinch) {
    // Beim Pan-Werkzeug geht ein Klick zuerst an ein Schiff, falls eins dort
    // steht (Schiffe stehen "über" der Kachel, nicht als Gebäude auf ihr) -
    // erst wenn kein Schiff getroffen wurde, greift die normale Gebäudeauswahl.
    const hitShip = currentTool === 'pan' ? findShipAtScreenPos(pos) : null;
    if (hitShip) {
      if (selectedShip) selectedShip.selected = false;
      selectedShip = hitShip;
      selectedShip.selected = true;
      selectedBuilding = null;
      renderBuildingInfo();
    } else {
      if (selectedShip) { selectedShip.selected = false; selectedShip = null; }
      const g = screenToGrid(pos.x, pos.y);
      handleClick(g.x, g.y);
    }
  }
  isDragging = false;
  dragMoved = false;
  pointerActive = false;
  canvas.classList.remove('panning');
}
function selectTool(name) {
  currentTool = name;
  document.querySelectorAll('.tool-btn').forEach(b => b.classList.toggle('active', b.dataset.tool === name));
  canvas.classList.toggle('tool-active', name !== 'pan');
  setStatus(toolHints[name] || '');
  if (name !== 'pan') {
    // Baumenü-Werkzeuge und Abreißen haben ihre eigene Klick-Wirkung -
    // das Infopanel eines vorher ausgewählten Gebäudes würde sonst nur
    // verwirren, während man z.B. eine neue Straße zieht.
    selectedBuilding = null;
    if (selectedShip) { selectedShip.selected = false; selectedShip = null; }
    renderBuildingInfo();
  }
}

// ---- Zoom (Mausrad) -----------------------------------------------------------
function onWheel(e) {
  e.preventDefault();
  const pos = getEventPos(e);
  const factor = e.deltaY < 0 ? 1.12 : 1 / 1.12;
  // Zoom zentriert auf die Mausposition: der Punkt unter dem Cursor bleibt fix
  // (dieselbe Zentrier-Logik wie beim Pinch-Zoom, siehe applyZoomAt).
  applyZoomAt(pos, camera.zoom * factor);
}

canvas.addEventListener('mousedown', onPointerDown);
window.addEventListener('mousemove', onPointerMove);
window.addEventListener('mouseup', onPointerUp);
canvas.addEventListener('touchstart', onPointerDown, { passive: false });
window.addEventListener('touchmove', onPointerMove, { passive: false });
window.addEventListener('touchend', onPointerUp, { passive: false });
window.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    selectTool('pan');
