// ---- Geld ist GLOBAL (NEU, v29.1) -------------------------------------------
// Münzen sind die einzige Ware, die NICHT an eine Insel gebunden ist: was
// irgendwo geprägt wird, steht überall zur Verfügung. Das ist eine bewusste
// Ausnahme von der Insel-Warenwirtschaft aus v25 - Geld ist kein Sack Getreide,
// den man über See schaffen muss, sondern ein Guthaben des Spielers.
//
// UMGESETZT ALS ACCESSOR, NICHT ALS SONDERFALL IN JEDER ZUGRIFFSFUNKTION:
// jeder Insel-Warenbestand bekommt für `coin` einen getter/setter auf dieselbe
// globale Variable. Dadurch trifft JEDER bestehende Codepfad automatisch die
// gemeinsame Kasse - `stockOf`, `spendFrom`, `addTo`, die Träger-Zustellung,
// die Anzeige, die Schiffsumschläge. Hätte ich stattdessen in jeder dieser
// Funktionen ein `if (good === 'coin')` eingebaut, wäre garantiert eine Stelle
// übrig geblieben, an der Geld doch wieder inselgebunden gewesen wäre.
//
// WICHTIG: nur INSEL-Bestände bekommen diesen Accessor, nicht die lokalen
// Puffer der Gebäude. Sonst wäre der Ausgabepuffer der Münzprägerei selbst die
// Staatskasse - und ihre Produktion würde stoppen, sobald landesweit acht
// Münzen im Umlauf sind (outputCapacity-Prüfung).
let treasury = 0;
function makeIslandStorage(init) {
  const s = emptyStorage();
  if (init) {
    for (const k of Object.keys(s)) {
      if (k === 'coin') continue; // kommt aus der globalen Kasse, nicht je Insel
      if (typeof init[k] === 'number') s[k] = init[k];
    }
  }
  Object.defineProperty(s, 'coin', {
    get: () => treasury,
    set: v => { treasury = Math.max(0, v); },
    enumerable: true,
    configurable: true
  });
  return s;
}

const ctx = canvas.getContext('2d');

let dueNobleHouses = []; // Adelsluxus (v34.24), siehe resolveNobleNeeds

const ZOOM_MIN = 0.2, ZOOM_MAX = 2.5; // noch weiter rauszoombar, damit auch die 80x80-Karte am Stück überblickbar bleibt

let dragMoved = false;

// ---- Hilfsfunktionen: Grid ------------------------------------------
function inBounds(x, y) {
  return x >= 0 && y >= 0 && x < CFG.mapSize && y < CFG.mapSize;
}
function neighbors4(x, y) {
  return [{ x: x + 1, y }, { x: x - 1, y }, { x, y: y + 1 }, { x, y: y - 1 }];
}
function hash(a, b, c) {
  const h = Math.sin(a * 127.1 + b * 311.7 + c * 74.7) * 43758.5453;
  return h - Math.floor(h);
}

// ---- Klimazonen (NEU, v24) -------------------------------------------
// Die Karte hat drei Klimazonen, die allein von der geografischen BREITE
// abhängen, also von der y-Koordinate: Norden = Schnee und Eis, Mitte =
// gemäßigt grün wie bisher, Süden = Savanne/Wüste.
//
// WICHTIGE ENTWURFSENTSCHEIDUNG: Das Klima ist KEIN gespeichertes Kachelfeld,
// sondern eine reine Funktion von y. Dadurch ändert sich das Speicherformat
// überhaupt nicht (kein SAVE_VERSION-Sprung), ein alter 80x80-Spielstand
// bekommt seine Zonen automatisch im richtigen Verhältnis, und es gibt keine
// Möglichkeit, dass gespeicherte Klimadaten und Kartenposition auseinander-
// laufen. Genauso wichtig: das Klima beeinflusst NUR Aussehen und Bewuchs,
// nie die Spielregeln - auf einer Wüsteninsel gelten dieselben Bauregeln wie
// im gemäßigten Gürtel.
const CLIMATES = ['polar', 'temperate', 'arid'];
// Stufenlose Klima-Position: 0 = tiefster Norden, 1 = gemäßigte Mitte,
// 2 = tiefster Süden. Die Zwischenwerte sind der eigentliche Trick - Farben
// werden dazwischen weich interpoliert, statt an einer Linie umzuspringen.
// Die Konstanten sind so gewählt, dass die diskreten Zonengrenzen (mix 0.5 und
// 1.5) bei 30 % und 70 % der Kartenhöhe liegen: das nördliche Drittel ist
// Schnee und Eis, das mittlere (etwas breitere) Drittel gemäßigt - dort startet
// der Spieler -, das südliche Drittel Savanne und Wüste. Vollständig
// "durchgefärbt" ist eine Zone erst jenseits von 10 % bzw. 90 %, dazwischen
// blendet die Landschaft weich über.
function climateMix(y) {
  const f = y / Math.max(1, CFG.mapSize - 1);
  return Math.max(0, Math.min(2, (f - 0.10) / 0.40));
}
// Diskrete Zone für Entscheidungen, die sich nicht mischen lassen (welcher
// Baum wächst hier, liegt Schnee auf dem Fels). Der Wobble verschiebt die
// Grenze je Spalte um ein paar Kacheln, damit der Übergang zwischen zwei
// Bewuchsarten keine schnurgerade Linie quer über die Karte ist.
const CLIMATE_WOBBLE = 8; // Kacheln Gesamtbreite der Grenzverschiebung je Spalte
function climateAt(x, y) {
  // Schnellweg: für die allermeisten Zeilen steht die Zone schon fest, weil der
  // Wobble sie gar nicht über eine Grenze schieben kann. Das ist keine reine
  // Kosmetik - climateAt läuft pro sichtbarer Wasserkachel und Frame (siehe
  // Treibeis in drawWaterSurface), und ein hash() enthält ein Math.sin.
  const row = climateRowKind[y];
  if (row && row !== 'mixed') return row;
  const m = climateMix(y + (hash(x, 3, 909) - 0.5) * CLIMATE_WOBBLE);
  return m < 0.5 ? 'polar' : (m < 1.5 ? 'temperate' : 'arid');
}
// Geländefarben je Zone. Die Wasserfarben unterscheiden sich bewusst nur im
// Flachwasser: das offene Meer ist überall dasselbe Blau, damit die Karte
// nicht in drei farblich getrennte Streifen zerfällt, während die Küstensäume
// die Zone verraten (eisblau / türkisgrün / warmes Türkis).
const CLIMATE_COLORS = {
  polar:     { grass: '#dbe4e8', forest: '#54706a', mountain: '#93a0a8', shallow: '#7fb6c9', deep: '#2b5c85' },
  temperate: { grass: '#4c7a44', forest: '#3f6b3f', mountain: '#7a746a', shallow: '#3f7f9e', deep: '#2b5c85' },
  arid:      { grass: '#b8a054', forest: '#7e8443', mountain: '#8f7f60', shallow: '#3f9fb0', deep: '#2b5c85' }
};
function mixHex(a, b, t) {
  const na = parseInt(a.slice(1), 16), nb = parseInt(b.slice(1), 16);
  const r = Math.round(((na >> 16) & 0xff) * (1 - t) + ((nb >> 16) & 0xff) * t);
  const g = Math.round(((na >> 8) & 0xff) * (1 - t) + ((nb >> 8) & 0xff) * t);
  const bl = Math.round((na & 0xff) * (1 - t) + (nb & 0xff) * t);
  return '#' + ((1 << 24) + (r << 16) + (g << 8) + bl).toString(16).slice(1);
}
// Vorberechnete Geländefarben JE KARTENZEILE. drawTile läuft für jede
// sichtbare Kachel in jedem Frame - eine Hex-Interpolation dort wären
// zehntausende String-Parsings pro Sekunde. Da die Farbe ausschließlich von y
// abhängt, reicht eine Tabelle mit einer Zeile pro y, einmal nach der
// Kartenerzeugung bzw. nach dem Laden aufgebaut.
let climateRowColors = [];
// Je Zeile die eindeutige Zone - oder 'mixed', wenn die Zeile so nah an einer
// Zonengrenze liegt, dass der spaltenweise Wobble sie darüber schieben könnte.
// Nur für diese wenigen Zeilen muss climateAt wirklich rechnen.
let climateRowKind = [];
function buildClimateColors() {
  climateRowColors = [];
  climateRowKind = [];
  for (let y = 0; y < CFG.mapSize; y++) {
    const half = CLIMATE_WOBBLE / 2;
    const lo = climateMix(y - half), hi = climateMix(y + half);
    const kindOf = (m) => m < 0.5 ? 'polar' : (m < 1.5 ? 'temperate' : 'arid');
    climateRowKind.push(kindOf(lo) === kindOf(hi) ? kindOf(lo) : 'mixed');
  }
  for (let y = 0; y < CFG.mapSize; y++) {
    const m = climateMix(y);
    const from = m < 1 ? CLIMATE_COLORS.polar : CLIMATE_COLORS.temperate;
    const to = m < 1 ? CLIMATE_COLORS.temperate : CLIMATE_COLORS.arid;
    const t = m < 1 ? m : m - 1;
    const row = {};
    for (const key of ['grass', 'forest', 'mountain', 'shallow', 'deep']) {
      row[key] = mixHex(from[key], to[key], t);
    }
    climateRowColors.push(row);
  }
}
function climateColor(y, key) {
  const row = climateRowColors[y];
  return row ? row[key] : CLIMATE_COLORS.temperate[key];
}

// ---- Kartengenerierung: Archipel mit Klimazonen (NEU, v24) -----------
// Die Karte besteht nicht mehr aus EINER Landmasse mit einem Meer an einer
// Kante, sondern aus vielen unterschiedlich großen Inseln in offenem Wasser.
// Ablauf: alles ist zunächst Meer, dann wird die Startinsel in die Kartenmitte
// gesetzt (garantiert groß und vollständig ausgestattet), danach werden weitere
// Inseln per Ablehnungsverfahren rundherum verteilt. Bewuchs und Gebirge
// entstehen anschließend PRO INSEL, damit jede Insel für sich stimmig wirkt
// statt als Ausschnitt eines kartenweiten Musters.
let homeSpot = null; // freie Landkachel auf der Startinsel - dort setzt init() das erste Lagerhaus

function generateMap() {
  map = [];
  for (let y = 0; y < CFG.mapSize; y++) {
    const row = [];
    for (let x = 0; x < CFG.mapSize; x++) {
      row.push({ terrain: 'water', trees: 0, iron: 0, gold: 0, copper: 0, diamond: 0, stone: 0, road: false, stoneRoad: false, shallow: false, building: null });
    }
    map.push(row);
  }
  buildClimateColors();
  growingTiles = []; // frische Karte: nichts wächst (siehe updateGrowth)
  const n = CFG.mapSize;
  const placed = []; // {cx, cy, r} - nur zur Abstandsprüfung, nicht die echte Form

  // --- Startinsel ---------------------------------------------------------
  // Bewusst in der Kartenmitte (also im gemäßigten Gürtel) und aus mehreren
  // überlappenden Lappen zusammengesetzt: eine einzelne runde Scheibe sähe
  // künstlich aus, und die Startinsel ist die einzige, die der Spieler lange
  // aus der Nähe sieht. Sie ist außerdem die einzige Insel mit einer GARANTIE
  // auf Wald und Gebirge - solange Schiffe noch keine Waren transportieren
  // können (siehe „Ideen"), muss sie für sich allein spielbar sein.
  const homeR = Math.max(10, Math.round(n * 0.16));
  const hx = Math.floor(n / 2), hy = Math.floor(n / 2);
  let homeTiles = stampIsland(hx, hy, homeR);
  for (let i = 0; i < 3; i++) {
    const ang = Math.random() * Math.PI * 2;
    const d = homeR * (0.5 + Math.random() * 0.3);
    homeTiles = homeTiles.concat(stampIsland(
      Math.round(hx + Math.cos(ang) * d),
      Math.round(hy + Math.sin(ang) * d),
      homeR * (0.45 + Math.random() * 0.25)
    ));
  }
  placed.push({ cx: hx, cy: hy, r: homeR * 1.3 });

  // --- Weitere Inseln -----------------------------------------------------
  // Ablehnungsverfahren: zufälliger Mittelpunkt, zufällige Größe, verworfen
  // wenn er einer bereits gesetzten Insel zu nahe kommt (der Zuschlag
  // ISLAND_CHANNEL garantiert eine fahrbare Wasserstraße dazwischen, damit die
  // Inseln als eigenständig lesbar bleiben) oder wenn er über den Kartenrand
  // ragen würde.
  // Größenklassen bewusst in DIESER Reihenfolge ("große Steine zuerst"): würden
  // die vielen kleinen Eilande zuerst gestreut, wäre die Karte danach so
  // durchsetzt, dass für eine wirklich große Insel nirgends mehr Platz bliebe -
  // es entstünde ein gleichförmiger Sprenkel-Teppich statt der gewünschten
  // Mischung aus wenigen großen und vielen kleinen Inseln.
  const scale = (n * n) / (140 * 140); // Anzahl skaliert mit der Kartenfläche
  const ISLAND_CLASSES = [
    { count: Math.round(4 * scale), min: 12, max: 17, channel: 5 },  // wenige große
    { count: Math.round(9 * scale), min: 6, max: 11, channel: 4 },   // mittlere
    { count: Math.round(18 * scale), min: 2.5, max: 5.5, channel: 3 } // viele kleine
  ];
  const others = [];
  for (const cls of ISLAND_CLASSES) {
    for (let made = 0, attempt = 0; made < cls.count && attempt < cls.count * 60; attempt++) {
      const r = cls.min + Math.random() * (cls.max - cls.min);
      const margin = Math.ceil(r) + 3;
      if (n - margin * 2 <= 0) break;
      const cx = margin + Math.floor(Math.random() * (n - margin * 2));
      const cy = margin + Math.floor(Math.random() * (n - margin * 2));
      if (placed.some(o => Math.hypot(o.cx - cx, o.cy - cy) < o.r + r + cls.channel)) continue;
      placed.push({ cx, cy, r });
      others.push({ cx, cy, r, tiles: stampIsland(cx, cy, r) });
      made++;
    }
  }

  // --- Bewuchs und Gebirge je Insel --------------------------------------
  dressIsland(homeTiles, hx, hy, homeR, true);
  // Erst die Erzarten verteilen (Gold- oder Kupferinsel je Südinsel), dann
  // ausschmücken - assignIslandOreKinds braucht ALLE Inseln auf einmal, um die
  // Zusicherung "beide Sorten kommen vor" überhaupt geben zu können (v34.16).
  assignIslandOreKinds(others);
  for (const isl of others) dressIsland(isl.tiles, isl.cx, isl.cy, isl.r, false, isl.oreKind);
  ensureGoldSomewhere(others);
  ensureCopperSomewhere(others);
  // NACH dem Kupfer: ensureCopperSomewhere kann eine Goldinsel umwidmen und
  // löscht dabei deren Diamanten (siehe dort) - die Diamant-Zusicherung muss
  // also das letzte Wort haben.
  ensureDiamondSomewhere(others);

  markShallowWater();
  computeIslands(); // muss NACH dem letzten Geländeeingriff laufen (siehe dort)
  homeSpot = findHomeSpot(hx, hy);
  collectAmbientSpots();
  initDeer();
  initElephants();
  initPolarBears();
  initSeals();
  initWhalePods(); // Walwanderung (v34.25)
  resetStats(); // neue Karte = neuer Verlauf (v34.24)
}

// Stempelt EINE Insel ins Wasser. Die Küstenlinie entsteht aus der Summe
// dreier Sinuswellen unterschiedlicher Frequenz über dem Winkel - dasselbe
// Prinzip wie früher bei der Festlandküste, nur radial statt linear. Ergibt
// eine unregelmäßige, nie kreisrunde Form, ohne dass dafür ein echtes
// Rauschverfahren nötig wäre. Rückgabe: die Liste der gesetzten Landkacheln,
// mit der dressIsland anschließend arbeitet.
function stampIsland(cx, cy, radius) {
  const p1 = Math.random() * 6.283, p2 = Math.random() * 6.283, p3 = Math.random() * 6.283;
  const a = 2 + Math.floor(Math.random() * 2);
  const b = 4 + Math.floor(Math.random() * 3);
  const c = 7 + Math.floor(Math.random() * 4);
  const shapeAt = (ang) => radius * (0.80
    + 0.13 * Math.sin(ang * a + p1)
    + 0.07 * Math.sin(ang * b + p2)
    + 0.04 * Math.sin(ang * c + p3));
  const R = Math.ceil(radius * 1.05);
  const tiles = [];
  for (let dy = -R; dy <= R; dy++) {
    for (let dx = -R; dx <= R; dx++) {
      const x = cx + dx, y = cy + dy;
      if (!inBounds(x, y)) continue;
      const dist = Math.hypot(dx, dy);
      if (dist > shapeAt(Math.atan2(dy, dx))) continue;
      const t = map[y][x];
      if (t.terrain === 'water') { t.terrain = 'grass'; tiles.push({ x, y }); }
    }
  }
  return tiles;
}

// Gibt einer fertig gestempelten Insel ihren Bewuchs und ggf. ein Gebirge.
// Wie dicht bewaldet und wie schroff eine Insel ist, hängt an ihrer Klimazone:
// im Norden lichter Nadelwald, in der Mitte dichter Mischwald wie bisher, im
// Süden nur vereinzelte Akazienhaine in offener Savanne.
function dressIsland(tiles, cx, cy, radius, isHome, islandOre) {
  if (tiles.length === 0) return;
  const climate = climateAt(cx, cy);
  const forestFactor = climate === 'arid' ? 0.5 : (climate === 'polar' ? 0.75 : 1);
  // Waldcluster: Anzahl proportional zur Inselfläche, damit große und kleine
  // Inseln gleich dicht (statt gleich absolut) bewaldet sind.
  const clusters = Math.max(isHome ? 6 : 1, Math.round(tiles.length / 90 * forestFactor));
  for (let i = 0; i < clusters; i++) {
    const seed = tiles[Math.floor(Math.random() * tiles.length)];
    const rad = 2 + Math.floor(Math.random() * 3);
    for (let dy = -rad; dy <= rad; dy++) {
      for (let dx = -rad; dx <= rad; dx++) {
        const x = seed.x + dx, y = seed.y + dy;
        if (!inBounds(x, y)) continue;
        const t = map[y][x];
        if (t.terrain !== 'grass') continue;
        const dist = Math.hypot(dx, dy);
        if (dist > rad) continue;
        if (Math.random() < (0.78 - (dist / rad) * 0.35) * (climate === 'arid' ? 0.55 : 1)) {
          t.terrain = 'forest';
          t.trees = 2 + Math.floor(Math.random() * 3);
        }
      }
    }
  }
  // Gebirge: nur auf größeren Inseln, und auf der Startinsel garantiert. Der
  // Massiv-Radius ist bewusst an den Inselradius gekoppelt - ein Gebirge darf
  // eine Insel niemals so weit ausfüllen, dass kein Bauland mehr übrig bleibt.
  if (!isHome && (radius < 8 || Math.random() > 0.55)) return;
  const massifR = Math.max(2, Math.round(radius * (isHome ? 0.30 : 0.34)));
  // Ausgangspunkt außerhalb der Inselmitte, damit die Mitte (wo das Dorf
  // wächst) frei bleibt - besonders wichtig auf der Startinsel.
  const ang = Math.random() * Math.PI * 2;
  const off = radius * (isHome ? 0.55 : 0.35);
  const bx = Math.round(cx + Math.cos(ang) * off);
  const by = Math.round(cy + Math.sin(ang) * off);
  const blobs = 2 + Math.floor(Math.random() * 2);
  for (let i = 0; i < blobs; i++) {
    const bcx = bx + Math.round((Math.random() - 0.5) * massifR);
    const bcy = by + Math.round((Math.random() - 0.5) * massifR);
    const rad = Math.max(1, Math.round(massifR * (0.6 + Math.random() * 0.5)));
    for (let dy = -rad; dy <= rad; dy++) {
      for (let dx = -rad; dx <= rad; dx++) {
        const x = bcx + dx, y = bcy + dy;
        if (!inBounds(x, y)) continue;
        const t = map[y][x];
        if (t.terrain === 'water') continue; // Gebirge wächst nicht ins Meer
        if (Math.hypot(dx, dy) > rad) continue;
        if (Math.random() < 0.92 - (Math.hypot(dx, dy) / rad) * 0.25) {
          t.terrain = 'mountain';
          t.trees = 0;
          t.growthStage = undefined;
          t.growthTimer = 0;
          t.growthKind = undefined;
          t.iron = 0;
          t.gold = 0;
          t.stone = 0; // wird in addOreToMountainEdges gesetzt
        }
      }
    }
  }
  addOreToMountainEdges(tiles, isHome, climate, islandOre);
}

// ---- Endliche Bodenschätze (NEU, v30) ---------------------------------------
// Bis v29.3 versiegten Erzadern nie und jede Gebirgskachel lieferte unbegrenzt
// Stein. Jetzt hat jedes Vorkommen einen VORRAT, der bei jeder Fuhre um eins
// sinkt - Stein, Eisen und Gold sind damit die einzigen wirklich endlichen
// Rohstoffe des Spiels (Holz wächst nach, Fisch/Wolle/Wild/Felle/Tran sind
// erneuerbar, Feldfrüchte ohnehin). Im Endspiel bleibt für diese drei nur noch
// der Zukauf am Kontor.
//
// Größenordnung: rund 150 Fuhren je Ader. Eine Mine (interval 6500 ms) holt
// gut neun Fuhren je Minute, eine Ader hält also mit EINER Mine etwa 15-20
// Minuten - lang genug, dass der Bergbau eine Partie trägt, und kurz genug,
// dass die Endlichkeit spürbar wird. Ein Gebirgsfeld liefert weniger Stein als
// eine Ader Erz, dafür hat ein Massiv Dutzende Felder.
const VEIN_SIZE_MIN = 120, VEIN_SIZE_MAX = 190;
const STONE_PER_MOUNTAIN_MIN = 25, STONE_PER_MOUNTAIN_MAX = 55;
function randomVeinSize() {
  return VEIN_SIZE_MIN + Math.floor(Math.random() * (VEIN_SIZE_MAX - VEIN_SIZE_MIN + 1));
}
// Alle Erzarten, die eine Gebirgskachel tragen kann (NEU, v34.16: bis dahin
// waren es nur Eisen und Gold, beide an zwei Dutzend Stellen einzeln
// aufgezählt). EINE Liste, damit jede Stelle, die "hat diese Kachel noch
// irgendein Erz?" fragt, beim nächsten Erz nicht wieder nachgezogen werden
// muss - genau der Fehler, der in v29.2 das Gold in der Mine liegen ließ.
// Eine Kachel trägt trotzdem immer HÖCHSTENS EINE Art (siehe oreOfTile).
const ORE_KINDS = ['iron', 'gold', 'copper', 'diamond'];
// Diamanten (NEU, v34.16) sind ausdrücklich ein Sonderfall und keine vierte
// gleichberechtigte Ader: nur etwa jede vierte Goldinsel trägt überhaupt eine,
// und dann eine einzige, sehr kleine. Zum Vergleich: eine Goldader liefert
// 120-190 Fuhren, eine Diamantader 15-30 - ein Fund ist ein Ereignis, kein
// Wirtschaftszweig. Auf Kupferinseln gibt es ausdrücklich KEINE (Nutzerwunsch).
//
// WICHTIG (v34.17): Diese Wahrscheinlichkeit ist nur noch die OBERGRENZE der
// Verteilung, nicht mehr die Untergrenze. Seit v34.17 sichert
// ensureDiamondSomewhere zu, dass auf JEDER Karte mindestens eine Diamantader
// liegt (Nutzerwunsch) - mit 0,25 je Goldinsel bleibt es damit in der Regel bei
// genau einer Ader je Karte und nur selten bei zwei. Wer die Chance hier
// erhöht, macht Diamanten häufiger, kann sie aber nicht mehr ganz abschalten,
// ohne auch die Zusicherung zu entfernen.
const DIAMOND_ISLAND_CHANCE = 0.25;
const DIAMOND_VEIN_MIN = 15, DIAMOND_VEIN_MAX = 30;
function randomDiamondVeinSize() {
  return DIAMOND_VEIN_MIN + Math.floor(Math.random() * (DIAMOND_VEIN_MAX - DIAMOND_VEIN_MIN + 1));
}
// Anteil der Südinseln, die KUPFERINSELN werden (statt Goldinseln). Bewusst
// keine reine Wahrscheinlichkeit: die Zuweisung in assignIslandOreKinds sichert
// zusätzlich zu, dass es auf jeder Karte mindestens eine Insel JEDER Sorte gibt,
// sobald überhaupt zwei Südinseln vorhanden sind (Lehre aus v29, siehe
// ensureGoldSomewhere/ensureCopperSomewhere).
const COPPER_ISLAND_SHARE = 0.35;
// Baut eine Fuhre aus einer Kachel ab und räumt erschöpfte Vorkommen auf.
// EINE Stelle für alle drei Rohstoffe, damit Mine und Steinbruch garantiert
// dieselbe Buchführung benutzen - und damit das Verschwinden des Gebirges
// nicht an zwei Orten halb implementiert ist.
function extractFromTile(x, y, good) {
  if (!inBounds(x, y)) return false;
  const t = map[y][x];
  if ((t[good] || 0) <= 0) return false;
  t[good] -= 1;
  // Ist der Berg vollständig abgetragen (kein Stein UND kein Erz mehr), wird
  // aus der Gebirgskachel normaler, bebaubarer Grund. Genau das ist der
  // sichtbare Lohn des Abbaus: aus dem Steinbruch wird Bauland.
  // Seit v34.16 über ORE_KINDS statt einzeln aufgezählt - sonst bliebe eine
  // abgebaute Kupfer- oder Diamantkachel für immer als leerer Fels stehen.
  if (t.terrain === 'mountain' && (t.stone || 0) <= 0 && !ORE_KINDS.some(k => (t[k] || 0) > 0)) {
    t.terrain = 'grass';
    t.trees = 0;
    t.growthStage = undefined;
    t.growthTimer = 0;
    t.growthKind = undefined;
  }
  return true;
}
// Erzvorkommen nur am RAND eines Gebirges (Gebirgskacheln mit mindestens
// einem Nicht-Gebirgs-Nachbarn) - dort setzt die Mine an. Auf der Startinsel
// wird notfalls nachgeholfen: ohne eine einzige Ader wäre sie ohne
// Schiffsverkehr in eine Sackgasse gebaut.
//
// WELCHES Erz entsteht, hängt seit v29 allein am Klima der Insel: auf den
// heißen Südinseln liegt GOLD im Berg, überall sonst EISEN. Damit bekommt der
// Süden eine eigene Bergbau-Identität - und das Gold ist zwangsläufig eine
// Fernhandelsware, weil die Startinsel im gemäßigten Gürtel liegt. Umgekehrt
// hat der Süden dafür kein eigenes Eisen und damit keine eigenen Werkzeuge:
// die beiden Erze schließen einander aus, statt sich zu ergänzen.
//
// v34.16: WELCHES Erz eine Südinsel trägt, entscheidet nicht mehr allein das
// Klima, sondern die Insel selbst - sie ist entweder GOLDINSEL (Gold, ganz
// selten dazu eine kleine Diamantader) oder KUPFERINSEL (nur Kupfer, nie Gold
// und nie Diamanten). Die Zuweisung passiert vorab in assignIslandOreKinds und
// wird hier nur noch ausgeführt; `climate` bleibt der Rückfall für die
// Startinsel und alles nördlich des Südgürtels (immer Eisen).
function addOreToMountainEdges(tiles, isHome, climate, islandOre) {
  const oreKind = islandOre || (climate === 'arid' ? 'gold' : 'iron');
  const edges = [];
  for (const { x, y } of tiles) {
    const t = map[y][x];
    if (t.terrain !== 'mountain') continue;
    // Steinvorrat bekommt JEDE Gebirgskachel (v30) - der Steinbruch trägt den
    // Berg damit tatsächlich ab, statt ihn unbegrenzt anzuknabbern.
    t.stone = STONE_PER_MOUNTAIN_MIN + Math.floor(Math.random() * (STONE_PER_MOUNTAIN_MAX - STONE_PER_MOUNTAIN_MIN + 1));
    if (!neighbors4(x, y).some(nb => inBounds(nb.x, nb.y) && map[nb.y][nb.x].terrain !== 'mountain')) continue;
    edges.push(t);
    // Gold ist etwas seltener als Eisen - es ist die Grundlage des Geldes und
    // soll sich nicht anfühlen wie Baustoff. Kupfer liegt dazwischen: es ist
    // ein Gebrauchsmetall wie Eisen, aber eines, das nur der Süden hat.
    const chance = oreKind === 'gold' ? 0.20 : 0.22;
    if (Math.random() < chance) t[oreKind] = randomVeinSize();
  }
  // Zusicherung: die Startinsel braucht Eisen (sonst wäre sie ohne Schiff eine
  // Sackgasse), und JEDE Südinsel mit Gebirgsrand braucht ihr Erz - sonst
  // stünde dort ein Gebirge, das genau nichts hergibt, während der Spieler das
  // halbe Südmeer nach einer Ader absucht (siehe auch ensureGoldSomewhere).
  const mustHaveOre = isHome || oreKind === 'gold' || oreKind === 'copper';
  if (mustHaveOre && edges.length > 0 && !edges.some(t => (t[oreKind] || 0) > 0)) {
    for (let i = 0; i < Math.min(3, edges.length); i++) {
      edges[Math.floor(Math.random() * edges.length)][oreKind] = randomVeinSize();
    }
  }
  // Diamanten (NEU, v34.16): ganz selten, ausschließlich auf GOLDinseln und
  // immer nur eine einzige, kleine Ader. Sie wird auf eine Randkachel gesetzt,
  // die noch KEIN Gold trägt - eine Kachel soll weiterhin höchstens eine
  // Aderart haben (siehe oreOfTile), sonst wäre für den Spieler nicht mehr
  // erkennbar, was seine Mine dort eigentlich abbaut.
  if (oreKind === 'gold' && edges.length > 0 && Math.random() < DIAMOND_ISLAND_CHANCE) {
    // `edges` sammelt hier die Kachel-OBJEKTE; waehleAderplatz braucht die
    // Koordinaten, um die Umgebung abzusuchen - deshalb einmal umpacken.
    const frei = tiles
      .map(({ x, y }) => ({ x, y, t: map[y][x] }))
      .filter(({ t }) => edges.includes(t) && !ORE_KINDS.some(k => (t[k] || 0) > 0));
    const platz = waehleAderplatz(frei);
    if (platz) platz.t.diamond = randomDiamondVeinSize();
  }
}
// Weist JEDER Südinsel vorab ihre Erzart zu: Goldinsel oder Kupferinsel (NEU,
// v34.16). Bewusst hier und nicht als Zufallswurf in addOreToMountainEdges,
// weil nur an dieser Stelle ALLE Inseln zugleich bekannt sind - und nur so
// lässt sich zusichern, dass beide Sorten auf der Karte vorkommen, statt es
// dem Zufall zu überlassen. Dieselbe Lehre wie bei der Startinsel (v24) und
// beim Gold (v29): garantierte Startbedingungen brauchen ausdrückliche
// Zusicherungen, keine Wahrscheinlichkeiten.
//
// Die Zuweisung erfolgt nach GRÖSSE: die größte Südinsel bleibt Goldinsel
// (Gold ist die Grundlage des Geldes und soll nicht auf einer Sandbank am
// Kartenrand liegen), die zweitgrößte wird garantiert Kupferinsel, alle
// weiteren per COPPER_ISLAND_SHARE.
function assignIslandOreKinds(islandsList) {
  const arid = islandsList
    .filter(isl => climateAt(isl.cx, isl.cy) === 'arid' && isl.tiles.length > 0)
    .sort((a, b) => b.tiles.length - a.tiles.length);
  for (const isl of islandsList) {
    isl.oreKind = climateAt(isl.cx, isl.cy) === 'arid' ? 'gold' : 'iron';
  }
  if (arid.length >= 2) arid[1].oreKind = 'copper';
  for (let i = 2; i < arid.length; i++) {
    if (Math.random() < COPPER_ISLAND_SHARE) arid[i].oreKind = 'copper';
  }
}

// Zusicherung statt Wahrscheinlichkeit (v29): auf JEDER Karte muss es
// mindestens eine Goldader geben. Gold ist die Grundlage der Münzen (des
// Geldes) und mit dem Schmuck zugleich eines von fünf Luxusgütern - eine Karte
// ganz ohne Gold wäre keine schwierige, sondern eine kaputte Karte. Der
// Zufallslauf über acht Kartenerzeugungen zeigte genau das: zweimal entstand
// überhaupt kein Gold, einmal davon, weil keine einzige Südinsel ein Gebirge
// abbekommen hatte (dressIsland setzt Gebirge nur auf Inseln ab Radius 8 und
// dann auch nur mit 55% Wahrscheinlichkeit).
//
// Dieselbe Lehre wie bei der Startinsel in v24: "Eine Karte mit garantierten
// Startbedingungen braucht ausdrückliche Zusicherungen, keine
// Wahrscheinlichkeiten." Deshalb hier ein Nachlauf: liegt nach dem Ausschmücken
// nirgends Gold, bekommt die GRÖSSTE Südinsel ein kleines Massiv verpasst (nur
// falls sie noch gar keines hat) und darin garantiert Adern.
// Liegt IRGENDWO auf der Karte noch etwas von dieser Erzart?
function erzKommtVor(kind) {
  for (let y = 0; y < CFG.mapSize; y++) {
    for (let x = 0; x < CFG.mapSize; x++) if ((map[y][x][kind] || 0) > 0) return true;
  }
  return false;
}
// Stempelt einer Insel ohne Gebirge ein kleines Massiv auf - bewusst klein
// (Radius 2) und außerhalb der Mitte, damit die Insel bebaubar bleibt. Wird nur
// von den Zusicherungen unten benutzt, nie im Normalfall.
function stampeKleinesMassiv(isl) {
  const seed = isl.tiles[Math.floor(Math.random() * isl.tiles.length)];
  for (let dy = -2; dy <= 2; dy++) {
    for (let dx = -2; dx <= 2; dx++) {
      const x = seed.x + dx, y = seed.y + dy;
      if (!inBounds(x, y)) continue;
      const t = map[y][x];
      if (t.terrain === 'water') continue;
      if (Math.hypot(dx, dy) > 2) continue;
      t.terrain = 'mountain';
      t.trees = 0;
      t.growthStage = undefined;
      t.growthTimer = 0;
      t.growthKind = undefined;
      for (const k of ORE_KINDS) t[k] = 0;
      t.stone = STONE_PER_MOUNTAIN_MIN + Math.floor(Math.random() * (STONE_PER_MOUNTAIN_MAX - STONE_PER_MOUNTAIN_MIN + 1));
    }
  }
}
// Setzt einer Insel garantiert Adern der gewünschten Art in den Gebirgsrand -
// dieselbe Randregel wie im Normalfall (nur Gebirgskacheln mit einem
// Nicht-Gebirgs-Nachbarn), nur eben garantiert statt zufällig.
// Wählt unter mehreren möglichen Aderplätzen den aus, der am WEITESTEN von
// jeder anderen Ader entfernt liegt (NEU, v34.17).
//
// Der Grund ist eine Eigenheit der Mine: sie baut immer die NÄCHSTGELEGENE
// Ader in ihrer Reichweite ab (findNearestOreVein). Eine Diamantader direkt
// neben mehreren Goldadern wird dadurch "verdeckt" - jede Mine, die man in ihre
// Nähe stellt, fördert zuerst das nähere Gold, und der Diamant kommt erst dran,
// wenn das Gold erschöpft ist. Im Messlauf über 30 Karten traf das 3 Karten.
// Eine Ader, die für den Spieler praktisch unerreichbar ist, ist aber keine
// Seltenheit, sondern ein Ärgernis - deshalb bekommt der Diamant bewusst den
// abgelegensten freien Platz.
function waehleAderplatz(kandidaten) {
  if (kandidaten.length <= 1) return kandidaten[0] || null;
  let beste = [], besterAbstand = -1;
  for (const k of kandidaten) {
    let nah = Infinity;
    // Umkreis von 8 Kacheln genügt: weiter entfernte Adern liegen ohnehin
    // außerhalb der Minen-Reichweite (5) und können nichts verdecken.
    for (let dy = -8; dy <= 8; dy++) {
      for (let dx = -8; dx <= 8; dx++) {
        if (dx === 0 && dy === 0) continue;
        const x = k.x + dx, y = k.y + dy;
        if (!inBounds(x, y)) continue;
        if (!ORE_KINDS.some(o => (map[y][x][o] || 0) > 0)) continue;

function findNearestWaterTile(cx, cy, radius) {

      if (!inBounds(x, y) || map[y][x].terrain !== 'water') continue;

// metric='circle' (Standard) misst den Radius euklidisch (kreisförmiger Bereich,

  for (let dy = -radius; dy <= radius; dy++) {
    for (let dx = -radius; dx <= radius; dx++) {
      const x = cx + dx, y = cy + dy;
      if (!inBounds(x, y)) continue;
      const t = map[y][x];
      if (t.terrain === 'field' && t.growthKind === growthKind && t.growthStage === maxGrowthStage(growthKind)) {
        const d = Math.sqrt(dx * dx + dy * dy);

// ---- Pfadsuche (BFS über Straßennetz) --------------------------------
function findPath(a, b) {
  const key = (x, y) => x + ',' + y;
  const aRoadNeighbors = neighbors4(a.x, a.y).filter(t => inBounds(t.x, t.y) && map[t.y][t.x].road);
  if (aRoadNeighbors.length === 0) return null;
  const bRoadKeys = new Set(
    neighbors4(b.x, b.y).filter(t => inBounds(t.x, t.y) && map[t.y][t.x].road).map(t => key(t.x, t.y))
  );
  if (bRoadKeys.size === 0) return null;

  const visited = new Set();
  const queue = [];
  const cameFrom = {};
  for (const n of aRoadNeighbors) {
    const k = key(n.x, n.y);
    if (!visited.has(k)) { visited.add(k); queue.push(n); cameFrom[k] = 'START'; }
  }
  let endKey = null;
  let qi = 0;
  while (qi < queue.length) {
    const cur = queue[qi++];
    const ck = key(cur.x, cur.y);
    if (bRoadKeys.has(ck)) { endKey = ck; break; }
    for (const nb of neighbors4(cur.x, cur.y)) {
      if (!inBounds(nb.x, nb.y)) continue;
      const nk = key(nb.x, nb.y);
      if (visited.has(nk)) continue;
      if (!map[nb.y][nb.x].road) continue;
      visited.add(nk);
      cameFrom[nk] = ck;
      queue.push(nb);
    }
  }
  if (endKey === null) return null;
  const pathTiles = [];
  let curKey = endKey;
  while (curKey !== 'START') {
    const [xs, ys] = curKey.split(',').map(Number);
    pathTiles.push({ x: xs, y: ys });
    curKey = cameFrom[curKey];
  }
  pathTiles.reverse();
  return [{ x: a.x, y: a.y }, ...pathTiles, { x: b.x, y: b.y }];
}
// Prüft, ob ein Gebäude mindestens eine direkt angrenzende Straßen-/
// Steinwegkachel hat - exakt dieselbe Voraussetzung, die findPath an BEIDEN
// Enden verlangt (aRoadNeighbors/bRoadKeys oben), hier aber als eigenständige
// Prüfung für ein einzelnes Gebäude (siehe decayDisconnectedBuildings).
function hasRoadAccess(b) {
  return neighbors4(b.x, b.y).some(nb => inBounds(nb.x, nb.y) && map[nb.y][nb.x].road);
}

// ---- Produktion -------------------------------------------------------
// Schickt eine Comicfigur direkt (nicht ans Straßennetz gebunden) von einem
// Gebäude zu einem Zielfeld, um dort zu pflanzen oder zu ernten.
function dispatchFieldWorker(building, target, action, cropKind) {
  building.busy = true;
  const c = {
    kind: 'field',
    action, // 'plant' | 'harvest' | 'chop' | 'mine' | 'quarry' | 'fish' | 'shear'
    cropKind, // 'tree' | 'crop' | 'hops' | ...
    path: [{ x: building.x, y: building.y }, { x: target.x, y: target.y }],
    segIndex: 0,
    segProgress: 0,
    phase: 'out',
    building,
    target
  };
  carriers.push(c);
  return c; // Rückgabe, damit der Aufrufer noch Zusatzdaten anhängen kann (z. B. das zu scherende Schaf)
}

// ---- Schafe (Ambient-Animation rund um die Schaffarm) ----------------------
// Die Schafe sind KEINE Träger/Carrier: sie hängen als eigenes kleines Array
// an ihrer Schaffarm, bewegen sich frei im Weideradius und haben keinerlei
// Einfluss auf Logistik oder Pfadsuche. Nur beim Scheren wird eines davon
// kurzzeitig "festgehalten" (s.held), damit der Schäfer es auch wirklich an
// der Stelle antrifft, zu der er losgelaufen ist.
const SHEEP_PER_FARM = 4;
const SHEEP_SPEED = 0.3; // Kacheln/Sekunde - Schafe trotten deutlich gemächlicher als Träger
function initSheep(b) {
  b.sheep = [];
  for (let i = 0; i < SHEEP_PER_FARM; i++) {
    b.sheep.push({
      x: b.x + (Math.random() - 0.5) * 2,
      y: b.y + (Math.random() - 0.5) * 2,
      tx: null, ty: null,
      wait: Math.random() * 3000,
      flip: Math.random() < 0.5,
      held: false,
      bob: Math.random() * Math.PI * 2 // Phasenversatz fürs Wippen beim Laufen
    });
  }
}
// Zufällige begehbare Weidekachel im Radius der Farm (kein Wasser, kein
// Gebirge, kein bebautes Feld) - so laufen Schafe nicht ins Meer oder durch Häuser.
function randomPastureSpot(b) {
  for (let tries = 0; tries < 24; tries++) {
    const ang = Math.random() * Math.PI * 2;
    const r = 0.6 + Math.random() * b.def.radius;
    const x = Math.round(b.x + Math.cos(ang) * r), y = Math.round(b.y + Math.sin(ang) * r);
    if (!inBounds(x, y)) continue;
    const t = map[y][x];
    if (t.terrain === 'water' || t.terrain === 'mountain' || t.building) continue;
    return { x, y };
  }
  return { x: b.x, y: b.y };
}

// Bevorzugt links davon; liegt dort Wasser/Gebirge, wird auf die rechte Seite
// ausgewichen, damit der Schäfer nie scheinbar im Meer steht.
function shearingSpotBeside(sheep) {
  const options = [
    { x: sheep.x - 0.4, y: sheep.y + 0.4, faceLeft: false }, // links vom Schaf -> nach rechts schauen
    { x: sheep.x + 0.4, y: sheep.y - 0.4, faceLeft: true }   // rechts vom Schaf -> nach links schauen
  ];
  for (const o of options) {
    const tx = Math.round(o.x), ty = Math.round(o.y);
    if (!inBounds(tx, ty)) continue;
    const t = map[ty][tx];
    if (t.terrain === 'water' || t.terrain === 'mountain') continue;
    return o;
  }

function updateSheep(b, dt) {
  if (!b.sheep) return;
  const dtSec = dt / 1000;
  for (const s of b.sheep) {
    if (s.held) continue; // steht still, solange der Schäfer es schert
    if (s.tx === null) {
      // Grasen: eine Weile stehen bleiben, dann ein neues Ziel suchen.
      s.wait -= dt;
      if (s.wait <= 0) { const p = randomPastureSpot(b); s.tx = p.x; s.ty = p.y; }
      continue;
    }
    const dx = s.tx - s.x, dy = s.ty - s.y;
    const dist = Math.hypot(dx, dy);
    if (dist < 0.06) {
      s.x = s.tx; s.y = s.ty; s.tx = null; s.ty = null;
      s.wait = 1500 + Math.random() * 5000;
      continue;
    }
    const step = Math.min(dist, SHEEP_SPEED * dtSec);
    s.x += (dx / dist) * step;
    s.y += (dy / dist) * step;

    // in der iso-Projektion ist die Bildschirm-x-Richtung (dx - dy).

// ---- Rehe (globale Wildpopulation am Waldrand) -----------------------------
// Siehe Kommentar bei `let deer` oben: echter, aber bewusst nicht gespeicherter
// Zustand, analog zu den Schafen, jedoch dorfweit statt an ein Gebäude gebunden.
const DEER_SPEED = 0.45; // Kacheln/Sekunde - etwas flotter als Schafe, aber ebenfalls gemächlich
const DEER_WANDER_RADIUS = 7; // Felder - wie weit ein Reh beim Weiterziehen höchstens vom aktuellen Standort abweicht
function initDeer() {
  deer = [];
  if (forestEdgeSpots.length === 0) return; // Karte praktisch ohne Wald (Extremfall) - dann eben keine Rehe
  const count = Math.max(10, Math.round(CFG.mapSize / 6));
  for (let i = 0; i < count; i++) {
    const spot = forestEdgeSpots[Math.floor(Math.random() * forestEdgeSpots.length)];
    deer.push({
      x: spot.x, y: spot.y, tx: null, ty: null,
      wait: Math.random() * 4000,
      flip: Math.random() < 0.5,
      held: false,
      bob: Math.random() * Math.PI * 2

  }

// verlaufen. Diese Funktion tastet die Strecke in kleinen Schritten ab.

  const dist = Math.hypot(x1 - x0, y1 - y0);

  for (let i = 0; i <= steps; i++) {

function findNearbyForestEdgeSpot(x, y, maxDist) {

}
function updateDeer(dt) {
  const dtSec = dt / 1000;
  for (const d of deer) {
    if (d.held) continue; // steht still, solange ein Jäger es anpirscht/erlegt
    if (d.tx === null) {
      d.wait -= dt;
      if (d.wait <= 0) {
        const spot = findNearbyForestEdgeSpot(d.x, d.y, DEER_WANDER_RADIUS);
        if (spot) { d.tx = spot.x; d.ty = spot.y; }
        else { d.wait = 2000 + Math.random() * 3000; }
      }

    const dx = d.tx - d.x, dy = d.ty - d.y;
    const dist = Math.hypot(dx, dy);
    if (dist < 0.06) {
      d.x = d.tx; d.y = d.ty; d.tx = null; d.ty = null;
      d.wait = 2000 + Math.random() * 5000;
      continue;
    }
    const step = Math.min(dist, DEER_SPEED * dtSec);

    d.y += (dy / dist) * step;
    d.flip = (dx - dy) < 0;
  }
}

// Nächstes Handelsschiff zu einem Piraten
function nearestMerchant(p) {

      p.leaving = PIRATE_LEAVE_TIME;
      const weg = pickSeaTileAtDistance(p.x, p.y, 18, 30);
      if (weg) setShipCourse(p, weg.x, weg.y);
      if (!pirates.some(o => o !== p && !o.leaving)) logEvent('🏴‍☠️ Die Piraten drehen ab und verschwinden am Horizont.', 'danger', null);
    }
    if (p.leaving) {
      p.leaving -= dt;

      if (p.leaving <= 0) pirates.splice(pirates.indexOf(p), 1);
      continue;
    }
    // Wer angegriffen wird, wehrt sich: ein Kriegsschiff, das auf ihn feuert,
    // geht jedem Handelsschiff vor.
    if (p.aggressor && !ships.includes(p.aggressor)) p.aggressor = null;
    if (p.aggressor && Math.hypot(p.aggressor.x - p.x, p.aggressor.y - p.y) > WARSHIP_ENGAGE_RADIUS + 3) p.aggressor = null;
    let ziel = p.aggressor;
    if (!ziel) {
      if (!p.target || !ships.includes(p.target)) p.target = nearestMerchant(p);
      ziel = p.target;
    }
    if (!ziel) {
      // Nichts mehr zu jagen (alle Handelsschiffe gesunken oder keine da)
      p.life = Math.min(p.life, 0);
      continue;
    }
    const d = Math.hypot(ziel.x - p.x, ziel.y - p.y);
    if (d > PIRATE_RANGE) {
      chase(p, ziel, dt);
    } else {
      stopVessel(p);
      p.flip = (ziel.x - p.x) - (ziel.y - p.y) < 0;
      if (p.reload <= 0) {
        p.reload = PIRATE_RELOAD;
        fireCannon(p, ziel, PIRATE_DAMAGE_MIN + Math.random() * (PIRATE_DAMAGE_MAX - PIRATE_DAMAGE_MIN), true);
      }

    if (waffen <= 0) {
      if (s.combatTarget) { s.combatTarget = null; stopVessel(s); }
      continue;

    if (!s.combatTarget) {

    } else {

        fireCannon(s, p, WARSHIP_DAMAGE, false);

        // den Angreifer aufmerksam - und seine Spießgesellen in der Nähe
        // gleich mit: Piraten fallen gemeinsam über ein Kriegsschiff her.
        // Genau das macht zwei Piraten für ein einzelnes Kriegsschiff gefährlich.

    const lebt = c.fromPirate ? ships.includes(tgt) : pirates.includes(tgt);
    if (!lebt) { combatPuffs.push({ x: c.x1, y: c.y1, t: 0, dur: 700, kind: 'splash' }); continue; }

  for (const s of ships) {
    const max = shipMaxHp(s);
    if (s.hp === undefined) s.hp = max;
    if (s.hp >= max) continue;
    if (animClock - (s.lastHit ?? -1e9) < 6000) continue;
    if (!dockNear(s)) continue;
    s.hp = Math.min(max, s.hp + SHIP_REPAIR_RATE * dt / 1000);

  for (let i = shipWrecks.length - 1; i >= 0; i--) {

  for (let i = combatPuffs.length - 1; i >= 0; i--) {
    combatPuffs[i].t += dt;
    if (combatPuffs[i].t >= combatPuffs[i].dur) combatPuffs.splice(i, 1);

// ---- Seewege um Inseln herum (NEU, v26) --------------------------------
// Bis v25 fuhren Schiffe ausschließlich die gerade Linie und lehnten jedes Ziel
// ab, vor dem Land lag. Auf einem Archipel ist das die halbe Karte - und für
// automatische Frachtrouten wäre es untauglich, weil zwei Kontore fast nie in
// Sichtlinie zueinander liegen. Deshalb eine Breitensuche über Wasserkacheln,
// bewusst mit derselben 4er-Nachbarschaft wie findPath und computeIslands.
const SEA_NEIGHBOURS = [[1, 0], [-1, 0], [0, 1], [0, -1]];
// Wie weit die Glättung höchstens vorausschaut. Ohne diese Grenze wäre die
// Glättung quadratisch in der Weglänge (jeder Sichtlinientest kostet selbst
// schon Abtastschritte) und würde bei einer Fahrt über die halbe Karte spürbar
// hängen. 30 Kacheln reichen völlig: mehr Sichtlinie hat man zwischen Inseln
// ohnehin selten.
const SEA_SMOOTH_LOOKAHEAD = 30;
function findSeaRoute(x0, y0, x1, y1) {
  if (!isWater(x0, y0) || !isWater(x1, y1)) return null;
  const n = CFG.mapSize;
  const start = y0 * n + x0, goal = y1 * n + x1;
  if (start === goal) return [{ x: x0, y: y0 }];
  const prev = new Int32Array(n * n).fill(-1);
  prev[start] = start;
  const queue = [start];
  let head = 0, found = false;
  while (head < queue.length) {
    const cur = queue[head++];
    if (cur === goal) { found = true; break; }
    const cx = cur % n, cy = (cur / n) | 0;
    for (const [dx, dy] of SEA_NEIGHBOURS) {
      const nx = cx + dx, ny = cy + dy;
      if (nx < 0 || ny < 0 || nx >= n || ny >= n) continue;
      const idx = ny * n + nx;
      if (prev[idx] !== -1) continue;
      if (map[ny][nx].terrain !== 'water') continue;
      prev[idx] = cur;
      queue.push(idx);
    }
  }
  if (!found) return null;
  const pts = [];
  for (let cur = goal; ; cur = prev[cur]) {
    pts.push({ x: cur % n, y: (cur / n) | 0 });
    if (cur === start) break;
  }

}

// jede Richtung bewegen, wird er hier auf wenige Wegpunkte eingedampft: vom
// aktuellen Punkt aus so weit springen, wie die Sichtlinie über Wasser reicht.
// Ergebnis ist eine natürlich wirkende Diagonalfahrt statt eines Zickzacks.
function smoothSeaRoute(pts) {
  const out = [pts[0]];
  let i = 0;
  while (i < pts.length - 1) {
    let j = Math.min(i + SEA_SMOOTH_LOOKAHEAD, pts.length - 1);
    while (j > i + 1 && !pathAllWater(pts[i].x, pts[i].y, pts[j].x, pts[j].y)) j--;

function setShipCourse(ship, gx, gy) {

    return true;

  const route = findSeaRoute(Math.round(ship.x), Math.round(ship.y), gx, gy);
  if (!route || route.length < 2) return false;
  ship.waypoints = route.slice(1); // der erste Punkt ist die eigene Position

// ---- Kontor: Gründung vom Schiff aus (NEU, v26) -------------------------
// Der Kern der Besiedlung fremder Inseln. Ohne diesen Weg gäbe es ein
// Henne-Ei-Problem: bauen kostet Bretter AUS DEM VORRAT DER ZIELINSEL, eine
// unbesiedelte Insel hat keinen Vorrat, und Waren dorthin bringen ginge nur
// über eine Anlegestelle, die man erst bauen müsste. Die Gründung durchbricht
// das genau einmal - bezahlt wird aus der LADUNG des Schiffs.
const KONTOR_FOUND_RANGE = 5; // Kacheln Luftlinie vom Schiff zum Bauplatz

// unverändert.
function kontorSpotForShip(ship) {
  const sx = Math.round(ship.x), sy = Math.round(ship.y);
  const r = KONTOR_FOUND_RANGE;

  for (let dy = -r; dy <= r; dy++) {

      const d = Math.hypot(dx, dy);
      if (d > r || d >= bestD) continue;
      const x = sx + dx, y = sy + dy;

  return Object.keys(KONTOR_FOUNDING_COST).map(g => `${KONTOR_FOUNDING_COST[g]} ${GOOD_LABELS[g]}`).join(', ');
}
function foundKontorFromShip(ship) {
  const spot = kontorSpotForShip(ship);
  if (!spot) {

    return null;
  }
  if (!shipCanAffordKontor(ship)) {
    setStatus(`Für ein Kontor müssen ${kontorCostLabel()} an Bord sein.`);
    return null;
  }
  for (const g of Object.keys(KONTOR_FOUNDING_COST)) {
    ship.cargo[g] -= KONTOR_FOUNDING_COST[g];
    if (ship.cargo[g] <= 0) delete ship.cargo[g];
  }
  const b = createBuilding(spot.x, spot.y, 'kontor');
  AudioEngine.playBuild();
  setStatus(`Kontor auf ${islandLabel(islandOfBuilding(b))} gegründet! Von hier aus lassen sich Waren umschlagen und Frachtrouten führen.`);
  updateResourceUI();
  return b;

// ---- Handel am Kontor (NEU, v30) --------------------------------------------
// Waren gegen Münzen kaufen und verkaufen. Damit bekommt das Geld aus v29

    // fängt bei der nächsten gültigen Station an.
    for (const s of ships) if (s.routeId === r.id && (s.routeStop || 0) >= r.stops.length) s.routeStop = 0;
  }
  for (const s of ships) {
    if (!s.routeId) continue;
    // Im Gefecht (v34.22) steuert updatePirates das Kriegsschiff - die Route
    // übernimmt erst wieder, wenn der Kampf vorbei ist.
    if (s.combatTarget) { s.routeStatus = 'Im Gefecht mit Piraten'; continue; }
    const r = routeById(s.routeId);
    if (!r) { clearShipRoute(s); continue; }
    if (s.routeWait > 0) { s.routeWait -= dt; continue; }
    const idx = Math.min(s.routeStop || 0, r.stops.length - 1);
    const stop = r.stops[idx];
    const target = kontorAt(stop.x, stop.y);
    if (!target) continue;
    // Bis an den Kai heranfahren, nicht nur in Rufweite (v29.2): für die
    // AUTOMATIK gilt ROUTE_DOCK_RANGE, nicht die großzügige Handsteuer-
    // Reichweite SHIP_DOCK_RANGE (siehe dort).
    //
    // Angekommen ist das Schiff aber ERST, wenn es seinen Kurs auch zu Ende
    // gefahren hat. Nur den Abstand zu prüfen genügte nicht: dann hielt es in
    // genau dem Moment an, in dem es die Grenze unterschritt - also weiterhin
    // ein Stück vor dem Kai statt auf der Anlegekachel. Der Zusatz "kein
    // Restkurs" ist der Unterschied zwischen "in Reichweite" und "da".
    const dist = Math.hypot(target.x - s.x, target.y - s.y);
    const hatKurs = (s.tx !== null && s.tx !== undefined) || (s.waypoints && s.waypoints.length > 0);
    if (dist > ROUTE_DOCK_RANGE || hatKurs) {
      // Nur dann einen neuen Kurs setzen, wenn das Schiff wirklich stillsteht -
      // sonst würde jede Sekunde eine neue Breitensuche laufen, und ein vom
      // Spieler von Hand verschobenes Schiff könnte nie ankommen.
      if (!hatKurs && dist > ROUTE_DOCK_RANGE) {
        const spot = findNearestWaterTile(target.x, target.y, 4);
        if (!spot || !setShipCourse(s, spot.x, spot.y)) {
          s.routeStatus = 'Kein Seeweg zum Kontor';
          s.routeWait = ROUTE_STEP_PAUSE * 4;
        } else {
          s.routeStatus = `Fährt zu Station ${idx + 1} (${islandLabel(islandOfBuilding(target))})`;
        }
      }
      continue;
    }
    // Angekommen. Restlichen Kurs verwerfen, sonst würde das Schiff nach dem
    // Umschlag noch die alten Wegpunkte zu Ende fahren, bevor es weiterzieht.
    s.waypoints = [];
    s.tx = null; s.ty = null;
    // An JEDER Station dieselbe Abfolge (v32): erst ABLADEN, was hier nicht
    // hingehört - also alles außer der Ware, die hier geladen werden soll -,
    // dann AUFNEHMEN, was von hier mitsoll. Erst abladen, dann laden, damit
    // der Laderaum beim Beladen garantiert frei ist.
    //
    // Die Anlegestelle wird ausdrücklich mitgegeben: stünde zufällig ein
    // zweiter Hafen näher, würde sonst auf der falschen Insel umgeschlagen.
    const abgeladen = [];
    for (const good in s.cargo) {
      if (stop.loads[good]) continue; // wird hier selbst geladen - bleibt an Bord
      // Die Waffen eines Kriegsschiffs sind seine Munition (v34.22) - die
      // Route lädt sie nie automatisch ab, sonst führe es wehrlos weiter.
      if (good === 'weapon' && s.shipType === 'warship') continue;
      const menge = s.cargo[good] || 0;
      if (menge <= 0) continue;
      const n = shipUnload(s, good, menge, target);
      if (n > 0) abgeladen.push(`${n} ${GOOD_LABELS[good]}`);
    }
    // Mehrere Waren gleichzeitig an Bord (NEU, v34.5): eine Station lädt jetzt
    // beliebig viele verschiedene Waren, bis der Laderaum voll ist - alle
    // eingestellten Waren teilen sich denselben verbleibenden Platz, in der
    // Reihenfolge, in der sie an dieser Station eingetragen wurden. Reicht der
    // Platz für die letzten nicht mehr, laden sie einfach weniger (oder
    // nichts) - dieselbe "kein Warten, nimm mit was geht"-Regel wie bisher,
    // nur je Ware statt nur einmal je Station.
    const geladenListe = [];
    for (const good of Object.keys(stop.loads)) {
      const wunsch = stop.loads[good];
      if (!wunsch) continue;
      const frei = shipCapacity(s) - cargoTotal(s);
      if (frei <= 0) break;
      const platz = Math.min(wunsch, frei);
      const n = shipLoad(s, good, platz, target);
      if (n > 0) geladenListe.push(`${n} ${GOOD_LABELS[good]}`);
    }
    // WICHTIG (seit v27.1, gilt jetzt an JEDER Station): es wird NICHT
    // gewartet, wenn die Ladung noch nicht bereitliegt. Das Schiff nimmt mit,
    // was gerade da ist, und fährt notfalls leer weiter. Eine Route soll
    // niemals zum Stillstand kommen, nur weil eine Insel zu wenig produziert.
    const teile = [];
    if (abgeladen.length) teile.push(abgeladen.join(', ') + ' abgeliefert');
    if (Object.keys(stop.loads).length) teile.push(geladenListe.length ? geladenListe.join(', ') + ' geladen' : 'nichts zu laden');
    s.routeStatus = `Station ${idx + 1}: ` + (teile.length ? teile.join(', ') : 'nichts umzuschlagen');
    // Weiter zur nächsten Station - und dabei jeden Halt ÜBERSPRINGEN, der am
    // selben Kai liegt wie der gerade erledigte. Solche Doppelhalte entstehen
    // beim Zusammenbauen einer Sternfahrt (A → B → A, dann C dahinter) und
    // beim Wegfallen eines Kontors mitten in der Reihe; sie noch einmal
    // anzulaufen hieße, denselben Umschlag zweimal zu machen.
    let next = (idx + 1) % r.stops.length;
    for (let n = 0; n < r.stops.length - 1; n++) {
      if (r.stops[next].x !== stop.x || r.stops[next].y !== stop.y) break;
      next = (next + 1) % r.stops.length;
    }
    s.routeStop = next;
    s.routeWait = ROUTE_STEP_PAUSE;
  }
}
// Sucht das nächste noch nicht anvisierte Reh im Jagdradius einer Jägerhütte.
function findNearestFreeDeer(cx, cy, radius) {
  let best = null, bestDist = Infinity;
  for (const d of deer) {
    if (d.held) continue;
    const dist = Math.hypot(d.x - cx, d.y - cy);
    if (dist <= radius && dist < bestDist) { bestDist = dist; best = d; }
  }
  return best;
}
// Standplatz für den Jäger direkt NEBEN einem Reh (nicht darauf) - analog zu
// shearingSpotBeside beim Schäfer.
function huntingSpotBeside(d) {
  const options = [
    { x: d.x - 0.4, y: d.y + 0.4, faceLeft: false },
    { x: d.x + 0.4, y: d.y - 0.4, faceLeft: true }
  ];
  for (const o of options) {
    const tx = Math.round(o.x), ty = Math.round(o.y);
    if (!inBounds(tx, ty)) continue;
    const t = map[ty][tx];
    if (t.terrain === 'water' || t.terrain === 'mountain') continue;
    return o;
  }
  return { x: d.x, y: d.y, faceLeft: false };
}
// Kann dieses Gebäude überhaupt angehalten werden (v31.1)? Alles, was Waren
// erzeugt oder verarbeitet - also Erzeuger (Holzfäller, Mine, Farmen, Fischer,
// Jäger, Walfänger ...) UND Verarbeiter (Sägewerk, Mühle, Bäckerei ...).

// Produktion selbst kommt: wer einen neuen Betrieb einträgt, bekommt den
// Schalter automatisch mit.

function updateProduction(b, dt) {

  // und (über destCapacity) auch kein Nachschub mehr. Was im Ausgangslager
  // liegt, wird weiterhin abgeholt - ein gestoppter Betrieb soll Waren
  // freigeben, nicht festhalten.

  // ein Fehler, und die halbe Arbeit ginge verloren.

    b.working = false;

    if (b.busy) return; // der Holzfäller ist gerade unterwegs, um einen Baum zu fällen
    if (b.storage.wood >= b.def.capacity) { b.blocked = null; return; }
    const spot = findNearestForestWithTrees(b.x, b.y, b.def.radius);
    if (!spot) { b.blocked = 'noForest'; return; }
    b.blocked = null;
    b.timer += dt;

      b.timer -= b.def.interval;

      // (Animation siehe handleFieldArrival/finishWork & drawChopAxe).
      dispatchFieldWorker(b, spot, 'chop', 'tree');

    // KEINEN Baum, sondern stellt eine Falle und holt das Fell. Die Bäume bleiben
    // also stehen (siehe finishWork, Fall 'trap') - Pelzwild ist wie Fisch, Wolle
    // und Wildbret eine erneuerbare Ressource, kein abbaubarer Vorrat.
    if (b.busy) return;
    if ((b.storage.fur || 0) >= b.def.capacity) { b.blocked = null; return; }
    const spot = findNearestForestWithTrees(b.x, b.y, b.def.radius);
    if (!spot) { b.blocked = 'noForest'; return; }
    b.blocked = null;
    b.timer += dt;
    if (b.timer >= b.def.interval) {
      b.timer -= b.def.interval;
      dispatchFieldWorker(b, spot, 'trap', 'fur');
    }
  } else if (b.type === 'mine') {
    if (b.busy) return; // der Minenarbeiter ist gerade unterwegs, um Erz abzubauen
    // Eine Mine fördert seit v29 ZWEI Erze: Eisen im Norden und in der Mitte,
    // Gold im Süden (siehe addOreToMountainEdges). Welches, entscheidet die
    // Ader, nicht das Gebäude - deshalb wird erst die nächste Ader gesucht und
    // deren Erzart übernommen, statt zwei Gebäudetypen zu bauen.
    const spot = findNearestOreVein(b.x, b.y, b.def.radius);
    if (!spot) { b.blocked = 'noOre'; return; }
    if ((b.storage[spot.ore] || 0) >= b.def.capacity) { b.blocked = null; return; }
    b.blocked = null;
    b.timer += dt;
    if (b.timer >= b.def.interval) {
      b.timer -= b.def.interval;
      // Der Minenarbeiter läuft sichtbar zum Erzvorkommen und baut es dort mit
      // der Spitzhacke ab (Animation siehe handleFieldArrival/finishWork & drawPickaxe).
      dispatchFieldWorker(b, spot, 'mine', spot.ore);
    }
  } else if (b.type === 'whaler') {
    if (b.busy) return; // das Boot ist gerade draußen auf See
    if ((b.storage.oil || 0) >= b.def.capacity) { b.blocked = null; return; }
    // Seit v29.1 schickt die Hütte ein BOOT hinaus, statt einen Harpunier ans
    // Ufer zu stellen (siehe launchWhaleBoat/updateWhaleBoats). Geprüft wird
    // deshalb schon hier, ob es überhaupt einen Weg aufs offene Meer gibt -
    // sonst stünde die Hütte kommentarlos still.
    const grounds = findWhalingGrounds(b);
    if (!grounds) { b.blocked = 'noWater'; return; }
    b.blocked = null;
    b.timer += dt;
    if (b.timer >= b.def.interval) {
      b.timer -= b.def.interval;
      launchWhaleBoat(b, grounds);
    }
  } else if (b.type === 'quarry') {
    if (b.busy) return; // der Steinbrecher ist gerade unterwegs, um Stein zu brechen
    if ((b.storage.stone || 0) >= b.def.capacity) { b.blocked = null; return; }
    const spot = findNearestQuarriableRock(b.x, b.y, b.def.radius);
    if (!spot) { b.blocked = 'noRock'; return; }
    b.blocked = null;
    b.timer += dt;
    if (b.timer >= b.def.interval) {
      b.timer -= b.def.interval;
      // Der Steinbrecher läuft sichtbar zum Gebirge und bricht dort mit der
      // Spitzhacke Stein (Animation siehe handleFieldArrival/finishWork & drawPickaxe).
      dispatchFieldWorker(b, spot, 'quarry', 'stone');
    }
  } else if (b.type === 'fishery') {
    if (b.busy) return; // der Fischer sitzt gerade am Ufer
    if ((b.storage.fish || 0) >= b.def.capacity) { b.blocked = null; return; }
    const spot = findNearestShoreSpot(b.x, b.y, b.def.radius);
    if (!spot) { b.blocked = 'noWater'; return; }
    b.blocked = null;
    b.timer += dt;
    if (b.timer >= b.def.interval) {
      b.timer -= b.def.interval;
      // Der Fischer läuft ans Ufer (Landkachel mit Wasser-Nachbar) und angelt
      // dort (Animation siehe handleFieldArrival/finishWork & drawFishingRod).
      dispatchFieldWorker(b, spot, 'fish', 'fish');
    }
  } else if (b.type === 'sheepfarm') {
    if (b.busy) return; // der Schäfer ist gerade bei einem Schaf
    if ((b.storage.wool || 0) >= b.def.capacity) { b.blocked = null; return; }
    b.blocked = null;
    b.timer += dt;
    if (b.timer >= b.def.interval) {
      b.timer -= b.def.interval;
      // Ein Schaf aussuchen, an Ort und Stelle festhalten (damit es nicht
      // weiterläuft, während der Schäfer unterwegs ist) und den Schäfer zu
      // dessen aktueller Kachel schicken.
      const sheep = (b.sheep || []).find(s => !s.held);
      if (!sheep) { b.blocked = 'noSheep'; return; }
      sheep.held = true;
      sheep.tx = null; sheep.ty = null;
      // Der Schäfer läuft NICHT exakt auf die Schafposition (sonst verdeckt
      // seine deutlich größere Figur das Schaf komplett), sondern auf eine um
      // eine halbe Kachel versetzte Position DANEBEN. Der Versatz (-0.4/+0.4)
      // ist in der iso-Projektion rein waagerecht (screenX ~ dx-dy,
      // screenY ~ dx+dy), der Schäfer steht also sauber links neben dem Schaf.
      const spot = shearingSpotBeside(sheep);
      const worker = dispatchFieldWorker(b, spot, 'shear', 'wool');
      worker.sheep = sheep;
      worker.workFacing = spot.faceLeft; // zum Schaf hin schauen, nicht von ihm weg
    }
  } else if (b.type === 'hunter') {
    if (b.busy) return; // der Jäger ist gerade bei einem Reh unterwegs
    if ((b.storage.meat || 0) >= b.def.capacity) { b.blocked = null; return; }
    // Das anvisierte Reh wird SOFORT beim Auffinden festgehalten (nicht erst
    // beim Loslaufen wie beim Schäfer) und auf dem Gebäude gemerkt
    // (b.trackedDeer) - sonst könnten zwei überlappende Jägerhütten im selben
    // Zyklus dasselbe freie Reh anvisieren. Das "Einfrieren" lässt sich auch
    // spielerisch lesen: das Reh äst weiter, hat den Jäger aber schon gewittert.
    if (!b.trackedDeer) {
      b.trackedDeer = findNearestFreeDeer(b.x, b.y, b.def.radius);
      if (b.trackedDeer) { b.trackedDeer.held = true; b.trackedDeer.tx = null; b.trackedDeer.ty = null; }
    }
    if (!b.trackedDeer) { b.blocked = 'noDeer'; return; }
    b.blocked = null;
    b.timer += dt;
    if (b.timer >= b.def.interval) {
      b.timer -= b.def.interval;
      const spot = huntingSpotBeside(b.trackedDeer);
      const worker = dispatchFieldWorker(b, spot, 'hunt', 'deer');
      worker.deer = b.trackedDeer;
      worker.workFacing = spot.faceLeft;
      b.trackedDeer = null;
    }
  } else if (b.type === 'forester') {
    if (b.busy) return; // der Förster ist gerade unterwegs, um einen Baum zu pflanzen
    b.timer += dt;
    if (b.timer >= b.def.interval) {
      b.timer -= b.def.interval;
      const spot = findPlantableSpot(b.x, b.y, b.def.radius, 'tree');
      if (spot) {
        b.blocked = null;
        // Der Förster läuft sichtbar quer über die Karte zum Zielfeld (nicht ans
        // Straßennetz gebunden) und pflanzt dort erst nach der Ankunft den Baum.
        dispatchFieldWorker(b, spot, 'plant', 'tree');

      }
    }

    // Generischer Feld-Erzeuger (Bauernhof, Hopfenfarm, ...): sät auf angrenzenden
    // Feldern aus, lässt die Saat reifen und erntet sie - datengetrieben über
    // FIELD_FARMS statt für jeden Feld-Erzeuger eigenen Code zu duplizieren.
    const farmDef = FIELD_FARMS.find(f => f.type === b.type);
    if (b.busy) return; // der Bauer/Hopfenbauer ist gerade auf dem Feld unterwegs
    if ((b.storage[farmDef.good] || 0) >= b.def.capacity) { b.blocked = null; return; }
    b.timer += dt;
    if (b.timer >= b.def.interval) {
      b.timer -= b.def.interval;
      const ripe = findRipeCropSpot(b.x, b.y, b.def.radius, farmDef.growthKind);
      if (ripe) {
        b.blocked = null;
        dispatchFieldWorker(b, ripe, 'harvest', farmDef.growthKind);
      } else {
        // Ausgesät wird bewusst nur in den unmittelbar an den Hof angrenzenden
        // Feldern (plantRadius), nicht im gesamten Arbeitsradius - und zwar in
        // allen 8 Nachbarfeldern inkl. der diagonalen (metric='square').
        const spot = findPlantableSpot(b.x, b.y, b.def.plantRadius, farmDef.growthKind, 'square');
        if (spot) {
          b.blocked = null;
          dispatchFieldWorker(b, spot, 'plant', farmDef.growthKind);
        } else {
          b.blocked = 'noSpace';
        }
      }
    }
  } else if (b.type === 'house') {
    updatePopulation(b, dt);
  } else {
    // Generische Verarbeiter (Sägewerk, Mühle, Bäckerei, Schmelzhütte): Input -> Output
    const proc = PROCESSORS.find(p => p.type === b.type);
    if (proc) {
      // b.working steuert allein die sichtbare Arbeiter-Animation vor dem
      // Gebäude (siehe PROCESSOR_WORK/drawBuilding) - Lager voll oder kein
      // Rohstoff da heißt: der Arbeiter verschwindet, das Gebäude steht
      // erkennbar still.
      if ((b.storage[proc.output] || 0) >= b.def.outputCapacity) { b.blocked = null; b.working = false; return; }
      if ((b.storage[proc.input] || 0) <= 0) { b.blocked = 'noInput'; b.working = false; return; }
      b.blocked = null;
      b.working = true;
      advanceProcessorWork(b, dt);
      b.timer += dt;
      if (b.timer >= b.def.interval) {
        b.timer -= b.def.interval;
        b.storage[proc.input] -= 1;
        // `yield` (v30): wie viele Einheiten je Rohstoff entstehen. Überall 1 -
        // nur die Münzprägerei macht aus EINEM Goldklumpen mehrere Münzen.
        // Ohne das wäre Geld sinnlos knapp: ein Klumpen Gold, der beim Verkauf
        // 6-11 Münzen bringt, dürfte nicht zu genau einer Münze werden.
        b.storage[proc.output] += (proc.yield || 1);

// Einzugsgebiet (def.radius) mindestens einer Kapelle liegt.
function hasChapelCoverage(house) {
  for (const b of buildings) {
    if (b.type !== 'chapel') continue;

    if (d <= b.def.radius) return true;
  }
  return false;

    if (b.type !== 'tavern') continue;

    if (d <= b.def.radius) return true;
  }

    if (d <= b.def.radius) return true;
