// ---- Kartennavigation per Pfeiltasten/WASD (NEU, v34.2) -----------------------
// `pressedMoveKeys` hält nur, WELCHE Richtungen gerade gedrückt sind - die
// eigentliche Bewegung passiert gleichmäßig pro Bild in updateKeyboardPan(dt),
// genau wie jede andere zeitgesteuerte Größe im Spiel (dt-basiert statt
// Tastendruck-gezählt, sonst wäre Tempo an die Bildrate gekoppelt).
const pressedMoveKeys = new Set();
const MOVE_KEY_DIRS = {
  ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right',
  w: 'up', s: 'down', a: 'left', d: 'right',
  W: 'up', S: 'down', A: 'left', D: 'right'
};
function isTypingTarget(el) {
  // Während man in ein Textfeld tippt oder eine Auswahlliste bedient (z. B.
  // Inselname, Frachtroute-Warenwahl), sollen a/w/s/d und die Pfeiltasten
  // ganz normal ihrer eigentlichen Aufgabe dienen statt die Karte zu bewegen.
  if (!el) return false;
  const tag = el.tagName;
  return tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || el.isContentEditable;
}
window.addEventListener('keydown', e => {
  const dir = MOVE_KEY_DIRS[e.key];
  if (!dir || isTypingTarget(document.activeElement)) return;
  pressedMoveKeys.add(dir);
  e.preventDefault(); // Pfeiltasten sollen die Karte bewegen, nicht die Seite scrollen
});
window.addEventListener('keyup', e => {
  const dir = MOVE_KEY_DIRS[e.key];
  if (dir) pressedMoveKeys.delete(dir);
});
// Verliert das Fenster den Fokus (Tab-Wechsel, Alt-Tab), kommt kein keyup
// mehr an - ohne das hier bliebe eine Taste "hängen" und die Karte liefe
// unbemerkt weiter, sobald man zurückkommt.
window.addEventListener('blur', () => pressedMoveKeys.clear());
const KEYBOARD_PAN_SPEED = 700; // Bildschirmpixel je Sekunde, wie zügiges Ziehen mit der Maus - bewusst UNABHÄNGIG vom Zoom, siehe camera.panX/Y als Bildschirm-Offset
function updateKeyboardPan(dt) {
  if (pressedMoveKeys.size === 0) return;
  let dx = 0, dy = 0;
  if (pressedMoveKeys.has('left')) dx += 1;
  if (pressedMoveKeys.has('right')) dx -= 1;
  if (pressedMoveKeys.has('up')) dy += 1;
  if (pressedMoveKeys.has('down')) dy -= 1;
  if (dx === 0 && dy === 0) return; // z.B. links UND rechts gleichzeitig gedrückt - heben sich auf
  const len = Math.hypot(dx, dy); // Diagonale (z.B. W+D) nicht schneller als eine einzelne Richtung
  const dist = KEYBOARD_PAN_SPEED * (dt / 1000);
  camera.panX += (dx / len) * dist;
  camera.panY += (dy / len) * dist;
}
// Rechtsklick auf eine Wasserkachel bewegt das gerade ausgewählte Schiff
// dorthin (siehe moveSelectedShipTo) - das Browser-eigene Kontextmenü würde
// sonst jeden Rechtsklick auf dem Canvas abfangen.
canvas.addEventListener('contextmenu', e => {
  e.preventDefault();
  if (!selectedShip) return;
  const pos = getEventPos(e);
  const g = screenToGrid(pos.x, pos.y);
  moveSelectedShipTo(g.x, g.y);
});
document.getElementById('buildingInfo').addEventListener('click', e => {
  if (e.target.id === 'buildingInfoClose') {
    selectedBuilding = null;
    if (selectedShip) { selectedShip.selected = false; selectedShip = null; }
    renderBuildingInfo();

canvas.addEventListener('wheel', onWheel, { passive: false });
document.querySelectorAll('.tool-btn[data-tool]').forEach(btn => {

});

// ---- Baumenü: Scroll-Schatten als Hinweis, dass die Liste weitergeht ------
// Ohne dieses Signal war (v.a. auf dem Handy, wo das Menü meist nicht alles
// auf einmal zeigen kann) nicht erkennbar, dass unten/oben noch mehr folgt -
// genau das führte zur Beschwerde, Einträge seien "nicht sichtbar". Die
// Schatten blenden nur ein, wenn in diese Richtung tatsächlich noch etwas zu
// scrollen ist, und aktualisieren sich bei jedem Scroll sowie beim Auf-/
// Zuklappen einer Baugruppe (ändert die Gesamthöhe des Inhalts).
const buildmenuScroll = document.getElementById('buildmenuScroll');
const buildmenuFadeTop = document.getElementById('buildmenuFadeTop');
const buildmenuFadeBottom = document.getElementById('buildmenuFadeBottom');
function updateBuildmenuScrollFade() {
  const el = buildmenuScroll;
  const canScrollUp = el.scrollTop > 2;
  const canScrollDown = el.scrollTop < el.scrollHeight - el.clientHeight - 2;
  buildmenuFadeTop.classList.toggle('visible', canScrollUp);
  buildmenuFadeBottom.classList.toggle('visible', canScrollDown);
}
buildmenuScroll.addEventListener('scroll', updateBuildmenuScrollFade);
window.addEventListener('resize', updateBuildmenuScrollFade);
document.querySelectorAll('.build-group').forEach(group => {
  group.addEventListener('toggle', () => {
    // Inhalt hat gerade seine Höhe geändert - erst nach dem Reflow neu prüfen.
    requestAnimationFrame(updateBuildmenuScrollFade);
  });
});

// ---- Hintergrundmusik (prozedural, Web Audio API) --------------------------
// Entspannte NATURMUSIK statt der früheren "Anno-Fanfaren"-Anmutung: eine
// ruhige, sich kaum merklich weiterbewegende Klanglandschaft aus vier Schichten,
// die alle dauerhaft übereinander liegen, statt aus einem Stück mit Anfang und
// Ende. Alles wird direkt im Browser synthetisiert (keine Audiodatei).
//
//  1. DRONE  - ein durchgehender, tiefer Quintbordun (G/D), wie er in fast jeder
//     Volks-/Naturmusik den Boden bildet. Ändert sich nie, wodurch die Musik
//     nie "wieder von vorn anfängt".
//  2. WIND   - sehr leise gefiltertes Rauschen mit langsamer Schwellbewegung:
//     der eigentliche "draußen"-Eindruck. Ohne diese Schicht klingt jedes reine
//     Synth-Pad nach Innenraum.
//  3. PAD    - warme, weit offene Akkorde (viele Quinten/Oktaven, wenige Terzen)
//     mit sehr langem Attack, die ineinander überblenden.
//  4. MELODIE- spärliche, gezupfte Töne aus der Pentatonik des aktuellen
//     Akkords, dazu tagsüber gelegentlich eine kleine, aufsteigende Flötenfigur.
//
// NACHTS wird bewusst nur zurückgenommen statt umgeschaltet: leiser, dunkler
// gefiltert, deutlich weniger Melodietöne und gar keine Flötenfiguren mehr -
// Drone und Wind bleiben, sodass es nie ganz still wird. Gesteuert über
// setNightFactor(0..1), das jeden Frame aus der Tageszeit gefüttert wird
// (siehe nightFactor()/update()).
const AudioEngine = (function () {
  let ctx = null;
  let master = null;
  // Musik (Pad/Zupfmelodie) und Soundeffekte sind über zwei unabhängige
  // Schalter steuerbar (siehe Audio-Menü), zusätzlich hat die Musik eine
  // eigene Lautstärke (Anteil 0..1 der ursprünglich fest verdrahteten
  // PAD_VOLUME). Die Soundeffekte laufen weiterhin über den separaten
  // `sfxOut`-Knoten und ignorieren die Musik-Lautstärke bewusst - sie sind
  // reine An/Aus-Effekte, keine gemischte Lautstärke.
  let musicEnabled = true;
  let sfxEnabled = true;
  let musicVolumeFrac = 1;
  let started = false;
  let schedulerTimer = null;
  let chordIndex = 0;
  let nextChordTime = 0;
  let nextPluckTime = 0;
  let nextFluteTime = 0;
  // Tageszeit-Stimmung: 0 = heller Tag, 1 = tiefe Nacht (siehe setNightFactor).
  // `appliedNight` merkt sich den zuletzt an die Audio-Parameter übergebenen
  // Wert - ohne diese Schwelle würde jeder einzelne Frame eine neue
  // Gain-Rampe planen (60 pro Sekunde), was hörbar zappelt und unnötig kostet.
  let nightFactorVal = 0;
  let appliedNight = -1;
  const CHORD_DURATION = 11.0; // Sekunden pro Akkord - noch langsamer als zuvor (8,5s), damit nichts drängt
  const PAD_ATTACK = 4.6, PAD_RELEASE = 5.0, PAD_VOLUME = 0.2;
  // Offene, pastorale Akkorde in G-Dur: bewusst viele Quinten und Oktaven und
  // nur je EINE Terz - dichte Terz-/Septakkorde (die frühere maj7-Folge) klingen
  // "komponiert", offene Lagen klingen nach Landschaft. Die Folge ist eine
  // reine Kreisbewegung ohne Spannungsaufbau, damit sie endlos laufen kann.
  const CHORDS = [
    [55, 59, 62, 67], // G B D G  - Grundakkord, warm
    [52, 59, 64, 67], // E B E G  - Em in offener Lage
    [48, 55, 60, 64], // C G C E  - Subdominante, weit
    [50, 57, 62, 66]  // D A D F# - ruht offen auf der Dominante
  ];
  // Bordun-Töne (tiefe Quinte), die DURCHGEHEND klingen - unabhängig von der
  // Akkordfolge. G1/D2 passen zu allen vier Akkorden oben (Grundton, Quinte,
  // Quinte, Quarte) und ergeben genau den leicht dudelsackartigen Volksmusik-
  // Boden, der eine Naturkulisse zusammenhält.
  const DRONE_NOTES = [31, 38];

  function midiToFreq(m) { return 440 * Math.pow(2, (m - 69) / 12); }

  function ensureContext() {
    if (ctx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    ctx = new AC();
    master = ctx.createGain();
    master.gain.value = 0;
    master.connect(ctx.destination);
  }

  // Sanfte, sich überlappende Akkordfläche: pro Ton zwei leicht verstimmte
  // Dreieck-Oszillatoren durch ein Tiefpassfilter, mit langem Attack/Release
  // für einen streicherartigen, nie abrupten Klangeindruck.
  function playPadChord(midiNotes, t) {
    const chordGain = ctx.createGain();
    chordGain.gain.setValueAtTime(0, t);
    chordGain.gain.linearRampToValueAtTime(1, t + PAD_ATTACK);
    chordGain.gain.setValueAtTime(1, t + CHORD_DURATION - PAD_RELEASE);
    chordGain.gain.linearRampToValueAtTime(0, t + CHORD_DURATION + 0.8);
    const filter = ctx.createBiquadFilter();
    filter.type = 'lowpass';
    // Nachts dunkler gefiltert: dieselben Töne, aber ohne die oberen
    // Obertöne - klingt weicher und weiter weg, ohne die Musik zu wechseln.
    filter.frequency.value = 1100 - 480 * nightFactorVal;
    filter.Q.value = 0.25;
    filter.connect(chordGain);
    chordGain.connect(master);
    for (const midi of midiNotes) {
      // Drei leicht gegeneinander verstimmte Stimmen pro Ton (statt zwei):
      // die minimalen Schwebungen nehmen dem Pad das rein Elektronische und
      // lassen es "atmen" wie ein leiser Chor im Freien.
      for (const detune of [-7, 0, 7]) {
        const osc = ctx.createOscillator();
        osc.type = 'triangle';
        osc.frequency.value = midiToFreq(midi);
        osc.detune.value = detune;
        osc.connect(filter);
        osc.start(t);
        osc.stop(t + CHORD_DURATION + 0.9);
      }
    }
  }

  // Durchgehender Quintbordun. Wird EINMAL gestartet und läuft dann für immer;
  // die Lautstärke folgt nur noch der Tageszeit. Bewusst kein Neuanlegen pro
  // Akkord (wie beim Pad), weil genau das Nicht-Enden den ruhigen Grundcharakter
  // ausmacht.
  let droneGain = null;
  function ensureDrone(t) {
    if (droneGain) return;
    droneGain = ctx.createGain();
    droneGain.gain.setValueAtTime(0, t);
    droneGain.gain.linearRampToValueAtTime(0.5, t + 6);
    const filter = ctx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.value = 420;
    filter.Q.value = 0.4;
    filter.connect(droneGain);
    droneGain.connect(master);
    for (const midi of DRONE_NOTES) {
      for (const detune of [-4, 4]) {
        const osc = ctx.createOscillator();
        osc.type = 'triangle';
        osc.frequency.value = midiToFreq(midi);
        osc.detune.value = detune;
        osc.connect(filter);
        osc.start(t);
      }
    }
  }

  // Windschicht: sehr leises, tief gefiltertes Rauschen, dessen Helligkeit und
  // Lautstärke von zwei langsamen, ungleich schnellen LFOs bewegt werden. Die
  // ungleichen Geschwindigkeiten (0,043 und 0,067 Hz) sorgen dafür, dass sich
  // das Muster praktisch nie hörbar wiederholt.
  let windGain = null;
  function ensureWind(t) {
    if (windGain) return;
    const src = ctx.createBufferSource();
    src.buffer = getLoopNoiseBuffer();
    src.loop = true;
    const lp = ctx.createBiquadFilter();
    lp.type = 'lowpass';
    lp.frequency.value = 430;
    lp.Q.value = 0.6;
    const swell = ctx.createGain();
    swell.gain.value = 0.55;
    windGain = ctx.createGain();
    windGain.gain.setValueAtTime(0, t);
    windGain.gain.linearRampToValueAtTime(0.09, t + 8);
    src.connect(lp); lp.connect(swell); swell.connect(windGain); windGain.connect(master);
    const lfoA = ctx.createOscillator(); lfoA.frequency.value = 0.043;
    const lfoAGain = ctx.createGain(); lfoAGain.gain.value = 0.4;
    lfoA.connect(lfoAGain); lfoAGain.connect(swell.gain); lfoA.start(t);
    const lfoB = ctx.createOscillator(); lfoB.frequency.value = 0.067;
    const lfoBGain = ctx.createGain(); lfoBGain.gain.value = 190;
    lfoB.connect(lfoBGain); lfoBGain.connect(lp.frequency); lfoB.start(t);
    src.start(t);
  }

  // Kleine, aufsteigende Flötenfigur (3-4 Töne) - nur tagsüber. Sinus mit
  // leichtem Vibrato statt eines Sägezahns: das ist der Unterschied zwischen
  // "Holzflöte im Wald" und "Synthesizer".
  function playFlutePhrase(chord, t) {
    const pool = [chord[0] + 12, chord[1] + 12, chord[2] + 12, chord[3] + 12, chord[0] + 24];
    const start = Math.floor(Math.random() * 2);
    const count = 3 + (Math.random() < 0.4 ? 1 : 0);
    for (let i = 0; i < count; i++) {
      const midi = pool[Math.min(pool.length - 1, start + i)];
      const noteT = t + i * (0.45 + Math.random() * 0.12);
      const gain = ctx.createGain();
      gain.gain.setValueAtTime(0.0001, noteT);
      gain.gain.exponentialRampToValueAtTime(0.055, noteT + 0.12);
      gain.gain.exponentialRampToValueAtTime(0.0001, noteT + 0.85);
      gain.connect(master);
      const osc = ctx.createOscillator();
      osc.type = 'sine';
      osc.frequency.value = midiToFreq(midi);
      osc.connect(gain);
      const vib = ctx.createOscillator();
      vib.frequency.value = 5.2;
      const vibGain = ctx.createGain();
      vibGain.gain.value = 4.5; // Cent
      vib.connect(vibGain); vibGain.connect(osc.detune);
      vib.start(noteT); vib.stop(noteT + 0.9);
      osc.start(noteT); osc.stop(noteT + 0.9);
    }
  }

  // Kurzer, gezupfter Ton (Harfen-/Lauten-Charakter): schneller Attack, lang
  // ausklingender Tiefpass-Sweep als Decay statt einer reinen Lautstärkehülle.
  function playPluck(midi, t, velocity) {
    const gain = ctx.createGain();
    gain.gain.setValueAtTime(0.0001, t);
    gain.gain.exponentialRampToValueAtTime(velocity, t + 0.008);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + 2.1);
    const filter = ctx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.setValueAtTime(3400 - 1600 * nightFactorVal, t);
    filter.frequency.exponentialRampToValueAtTime(650, t + 1.3);
    filter.connect(gain);
    gain.connect(master);
    const osc = ctx.createOscillator();
    osc.type = 'triangle';
    osc.frequency.value = midiToFreq(midi);
    osc.connect(filter);
    osc.start(t);
    osc.stop(t + 2.2);
  }

  // ---- Soundeffekte (Hacken/Abbauen, Bauen, Trägerschritte) ----------------
  // Wie die Musik rein prozedural synthetisiert (kein Audio-Asset) und über
  // denselben 🎵/🔇-Schalter wie die Musik an-/abschaltbar. Eigener Ausgabe-
  // Knoten `sfxOut` (statt über `master`), weil die Effekte kurze, einmalige
  // Ereignisse sind und nicht die langsame Ein-/Ausblend-Hüllkurve des
  // Musik-Pads mitmachen sollen - sie werden stattdessen einfach gar nicht
  // erst ausgelöst, wenn `enabled` gerade false ist.
  let noiseBuffer = null;
  function getNoiseBuffer() {
    if (noiseBuffer) return noiseBuffer;
    const len = Math.floor(ctx.sampleRate * 0.3);
    noiseBuffer = ctx.createBuffer(1, len, ctx.sampleRate);
    const data = noiseBuffer.getChannelData(0);
    for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
    return noiseBuffer;
  }
  // Eigener, DEUTLICH längerer Rauschpuffer für die dauerhaft laufenden
  // Kulissen (Wind, Brandung). Der 0,3-Sekunden-Puffer oben reicht für kurze
  // Einzeleffekte, im Dauerloop würde er sich aber rund dreimal pro Sekunde
  // wiederholen - und eine so kurze Periode hört man als tonales Brummen
  // heraus, nicht mehr als Rauschen. 4 Sekunden liegen unter jeder
  // Wiedererkennungsschwelle.
  let loopNoiseBuffer = null;
  function getLoopNoiseBuffer() {
    if (loopNoiseBuffer) return loopNoiseBuffer;
    const len = Math.floor(ctx.sampleRate * 4);
    loopNoiseBuffer = ctx.createBuffer(1, len, ctx.sampleRate);
    const data = loopNoiseBuffer.getChannelData(0);
    for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
    return loopNoiseBuffer;
  }
  let sfxOut = null;
  function ensureSfxOut() {
    if (!sfxOut) { sfxOut = ctx.createGain(); sfxOut.gain.value = 0.9; sfxOut.connect(ctx.destination); }
    return sfxOut;
  }
  // Perkussiver Treffer (gefiltertes Rauschen durch ein Bandpassfilter, plus
  // ein kurzer, tiefer Sinus-"Thud" darunter) - gemeinsamer Grundbaustein für
  // Axt- und Spitzhacken-Treffer, nur mit unterschiedlichen Parametern.
  function playHit(t, { freq = 2200, decay = 0.09, volume = 0.5, thud = 90 } = {}) {
    const out = ensureSfxOut();
    const noise = ctx.createBufferSource();
    noise.buffer = getNoiseBuffer();
    const bp = ctx.createBiquadFilter();
    bp.type = 'bandpass'; bp.frequency.value = freq; bp.Q.value = 1.1;
    const ng = ctx.createGain();
    ng.gain.setValueAtTime(volume, t);
    ng.gain.exponentialRampToValueAtTime(0.001, t + decay);
    noise.connect(bp); bp.connect(ng); ng.connect(out);
    noise.start(t); noise.stop(t + decay + 0.02);

    const osc = ctx.createOscillator();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(thud, t);
    osc.frequency.exponentialRampToValueAtTime(Math.max(30, thud * 0.6), t + decay);
    const og = ctx.createGain();
    og.gain.setValueAtTime(volume * 0.7, t);
    og.gain.exponentialRampToValueAtTime(0.001, t + decay * 1.3);
    osc.connect(og); og.connect(out);
    osc.start(t); osc.stop(t + decay * 1.4 + 0.02);
  }
  // Holzfäller-Axtschlag: warmer, tieferer "Thwack".
  function playChop() {
    if (!ctx || !sfxEnabled) return;
    playHit(ctx.currentTime, { freq: 1500 + Math.random() * 300, decay: 0.1, volume: 0.4, thud: 110 });
  }
  // Spitzhacken-Treffer (Mine & Steinbruch): höher, metallischer als der
  // Axtschlag, zusätzlich mit einem kurzen, hellen Nachklingen für den
  // metallischen Charakter.
  function playPickaxeHit() {
    if (!ctx || !sfxEnabled) return;
    const t = ctx.currentTime;
    playHit(t, { freq: 3200 + Math.random() * 400, decay: 0.06, volume: 0.32, thud: 260 });
    const out = ensureSfxOut();
    const osc = ctx.createOscillator();
    osc.type = 'square';
    osc.frequency.setValueAtTime(1800, t);
    osc.frequency.exponentialRampToValueAtTime(900, t + 0.12);
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.05, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.15);
    osc.connect(g); g.connect(out);
    osc.start(t); osc.stop(t + 0.16);
  }
  // Baugeräusch: tiefer Holz-"Knock" plus ein kurzer, heller "Ding"-Nachklang
  // kurz danach - soll sich nach einer zufriedenstellenden Fertigstellung anhören.
  function playBuild() {
    if (!ctx || !sfxEnabled) return;
    const t = ctx.currentTime;
    const out = ensureSfxOut();
    playHit(t, { freq: 900, decay: 0.14, volume: 0.4, thud: 140 });
    const ding = ctx.createOscillator();
    ding.type = 'triangle';
    ding.frequency.value = 880;
    const dg = ctx.createGain();
    dg.gain.setValueAtTime(0.0001, t + 0.05);
    dg.gain.exponentialRampToValueAtTime(0.16, t + 0.08);
    dg.gain.exponentialRampToValueAtTime(0.0001, t + 0.4);
    ding.connect(dg); dg.connect(out);
    ding.start(t + 0.05); ding.stop(t + 0.42);
  }
  // Angel-Platsch: kurzer, nach unten gefilterter Rauschimpuls ("blubb") mit
  // einem abfallenden Sinus darunter - klingt nach einem Köder, der ins Wasser
  // eintaucht, statt nach einem harten Treffer wie Axt/Spitzhacke.
  function playSplash() {
    if (!ctx || !sfxEnabled) return;
    const t = ctx.currentTime;
    const out = ensureSfxOut();
    const noise = ctx.createBufferSource();
    noise.buffer = getNoiseBuffer();
    const lp = ctx.createBiquadFilter();
    lp.type = 'lowpass';
    lp.frequency.setValueAtTime(2600, t);
    lp.frequency.exponentialRampToValueAtTime(420, t + 0.22);
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.16, t);
    g.gain.exponentialRampToValueAtTime(0.0008, t + 0.26);
    noise.connect(lp); lp.connect(g); g.connect(out);
    noise.start(t); noise.stop(t + 0.28);
    const osc = ctx.createOscillator();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(420, t);
    osc.frequency.exponentialRampToValueAtTime(130, t + 0.18);
    const og = ctx.createGain();
    og.gain.setValueAtTime(0.13, t);
    og.gain.exponentialRampToValueAtTime(0.0008, t + 0.2);
    osc.connect(og); og.connect(out);
    osc.start(t); osc.stop(t + 0.22);
  }
  // Scherenschnitt: zwei sehr kurze, hohe, gebandpasste Rauschzischer dicht
  // hintereinander (die beiden Klingen) - ein knappes "schnipp".
  function playSnip() {
    if (!ctx || !sfxEnabled) return;
    const t = ctx.currentTime;
    const out = ensureSfxOut();
    for (const [offset, vol] of [[0, 0.12], [0.045, 0.08]]) {
      const noise = ctx.createBufferSource();
      noise.buffer = getNoiseBuffer();
      const bp = ctx.createBiquadFilter();
      bp.type = 'bandpass';
      bp.frequency.value = 4200 + Math.random() * 900;
      bp.Q.value = 3.2;
      const g = ctx.createGain();
      g.gain.setValueAtTime(vol, t + offset);
      g.gain.exponentialRampToValueAtTime(0.0006, t + offset + 0.045);
      noise.connect(bp); bp.connect(g); g.connect(out);
      noise.start(t + offset); noise.stop(t + offset + 0.06);
    }
  }
  // Tellereisen (v27): ein harter, metallischer Doppelschlag - die beiden Bügel
  // schlagen fast gleichzeitig zusammen. Bewusst deutlich tiefer und kürzer als
  // das Scheren-Schnipp und mit einem mitklingenden Metallton, sonst wären die
  // beiden Rauschgeräusche im Spiel kaum auseinanderzuhalten.
  function playTrapSnap() {
    if (!ctx || !sfxEnabled) return;
    const t = ctx.currentTime;
    const out = ensureSfxOut();
    for (const [offset, vol] of [[0, 0.16], [0.03, 0.09]]) {
      const noise = ctx.createBufferSource();
      noise.buffer = getNoiseBuffer();
      const bp = ctx.createBiquadFilter();
      bp.type = 'bandpass';
      bp.frequency.value = 1500 + Math.random() * 500;
      bp.Q.value = 1.8;
      const g = ctx.createGain();
      g.gain.setValueAtTime(vol, t + offset);
      g.gain.exponentialRampToValueAtTime(0.0006, t + offset + 0.07);
      noise.connect(bp); bp.connect(g); g.connect(out);
      noise.start(t + offset); noise.stop(t + offset + 0.09);
    }
    // kurz nachklingendes Metall
    const osc = ctx.createOscillator();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(880, t);
    osc.frequency.exponentialRampToValueAtTime(430, t + 0.16);
    const og = ctx.createGain();
    og.gain.setValueAtTime(0.05, t);
    og.gain.exponentialRampToValueAtTime(0.0005, t + 0.2);
    osc.connect(og); og.connect(out);
    osc.start(t); osc.stop(t + 0.22);
  }
  // Schabeisen der Kürschnerei (v27): ein weiches, tieffrequentes Ziehen über
  // Leder. Bewusst OHNE metallische Komponente und mit langer, sanfter Hüllkurve -
  // es soll sich klar vom trockenen Sägestrich des Sägewerks unterscheiden.
  function playScrape() {
    if (!ctx || !sfxEnabled) return;
    const t = ctx.currentTime;
    const out = ensureSfxOut();
    const noise = ctx.createBufferSource();
    noise.buffer = getNoiseBuffer();
    const lp = ctx.createBiquadFilter();
    lp.type = 'lowpass';
    lp.frequency.setValueAtTime(900, t);
    lp.frequency.linearRampToValueAtTime(1700, t + 0.18);
    lp.frequency.linearRampToValueAtTime(700, t + 0.36);
    lp.Q.value = 0.8;
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0008, t);
    g.gain.linearRampToValueAtTime(0.075, t + 0.09);
    g.gain.linearRampToValueAtTime(0.0008, t + 0.36);
    noise.connect(lp); lp.connect(g); g.connect(out);
    noise.start(t); noise.stop(t + 0.4);
  }
  // Harpunenstoß (v29): ein tiefer, schwerer Wasserschlag - deutlich massiger
  // als das kurze, helle "Platsch" der Angel (playSplash), sonst wären
  // Fischerhütte und Walfängerhütte am Ton nicht zu unterscheiden. Aufbau:
  // erst ein trockener Holz-/Metall-Impuls (der Stoß), dann eine tief
  // absackende, gefilterte Rauschwolke (die aufplatzende Wasserfläche).
  function playHarpoon() {
    if (!ctx || !sfxEnabled) return;
    const t = ctx.currentTime;
    const out = ensureSfxOut();
    const thud = ctx.createOscillator();
    thud.type = 'triangle';
    thud.frequency.setValueAtTime(220, t);
    thud.frequency.exponentialRampToValueAtTime(70, t + 0.12);
    const tg = ctx.createGain();
    tg.gain.setValueAtTime(0.12, t);
    tg.gain.exponentialRampToValueAtTime(0.0006, t + 0.16);
    thud.connect(tg); tg.connect(out);
    thud.start(t); thud.stop(t + 0.18);
    const noise = ctx.createBufferSource();
    noise.buffer = getNoiseBuffer();
    const lp = ctx.createBiquadFilter();
    lp.type = 'lowpass';
    lp.frequency.setValueAtTime(2400, t + 0.04);
    lp.frequency.exponentialRampToValueAtTime(320, t + 0.5);
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0008, t + 0.04);
    g.gain.linearRampToValueAtTime(0.14, t + 0.09);
    g.gain.exponentialRampToValueAtTime(0.0006, t + 0.55);
    noise.connect(lp); lp.connect(g); g.connect(out);
    noise.start(t + 0.04); noise.stop(t + 0.6);
  }
  // Goldschmiede (v29): ein sehr helles, feines Ziselier-Klingeln - dasselbe
  // Grundprinzip wie der Amboss der Schmiede, aber eine Oktave höher, viel
  // leiser und ohne dessen wuchtigen Nachhall. Die Schmiede schlägt Werkzeug,
  // der Goldschmied tickt an einem Ohrring.
  function playChisel() {
    if (!ctx || !sfxEnabled) return;
    const t = ctx.currentTime;
    const out = ensureSfxOut();
    const osc = ctx.createOscillator();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(2400, t);
    osc.frequency.exponentialRampToValueAtTime(1500, t + 0.09);
    const og = ctx.createGain();
    og.gain.setValueAtTime(0.055, t);
    og.gain.exponentialRampToValueAtTime(0.0005, t + 0.22);
    osc.connect(og); og.connect(out);
    osc.start(t); osc.stop(t + 0.24);
  }
  // Münzprägung (v29): ein dumpfer Pressenschlag mit hell nachklirrender
  // Münze - der Schlag kommt vom Prägestempel, das Klirren vom Stück, das in
  // die Schale fällt. Zwei getrennte Klangschichten, weil genau dieses
  // Nacheinander die Prägung von einem reinen Hammerschlag unterscheidet.
  function playMintStrike() {
    if (!ctx || !sfxEnabled) return;
    const t = ctx.currentTime;
    const out = ensureSfxOut();
    const press = ctx.createOscillator();
    press.type = 'sine';
    press.frequency.setValueAtTime(180, t);
    press.frequency.exponentialRampToValueAtTime(60, t + 0.1);
    const pg = ctx.createGain();
    pg.gain.setValueAtTime(0.13, t);
    pg.gain.exponentialRampToValueAtTime(0.0006, t + 0.14);
    press.connect(pg); pg.connect(out);
    press.start(t); press.stop(t + 0.16);
    for (const [offset, freq, vol] of [[0.11, 3100, 0.045], [0.17, 2600, 0.03]]) {
      const ring = ctx.createOscillator();
      ring.type = 'triangle';
      ring.frequency.setValueAtTime(freq, t + offset);
      const rg = ctx.createGain();
      rg.gain.setValueAtTime(vol, t + offset);
      rg.gain.exponentialRampToValueAtTime(0.0005, t + offset + 0.3);
      ring.connect(rg); rg.connect(out);
      ring.start(t + offset); ring.stop(t + offset + 0.32);
    }
  }
  // Münzklimpern beim Handel (v30): drei kurze, helle Metalltöne dicht
  // hintereinander mit leicht zufälliger Tonhöhe - Geld, das über den Tisch
  // geht. Bewusst OHNE den dumpfen Pressenschlag von playMintStrike: das
  // Prägen ist Arbeit, der Handel ein Klimpern.
  function playCoins() {
    if (!ctx || !sfxEnabled) return;
    const t = ctx.currentTime;
    const out = ensureSfxOut();
    for (let i = 0; i < 3; i++) {
      const offset = i * 0.055 + Math.random() * 0.02;
      const osc = ctx.createOscillator();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(2300 + Math.random() * 900, t + offset);
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.045 - i * 0.008, t + offset);
      g.gain.exponentialRampToValueAtTime(0.0005, t + offset + 0.22);
      osc.connect(g); g.connect(out);
      osc.start(t + offset); osc.stop(t + offset + 0.24);
    }
  }
  // Bogenschuss: kurzer, hoher, gebandpasster Rauschzischer (die schwirrende
  // Sehne) plus ein tief abfallender Ton (die Sehne, die zurückschwingt) -
  // klingt nach einem "Twang" statt nach einem harten Treffer wie Axt/Spitzhacke.
  function playBowShot() {
    if (!ctx || !sfxEnabled) return;
    const t = ctx.currentTime;
    const out = ensureSfxOut();
    const noise = ctx.createBufferSource();
    noise.buffer = getNoiseBuffer();
    const bp = ctx.createBiquadFilter();
    bp.type = 'bandpass';
    bp.frequency.value = 1800;
    bp.Q.value = 2.2;
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.14, t);
    g.gain.exponentialRampToValueAtTime(0.0006, t + 0.09);
    noise.connect(bp); bp.connect(g); g.connect(out);
    noise.start(t); noise.stop(t + 0.1);
    const osc = ctx.createOscillator();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(240, t);
    osc.frequency.exponentialRampToValueAtTime(90, t + 0.15);
    const og = ctx.createGain();
    og.gain.setValueAtTime(0.1, t);
    og.gain.exponentialRampToValueAtTime(0.0006, t + 0.18);
    osc.connect(og); og.connect(out);
    osc.start(t); osc.stop(t + 0.2);
  }
  // Trägerschritte: sehr leiser, kurzer, gefilterter Rauschimpuls pro
  // überquerter Kachel. Global gedrosselt (Mindestabstand zwischen zwei
  // Schritten + zusätzliche Zufallschance zum Auslassen), damit viele
  // gleichzeitig laufende Träger nicht zu einem durchgehenden Rauschteppich
  // verschmelzen, sondern eine dezente, unregelmäßige Geh-Textur ergeben.
  let lastFootstepAt = -Infinity;
  function playFootstep() {
    if (!ctx || !sfxEnabled) return;
    const t = ctx.currentTime;
    if (t - lastFootstepAt < 0.11 || Math.random() < 0.45) return;
    lastFootstepAt = t;
    const out = ensureSfxOut();
    const noise = ctx.createBufferSource();
    noise.buffer = getNoiseBuffer();
    const bp = ctx.createBiquadFilter();
    bp.type = 'bandpass';
    bp.frequency.value = 300 + Math.random() * 180;
    bp.Q.value = 0.8;
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.05 + Math.random() * 0.02, t);
    g.gain.exponentialRampToValueAtTime(0.0008, t + 0.07);
    noise.connect(bp); bp.connect(g); g.connect(out);
    noise.start(t); noise.stop(t + 0.09);
  }

  // ---- Umgebungs- und Arbeitsgeräusche -------------------------------------
  // WICHTIG zur Einordnung: OB eines dieser Geräusche überhaupt ausgelöst wird,
  // entscheidet allein die Spiellogik anhand der Sichtbarkeit der Quelle (siehe
  // updateAmbientSounds/advanceProcessorWork). Die Engine hier kennt die Karte
  // nicht und synthetisiert nur den Klang - dieselbe Trennung wie bei den
  // bestehenden Werkzeug-Geräuschen.

  // Kurzes, gefiltertes Rauschimpuls-Grundmuster für alle "Klopf/Klack"-Klänge.
  // Ein hölzernes Klacken unterscheidet sich von einem metallischen im
  // Wesentlichen durch Filterfrequenz, Abklingzeit und den mitschwingenden
  // tiefen Sinus darunter - genau die drei Parameter von playHit oben. Statt
  // einer weiteren fast identischen Funktion bekommen die neuen Klänge daher
  // jeweils nur passende Parameter mit.
  function playWoodClack(t, { freq = 900, decay = 0.11, volume = 0.28, thud = 150 } = {}) {
    playHit(t, { freq, decay, volume, thud });
  }
  // Möwenruf: zwei bis drei kurze, jeweils abfallende "kja"-Schreie. Der
  // charakteristische Möwenklang entsteht aus einem Sägezahn mit schnellem
  // Tonhöhenabfall durch ein schmales Bandpassfilter (das die Formant-Färbung
  // nachbildet) - ein reiner Sinus klingt dagegen wie ein Pfeifsignal.
  function playGullCry() {
    if (!ctx || !sfxEnabled) return;
    const t0 = ctx.currentTime;
    const out = ensureSfxOut();
    const calls = 2 + Math.floor(Math.random() * 2);
    const base = 900 + Math.random() * 350;
    for (let i = 0; i < calls; i++) {
      const t = t0 + i * (0.19 + Math.random() * 0.09);
      const dur = 0.16 + Math.random() * 0.07;
      const osc = ctx.createOscillator();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(base * (1 - i * 0.06), t);
      osc.frequency.exponentialRampToValueAtTime(base * 0.55, t + dur);
      const bp = ctx.createBiquadFilter();
      bp.type = 'bandpass';
      bp.frequency.setValueAtTime(2100, t);
      bp.frequency.exponentialRampToValueAtTime(1250, t + dur);
      bp.Q.value = 4.5;
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.09, t + 0.03);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      osc.connect(bp); bp.connect(g); g.connect(out);
      osc.start(t); osc.stop(t + dur + 0.02);
    }
  }
  // Brandung: DAUERHAFT laufende Kulisse, kein Einzelereignis. Der Klang ist
  // tief gefiltertes Rauschen, dessen Helligkeit UND Lautstärke von zwei
  // langsamen, ungleich schnellen LFOs bewegt werden - erst dadurch entsteht
  // der Eindruck einzelner an- und abschwellender Wellen statt eines statischen
  // Rauschens. `setSurfLevel` regelt nur noch die Gesamtlautstärke dieser
  // Kulisse (0 = gar kein Ufer im Bild), der Generator läuft durchgehend weiter.
  let surfGain = null;
  let surfLevel = -1;
  function ensureSurf() {
    if (surfGain || !ctx) return;
    const t = ctx.currentTime;
    const src = ctx.createBufferSource();
    src.buffer = getLoopNoiseBuffer();
    src.loop = true;
    const lp = ctx.createBiquadFilter();
    lp.type = 'lowpass';
    lp.frequency.value = 620;
    lp.Q.value = 0.8;
    const swell = ctx.createGain();
    swell.gain.value = 0.6;
    surfGain = ctx.createGain();
    surfGain.gain.value = 0;
    src.connect(lp); lp.connect(swell); swell.connect(surfGain);
    surfGain.connect(ensureSfxOut());
    const lfoA = ctx.createOscillator(); lfoA.frequency.value = 0.11;
    const lfoAGain = ctx.createGain(); lfoAGain.gain.value = 0.38;
    lfoA.connect(lfoAGain); lfoAGain.connect(swell.gain); lfoA.start(t);
    const lfoB = ctx.createOscillator(); lfoB.frequency.value = 0.071;
    const lfoBGain = ctx.createGain(); lfoBGain.gain.value = 260;
    lfoB.connect(lfoBGain); lfoBGain.connect(lp.frequency); lfoB.start(t);
    src.start(t);
  }
  // level: 0..1 (Anteil sichtbarer Uferkacheln). Wird jeden Frame gerufen,
  // deshalb - wie bei setNightFactor - nur bei nennenswerter Änderung wirklich
  // eine neue Rampe planen. Die Rampe ist mit 1,2s bewusst träge, damit die
  // Brandung beim Verschieben der Karte weich aufzieht statt zu schalten.
  function setSurfLevel(level) {
    const target = sfxEnabled ? Math.max(0, Math.min(1, level || 0)) : 0;
    if (!ctx) return;
    if (target > 0) ensureSurf();
    if (!surfGain) return;
    if (Math.abs(target - surfLevel) < 0.03) return;
    surfLevel = target;
    const t = ctx.currentTime;
    surfGain.gain.cancelScheduledValues(t);
    surfGain.gain.setValueAtTime(surfGain.gain.value, t);
    surfGain.gain.linearRampToValueAtTime(target * 0.16, t + 1.2);
  }
  // Wetterkulisse (v29): nach demselben Muster wie die Brandung eine DAUERHAFT
  // laufende Rauschquelle, deren Lautstärke und Klangfarbe von außen geregelt
  // werden - kein Ein-/Ausschalten, sondern ein weiches Auf- und Abziehen.
  // Der Unterschied zur Brandung liegt in der Filterfrequenz: Regen ist ein
  // helles Prasseln (Hochpass-artig, ~2600 Hz), Sturm und Schneesturm sind ein
  // tiefes Heulen (~700 Hz) mit deutlich langsamerem, breiterem LFO-Atem. Ein
  // einziger Generator reicht dafür, weil nie zwei Wetterlagen gleichzeitig
  // laufen (siehe weather im Spielcode).
  let weatherGain = null, weatherFilter = null, weatherLevel = -1, weatherTone = -1;
  function ensureWeather() {
    if (weatherGain || !ctx) return;
    const t = ctx.currentTime;
    const src = ctx.createBufferSource();
    src.buffer = getLoopNoiseBuffer();
    src.loop = true;
    weatherFilter = ctx.createBiquadFilter();
    weatherFilter.type = 'lowpass';
    weatherFilter.frequency.value = 1200;
    weatherFilter.Q.value = 0.7;
    const swell = ctx.createGain();
    swell.gain.value = 0.7;
    weatherGain = ctx.createGain();
    weatherGain.gain.value = 0;
    src.connect(weatherFilter); weatherFilter.connect(swell); swell.connect(weatherGain);
    weatherGain.connect(ensureSfxOut());
    // Zwei ungleich schnelle LFOs wie bei der Brandung - ein Sturm, der exakt
    // gleichmäßig rauscht, klingt nach Fernsehrauschen statt nach Wind.
    const lfoA = ctx.createOscillator(); lfoA.frequency.value = 0.083;
    const lfoAGain = ctx.createGain(); lfoAGain.gain.value = 0.42;
    lfoA.connect(lfoAGain); lfoAGain.connect(swell.gain); lfoA.start(t);
    const lfoB = ctx.createOscillator(); lfoB.frequency.value = 0.047;
    const lfoBGain = ctx.createGain(); lfoBGain.gain.value = 420;
    lfoB.connect(lfoBGain); lfoBGain.connect(weatherFilter.frequency); lfoB.start(t);
    src.start(t);
  }
  // level: 0..1 (Stärke des Wetters), tone: Filtermitte in Hz (hell = Regen,
  // tief = Sturm). Wird jeden Frame gerufen, deshalb wie bei setSurfLevel nur
  // bei nennenswerter Änderung eine neue Rampe planen.
  function setWeatherLevel(level, tone = 1200) {
    const target = sfxEnabled ? Math.max(0, Math.min(1, level || 0)) : 0;
    if (!ctx) return;
    if (target > 0) ensureWeather();
    if (!weatherGain) return;
    const t = ctx.currentTime;
    if (Math.abs(target - weatherLevel) >= 0.03) {
      weatherLevel = target;
      weatherGain.gain.cancelScheduledValues(t);
      weatherGain.gain.setValueAtTime(weatherGain.gain.value, t);
      weatherGain.gain.linearRampToValueAtTime(target * 0.19, t + 1.5);
    }
    if (Math.abs(tone - weatherTone) >= 60) {
      weatherTone = tone;
      weatherFilter.frequency.cancelScheduledValues(t);
      weatherFilter.frequency.setValueAtTime(weatherFilter.frequency.value, t);
      weatherFilter.frequency.linearRampToValueAtTime(tone, t + 2.0);
    }
  }
  // Mühlenklappern: hölzernes Klacken der Flügelwelle, bewusst mit leicht
  // zufälliger Tonhöhe, damit ein regelmäßiger Takt nicht mechanisch wirkt.
  function playMillClack(volume = 1) {
    if (!ctx || !sfxEnabled) return;
    const t = ctx.currentTime;
    playWoodClack(t, { freq: 640 + Math.random() * 180, decay: 0.13, volume: 0.24 * volume, thud: 118 });
  }
  // Amboss: heller, lange nachklingender Metallschlag. Zwei zueinander
  // UNharmonische Sinustöne (Verhältnis ~1:2,76) plus ein kurzer Rausch-
  // Transient - genau diese Unharmonizität unterscheidet einen Glockenklang von
  // einem Musikton.
  function playAnvil() {
    if (!ctx || !sfxEnabled) return;
    const t = ctx.currentTime;
    const out = ensureSfxOut();
    playHit(t, { freq: 3200, decay: 0.05, volume: 0.22, thud: 190 });
    for (const [mult, vol, dur] of [[1, 0.11, 0.85], [2.76, 0.06, 0.55]]) {
      const osc = ctx.createOscillator();
      osc.type = 'sine';
      osc.frequency.value = 1180 * mult;
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(vol, t + 0.006);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      osc.connect(g); g.connect(out);
      osc.start(t); osc.stop(t + dur + 0.02);
    }
  }
  // Sägezug: gefiltertes Rauschen, dessen Bandpass in einem Bogen hoch und
  // wieder herunter wandert - das bildet den Hin- und Rückzug eines Sägeblatts
  // nach, statt nur ein Kratzen zu sein.
  function playSawStroke() {
    if (!ctx || !sfxEnabled) return;
    const t = ctx.currentTime;
    const out = ensureSfxOut();
    const noise = ctx.createBufferSource();
    noise.buffer = getNoiseBuffer();
    const bp = ctx.createBiquadFilter();
    bp.type = 'bandpass'; bp.Q.value = 2.2;
    bp.frequency.setValueAtTime(900, t);
    bp.frequency.linearRampToValueAtTime(1900, t + 0.13);
    bp.frequency.linearRampToValueAtTime(850, t + 0.28);
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(0.11, t + 0.05);
    g.gain.exponentialRampToValueAtTime(0.0008, t + 0.3);
    noise.connect(bp); bp.connect(g); g.connect(out);
    noise.start(t); noise.stop(t + 0.32);
  }
  // Brotschieber: dumpfes Holz-auf-Stein-Schaben am Ofen.
  function playOvenPush() {
    if (!ctx || !sfxEnabled) return;
    const t = ctx.currentTime;
    const out = ensureSfxOut();
    const noise = ctx.createBufferSource();
    noise.buffer = getNoiseBuffer();
    const lp = ctx.createBiquadFilter();
    lp.type = 'lowpass'; lp.frequency.value = 800; lp.Q.value = 0.7;
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(0.075, t + 0.06);
    g.gain.exponentialRampToValueAtTime(0.0008, t + 0.26);
    noise.connect(lp); lp.connect(g); g.connect(out);
    noise.start(t); noise.stop(t + 0.28);
  }
  // Schmelzhütte: kurzes Zischen (Hochpass-Rauschen) wie beim Abschrecken.
  function playForgeHiss() {
    if (!ctx || !sfxEnabled) return;
    const t = ctx.currentTime;
    const out = ensureSfxOut();
    const noise = ctx.createBufferSource();
    noise.buffer = getNoiseBuffer();
    const hp = ctx.createBiquadFilter();
    hp.type = 'highpass'; hp.frequency.value = 2600;
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(0.06, t + 0.03);
    g.gain.exponentialRampToValueAtTime(0.0008, t + 0.34);
    noise.connect(hp); hp.connect(g); g.connect(out);
    noise.start(t); noise.stop(t + 0.36);
  }
  // Brauerei: weiches, langsames Rühren in der Flüssigkeit - sehr tief
  // gefiltert und mit langem, weichem Ein- und Ausblenden, damit es plätschert
  // statt zu rauschen.
  function playStir() {
    if (!ctx || !sfxEnabled) return;
    const t = ctx.currentTime;
    const out = ensureSfxOut();
    const noise = ctx.createBufferSource();
    noise.buffer = getNoiseBuffer();
    const lp = ctx.createBiquadFilter();
    lp.type = 'lowpass'; lp.frequency.value = 480; lp.Q.value = 1.4;
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(0.06, t + 0.18);
    g.gain.linearRampToValueAtTime(0.0001, t + 0.55);
    noise.connect(lp); lp.connect(g); g.connect(out);
    noise.start(t); noise.stop(t + 0.58);
  }
  // Webstuhl: leichteres, höheres Holzklacken als bei der Mühle.
  function playLoomClack() {
    if (!ctx || !sfxEnabled) return;
    playWoodClack(ctx.currentTime, { freq: 1250 + Math.random() * 250, decay: 0.07, volume: 0.16, thud: 260 });
  }
  // Schneiderei: nur ein Hauch - ein sehr kurzes, hohes "Schff" des durch den
  // Stoff gezogenen Fadens. Bewusst der leiseste Arbeitsklang im Spiel.
  function playStitch() {
    if (!ctx || !sfxEnabled) return;
    const t = ctx.currentTime;
    const out = ensureSfxOut();
    const noise = ctx.createBufferSource();
    noise.buffer = getNoiseBuffer();
    const bp = ctx.createBiquadFilter();
    bp.type = 'bandpass'; bp.frequency.value = 3800; bp.Q.value = 1.6;
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.035, t);
    g.gain.exponentialRampToValueAtTime(0.0005, t + 0.09);
    noise.connect(bp); bp.connect(g); g.connect(out);
    noise.start(t); noise.stop(t + 0.11);
  }

  // Lookahead-Scheduler: plant Ereignisse einige Sekunden im Voraus über die
  // präzise Audio-Uhr (ctx.currentTime), statt sich auf JS-Timer zu verlassen
  // - vermeidet hörbares Timing-Ruckeln.
  function schedule() {
    if (!ctx || !musicEnabled) return;
    const now = ctx.currentTime;
    while (nextChordTime < now + 4) {
      playPadChord(CHORDS[chordIndex % CHORDS.length], nextChordTime);
      chordIndex++;
      nextChordTime += CHORD_DURATION;
    }
    const currentChord = CHORDS[(chordIndex - 1 + CHORDS.length) % CHORDS.length];
    while (nextPluckTime < now + 4) {
      // Tagsüber die volle Lage inkl. Oktave darüber, nachts bewusst nur die
      // tiefen Töne des Akkords: dieselbe Harmonie, aber ruhiger und dunkler.
      const pool = nightFactorVal > 0.5
        ? currentChord.slice(0, 3)
        : currentChord.concat(currentChord.map(n => n + 12), [currentChord[0] + 19]);
      const note = pool[Math.floor(Math.random() * pool.length)];
      // Nachts kommt nur noch etwa jeder vierte fällige Ton wirklich - die
      // Melodie dünnt spürbar aus, statt einfach nur leiser zu werden.
      const chance = 0.62 - 0.4 * nightFactorVal;
      if (Math.random() < chance) playPluck(note, nextPluckTime, (0.08 + Math.random() * 0.05) * (1 - 0.35 * nightFactorVal));
      // Nachts zusätzlich größere Abstände zwischen den Tönen.
      nextPluckTime += (1.6 + Math.random() * 2.0) * (1 + nightFactorVal);
    }
    // Flötenfiguren gibt es nur bei Tag - nachts bleibt es bei Drone, Wind und
    // vereinzelten tiefen Zupftönen.
    while (nextFluteTime < now + 4) {
      if (nightFactorVal < 0.45 && Math.random() < 0.55) playFlutePhrase(currentChord, nextFluteTime);
      nextFluteTime += 14 + Math.random() * 16;
    }
  }

  // Ziel-Gain der Musik: aus (0), wenn Musik ausgeschaltet ist, sonst
  // PAD_VOLUME skaliert mit dem Lautstärke-Anteil (0..1) aus dem Audio-Menü
  // UND mit der Tageszeit - nachts spielt dieselbe Musik deutlich leiser.
  function musicTargetGain() {
    return musicEnabled ? PAD_VOLUME * musicVolumeFrac * (1 - 0.45 * nightFactorVal) : 0;
  }
  // Wird jeden Frame aus der Tageszeit gefüttert (siehe update()). Die
  // Änderungsschwelle ist wichtig: ohne sie plante jeder Frame eine neue
  // Lautstärke-Rampe, was hörbar zappelt. 0,02 entspricht auf einem 4,5-Minuten-
  // Tag rund einer Anpassung alle paar Sekunden - für einen Sonnenuntergang
  // völlig ausreichend.
  function setNightFactor(f) {
    nightFactorVal = Math.max(0, Math.min(1, f || 0));
    if (!ctx || Math.abs(nightFactorVal - appliedNight) < 0.02) return;
    appliedNight = nightFactorVal;
    if (!musicEnabled) return;
    const t = ctx.currentTime;
    master.gain.cancelScheduledValues(t);
    master.gain.setValueAtTime(master.gain.value, t);
    master.gain.linearRampToValueAtTime(musicTargetGain(), t + 2.5);
  }

  // `start()` wird beim ersten Klick/Tastendruck aufgerufen (Browser-Pflicht
  // für Audio) - unabhängig vom Musik-Schalter, denn auch die Soundeffekte
  // brauchen einen laufenden AudioContext. Der Akkord-/Zupf-Scheduler läuft
  // danach immer im Hintergrund weiter; ob dabei etwas zu hören ist, hängt
  // allein von `master.gain` (musicTargetGain) ab.
  function start() {
    ensureContext();
    if (!ctx) return;
    if (ctx.state === 'suspended') ctx.resume();
    master.gain.cancelScheduledValues(ctx.currentTime);
    master.gain.linearRampToValueAtTime(musicTargetGain(), ctx.currentTime + 4);
    if (started) return;
    started = true;
    ensureDrone(ctx.currentTime);
    ensureWind(ctx.currentTime);
    nextChordTime = ctx.currentTime + 0.3;
    nextPluckTime = ctx.currentTime + 6.5;
    nextFluteTime = ctx.currentTime + 20;
    schedule();
    schedulerTimer = setInterval(schedule, 1500);
  }

  function setMusicEnabled(v) {
    musicEnabled = v;
    if (!ctx) { if (v) start(); return; }
    const t = ctx.currentTime;
    master.gain.cancelScheduledValues(t);
    master.gain.setValueAtTime(master.gain.value, t);
    master.gain.linearRampToValueAtTime(musicTargetGain(), t + 1.2);
    if (v) start();
  }

  // Lautstärke-Anteil (0..1) der Musik; wirkt nur, solange Musik an ist -
  // reagiert schneller (0.15s) als das An-/Ausblenden, damit der Regler sich
  // unmittelbar anfühlt.
  function setMusicVolume(frac) {
    musicVolumeFrac = Math.max(0, Math.min(1, frac));
    if (!ctx || !musicEnabled) return;
    const t = ctx.currentTime;
    master.gain.cancelScheduledValues(t);
    master.gain.setValueAtTime(master.gain.value, t);
    master.gain.linearRampToValueAtTime(musicTargetGain(), t + 0.15);
  }

  // Soundeffekte sind ein reiner An/Aus-Schalter (keine eigene Lautstärke,
  // siehe Kommentar oben bei `sfxOut`). `ensureContext()` schadet auch vor
  // der ersten Nutzerinteraktion nicht (nur `resume()`/tatsächliches Klingen
  // braucht die Geste), so ist der Effekt sofort bereit, sobald der erste
  // Klick den Context freigibt.
  function setSfxEnabled(v) {
    sfxEnabled = v;
    ensureContext();
    // Die Brandung ist der einzige Effekt, der DAUERHAFT klingt - sie hört
    // nicht von selbst auf, nur weil nichts Neues mehr ausgelöst wird, und
    // muss deshalb hier ausdrücklich mit heruntergefahren werden.
    if (surfGain && ctx) {
      const t = ctx.currentTime;
      surfLevel = -1; // Vergleichswert verwerfen, damit setSurfLevel danach wieder greift
      surfGain.gain.cancelScheduledValues(t);
      surfGain.gain.setValueAtTime(surfGain.gain.value, t);
      surfGain.gain.linearRampToValueAtTime(0, t + 0.4);
    }
  }

  // Feueralarm (v34.7): eine kleine, dringliche Glocke - drei schnelle,
  // helle Schläge statt eines einzelnen Tons, damit sie sich klar von jedem
  // anderen kurzen Klingeln (Münzprägung, Ziselieren) absetzt und sofort als
  // "Alarm" erkennbar ist, ohne so lang oder aufdringlich zu sein wie eine
  // Sirene.
  function playFireAlarm() {
    if (!ctx || !sfxEnabled) return;
    const t = ctx.currentTime;
    const out = ensureSfxOut();
    for (let i = 0; i < 3; i++) {
      const offset = i * 0.16;
      const bell = ctx.createOscillator();
      bell.type = 'square';
      bell.frequency.setValueAtTime(1500, t + offset);
      const bg = ctx.createGain();
      bg.gain.setValueAtTime(0.09, t + offset);
      bg.gain.exponentialRampToValueAtTime(0.0006, t + offset + 0.14);
      bell.connect(bg); bg.connect(out);
      bell.start(t + offset); bell.stop(t + offset + 0.16);
    }
  }
  // Löscherfolg (v34.7): ein kurzes, fallendes Wasser-/Zischgeräusch (gefiltertes
  // Rauschen, das nach unten wegsackt) - bewusst KEIN fröhlicher Erfolgsklang
  // wie playCoins, sondern eher ein erleichtertes "Pssscht", das zur
  // gelöschten Glut passt.
  function playFireExtinguish() {
    if (!ctx || !sfxEnabled) return;
    const t = ctx.currentTime;
    const out = ensureSfxOut();
    const noise = ctx.createBufferSource();
    noise.buffer = getNoiseBuffer();
    const lp = ctx.createBiquadFilter();
    lp.type = 'lowpass';
    lp.frequency.setValueAtTime(3200, t);
    lp.frequency.exponentialRampToValueAtTime(260, t + 0.55);
    lp.Q.value = 0.6;
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0008, t);
    g.gain.linearRampToValueAtTime(0.16, t + 0.05);
    g.gain.exponentialRampToValueAtTime(0.0006, t + 0.6);
    noise.connect(lp); lp.connect(g); g.connect(out);
    noise.start(t); noise.stop(t + 0.65);
  }
  // Niederbrennen (v34.7): ein dumpfer, tief absackender Krach - der
  // Gegenpol zum hellen playBuild, weil hier ein Gebäude verloren geht statt
  // eines zu entstehen. Ein tiefer, brechender Holzimpuls gefolgt von einer
  // langsam verklingenden Rauch-/Ascherauschwolke.
  function playFireBurnDown() {
    if (!ctx || !sfxEnabled) return;
    const t = ctx.currentTime;
    const out = ensureSfxOut();
    const crack = ctx.createOscillator();
    crack.type = 'sawtooth';
    crack.frequency.setValueAtTime(160, t);
    crack.frequency.exponentialRampToValueAtTime(40, t + 0.35);
    const cg = ctx.createGain();
    cg.gain.setValueAtTime(0.14, t);
    cg.gain.exponentialRampToValueAtTime(0.0006, t + 0.4);
    crack.connect(cg); cg.connect(out);
    crack.start(t); crack.stop(t + 0.42);
    const noise = ctx.createBufferSource();
    noise.buffer = getNoiseBuffer();
    const lp = ctx.createBiquadFilter();
    lp.type = 'lowpass';
    lp.frequency.setValueAtTime(1400, t + 0.05);
    lp.frequency.exponentialRampToValueAtTime(180, t + 1.1);
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0008, t + 0.05);
    g.gain.linearRampToValueAtTime(0.12, t + 0.15);
    g.gain.exponentialRampToValueAtTime(0.0005, t + 1.2);
    noise.connect(lp); lp.connect(g); g.connect(out);
    noise.start(t + 0.05); noise.stop(t + 1.25);
  }

  // Seegefecht (v34.22): Kanonenschuss = kurzer, tiefer Knall (Sinus, der
  // schnell nach unten wegfällt) plus ein Stoß gefiltertes Rauschen.
  function playCannon() {
    if (!ctx || !sfxEnabled) return;
    const t = ctx.currentTime;
    const out = ensureSfxOut();
    const boom = ctx.createOscillator();
    boom.type = 'sine';
    boom.frequency.setValueAtTime(120, t);
    boom.frequency.exponentialRampToValueAtTime(38, t + 0.35);
    const bg = ctx.createGain();
    bg.gain.setValueAtTime(0.22, t);
    bg.gain.exponentialRampToValueAtTime(0.0006, t + 0.45);
    boom.connect(bg); bg.connect(out);
    boom.start(t); boom.stop(t + 0.5);
    const noise = ctx.createBufferSource();
    noise.buffer = getNoiseBuffer();
    const lp = ctx.createBiquadFilter();
    lp.type = 'lowpass';
    lp.frequency.setValueAtTime(1800, t);
    lp.frequency.exponentialRampToValueAtTime(220, t + 0.5);
    const ng = ctx.createGain();
    ng.gain.setValueAtTime(0.16, t);
    ng.gain.exponentialRampToValueAtTime(0.0005, t + 0.6);
    noise.connect(lp); lp.connect(ng); ng.connect(out);
    noise.start(t); noise.stop(t + 0.65);
  }
  // Piratenalarm: zwei tiefe, raue Hornstöße - klar anders als die helle
  // Feuerglocke, damit man am Klang hört, WAS los ist.
  function playPirateHorn() {
    if (!ctx || !sfxEnabled) return;
    const t = ctx.currentTime;
    const out = ensureSfxOut();
    for (let i = 0; i < 2; i++) {
      const o = t + i * 0.5;
      const horn = ctx.createOscillator();
      horn.type = 'sawtooth';
      horn.frequency.setValueAtTime(i === 0 ? 146 : 110, o);
      const lp = ctx.createBiquadFilter();
      lp.type = 'lowpass'; lp.frequency.setValueAtTime(700, o);
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.0008, o);
      g.gain.linearRampToValueAtTime(0.1, o + 0.06);
      g.gain.setValueAtTime(0.1, o + 0.32);
      g.gain.exponentialRampToValueAtTime(0.0006, o + 0.44);
      horn.connect(lp); lp.connect(g); g.connect(out);
      horn.start(o); horn.stop(o + 0.46);
    }
  }
  // Schiff sinkt: langes, abfallendes Gurgeln (Rauschen durch einen Tiefpass,
  // dessen Grenze langsam nach unten wandert).
  function playShipSink() {
    if (!ctx || !sfxEnabled) return;
    const t = ctx.currentTime;
    const out = ensureSfxOut();
    const noise = ctx.createBufferSource();
    noise.buffer = getNoiseBuffer();
    const lp = ctx.createBiquadFilter();
    lp.type = 'lowpass';
    lp.frequency.setValueAtTime(900, t);
    lp.frequency.exponentialRampToValueAtTime(120, t + 1.8);
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0008, t);
    g.gain.linearRampToValueAtTime(0.13, t + 0.15);
    g.gain.exponentialRampToValueAtTime(0.0005, t + 1.9);
    noise.connect(lp); lp.connect(g); g.connect(out);
    noise.start(t); noise.stop(t + 2);
  }

  // Seuchenglocke (v34.24): ein einzelner, tiefer, lang nachklingender
  // Glockenschlag - bewusst anders als die helle Feuerglocke und das raue
  // Piratenhorn.
  function playPlagueBell() {
    if (!ctx || !sfxEnabled) return;
    const t = ctx.currentTime;
    const out = ensureSfxOut();
    for (const [f, a] of [[196, 0.12], [392, 0.05], [587, 0.03]]) {
      const o = ctx.createOscillator();
      o.type = 'sine';
      o.frequency.setValueAtTime(f, t);
      const g = ctx.createGain();
      g.gain.setValueAtTime(a, t);
      g.gain.exponentialRampToValueAtTime(0.0004, t + 2.4);
      o.connect(g); g.connect(out);
      o.start(t); o.stop(t + 2.5);
    }
  }

  return {
    start, setMusicEnabled, setMusicVolume, setSfxEnabled, setNightFactor,
    playPlagueBell,
    // Piraten & Seegefechte (v34.22)
    playCannon, playPirateHorn, playShipSink,
    isStarted: () => started, state: () => (ctx ? ctx.state : 'none'),
    playChop, playPickaxeHit, playBuild, playFootstep, playSplash, playSnip, playBowShot, playTrapSnap, playHarpoon, playCoins,
    // Umgebung (sichtbarkeitsabhängig ausgelöst, siehe updateAmbientSounds)
    playGullCry, playMillClack, setSurfLevel, setWeatherLevel,
    // Arbeitsklänge der ortsfesten Verarbeiter (siehe PROCESSOR_WORK)
    playAnvil, playSawStroke, playOvenPush, playForgeHiss, playStir, playLoomClack, playStitch, playScrape,
    playChisel, playMintStrike,
    // Feuer-Ereignis (v34.7): Alarm, Löscherfolg, Niederbrennen
    playFireAlarm, playFireExtinguish, playFireBurnDown,
    // Debug-/Testzugriff auf die Tageszeit-Stimmung
    nightFactor: () => nightFactorVal
  };
})();
window.__manfredvilleAudio = AudioEngine; // Debug-/Testzugriff

// ---- Einstellungen-Menü (bisher "Audio-Menü") ---------------------------------
// Der ⚙️-Button (bis v34.4: 🎵) öffnet/schließt nur noch das Menü (statt
// direkt zu muten); die drei Regler darin steuern Musik und Soundeffekte
// unabhängig voneinander über die zugehörigen AudioEngine-Setter. Aus einem
// reinen Audio-Knopf wurde bewusst ein allgemeiner Einstellungen-Knopf (NEU,
// v34.4) - Ton ist bisher der einzige Menüpunkt darin (siehe die "🎵 Ton"-
// Überschrift im Menü selbst), aber ein ⚙️-Symbol kündigt keine falsche
// Beschränkung auf Audio mehr an, falls später weitere Einstellungen
// dazukommen. Das Symbol bleibt deshalb IMMER ⚙️ (wechselt anders als vorher
// nicht mehr zu 🔇) - eine Stummschaltung zeigt sich weiterhin über die
// `.muted`-Klasse (blasser, entsättigt), ohne dass der Knopf seine
// Bedeutung als "Einstellungen" verliert.
let uiMusicEnabled = true;
let uiSfxEnabled = true;
let uiMusicVolume = 100; // 0..100, Prozent
const settingsBtn = document.getElementById('settingsToggle');
const settingsMenu = document.getElementById('settingsMenu');
const musicEnabledChk = document.getElementById('musicEnabledChk');
const musicVolumeSlider = document.getElementById('musicVolumeSlider');
const musicVolumeVal = document.getElementById('musicVolumeVal');
const sfxEnabledChk = document.getElementById('sfxEnabledChk');

function updateMusicBtn() {
  settingsBtn.classList.toggle('muted', !uiMusicEnabled);
}
settingsBtn.addEventListener('click', (e) => {
  e.stopPropagation();
  settingsMenu.classList.toggle('open');
});
// Klick irgendwo außerhalb des Menüs schließt es wieder; Klicks innerhalb
// des Menüs selbst sollen es nicht schließen (sonst ließe sich der Regler
// kaum bedienen).
document.addEventListener('click', (e) => {
  if (!settingsMenu.classList.contains('open')) return;
  if (e.target === settingsBtn || settingsMenu.contains(e.target)) return;
  settingsMenu.classList.remove('open');
});
settingsMenu.addEventListener('click', (e) => e.stopPropagation());

musicEnabledChk.addEventListener('change', () => {
  uiMusicEnabled = musicEnabledChk.checked;
  musicVolumeSlider.disabled = !uiMusicEnabled;
  AudioEngine.setMusicEnabled(uiMusicEnabled);
  updateMusicBtn();
});
musicVolumeSlider.addEventListener('input', () => {
  uiMusicVolume = Number(musicVolumeSlider.value);
  musicVolumeVal.textContent = uiMusicVolume + '%';
  AudioEngine.setMusicVolume(uiMusicVolume / 100);
});
sfxEnabledChk.addEventListener('change', () => {
  uiSfxEnabled = sfxEnabledChk.checked;
  AudioEngine.setSfxEnabled(uiSfxEnabled);
});
updateMusicBtn();

// Browser verlangen eine erste Nutzerinteraktion, bevor Audio starten darf -
// der AudioContext wird daher beim ersten Klick/Tastendruck irgendwo im
// Spiel freigegeben (unabhängig davon, ob Musik oder nur Soundeffekte an
// sind - start() kümmert sich intern um die richtige Lautstärke).
function unlockAudioOnce() {
  AudioEngine.start();
  window.removeEventListener('pointerdown', unlockAudioOnce);
  window.removeEventListener('keydown', unlockAudioOnce);
}
window.addEventListener('pointerdown', unlockAudioOnce);
window.addEventListener('keydown', unlockAudioOnce);

// ---- Spielschleife -----------------------------------------------------------
let lastTime = performance.now();
let logisticsTimer = 0;
const LOGISTICS_INTERVAL = 600;
let buildingInfoTimer = 0;
let minimapTimer = 0;
let animClock = 0; // globale Animations-Uhr (ms) für Rauch, rotierende Mühlenflügel/Sägeblatt, Funken usw.
function update(dt) {
  updateKeyboardPan(dt); // Pfeiltasten/WASD (v34.2) - VOR allem anderen, rein kameraseitig ohne Wirkung auf Spielzustand
  animClock += dt;
  advanceDayTime(dt);
  updateLighthouses(); // Tran-Verbrauch bei Sonnenuntergang (v34) - VOR updateShips, damit der Geschwindigkeitsbonus im selben Bild gilt
  // updateWeather steht seit v34.14 VOR updateGrowth (und damit weiterhin vor
  // updateShips): seit die Dürre das Feldwachstum bremst, hängen BEIDE Seiten
  // am Wetter, und beide sollen denselben, aktuellen Zellzustand sehen statt
  // den des Vorframes.
  updateWeather(dt);
  updateGrowth(dt);
  updateDeer(dt); // globale Wildpopulation - unabhängig vom Produktionstakt einzelner Gebäude
  updateElephants(dt); // Landschaftstiere der Südinseln (v34.14) - ohne jede Spielwirkung
  updatePolarBears(dt); // ...und des Nordens (v34.21)
  updateSeals(dt);
  updateWhalePods(dt); // Walwanderung (v34.25)
  updateShips(dt);
  updatePirates(dt); // Piraten-Ereignis und Seegefechte (v34.22)
  updateEscorts(dt); // Geleitschutz auf Routen (v34.24)
  updateMarkets(dt); // Marktpreise erholen sich (v34.24)
  updateStats(dt); // Statistik-Messpunkte (v34.24)
  updateFog(dt); // Schiffe und Gebäude decken den Nebel auf (v34.24)
  updateWhaleBoats(dt); // Walfangboote (v29.1) - wie die Schiffe wetterabhängig
  updateFires(dt); // Feuer-Ereignis (v34.7): seltener Zufallsbrand + Löschhelfer
  updateDisease(dt); // Seuche (v34.24)
  updateMood(dt); // Zufriedenheit je Insel (v34.26)
  updateRoutes(dt); // Frachtrouten: Kurs setzen, laden, entladen (v26)
  dueBreadHouses.length = 0;
  dueBeerHouses.length = 0;
  dueClothesHouses.length = 0;
  dueLuxuryHouses.length = 0;
  dueNobleHouses.length = 0;
  for (const b of buildings) {
    updateProduction(b, dt);
    if (b.sheep) updateSheep(b, dt); // Schafe laufen unabhängig vom Produktionstakt weiter
  }
  // Brot/Bier erst NACH der Produktionsschleife fair verteilen (siehe
  // resolveBreadNeeds/resolveBeerNeeds), danach Wachstum & Status je Haus
  // mit den dadurch garantiert aktuellen fed/hasFaith/satisfied-Werten.
  resolveBreadNeeds();
  resolveBeerNeeds();
  resolveClothesNeeds();
  resolveLuxuryNeeds();
  resolveNobleNeeds(); // Adelsluxus (v34.24)
  for (const b of buildings) { if (b.type === 'house') updateHouseGrowthAndStatus(b, dt); }
  updateTaxes(dt); // Steuereinnahmen (v33) - NACH dem Wachstum, damit sie die Kopfzahl dieses Ticks abrechnen
  updateSchoolUpkeep(dt); // Schulunterhalt (v34.11) - NACH den Steuern, damit derselbe Zyklus erst einnimmt, dann ausgibt
  // Straßenanschluss-Prüfung NACH allen anderen Status-Aktualisierungen dieses
  // Ticks (siehe decayDisconnectedBuildings) - ein evtl. hier verfallendes
  // Gebäude nimmt so keinen veralteten Blocked-Status mehr mit in den nächsten
  // Frame, und runLogistics/updateCarriers direkt danach sehen bereits die
  // bereinigte buildings-Liste.
  decayDisconnectedBuildings(dt);
  logisticsTimer += dt;
  if (logisticsTimer >= LOGISTICS_INTERVAL) { logisticsTimer = 0; runLogistics(); }
  updateCarriers(dt);
  // Klangkulisse: sichtbarkeitsabhängige Umgebungsgeräusche plus die
  // Tageszeit-Stimmung der Musik. Beides bewusst NACH allen Spielzustands-
  // Änderungen dieses Ticks, damit z. B. eine gerade verfallene Mühle nicht
  // noch einmal klappert.
  updateAmbientSounds(dt);
  AudioEngine.setNightFactor(nightFactor());
  updateResourceUI();
  if (selectedBuilding || selectedShip) {
    // Infopanel-Inhalt regelmäßig auffrischen, damit Lagerbestände live
    // mitlaufen, während das Panel offen ist (kein Re-Render jeden Frame).
    buildingInfoTimer += dt;
    if (buildingInfoTimer >= 400) {
      buildingInfoTimer = 0;
      // ABER nicht, während der Spieler gerade in einer Auswahlliste des Panels
      // steht (Warenwahl einer Frachtroute, v26): ein Neuaufbau würde ihm das
      // geöffnete Menü unter der Hand wegnehmen.
      const panel = document.getElementById('buildingInfo');
      const ae = document.activeElement;
      const busy = ae && ae.tagName === 'SELECT' && panel && panel.contains(ae);
      if (!busy) renderBuildingInfo();
    }
  }
  // Minimap nur gedrosselt neu zeichnen (nicht jeden Frame) - 40x40 Kacheln
  // pro Aufruf lohnen sich nicht bei 60fps, für eine Übersichtskarte reicht
  // ein deutlich selteneres Update.
  minimapTimer += dt;
  if (minimapTimer >= 300) { minimapTimer = 0; renderMinimap(); }
  // Warenübersicht (v33) mitlaufen lassen, solange sie offen ist - sonst stünde
  // dort ein eingefrorener Bestand. Gedrosselt wie das Infopanel, und sie baut
  // sich nicht neu auf, während jemand einen Inselnamen tippt (siehe dort).
  if (overviewOpen) {
    overviewTimer += dt;
    if (overviewTimer >= 700) { overviewTimer = 0; renderOverview(); }
  }
  // Automatische Zwischenspeicherung (v33).
  autosaveTimer += dt;
  if (autosaveTimer >= AUTOSAVE_INTERVAL) { autosaveTimer = 0; autosaveNow(); }
}
let overviewTimer = 0;
let autosaveTimer = 0;
function gameLoop(now) {
  const dt = Math.min(now - lastTime, 100);
  lastTime = now;
  update(dt);
  render();
  requestAnimationFrame(gameLoop);
}

// ---- Setup ---------------------------------------------------------------------
function resizeCanvas() {
  const dpr = window.devicePixelRatio || 1;
  canvas.width = Math.floor(canvas.clientWidth * dpr);
  canvas.height = Math.floor(canvas.clientHeight * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  refreshCanvasSize(); // gemerkte Fenstergröße für getOrigin/currentTileSize
}
window.addEventListener('resize', resizeCanvas);

function init() {
  resizeCanvas();
  generateMap();
  // Seit v24 ist die Kartenmitte nicht mehr zwangsläufig Land (die Karte ist
  // ein Archipel) - generateMap sucht deshalb eine passende freie Kachel auf
  // der Startinsel und legt sie in homeSpot ab.
  const cx = homeSpot ? homeSpot.x : Math.floor(CFG.mapSize / 2);
  const cy = homeSpot ? homeSpot.y : Math.floor(CFG.mapSize / 2);
  // Jede Insel hat ihren eigenen Warenbestand (siehe computeIslands) - jedes
  // Lagerhaus zeigt in tryPlaceBuilding/applySave auf den Bestand SEINER Insel.
  // Startkapital liegt auf der Startinsel - ab hier hat jede Insel ihren
  // eigenen Bestand (siehe computeIslands/stockOf).
  homeIslandId = islandAt(cx, cy);
  activeIslandId = homeIslandId;
  if (homeIslandId >= 0) islands[homeIslandId].storage.plank = 20;
  initFog(); // Nebel: nur die Startinsel ist bekannt (v34.24)
  // noRoadTimer: 0 wie bei jedem anderen Gebäude - hier ohnehin irrelevant,
  // solange es das einzige (und damit letzte) Lagerhaus ist (siehe isLastWarehouse).
  warehouse = { type: 'warehouse', x: cx, y: cy, def: buildingTypes.warehouse, storage: storageOfIsland(homeIslandId), timer: 0, blocked: null, pendingOut: false, noRoadTimer: 0 };
  clearAreaForest(cx, cy, 2);
  map[cy][cx].building = warehouse;
  buildings.push(warehouse);
  // Kamera initial so ausrichten, dass das Lagerhaus in der Bildschirmmitte
  // liegt. Der Ursprung-Offset (getOrigin) ist ein fester Wert, der bei einer
  // größeren Karte sonst den Startbereich weit aus dem Sichtfeld schieben würde.
  const { th } = currentTileSize();
  const desiredScreenY = canvas.clientHeight * 0.55;
  camera.panY = desiredScreenY - 110 - (cx + cy) * (th / 2);
  selectTool('pan');
  updateResourceUI();
  renderMinimap();
  requestAnimationFrame(gameLoop);
  // Liegt ein automatisch gespeicherter Stand vor, wird gefragt statt
  // entschieden (v33): einfach fortzusetzen würde beim Öffnen der Datei
  // stillschweigend jede Absicht überstimmen, neu anzufangen - und einfach zu
  // ignorieren wäre der ganze Sinn des Autosaves. Die frisch erzeugte Karte
  // läuft dabei schon im Hintergrund; sagt der Spieler "fortsetzen", ersetzt
  // applySave sie vollständig.
  fragteNachAutosave();
}
function fragteNachAutosave() {
  const stand = readAutosave();
  if (!stand) return;
  const box = document.createElement('div');
  box.id = 'resumeBox';
  box.innerHTML = `<div class="resume-inner">`
    + `<b>Gespeicherten Stand fortsetzen?</b>`
    + `<div class="resume-when">Automatisch gesichert ${autosaveZeitText(stand.savedAt)}.</div>`
    + `<div class="resume-row">`
    + `<button id="resumeYes" class="tool-btn">▶ Fortsetzen</button>`
    + `<button id="resumeNo" class="tool-btn">🗺️ Neu anfangen</button>`
    + `</div></div>`;
  document.body.appendChild(box);
  const schliessen = () => box.remove();
  document.getElementById('resumeYes').addEventListener('click', () => {
    schliessen();
    try {
      applySave(stand.game);
      setStatus(`Stand von ${autosaveZeitText(stand.savedAt)} fortgesetzt.`);
    } catch (e) {
      setStatus('Der gespeicherte Stand ließ sich nicht laden – es geht mit einer neuen Karte weiter.');
    }
  });
  document.getElementById('resumeNo').addEventListener('click', () => {
    schliessen();
    // Der alte Stand wird NICHT sofort gelöscht: der nächste Autosave
    // überschreibt ihn ohnehin, und solange nichts gebaut ist, hätte ein
    // versehentlicher Klick sonst einen ganzen Spielstand vernichtet.
    setStatus('Neue Karte. Der alte Stand wird beim nächsten automatischen Speichern überschrieben.');
  });
}
init();
</script>
