// Wird aufgerufen, wenn die Arbeits-Animation (Fällen oder Abbauen) am
// Zielfeld fertig abgespielt ist: erledigt die eigentliche Arbeit (falls die
// Ressource inzwischen nicht schon von jemand anderem verbraucht wurde) und
// schickt den Arbeiter zurück zum Gebäude.
function finishWork(c) {
  // c.target darf (beim Scheren) auch eine Zwischenposition mit Nachkommastellen
  // sein - daher gerundet nachschlagen und den Fall "außerhalb der Karte"
  // abfangen, statt blind zu indizieren.
  const ttx = Math.round(c.target.x), tty = Math.round(c.target.y);
  const t = inBounds(ttx, tty) ? map[tty][ttx] : null;
  if (!t) { c.path = [c.path[1], c.path[0]]; c.segIndex = 0; c.segProgress = 0; c.phase = 'return'; return; }
  if (c.action === 'chop') {
    if (t.terrain === 'forest' && t.trees > 0) {
      t.trees -= 1;
      // Das Holz kommt erst ins Lager der Hütte, wenn der Holzfäller dort auch
      // tatsächlich ankommt (siehe handleFieldArrival) - sonst würde die
      // Straßen-Logistik schon einen Träger losschicken, bevor die Figur den
      // sichtbaren Rückweg überhaupt angetreten hat.
      c.carryGood = 'wood';
      if (t.trees <= 0) {
        // Feld ist leer geerntet - kann von einem Förster neu bepflanzt werden
        t.terrain = 'grass';
        t.growthStage = undefined;
        t.growthTimer = 0;
        t.growthKind = undefined;
      }
    }
  } else if (c.action === 'mine') {
    // Welches Erz hier liegt, entscheidet die KACHEL (v29: Eisen im Norden und
    // in der Mitte, Gold im Süden) - nicht der Auftrag, mit dem der Arbeiter
    // losgeschickt wurde. Seit v30 wird die Ader dabei ABGEBAUT: extractFromTile
    // bucht eine Fuhre ab und verwandelt den Berg in Grasland, sobald nichts
    // mehr drin ist.
    if (t.terrain === 'mountain') {
      const ore = oreOfTile(t);
      if (ore && extractFromTile(ttx, tty, ore)) c.carryGood = ore;
    }
  } else if (c.action === 'quarry') {
    // Seit v30 zehrt der Steinbruch das Gebirge auf (vorher lieferte es
    // unbegrenzt). Ist die Kachel leer, wird sie zu Grasland - siehe
    // extractFromTile.
    if (t.terrain === 'mountain' && extractFromTile(ttx, tty, 'stone')) {
      c.carryGood = 'stone';
    }
  } else if (c.action === 'fish') {
    // Das Meer ist unerschöpflich (wie Erzader und Gebirge) - geprüft wird nur,
    // ob von der Uferkachel aus überhaupt noch Wasser erreichbar ist.
    if (neighbors4(ttx, tty).some(nb => isWater(nb.x, nb.y))) c.carryGood = 'fish';
  } else if (c.action === 'trap') {
    // Anders als beim Holzfäller bleibt der Baum stehen: die Falle steht nur
    // darunter. Geprüft wird deshalb lediglich, ob dort überhaupt noch Wald ist
    // (er könnte inzwischen von einem Holzfäller abgeräumt worden sein).
    if (t.terrain === 'forest') c.carryGood = 'fur';
  } else if (c.action === 'shear') {
    c.carryGood = 'wool';
    // Das Schaf darf jetzt wieder frei weiterlaufen.
    if (c.sheep) c.sheep.held = false;
  } else if (c.action === 'hunt') {
    c.carryGood = 'meat';
    // Das Reh flieht nach dem Schuss an eine neue Stelle am Waldrand, statt
    // dauerhaft aus der Population zu verschwinden - Wild ist wie Wolle/Fisch
    // eine erneuerbare, nicht erschöpfbare Ressource (siehe Kommentar bei `let deer`).
    if (c.deer) {
      const spot = findNearbyForestEdgeSpot(c.deer.x, c.deer.y, DEER_WANDER_RADIUS) ||
        (forestEdgeSpots.length ? forestEdgeSpots[Math.floor(Math.random() * forestEdgeSpots.length)] : null);
      if (spot) { c.deer.x = spot.x; c.deer.y = spot.y; }
      c.deer.tx = null; c.deer.ty = null;
      c.deer.wait = 800 + Math.random() * 2000;
      c.deer.held = false;
    }
  }
  c.path = [c.path[1], c.path[0]];
  c.segIndex = 0;
  c.segProgress = 0;
  c.phase = 'return';
}
function handleFieldArrival(c, i) {
  if (c.phase === 'out') {
    if (WORK_ACTIONS[c.action]) {
      // Am Baum/Erzvorkommen/Gebirge/Ufer/Schaf angekommen: erst die Arbeits-
      // Animation abspielen, bevor die Ressource tatsächlich gewonnen wird und
      // der Arbeiter zurückläuft (welche Tätigkeiten das sind, steht in WORK_ACTIONS).
      c.phase = 'working';
      c.workTimer = 0;
      return;
    }
    const t = map[c.target.y][c.target.x];
    if (c.action === 'plant') {
      // Am Zielfeld angekommen: erneut prüfen (könnte inzwischen bebaut/bepflanzt sein) und pflanzen
      if (isStillPlantable(c.target.x, c.target.y, c.cropKind)) {
        t.terrain = c.cropKind === 'tree' ? 'forest' : 'field';
        t.trees = 0;
        t.growthStage = 0;
        t.growthTimer = 0;
        t.growthKind = c.cropKind;
        markGrowing(c.target.x, c.target.y); // sonst würde updateGrowth diese Kachel nie ansehen
      }
    } else if (c.action === 'harvest') {
      // Erneut prüfen, ob das Feld noch reif ist (könnte inzwischen anders geerntet worden sein)
      if (t.terrain === 'field' && t.growthKind === c.cropKind && t.growthStage === maxGrowthStage(c.cropKind)) {
        // Die Ernte kommt erst ins Lager des Hofs, wenn die Figur dort auch
        // tatsächlich ankommt (siehe unten) - sonst würde die Straßen-Logistik
        // schon einen Träger losschicken, bevor die Figur den sichtbaren
        // Rückweg überhaupt angetreten hat. Welches Gut geerntet wird, ergibt
        // sich generisch aus FIELD_FARMS (growthKind -> good).
        const farmDef = FIELD_FARMS.find(f => f.growthKind === c.cropKind);
        c.carryGood = farmDef ? farmDef.good : 'grain';
        t.terrain = 'grass';
        t.growthStage = undefined;
        t.growthTimer = 0;
        t.growthKind = undefined;
      }
    }
    c.path = [c.path[1], c.path[0]];
    c.segIndex = 0;
    c.segProgress = 0;
    c.phase = 'return';
  } else {
    // Erst jetzt, bei der tatsächlichen Rückkehr zum Gebäude, wird die
    // mitgebrachte Ware verbucht (siehe finishWork/harvest oben).
    if (c.carryGood) {
      // ownWorker = true: das ist die eigene Fuhre dieses Gebäudes, kein
      // Nachschub von außen - sie wird auch dann eingelagert, wenn der Betrieb
      // inzwischen von Hand gestoppt wurde (siehe destCapacity).
      const cap = destCapacity(c.building, c.carryGood, true);
      c.building.storage[c.carryGood] = Math.min((c.building.storage[c.carryGood] || 0) + 1, cap);
      recordProduced(c.carryGood, 1);
    }
    c.building.busy = false;
    carriers.splice(i, 1);
  }
}

// ---- Rendering ----------------------------------------------------------
// shade() rechnet eine Hex-Farbe heller/dunkler. Für sich genommen billig,
// wird aber SEHR oft aufgerufen: einmal je Kachel für das Schachbrettmuster
// (bei herausgezoomter Karte über 15000-mal pro Frame) und mehrfach je Gebäude
// für die Wand- und Dachverläufe. parseInt + toString(16) sind Zeichenketten-
// arbeit, und die Zahl unterschiedlicher Kombinationen ist winzig (eine
// Handvoll Farben mal eine Handvoll Helligkeiten) - also gemerkt statt jedes
// Mal neu gerechnet (v31).
const shadeCache = new Map();
function shade(hex, amt) {
  const key = hex + '|' + amt;
  const hit = shadeCache.get(key);
  if (hit !== undefined) return hit;
  const n = parseInt(hex.slice(1), 16);
  let r = (n >> 16) + amt, g = ((n >> 8) & 0xff) + amt, b = (n & 0xff) + amt;
  r = Math.max(0, Math.min(255, r)); g = Math.max(0, Math.min(255, g)); b = Math.max(0, Math.min(255, b));
  const out = '#' + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
  shadeCache.set(key, out);
  return out;
}
// Baum im gemäßigten Gürtel (und Standardform, u. a. für die Requisiten der
// Försterhütte). Für die anderen Klimazonen siehe drawSnowyPine/drawAcacia -
// die Auswahl trifft drawTreeFor.
function drawPineTree(x, y) {
  ctx.fillStyle = '#2e5c34';
  ctx.beginPath();
  ctx.moveTo(x, y - 14);
  ctx.lineTo(x - 6, y);
  ctx.lineTo(x + 6, y);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = '#5a3b23';
  ctx.fillRect(x - 1.5, y, 3, 4);
}
// Norden: schlankere, dunklere Fichte mit Schneeauflage auf den Zweigen. Der
// helle Schneekeil oben ist das, was den Baum aus der Iso-Distanz überhaupt
// als "verschneit" lesbar macht - eine bloß dunklere Farbe reichte nicht.
function drawSnowyPine(x, y) {
  ctx.fillStyle = '#28453c';
  ctx.beginPath();
  ctx.moveTo(x, y - 15);
  ctx.lineTo(x - 5, y);
  ctx.lineTo(x + 5, y);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = '#eef4f6';
  ctx.beginPath();
  ctx.moveTo(x, y - 15);
  ctx.lineTo(x - 3.2, y - 6.5);
  ctx.lineTo(x - 1.6, y - 7.4);
  ctx.lineTo(x, y - 5.6);
  ctx.lineTo(x + 1.6, y - 7.4);
  ctx.lineTo(x + 3.2, y - 6.5);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = '#4a3626';
  ctx.fillRect(x - 1.3, y, 2.6, 4);
}
// Süden: Akazie mit dünnem Stamm und breiter, flacher Schirmkrone - die
// Silhouette, an der eine Savanne sofort erkennbar ist. Bewusst niedriger und
// breiter als die Nadelbäume, damit sich die Zonen schon an der Form
// unterscheiden und nicht nur an der Farbe.
function drawAcacia(x, y) {
  ctx.strokeStyle = '#6b5334';
  ctx.lineWidth = 1.6;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(x, y + 3);
  ctx.lineTo(x, y - 5);
  ctx.moveTo(x, y - 3);
  ctx.lineTo(x - 3, y - 7);
  ctx.moveTo(x, y - 3.5);
  ctx.lineTo(x + 3, y - 7);
  ctx.stroke();
  ctx.lineCap = 'butt';
  ctx.fillStyle = '#7c8a3e';
  ctx.beginPath();
  ctx.ellipse(x, y - 8, 7.5, 3, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#8f9c4a';
  ctx.beginPath();
  ctx.ellipse(x - 1.5, y - 9.4, 4.6, 1.9, 0, 0, Math.PI * 2);
  ctx.fill();
}
// Wählt die Baumform anhand der Klimazone der Kachel.
function drawTreeFor(climate, x, y) {
  if (climate === 'polar') drawSnowyPine(x, y);
  else if (climate === 'arid') drawAcacia(x, y);
  else drawPineTree(x, y);
}
// Bodendetails auf offenem Land - Schneeverwehungen im Norden, trockene
// Grasbüschel und Steine im Süden. Ohne sie wirken gerade die baumarmen
// Savannen- und Eisinseln wie einfarbige Flächen (im ersten Bildtest sah eine
// große Wüsteninsel aus wie ein gelbes Papier). Der gemäßigte Gürtel bekommt
// bewusst NICHTS: er ist der etablierte Standard-Look, und die Kacheln dort
// sind ohnehin meist bewaldet oder bebaut.
//
// Komplett zustandslos aus hash() berechnet (wie Hühner, Fische und Möwen) -
// kein Speicherbedarf, keine Spielwirkung. Die frühe Rückkehr für den
// gemäßigten Gürtel hält die Kosten für den Normalfall bei praktisch null.
function drawGroundDetail(gx, gy, climate) {
  if (climate === 'temperate') return;
  if (viewDetail < 2) return; // aus der Ferne unsichtbar - dann gar nicht erst zeichnen
  const r = hash(gx, gy, 137);
  if (r > (climate === 'arid' ? 0.55 : 0.45)) return;
  const p = gridToScreen(gx, gy);
  ctx.save();
  ctx.translate(p.x, p.y);
  ctx.scale(camera.zoom, camera.zoom);
  const count = 1 + Math.floor(hash(gx, gy, 141) * 2);
  for (let i = 0; i < count; i++) {
    const ox = (hash(gx, gy, 150 + i * 3) - 0.5) * 22;
    const oy = (hash(gx, gy, 160 + i * 3) - 0.5) * 11;
    if (climate === 'arid') {
      if (hash(gx, gy, 170 + i) < 0.3) {
        // vereinzelter Stein
        ctx.fillStyle = 'rgba(120,104,74,0.55)';
        ctx.beginPath(); ctx.ellipse(ox, oy, 2.2, 1.4, 0, 0, Math.PI * 2); ctx.fill();
      } else {
        // trockenes Grasbüschel
        ctx.strokeStyle = 'rgba(150,132,64,0.75)';
        ctx.lineWidth = 0.9;
        ctx.beginPath();
        ctx.moveTo(ox - 2, oy + 1); ctx.lineTo(ox - 1, oy - 3);
        ctx.moveTo(ox, oy + 1); ctx.lineTo(ox + 0.4, oy - 4);
        ctx.moveTo(ox + 2, oy + 1); ctx.lineTo(ox + 3, oy - 2.6);
        ctx.stroke();
      }
    } else {
      // Schneeverwehung: flacher, etwas hellerer Bogen als der Untergrund
      ctx.fillStyle = 'rgba(250,253,255,0.6)';
      ctx.beginPath();
      ctx.ellipse(ox, oy, 5 + hash(gx, gy, 180 + i) * 4, 1.8, 0, Math.PI, Math.PI * 2);
      ctx.fill();
    }
  }
  ctx.restore();
}
function drawTrees(gx, gy, count) {
  const p = gridToScreen(gx, gy);
  const climate = climateAt(gx, gy);
  // Fernansicht: ein Wald aus 15 Kacheln, von denen jede vier einzeln
  // gezeichnete Bäumchen trägt, ist bei 16 Pixel Kachelbreite nur noch eine
  // dunkelgrüne Fläche - dieselbe Fläche entsteht aus EINER Ellipse je
  // Kachel, also mit einem Zehntel des Aufwands. Die Größe folgt weiterhin
  // der Baumzahl, damit ein dichter Wald dunkler wirkt als ein gelichteter.
  if (viewDetail === 0) {
    const { tw, th } = currentTileSize();
    const dens = Math.min(1, count / 4);
    ctx.fillStyle = climate === 'polar' ? 'rgba(46,74,68,0.85)'
      : (climate === 'arid' ? 'rgba(96,104,54,0.85)' : 'rgba(38,74,42,0.85)');
    ctx.beginPath();
    ctx.ellipse(p.x, p.y - th * 0.12, tw * (0.2 + dens * 0.16), th * (0.22 + dens * 0.16), 0, 0, Math.PI * 2);
    ctx.fill();
    return;
  }
  ctx.save();
  ctx.translate(p.x, p.y);
  ctx.scale(camera.zoom, camera.zoom);
  // Mittlere Entfernung: höchstens zwei Bäume je Kachel. Ab hier sind die
  // Stämme dünner als ein Pixel, die Krone bleibt dieselbe Fläche.
  if (viewDetail === 1) count = Math.min(count, 2);
  for (let i = 0; i < count; i++) {
    const ang = hash(gx, gy, i) * Math.PI * 2;
    const dist = 5 + hash(gx, gy, i + 50) * 9;
    const tx = Math.cos(ang) * dist * 0.95;
    const ty = Math.sin(ang) * dist * 0.45 - 3;
    drawTreeFor(climate, tx, ty);
  }
  ctx.restore();
}
// Zeichnet einen von einem Förster gepflanzten, noch nicht ausgewachsenen Baum
// je nach Wachstumsstufe (0=Setzling ... maxGrowthStage('tree')-1=fast ausgewachsen),
// oder (kind='crop') junges Getreide auf einem Feld des Bauernhofs (0..maxGrowthStage('crop')-1).
function drawSapling(gx, gy, stage, kind) {
  const p = gridToScreen(gx, gy);
  ctx.save();
  ctx.translate(p.x, p.y);
  ctx.scale(camera.zoom, camera.zoom);
  // Tabak und Gewürze teilen sich als junge Pflanzen die Getreide-Darstellung
  // (schmale, mit der Stufe wachsende Halme) - erst reif unterscheiden sie sich
  // deutlich (siehe drawRipeCrop). Nur der Farbton verrät die Frucht früher.
  if (kind === 'grape') {
    // Junge Reben (v34.24): Pfähle, an denen mit der Stufe mehr Laub wächst
    for (const px of [-8, 0, 8]) {
      ctx.strokeStyle = '#6a4a28'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(px, 5); ctx.lineTo(px, -7); ctx.stroke();
      ctx.fillStyle = '#6f9a44';
      for (let i = 0; i <= stage; i++) {
        ctx.beginPath(); ctx.ellipse(px + (i % 2 ? 1.8 : -1.8), 3 - i * 2.2, 1.8, 1.2, 0.3, 0, Math.PI * 2); ctx.fill();
      }
    }
  } else if (kind === 'crop' || kind === 'tobacco' || kind === 'spice' || kind === 'cotton' || kind === 'herb') {
    const blades = 3 + stage * 2;
    const h = 3 + stage * 2.5;
    ctx.strokeStyle = kind === 'tobacco' ? '#7d9040'
      : kind === 'spice' ? '#6f7a3a'
        : kind === 'cotton' ? '#5f8a5c' // kräftiges Buschgrün, dunkler als Getreide
          : kind === 'herb' ? '#5f9a44'
            : '#8a9c3a';
    ctx.lineWidth = 1.1;
    for (let i = 0; i < blades; i++) {
      const bx = -6 + (12 / (blades - 1 || 1)) * i;
      const lean = (hash(gx, gy, i) - 0.5) * 2.5;
      ctx.beginPath();
      ctx.moveTo(bx, 4);
      ctx.quadraticCurveTo(bx + lean * 0.5, 4 - h * 0.6, bx + lean, 4 - h);
      ctx.stroke();
    }
  } else if (kind === 'hops') {
    // Junger Hopfen: senkrechte Rankstangen, an denen mit wachsender Stufe
    // zunehmend viele Blattpaare hochklettern.
    const poleH = 5 + stage * 3.5;
    const leafPairs = stage + 1;
    ctx.strokeStyle = '#7a5a34';
    ctx.lineWidth = 1;
    for (const px of [-4, 4]) {
      ctx.beginPath();
      ctx.moveTo(px, 5);
      ctx.lineTo(px, 5 - poleH);
      ctx.stroke();
      ctx.strokeStyle = '#6a9c44';
      ctx.lineWidth = 1.2;
      for (let i = 0; i < leafPairs; i++) {
        const ly = 5 - (i + 0.8) * (poleH / (leafPairs + 0.5));
        ctx.beginPath();
        ctx.ellipse(px - 2.2, ly, 1.8, 1, 0.4, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.ellipse(px + 2.2, ly, 1.8, 1, -0.4, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.strokeStyle = '#7a5a34';
      ctx.lineWidth = 1;
    }
  } else if (stage <= 0) {
    ctx.strokeStyle = '#3d7a44';
    ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.moveTo(0, 3); ctx.lineTo(0, -3); ctx.stroke();
    ctx.fillStyle = '#4c9a52';
    ctx.beginPath(); ctx.ellipse(-2.3, -2, 2.2, 1.2, -0.5, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(2.3, -2, 2.2, 1.2, 0.5, 0, Math.PI * 2); ctx.fill();
  } else {
    const s = stage === 1 ? 0.5 : 0.78;
    ctx.scale(s, s);
    drawPineTree(0, 0);
  }
  ctx.restore();
}
// Zeichnet ein ausgewachsenes, erntereifes Getreidefeld (Weizenbüschel).
function drawCropRipe(gx, gy) {
  const p = gridToScreen(gx, gy);
  ctx.save();
  ctx.translate(p.x, p.y);
  ctx.scale(camera.zoom, camera.zoom);
  for (let i = 0; i < 7; i++) {
    const bx = -9 + (18 / 6) * i;
    const lean = (hash(gx, gy, i + 20) - 0.5) * 3;
    ctx.strokeStyle = '#d9c14c';
    ctx.lineWidth = 1.3;
    ctx.beginPath();
    ctx.moveTo(bx, 5);
    ctx.quadraticCurveTo(bx + lean * 0.5, -2, bx + lean, -8);
    ctx.stroke();
    ctx.fillStyle = '#e0b93e';
    ctx.beginPath();
    ctx.ellipse(bx + lean, -8, 1.6, 3, 0, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
}
// Zeichnet ein ausgewachsenes, erntereifes Hopfenfeld: hohe Rankstangen mit
// hängenden, zapfenförmigen Hopfendolden-Büscheln.
function drawHopsRipe(gx, gy) {
  const p = gridToScreen(gx, gy);
  ctx.save();
  ctx.translate(p.x, p.y);
  ctx.scale(camera.zoom, camera.zoom);
  const poles = [-9, -3, 3, 9];
  for (const px of poles) {
    const lean = (hash(gx, gy, px + 30) - 0.5) * 2;
    ctx.strokeStyle = '#6a4a28';
    ctx.lineWidth = 1.1;
    ctx.beginPath();
    ctx.moveTo(px, 6);
    ctx.lineTo(px + lean, -13);
    ctx.stroke();
    // hängende Hopfendolden in mehreren Höhen
    for (let i = 0; i < 3; i++) {
      const cy = -3 - i * 4.2;
      const cx = px + lean * (0.3 + i * 0.25);
      ctx.fillStyle = '#a8c25a';
      ctx.beginPath();
      ctx.ellipse(cx, cy, 2, 3.2, 0.15, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = 'rgba(70,90,30,0.5)';
      ctx.lineWidth = 0.6;
      ctx.beginPath();
      ctx.moveTo(cx, cy - 3); ctx.lineTo(cx, cy + 3);
      ctx.stroke();
    }
  }
  ctx.restore();
}
// Zeichnet eine Gebirgskachel als zwei bis drei überlappende, kantige
// Felsbrocken; bei hasIron=true zusätzlich kleine rostrot-goldene
// Erzadern-Glanzpunkte als Hinweis auf ein abbaubares Eisenvorkommen.
// Wasseroberfläche: ein paar helle, leicht auf und ab wandernde Wellenstriche
// pro Kachel. Die Phase kommt aus hash(gx, gy) - dadurch wogt jede Kachel
// eigenständig und das Meer wirkt lebendig statt wie eine gekachelte Fläche.
// Bei stark herausgezoomter Ansicht werden die Wellen weggelassen: sie wären
// dann nur noch ein unruhiges Flimmern und kosten bei einem großen Meer
// unnötig Zeichenzeit.
// Bodenfarbe eines bestellten Feldes je Frucht. Bewusst klimaunabhängig
// (siehe drawTile): ein bewirtschaftetes Feld soll in jeder Zone sofort als
// Anbaufläche erkennbar sein.
const FIELD_COLORS = { crop: '#a8965a', hops: '#93985a', tobacco: '#9c8552', spice: '#a87a4a', cotton: '#9d9a76', grape: '#a08a62', herb: '#7f8f5a' };
// Süden: reifer Tabak - breite, hängende Blätter an einem kräftigen Stängel.
function drawTobaccoRipe(gx, gy) {
  ctx.fillStyle = '#7c6a3a';
  for (const px of [-8, -1, 6]) {
    const lean = (hash(gx, gy, px + 61) - 0.5) * 2;
    ctx.strokeStyle = '#6b5c30'; ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.moveTo(px, 5); ctx.lineTo(px + lean, -7); ctx.stroke();
    ctx.fillStyle = '#8a9c4a';
    for (let i = 0; i < 3; i++) {
      const ly = 2 - i * 3.4;
      const side = i % 2 ? 1 : -1;
      ctx.beginPath();
      ctx.ellipse(px + lean * 0.5 + side * 3.2, ly, 3.6, 1.8, side * 0.4, 0, Math.PI * 2);
      ctx.fill();
    }
  }
}
// Süden: reife Gewürze - niedrige Büschel mit auffällig roten Kapseln, damit
// sie sich aus der Iso-Distanz klar vom Tabak unterscheiden.
function drawSpiceRipe(gx, gy) {
  for (const px of [-8, -2, 5, 10]) {
    const h = 4 + hash(gx, gy, px + 71) * 3;
    ctx.strokeStyle = '#6f7a3a'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(px, 5); ctx.lineTo(px, 5 - h); ctx.stroke();
    ctx.fillStyle = '#c9682e';
    ctx.beginPath(); ctx.arc(px, 5 - h - 1.4, 1.9, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#e08a44';
    ctx.beginPath(); ctx.arc(px - 0.6, 5 - h - 2, 0.8, 0, Math.PI * 2); ctx.fill();
  }
}
// Süden: reife Baumwolle (NEU, v34.15) - niedrige, runde Büsche mit WEISSEN
// Kapseln. Das Weiß ist hier das ganze Erkennungszeichen: alle übrigen
// Feldfrüchte des Spiels sind gelb (Getreide), grün (Hopfen), braun (Tabak)
// oder rot (Gewürze), eine weiße Frucht kann also mit keiner verwechselt
// werden - auch nicht aus der Iso-Distanz, in der Form kaum noch zählt.
function drawCottonRipe(gx, gy) {
  for (const px of [-8, -1, 7]) {
    const h = 3.5 + hash(gx, gy, px + 91) * 1.5;
    // Buschgrün als Sockel
    ctx.fillStyle = '#5f8a5c';
    ctx.beginPath(); ctx.ellipse(px, 4 - h * 0.4, 3.6, 2.4, 0, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#4a6b48'; ctx.lineWidth = 0.9;
    ctx.beginPath(); ctx.moveTo(px, 5); ctx.lineTo(px, 5 - h); ctx.stroke();
    // Zwei bis drei Kapseln je Busch, leicht versetzt
    const bolls = 2 + (hash(gx, gy, px + 97) > 0.5 ? 1 : 0);
    for (let i = 0; i < bolls; i++) {
      const bx = px - 2 + i * 2;
      const by = 5 - h - 1 + (hash(gx, gy, px + i + 101) - 0.5) * 1.6;
      ctx.fillStyle = '#f7f4ec';
      ctx.strokeStyle = 'rgba(90,100,80,0.45)'; ctx.lineWidth = 0.5;
      ctx.beginPath(); ctx.arc(bx, by, 1.5, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      // kleiner Schattenkern, damit die Kapsel nicht als flacher Punkt liest
      ctx.fillStyle = 'rgba(200,198,184,0.9)';
      ctx.beginPath(); ctx.arc(bx + 0.4, by + 0.4, 0.7, 0, Math.PI * 2); ctx.fill();
    }
  }
}
// Traubenrispe (v34.24) - auch am Winzerhof und in der Kelterei benutzt
function drawGrapeBunch(x, y, sc) {
  ctx.fillStyle = '#6a2f6a';
  for (const [dx, dy] of [[-1.2, 0], [0, 0], [1.2, 0], [-0.6, 1.1], [0.6, 1.1], [0, 2.2]]) {
    ctx.beginPath(); ctx.arc(x + dx * sc, y + dy * sc, 0.8 * sc, 0, Math.PI * 2); ctx.fill();
  }
  ctx.fillStyle = 'rgba(220,180,230,0.6)';
  ctx.beginPath(); ctx.arc(x - 0.4 * sc, y - 0.3 * sc, 0.3 * sc, 0, Math.PI * 2); ctx.fill();
}
// Süden: reife Reben (v34.24) - Pfähle mit Laub und dunklen Traubenrispen
function drawGrapeRipe(gx, gy) {
  for (const px of [-8, 0, 8]) {
    ctx.strokeStyle = '#6a4a28'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(px, 5); ctx.lineTo(px, -7); ctx.stroke();
    ctx.fillStyle = '#5f8a3c';
    for (const [lx, ly] of [[-2, -6], [2, -5], [-1.5, -2], [2, -1.5]]) {
      ctx.beginPath(); ctx.ellipse(px + lx, ly, 2.4, 1.6, 0.3, 0, Math.PI * 2); ctx.fill();
    }
    drawGrapeBunch(px - 1.8 + hash(gx, gy, px + 131), 0.5, 1.15);
    drawGrapeBunch(px + 2, -2.2, 1);
  }
}
// Heilkräuter (v34.24): niedrige, buschige Polster mit kleinen violetten und
// weißen Blüten - Lavendel, Kamille, Salbei.
function drawHerbRipe(gx, gy) {
  for (const px of [-9, -3, 3, 9]) {
    const h = 2.5 + hash(gx, gy, px + 141) * 1.5;
    ctx.fillStyle = '#5f9a44';
    ctx.beginPath(); ctx.ellipse(px, 4 - h * 0.5, 3, h, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = (px + 9) % 2 ? '#f2f0e0' : '#9a7ad0';
    for (let i = 0; i < 3; i++) {
      ctx.beginPath(); ctx.arc(px - 1.6 + i * 1.6, 4 - h * 1.3 + (i % 2) * 0.8, 0.8, 0, Math.PI * 2); ctx.fill();
    }
  }
}
// Gemeinsamer Einstieg fürs Zeichnen einer reifen Feldfrucht - eine wachsende
// ODER-Kette in drawTile hätte bei jeder neuen Frucht nachgezogen werden müssen.
function drawRipeCrop(gx, gy, kind) {
  if (kind === 'hops') { drawHopsRipe(gx, gy); return; }
  const p = gridToScreen(gx, gy);
  if (kind === 'tobacco' || kind === 'spice' || kind === 'cotton' || kind === 'grape' || kind === 'herb') {
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.scale(camera.zoom, camera.zoom);
    if (kind === 'tobacco') drawTobaccoRipe(gx, gy);
    else if (kind === 'spice') drawSpiceRipe(gx, gy);
    else if (kind === 'grape') drawGrapeRipe(gx, gy);
    else if (kind === 'herb') drawHerbRipe(gx, gy);
    else drawCottonRipe(gx, gy);
    ctx.restore();
    return;
  }
  drawCropRipe(gx, gy);
}
function drawWaterSurface(gx, gy, tile) {
  const { tw, th } = currentTileSize();
  // Wasser ist auf einer Archipelkarte die häufigste Kachel überhaupt - was
  // hier je Kachel passiert, bestimmt die Bildrate. Wellen und Schaumsaum
  // sind reine Nahansicht-Stimmung und entfallen ab mittlerer Entfernung;
  // das Treibeis bleibt länger, weil es ein größeres, sichtbares Objekt ist.
  if (viewDetail === 0) return;
  const p = gridToScreen(gx, gy);
  // Drei unabhängige Zufallswerte pro Kachel: Phase, Anzahl und Platzierung
  // der Wellen. Ohne diese Variation bekäme JEDE Wasserkachel exakt dieselben
  // Wellenstriche an derselben Stelle - das Meer sähe dann aus wie ein
  // gekacheltes Fischschuppen-Muster statt wie eine Wasserfläche.
  const r1 = hash(gx, gy, 3), r2 = hash(gx, gy, 11), r3 = hash(gx, gy, 27);
  const phase = r1 * Math.PI * 2;
  const t = animClock / 1000;
  ctx.save();
  ctx.lineCap = 'round';
  // Treibeis im Nordmeer: auf einem kleinen Teil der Kacheln des Polargürtels
  // schwimmt eine Eisscholle. Rein zustandslos aus hash() berechnet (wie die
  // Hühner und Fische), also kein Speicherbedarf - und sie schaukelt leicht,
  // damit sie nicht wie ein Malfehler auf dem Wasser klebt.
  if (climateAt(gx, gy) === 'polar' && hash(gx, gy, 83) < 0.055) {
    const drift = Math.sin(t * 0.35 + phase) * (tw * 0.03);
    const size = 0.2 + hash(gx, gy, 91) * 0.18;
    ctx.save();
    ctx.translate(p.x + drift, p.y + Math.cos(t * 0.28 + phase) * (th * 0.04));
    ctx.fillStyle = 'rgba(232,242,246,0.92)';
    ctx.strokeStyle = 'rgba(150,180,196,0.8)';
    ctx.lineWidth = 0.8;
    ctx.beginPath();
    ctx.moveTo(-tw * size, 0);
    ctx.lineTo(-tw * size * 0.35, -th * size * 0.9);
    ctx.lineTo(tw * size * 0.75, -th * size * 0.5);
    ctx.lineTo(tw * size * 0.6, th * size * 0.55);
    ctx.lineTo(-tw * size * 0.4, th * size * 0.8);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    ctx.restore();
  }
  if (viewDetail < 2) { ctx.restore(); return; }
  // Mal eine, mal zwei Wellenlinien - unterschiedlich hoch, breit und schnell.
  const waveCount = r2 < 0.35 ? 1 : 2;
  for (let i = 0; i < waveCount; i++) {
    const rw = hash(gx, gy, 40 + i * 7);
    const yFrac = -0.42 + rw * 0.8;                 // irgendwo über die Kachelhöhe verteilt
    const xOff = (hash(gx, gy, 60 + i * 5) - 0.5) * (tw * 0.22);
    const wFrac = 0.18 + rw * 0.2;
    const speed = 0.7 + rw * 0.6;
    const alpha = 0.14 + rw * 0.16;
    const bob = Math.sin(t * speed + phase + i * 1.9) * (th * 0.06);
    const cy = p.y + yFrac * (th / 2) + bob;
    const halfW = wFrac * (tw / 2);
    const drift = Math.cos(t * speed * 0.7 + phase) * (tw * 0.05);
    ctx.strokeStyle = `rgba(210, 236, 248, ${alpha})`;
    ctx.lineWidth = Math.max(0.9, th * 0.04);
    ctx.beginPath();
    ctx.moveTo(p.x + xOff - halfW + drift, cy);
    ctx.quadraticCurveTo(p.x + xOff + drift, cy - th * 0.07, p.x + xOff + halfW + drift, cy);
    ctx.stroke();
  }
  // Flachwasser am Ufer: heller, leicht pulsierender Schaumsaum - bewusst
  // dezent und in Größe/Lage pro Kachel variiert, damit daraus keine Reihe
  // gleich großer heller Flecken wird.
  if (tile.shallow) {
    const pulse = 0.85 + 0.15 * Math.sin(t * 1.3 + phase);
    ctx.fillStyle = `rgba(226, 242, 250, ${0.07 + r3 * 0.05})`;
    ctx.beginPath();
    ctx.ellipse(
      p.x + (r2 - 0.5) * tw * 0.18,
      p.y + (r3 - 0.4) * th * 0.3,
      tw * (0.12 + r3 * 0.1) * pulse,
      th * (0.08 + r2 * 0.06) * pulse,
      0, 0, Math.PI * 2
    );
    ctx.fill();
  }
  ctx.restore();
}
// `ore` ist seit v29 die ERZART der Kachel ('iron' | 'gold' | null, siehe
// oreOfTile) statt eines bloßen Ja/Nein. Beide Adern hellen den Fels gleich
// auf; unterschieden werden sie über die Farbe der Sprenkel - rostorange für
// Eisen, warmes Gold für Gold. Das ist der einzige Ort, an dem der Spieler
// eine Goldader von einer Eisenader unterscheiden kann, bevor er die Mine
// hinstellt, also muss der Unterschied deutlich ausfallen.
// `stoneLeft` ist der Rest-Steinvorrat der Kachel (v30). Der Fels SCHRUMPFT
// damit sichtbar: erst fallen die kleineren Brocken weg, dann wird der letzte
// flacher. Ohne diese Rückmeldung wäre ein zu 90% abgetragener Berg von einem
// unberührten nicht zu unterscheiden - und der Spieler stünde plötzlich vor
// einer Kachel, die kommentarlos zu Grasland geworden ist.
function drawMountainRock(gx, gy, ore, stoneLeft) {
  const hasIron = !!ore;
  // 1 bei vollem Vorrat, 0 kurz vor dem Verschwinden. STONE_PER_MOUNTAIN_MAX
  // als Bezugsgröße, damit reiche und arme Kacheln gleich aussehen, solange
  // beide voll sind - abgetragen wird ja nur relativ zum eigenen Vorrat.
  const fill = stoneLeft === undefined ? 1
    : Math.max(0, Math.min(1, stoneLeft / STONE_PER_MOUNTAIN_MIN));
  const p = gridToScreen(gx, gy);
  // Fernansicht: EIN Felsklotz statt drei Brocken mit Schneeauflage, Rissen
  // und Erzsprenkeln. Die Erzader bleibt trotzdem erkennbar - sie ist eine
  // Spielinformation und der einzige Grund, an einer Stelle eine Mine zu
  // bauen, also darf sie beim Herauszoomen nicht als Erstes verschwinden.
  if (viewDetail === 0) {
    if (fill <= 0) return;
    const { tw, th } = currentTileSize();
    const climateFar = climateAt(gx, gy);
    ctx.fillStyle = ore ? (ore === 'gold' ? '#b79246'
      : ore === 'copper' ? '#8a9a7e'   // Grünspan-Stich, schon aus der Ferne
        : ore === 'diamond' ? '#a8c2cc' // kühles Hellgrau-Blau
          : '#9a7d63')
      : (climateFar === 'polar' ? '#8794a0' : (climateFar === 'arid' ? '#8a7a5c' : '#6e6a63'));
    const s = 0.5 + 0.5 * fill;
    ctx.beginPath();
    ctx.moveTo(p.x - tw * 0.26 * s, p.y + th * 0.14);
    ctx.lineTo(p.x - tw * 0.08 * s, p.y - th * 0.34 * s);
    ctx.lineTo(p.x + tw * 0.14 * s, p.y - th * 0.2 * s);
    ctx.lineTo(p.x + tw * 0.27 * s, p.y + th * 0.16);
    ctx.closePath();
    ctx.fill();
    return;
  }
  ctx.save();
  ctx.translate(p.x, p.y);
  ctx.scale(camera.zoom, camera.zoom);
  // Fels nimmt die Klimazone auf: im Norden kaltes, ins Blaugraue gehendes
  // Gestein mit Schneeauflage, im Süden warm-sandiger Stein. Erzadern
  // bleiben in jeder Zone erkennbar heller als der Umgebungsfels -
  // das ist eine Spielinformation und darf vom Klima nicht verschluckt werden.
  const climate = climateAt(gx, gy);
  const rockTint = climate === 'polar' ? { base: '#8794a0', dark: '#5b6672', iron: '#9c9280', ironDark: '#6b6153' }
    : climate === 'arid' ? { base: '#8a7a5c', dark: '#5e5240', iron: '#a8916a', ironDark: '#73603f' }
      : { base: '#6e6a63', dark: '#4a4740', iron: '#8b7d6b', ironDark: '#5f5346' };
  const baseGray = hasIron ? rockTint.iron : rockTint.base;
  const darkGray = hasIron ? rockTint.ironDark : rockTint.dark;
  const rocks = [
    { dx: -6, dy: 2, s: 1.0, keepAt: 0 },     // der Hauptbrocken bleibt bis zuletzt
    { dx: 5, dy: -2, s: 0.82, keepAt: 0.35 }, // fällt weg, wenn ein Drittel übrig ist
    { dx: -1, dy: 6, s: 0.68, keepAt: 0.65 }  // fällt als erster weg
  ];
  for (const r of rocks) {
    if (fill < r.keepAt) continue; // abgetragener Brocken
    ctx.save();
    ctx.translate(r.dx, r.dy);
    // Der verbleibende Fels wird zusätzlich flacher, je weniger drin ist -
    // nie kleiner als 55%, sonst verschwände er unbemerkt statt sichtbar
    // abgetragen zu werden.
    const shrink = 0.55 + 0.45 * Math.min(1, fill / 0.85);
    ctx.scale(r.s * shrink, r.s * shrink);
    ctx.beginPath();
    ctx.moveTo(-9, 4);
    ctx.lineTo(-10, -3);
    ctx.lineTo(-3, -9);
    ctx.lineTo(5, -7);
    ctx.lineTo(10, -1);
    ctx.lineTo(7, 5);
    ctx.lineTo(-2, 7);
    ctx.closePath();
    ctx.fillStyle = baseGray;
    ctx.fill();
    ctx.strokeStyle = darkGray;
    ctx.lineWidth = 1;
    ctx.stroke();
    ctx.strokeStyle = 'rgba(0,0,0,0.18)';
    ctx.lineWidth = 0.8;
    ctx.beginPath();
    ctx.moveTo(-3, -9); ctx.lineTo(-1, 3);
    ctx.moveTo(5, -7); ctx.lineTo(-1, 3);
    ctx.moveTo(-1, 3); ctx.lineTo(-2, 7);
    ctx.stroke();
    ctx.restore();
  }
  if (ore) {
    // Jede Aderart hat ihre eigene Sprenkelung - das ist reine SPIELINFORMATION
    // (woran erkenne ich, was meine Mine hier abbauen wird?) und muss deshalb
    // auch dann noch unterscheidbar sein, wenn die Kachel nur wenige Pixel
    // groß ist. Deshalb unterscheiden sich die vier nicht nur im Farbton,
    // sondern auch in Zahl, Größe und Glanz der Punkte:
    //   Eisen    - vier stumpfe, rostrote Flecken (unverändert seit v29)
    //   Gold     - fünf warme Flecken mit hellem Glanzpunkt, funkelt
    //   Kupfer   - vier kupferrote Flecken mit GRÜNSPAN-Rand, funkelt nicht
    //   Diamant  - drei kleine, kühl-weiße Punkte mit kräftigem Stern-Glanz
    const funken = ore === 'diamond' ? 3 : (ore === 'gold' ? 5 : 4);
    for (let i = 0; i < funken; i++) {
      const ang = hash(gx, gy, i + 5) * Math.PI * 2;
      const dist = 3 + hash(gx, gy, i + 15) * 7;
      const ox = Math.cos(ang) * dist, oy = Math.sin(ang) * dist * 0.6 - 2;
      if (ore === 'copper') {
        // Grünspan-Hof um den kupferroten Kern - Kupfer oxidiert, und genau
        // dieses Grün unterscheidet es aus der Ferne vom rostroten Eisen.
        ctx.fillStyle = 'rgba(74,166,128,0.75)';
        ctx.beginPath();
        ctx.ellipse(ox, oy, 2.1, 1.5, ang, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#b87333';
        ctx.beginPath();
        ctx.ellipse(ox, oy, 1.3, 0.9, ang, 0, Math.PI * 2);
        ctx.fill();
        continue;
      }
      if (ore === 'diamond') {
        // Kleiner, heller Kern plus ein gekreuzter Lichtstrahl - ein Diamant
        // liest sich über seinen STERN, nicht über seine Farbe (weiß auf
        // hellgrauem Fels wäre sonst kaum zu sehen).
        ctx.fillStyle = '#e8fbff';
        ctx.beginPath();
        ctx.arc(ox, oy, 1.1, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = 'rgba(255,255,255,0.9)';
        ctx.lineWidth = 0.6;
        ctx.beginPath();
        ctx.moveTo(ox - 2.4, oy); ctx.lineTo(ox + 2.4, oy);
        ctx.moveTo(ox, oy - 1.8); ctx.lineTo(ox, oy + 1.8);
        ctx.stroke();
        ctx.fillStyle = 'rgba(150,220,240,0.9)';
        ctx.beginPath();
        ctx.arc(ox + 0.4, oy + 0.4, 0.5, 0, Math.PI * 2);
        ctx.fill();
        continue;
      }
      const isGold = ore === 'gold';
      ctx.fillStyle = isGold ? '#f0c419' : '#d98a3d';
      ctx.beginPath();
      ctx.ellipse(ox, oy, 1.6, 1.1, ang, 0, Math.PI * 2);
      ctx.fill();
      if (isGold) {
        ctx.fillStyle = 'rgba(255,250,214,0.95)';
        ctx.beginPath();
        ctx.ellipse(ox - 0.4, oy - 0.4, 0.6, 0.42, ang, 0, Math.PI * 2);
        ctx.fill();
      }
    }
  }
  // Schneehauben auf den Felsspitzen im Norden - über allem anderen, damit sie
  // auch die Eisenader-Punkte teilweise überdecken (frisch verschneiter Fels).
  if (climate === 'polar') {
    ctx.fillStyle = 'rgba(238,244,246,0.9)';
    for (const [sx, sy, sw] of [[-6, -8, 5], [3, -6, 6], [-1, -2, 4]]) {
      ctx.beginPath();
      ctx.ellipse(sx, sy, sw, sw * 0.42, 0, Math.PI, Math.PI * 2);
      ctx.fill();
    }
  }
  ctx.restore();
}
const ROAD_NEIGHBOR_DIRS = [[1, 0], [-1, 0], [0, 1], [0, -1]];
function drawRoadOverlay(gx, gy) {
  const tile = map[gy][gx];
  const isStone = !!tile.stoneRoad;
  const pts = tileDiamond(gx, gy);
  const c = { x: (pts[0].x + pts[2].x) / 2, y: (pts[0].y + pts[2].y) / 2 };
  const s = 0.55;
  // Steinweg: heller, grauer Pflasterbelag statt des braunen Erdwegs -
  // macht auf einen Blick sichtbar, wo Träger schneller unterwegs sind.
  ctx.fillStyle = isStone ? '#9a958f' : '#8a7355';

  // zentrale, leicht eingerückte Raute (Basiskachel des Straßenbelags)
  ctx.beginPath();
  ctx.moveTo(c.x + (pts[0].x - c.x) * s, c.y + (pts[0].y - c.y) * s);
  ctx.lineTo(c.x + (pts[1].x - c.x) * s, c.y + (pts[1].y - c.y) * s);
  ctx.lineTo(c.x + (pts[2].x - c.x) * s, c.y + (pts[2].y - c.y) * s);
  ctx.lineTo(c.x + (pts[3].x - c.x) * s, c.y + (pts[3].y - c.y) * s);
  ctx.closePath();
  ctx.fill();

  // Verbindungsstege zu benachbarten Straßenkacheln, damit das Wegenetz
  // optisch durchgängig wirkt statt aus einzelnen Inseln zu bestehen.
  const { th } = currentTileSize();
  const halfWidth = th * 0.22;
  for (const [dgx, dgy] of ROAD_NEIGHBOR_DIRS) {
    const nx = gx + dgx, ny = gy + dgy;
    if (!inBounds(nx, ny) || !map[ny][nx].road) continue;
    const nCenter = gridToScreen(nx, ny);
    const dirX = nCenter.x - c.x, dirY = nCenter.y - c.y;
    const len = Math.hypot(dirX, dirY) || 1;
    const ux = dirX / len, uy = dirY / len;
    const px = -uy * halfWidth, py = ux * halfWidth;
    const midX = c.x + dirX * 0.5, midY = c.y + dirY * 0.5;
    ctx.beginPath();
    ctx.moveTo(c.x + px, c.y + py);
    ctx.lineTo(c.x - px, c.y - py);
    ctx.lineTo(midX - px, midY - py);
    ctx.lineTo(midX + px, midY + py);
    ctx.closePath();
    ctx.fill();
  }

  if (isStone) {
    // Kleine helle Pflasterstein-Sprenkel als Textur, damit der Steinweg
    // auch aus der Nähe erkennbar anders wirkt als der einfarbige Erdweg.
    ctx.fillStyle = 'rgba(230, 226, 216, 0.55)';
    for (const [ox, oy] of [[-6, -2], [5, 3], [-2, 5], [3, -5]]) {
      ctx.beginPath();
      ctx.arc(c.x + ox * s, c.y + oy * s * 0.5, 1.3, 0, Math.PI * 2);
      ctx.fill();
    }
  }
}
// ---- Gebäude-Rendering (Anno-artige, detailreiche Vektor-Gebäude) ---------
// Reine Canvas-Vektorzeichnungen (kein Bildmaterial) - aber mit deutlich mehr
// Tiefe als zuvor: Fundament, Wandverlauf mit Schattenseite, Fachwerkbalken,
// First-/Ziegeltextur auf dem Dach, animierter Rauch/Funken/Flügel (über die

// Malt kleine, langsam aufsteigende und verblassende Rauchschwaden über einem
// Kamin. `seed` versetzt die Phase pro Gebäude, damit mehrere Kamine nicht
// exakt synchron rauchen.
// Schornsteinrauch. `smokeSuppressed` wird von drawBuilding für die Dauer
// EINES Gebäudes gesetzt (v31.1): aus dem Schlot eines von Hand gestoppten
// Betriebs soll nichts mehr qualmen. Über eine Modulvariable statt über einen
// Parameter, weil drawSmoke an über einem Dutzend Stellen aufgerufen wird und
// die Sperre immer für das ganze Gebäude gilt, nie für einzelne Schlote.
let smokeSuppressed = false;
function drawSmoke(x, y, seed) {
  if (smokeSuppressed) return;
  for (let i = 0; i < 3; i++) {
    const phase = ((animClock * 0.0006) + seed + i * 0.34) % 1;
    const puffY = y - phase * 22;
    const puffX = x + Math.sin(phase * Math.PI * 2 + seed * 6) * 3.2;
    const r = 2 + phase * 4;
    const alpha = 0.32 * (1 - phase);
    ctx.fillStyle = `rgba(210,206,198,${alpha.toFixed(3)})`;
    ctx.beginPath();
    ctx.arc(puffX, puffY, r, 0, Math.PI * 2);
    ctx.fill();
  }
}
// Flammen + Rauch für ein brennendes Gebäude (NEU, v34.7) - dieselbe Bauweise
// wie drawSmoke (mehrere phasenversetzte Formen über animClock, `seed`
// versetzt die Phase je Gebäude), aber in Flammenfarben und bewusst OHNE
// Kopplung an `smokeSuppressed`: ein Brand ignoriert eine von Hand gestoppte
// Produktion, er brennt so oder so weiter. Wird generisch nach der
// gebäudespezifischen Zeichnung aufgerufen (siehe drawBuilding), nicht in
// jedem einzelnen Typ-Zweig - ein Brand kann JEDES Gebäude treffen.
function drawFireFlames(x, y, seed) {
  for (let i = 0; i < 3; i++) {
    const phase = ((animClock * 0.0007) + seed + i * 0.31) % 1;
    const puffY = y - 6 - phase * 26;
    const puffX = x + Math.sin(phase * Math.PI * 2 + seed * 5) * 4;
    const r = 2.4 + phase * 5;
    const alpha = 0.34 * (1 - phase);
    ctx.fillStyle = `rgba(60,56,50,${alpha.toFixed(3)})`;
    ctx.beginPath(); ctx.arc(puffX, puffY, r, 0, Math.PI * 2); ctx.fill();
  }
  for (let i = 0; i < 3; i++) {
    const flick = Math.sin(animClock * 0.012 + seed * 9 + i * 2.1) * 1.6;
    const fx = x + (i - 1) * 4.2 + flick * 0.4;
    const fy = y - 2;
    const h = 9 + Math.abs(flick) * 1.4 + (i === 1 ? 3 : 0);
    const grad = ctx.createLinearGradient(fx, fy, fx, fy - h);
    grad.addColorStop(0, 'rgba(232,60,30,0.95)');
    grad.addColorStop(0.55, 'rgba(245,140,30,0.92)');
    grad.addColorStop(1, 'rgba(255,224,90,0.85)');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.moveTo(fx - 3, fy);
    ctx.quadraticCurveTo(fx - 4 + flick, fy - h * 0.55, fx, fy - h);
    ctx.quadraticCurveTo(fx + 4 + flick, fy - h * 0.55, fx + 3, fy);
    ctx.closePath();
    ctx.fill();
  }
}
// Zeichnet ein kleines Sprossenfenster, optional mit Fensterläden.
function drawWindow(x, y, w, h, shutterColor) {
  if (shutterColor) {
    ctx.fillStyle = shutterColor;
    ctx.fillRect(x - w * 0.55, y, w * 0.4, h);
    ctx.fillRect(x + w * 1.15, y, w * 0.4, h);
  }
  // Nachts brennt hinter dem Fenster Licht: die Scheibe wird warm gelb statt
  // kalt blaugrau und bekommt einen weichen Schein nach außen. Weil ALLE
  // Gebäude ihre Fenster über diese eine Funktion zeichnen, genügt die
  // Änderung hier, um das ganze Dorf abends zum Leuchten zu bringen.
  const lit = nightLightFactor();
  if (lit > 0.02) {
    ctx.save();
    ctx.globalAlpha = lit * 0.5;
    ctx.fillStyle = '#ffcf6a';
    ctx.beginPath();
    ctx.ellipse(x + w / 2, y + h / 2, w * 1.5, h * 1.5, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
  ctx.fillStyle = lit > 0.02 ? shade('#3a4a52', Math.round(lit * 120)) : '#3a4a52';
  ctx.fillRect(x, y, w, h);
  ctx.fillStyle = lit > 0.02
    ? `rgba(255, 226, 150, ${0.55 + lit * 0.4})`
    : 'rgba(255, 235, 180, 0.55)';
  ctx.fillRect(x + 0.6, y + 0.6, w - 1.2, h * (0.45 + lit * 0.5));
  ctx.strokeStyle = '#2a2016';
  ctx.lineWidth = 0.7;
  ctx.strokeRect(x, y, w, h);
  ctx.beginPath();
  ctx.moveTo(x + w / 2, y); ctx.lineTo(x + w / 2, y + h);
  ctx.moveTo(x, y + h / 2); ctx.lineTo(x + w, y + h / 2);
  ctx.stroke();
}
// Gemeinsamer "Rohbau": Steinfundament, Wände mit Volumen-Verlauf und
// Fachwerkbalken, Satteldach mit First, Dachüberstand und Ziegeltextur.
// Liefert die wichtigsten y-Koordinaten zurück, damit die gebäudespezifischen
// Details (Fenster, Requisiten, Schornstein) sich sauber daran ausrichten.
function drawBuildingShell(cx, cy, colors, opts = {}) {
  const wallW = opts.wallW || 18;
  const wallH = opts.wallH || 22;
  const roofH = opts.roofH || 19;
  const overhang = opts.overhang || 3;
  const timber = opts.timber !== false;
  const wallTop = cy - wallH;
  const wallBottom = cy + 3;
  const roofBase = wallTop + 2;
  const roofApex = roofBase - roofH;

  ctx.fillStyle = 'rgba(0,0,0,0.25)';
  ctx.beginPath();
  ctx.ellipse(cx + 1.5, wallBottom + 3, wallW * 0.9, 5.5, 0, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = colors.foundation;
  ctx.fillRect(cx - wallW - 1, wallBottom - 3, wallW * 2 + 2, 5);
  ctx.strokeStyle = 'rgba(0,0,0,0.35)';
  ctx.lineWidth = 0.7;
  ctx.strokeRect(cx - wallW - 1, wallBottom - 3, wallW * 2 + 2, 5);
  ctx.strokeStyle = 'rgba(0,0,0,0.18)';
  for (let i = -1; i <= 1; i++) {
    ctx.beginPath();
    ctx.moveTo(cx + i * wallW * 0.66, wallBottom - 3);
    ctx.lineTo(cx + i * wallW * 0.66, wallBottom + 2);
    ctx.stroke();
  }

  const wallGrad = ctx.createLinearGradient(cx - wallW, 0, cx + wallW, 0);
  wallGrad.addColorStop(0, shade(colors.wall, 14));
  wallGrad.addColorStop(0.62, colors.wall);
  wallGrad.addColorStop(1, colors.wall2);
  ctx.fillStyle = wallGrad;
  ctx.fillRect(cx - wallW, wallTop, wallW * 2, wallH);
  ctx.strokeStyle = 'rgba(0,0,0,0.4)';
  ctx.lineWidth = 1;
  ctx.strokeRect(cx - wallW, wallTop, wallW * 2, wallH);

  if (timber) {
    ctx.strokeStyle = shade(colors.wall2, -25);
    ctx.lineWidth = 1.5;
    for (const lx of [cx - wallW + 2.5, cx, cx + wallW - 2.5]) {
      ctx.beginPath(); ctx.moveTo(lx, wallTop + 1); ctx.lineTo(lx, wallBottom - 1); ctx.stroke();
    }
    ctx.beginPath();
    ctx.moveTo(cx - wallW + 1, wallTop + wallH * 0.58);
    ctx.lineTo(cx + wallW - 1, wallTop + wallH * 0.58);
    ctx.stroke();
  }

  ctx.beginPath();
  ctx.moveTo(cx - wallW - overhang, roofBase);
  ctx.lineTo(cx, roofApex);
  ctx.lineTo(cx + wallW + overhang, roofBase);
  ctx.closePath();
  const roofGrad = ctx.createLinearGradient(cx - wallW, 0, cx + wallW, 0);
  roofGrad.addColorStop(0, shade(colors.roof, 16));
  roofGrad.addColorStop(0.55, colors.roof);
  roofGrad.addColorStop(1, shade(colors.roof, -28));
  ctx.fillStyle = roofGrad;
  ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,0.42)';
  ctx.lineWidth = 1;
  ctx.stroke();
  ctx.strokeStyle = 'rgba(0,0,0,0.16)';
  ctx.lineWidth = 0.7;
  for (let t = 0.32; t < 0.95; t += 0.22) {
    ctx.beginPath();
    ctx.moveTo(cx - (wallW + overhang) * (1 - t), roofBase - (roofBase - roofApex) * t);
    ctx.lineTo(cx + (wallW + overhang) * (1 - t), roofBase - (roofBase - roofApex) * t);
    ctx.stroke();
  }
  ctx.fillStyle = 'rgba(0,0,0,0.14)';
  ctx.fillRect(cx - wallW - overhang, roofBase, wallW * 2 + overhang * 2, 1.6);

  return { wallTop, wallBottom, roofBase, roofApex };
}
// Gebäude in der Fernansicht (Detailstufe 0): Wandblock plus Dachdreieck in
// den Farben des jeweiligen Typs, mehr nicht. Ein voll ausgebautes Dorf hat
// schnell 60-100 Gebäude, und jedes einzelne zieht sonst Fundament, Verläufe,
// Fachwerk, Fenster, Requisiten und womöglich eine Arbeiterfigur nach sich -
// bei 16 Pixel Kachelbreite alles kleiner als ein Pixel. Die Silhouette hält
// dagegen genau das, was aus der Ferne zählt: WO steht etwas und welcher Art
// ist es (die Dachfarbe unterscheidet die Typen weiterhin).
const HOUSE_FAR_COLORS = [
  { wall: '#c3ad86', roof: '#9c8348' }, // Siedlerkate: Stroh
  { wall: '#d9c9a3', roof: '#a44b36' }, // Bürgerhaus: rotes Ziegeldach
  { wall: '#e2dccc', roof: '#8c3f2e' }, // Kaufmannshaus: heller Stein
  { wall: '#efe7d4', roof: '#3d4f6e' }  // Adelssitz (v34.24): Sandstein, Schieferdach
];
function drawBuildingFar(px, py, b) {
  const { tw, th } = currentTileSize();
  // Auch aus der Ferne bleiben die drei Wohnstufen unterscheidbar - über die
  // Farbe und (siehe unten) über die Höhe. Genau dafür zoomt man heraus: um zu
  // sehen, welche Viertel schon aufgestiegen sind.
  const colors = b.type === 'house'
    ? HOUSE_FAR_COLORS[Math.min(3, b.tier || 0)]
    : (buildingColors[b.type] || { wall: '#888', roof: '#aaa' });
  const hoch = b.type === 'house' ? 0.5 + 0.18 * Math.min(3, b.tier || 0) : 0.62;
  const w = tw * 0.34, hWall = th * hoch, hRoof = th * 0.5;
  const base = py + th * 0.1;
  ctx.fillStyle = colors.wall;
  ctx.fillRect(px - w / 2, base - hWall, w, hWall);
  ctx.fillStyle = colors.roof;
  ctx.beginPath();
  ctx.moveTo(px - w * 0.62, base - hWall);
  ctx.lineTo(px, base - hWall - hRoof);
  ctx.lineTo(px + w * 0.62, base - hWall);
  ctx.closePath();

    ctx.strokeStyle = '#f2d98a';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.ellipse(px, base, tw * 0.34, th * 0.34, 0, 0, Math.PI * 2);

  // brennendes Gebäude ist dringlicher als ein angehaltener Betrieb oder ein
  // gewöhnliches "!". Größer als die übrigen Punkte, damit er auch in der
  // Fernansicht (bei vielleicht 60-100 Gebäuden auf dem Bildschirm) sofort
  // ins Auge fällt.
  if (b.onFire) {
    ctx.fillStyle = '#ff5a2e';
    ctx.beginPath();
    ctx.arc(px, base - hWall - hRoof - th * 0.22, Math.max(2.4, th * 0.17), 0, Math.PI * 2);

    // Punkt - gerade in der Übersicht will man sehen, welche Betriebe man

    ctx.arc(px, base - hWall - hRoof - th * 0.22, Math.max(1.6, th * 0.12), 0, Math.PI * 2);

      const px = cx + j0x + (j1x - j0x) * f, py = cy + j0y + (j1y - j0y) * f;

    }

    ctx.fillStyle = '#3a2c1c'; ctx.fillRect(cx + 2, s.wallBottom - 8, 5, 8);

    // `cx + 11` mit dem Mastfuß auf `s.roofApex + 2` - das Dach ist aber ein
    // DREIECK mit der Spitze bei `cx` (siehe drawBuildingShell), an dessen
    // rechter Schräge die Dachfläche bei dx=11 deutlich TIEFER liegt als
    // `roofApex + 2`. Der Mastfuß schwebte dadurch sichtbar frei über dem
    // Dach statt auf ihm zu stehen. Jetzt sitzt der Mast MITTIG auf dem
    // First (`cx`, exakt wie das Kreuz der Kapelle), wo die Dachspitze
    // tatsächlich ist - dort kann kein Versatz mehr entstehen.
    ctx.strokeStyle = colors.foundation; ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.moveTo(cx, s.roofApex + 1); ctx.lineTo(cx, s.roofApex - 12); ctx.stroke();
    ctx.fillStyle = colors.accent;
    ctx.beginPath(); ctx.moveTo(cx, s.roofApex - 12); ctx.lineTo(cx + 7, s.roofApex - 9); ctx.lineTo(cx, s.roofApex - 6); ctx.closePath(); ctx.fill();
    // Gekaufte Schiffe werden NICHT mehr statisch am Hafen gezeichnet, sondern
    // sind eigene, bewegliche Entitäten (siehe `ships`/drawShips) - sie können

    // Werft (v34.25): Helling mit Schiffsgerippe links, Holzkran rechts
    if (b.shipyard) {
      ctx.save(); ctx.translate(cx - 19, cy + 5);

      ctx.beginPath(); ctx.moveTo(-9, 4); ctx.lineTo(9, 1); ctx.stroke(); // Helling

      ctx.strokeStyle = '#8a6a44'; ctx.lineWidth = 1.2;

      }

      ctx.beginPath(); ctx.moveTo(0, 4); ctx.lineTo(0, -24); ctx.lineTo(-10, -20); ctx.stroke();
      ctx.strokeStyle = '#2a2016'; ctx.lineWidth = 0.7;
      ctx.beginPath(); ctx.moveTo(-9.5, -20); ctx.lineTo(-9.5, -12); ctx.stroke();
      ctx.fillStyle = '#8a5a34'; ctx.fillRect(-12, -12, 5, 3);

  } else if (b.type === 'furhunter') {
    // Blockhütte mit Schneedach und aufgespannten Fellen an der Wand - die

    const s = drawBuildingShell(cx, cy, colors, { wallW: 16, wallH: 17, roofH: 13, timber: false });

  } else if (b.type === 'furrier') {

    drawWindow(cx - 6, s.wallTop + 5, 4.2, 4.2, '#7a4a30');
    ctx.fillStyle = '#4a3524'; ctx.fillRect(cx + 2, s.wallBottom - 9, 5, 9);

    // dadurch wie ein Fass an der Hauswand.
    const barY = cy - 7;
    ctx.strokeStyle = '#6b4a2f'; ctx.lineWidth = 1.4; ctx.lineCap = 'round';

  } else if (b.type === 'cigarmaker') {

    const s = drawBuildingShell(cx, cy, colors, { wallW: 16, wallH: 17, roofH: 12, timber: false });
    drawWindow(cx + 4, s.wallTop + 5, 4.2, 4.2, '#9c5a3c');

      ctx.strokeStyle = 'rgba(40,44,20,0.45)'; ctx.lineWidth = 0.5;

  } else if (b.type === 'whaler') {

    // zeichen, bewusst auf verschiedene Seiten verteilt, damit keines das

    // rechts das Tranfass unter der Presse, oben der qualmende Siedekessel.

    ctx.fillStyle = '#241f1a'; ctx.fillRect(cx - 6, s.wallBottom - 9, 5.5, 9);

    // Auswärtskrümmung. Der innere Schenkel steht deshalb ein Stück VOR der

    topY = s.roofApex;
  } else if (b.type === 'goldsmith') {

  } else if (b.type === 'mint') {
    // Münzprägerei (v29): gedrungener, wehrhafter Steinbau mit schmalen

    drawWindow(cx - 4.5, s.wallTop + 5, 2.6, 5, '#2a3440');
