<style>
  :root {
    --panel-bg: rgba(28, 24, 18, 0.88);
    --panel-border: #6b5636;
    --accent: #d8b46a;
    --wood-color: #8a5a34;
    --plank-color: #d9a86a;
    --grain-color: #d9c14c;
    --flour-color: #f0e6d2;
    --bread-color: #c98a4a;
    --iron-color: #8f8f9a;
    --ironbar-color: #b8c4d6;
    --hops-color: #8fae3f;
    --beer-color: #c98a1e;
    --stone-color: #9a958a;
    --fish-color: #a8c4d0;
    --wool-color: #f0ece0;
    --cloth-color: #c07fa8;
    --clothes-color: #5fb9a4;
    --tobacco-color: #8a6b3a;
    --cigar-color: #6b3f1d;
    --spice-color: #c9682e;
    --fur-color: #7a5230;
    --furcoat-color: #c2a071;
    --oil-color: #a07b28;
    --gold-color: #d4af37;
    --copper-color: #b87333;
    --copperbar-color: #dd8b45;
    --weapon-color: #9c4a52;
    --diamond-color: #9fe4ef;
    --jewelry-color: #9a6ad8;
    --coin-color: #f7e07a;
    --meat-color: #a8563c;
    --tools-color: #8a8a94;
    --grapes-color: #7a3f78;
    --wine-color: #8c1c3a;
    --gem-color: #5fd0e0;
    --herbs-color: #6a9c4a;
    --sailcloth-color: #e6dcc0;
    --pop-color: #e8a87c;
    --text-light: #f1e6d2;
    /* Rechter HUD-Einzug für #mapHud (Minikarte + Zoom-Buttons, v34.4) -
       identisch mit dem rechten Innenabstand von #topbar, damit beide bündig
       auf derselben senkrechten Linie enden. */
    --hud-inset: 16px;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #1b2b1e;
    font-family: 'Trebuchet MS', 'Segoe UI', sans-serif;
    color: var(--text-light);
  }
  #game {
    position: relative;
    width: 100vw;
    /* iOS Safari: `100vh` misst historisch die GRÖSSTE mögliche Viewport-Höhe
       (Adressleiste/Werkzeugleiste eingerechnet als ausgeblendet), nicht die
       gerade tatsächlich sichtbare. Ist die Werkzeugleiste eingeblendet, ragt
       ein auf `100vh` hoch gesetztes #game unten über den sichtbaren Bereich
       hinaus - und weil html/body `overflow:hidden` haben, ist dieser
       überstehende Teil (genau dort, wo Baumenü/Statuszeile per `bottom:`
       verankert sind) weder sichtbar noch durch Scrollen erreichbar: exakt
       das gemeldete "abgeschnitten". `100dvh` (dynamic viewport height) passt
       sich dagegen laufend an die WIRKLICH sichtbare Höhe an; die vorangehende
       `100vh`-Zeile bleibt als Fallback für Browser ohne dvh-Unterstützung. */
    height: 100vh;
    height: 100dvh;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
    background: #2a3f2d;
    cursor: grab;
  }
  canvas.tool-active { cursor: crosshair; }
  canvas.panning { cursor: grabbing; }

  /* flex-wrap: wrap (NEU, v34.6): #titleRow allein braucht mit all seinen
     Abzeichen rund 750-760px, die vier Kernwaren in #resourcesWrap weitere
     rund 340px - zusammen rund 1100-1130px, bevor überhaupt ein Fenster
     schmaler als das ist. Ohne flex-wrap wurden BEIDE Flex-Kinder unterhalb
     dieser Breite gleichzeitig zusammengequetscht: #titleRow (siehe #title
     weiter unten) UND #resourcesWrap (das `min-width: 0` hat) - und weil die
     vier Waren-Pillen selbst NICHT schrumpfen (`.resource { flex-shrink: 0 }`,
     seit der Verschlankung auf vier feste Pillen in v34.4 ohne Scroll-
     Fallback), liefen sie bei mittleren Fensterbreiten (grob 770-1100px)
     sichtbar über den rechten Bildschirmrand hinaus, statt nur enger zu
     werden. Jetzt weicht #resourcesWrap stattdessen in eine ZWEITE Zeile
     unter die Titelzeile aus, sobald für beide zusammen kein Platz mehr ist -
     dort hat es die volle Zeilenbreite für sich und muss nicht schrumpfen.
     Erst unterhalb der separaten Handy-Schwelle (siehe Media Query weiter
     unten) übernimmt die dortige Spalten-Anordnung mit zusätzlich
     verkleinerter Schrift. #topbar hat weiterhin keine feste Höhe (wächst mit
     seinem Inhalt), darum braucht auch #mapHud (siehe dort) keine Anpassung -
     `layoutMapHud()` misst ohnehin live die tatsächliche `topbar`-Unterkante,
     ob ein- oder zweizeilig. */
  #topbar {
    position: absolute;
    top: 0; left: 0; right: 0;
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    /* flex-start statt center: der Titel soll oben bleiben, auch wenn
       #resourcesWrap (siehe unten) auf sehr schmalen Fenstern die volle
       verfügbare Höhe der Kopfzeile beansprucht. */
    align-items: flex-start;
    gap: 10px;
    padding: 10px 16px;
    background: linear-gradient(to bottom, rgba(20,16,10,0.92), rgba(20,16,10,0));
    pointer-events: none;
  }
  #titleRow {
    display: flex;
    align-items: center;
    gap: 10px;
    pointer-events: auto;
  }
  /* flex-shrink: 0 + white-space: nowrap (NEU, v34.6): ohne beides durfte der
     Titeltext bei mittleren Fensterbreiten (rund 850-1024px) auf zwei Zeilen
     umbrechen, WEIL #resourcesWrap (siehe unten) seit der Verschlankung auf
     vier Kernwaren (v34.4) viel weniger eigene Breite mehr mitbringt und
     dadurch selbst weniger zum Schrumpfen der Titelzeile beitragen konnte -
     der fehlende Rest ging zulasten von #title, dem bis dahin einzigen
     Titelzeilen-Kind OHNE eigenen Schrumpf-Schutz. Ein zweizeiliger Titel
     machte #topbar spürbar höher und schob damit auch #mapHud (siehe unten,
     `top` folgt `topbar.bottom`) unnötig weit nach unten - genau das war als
     "Minikarte trotz schlankerer Warenleiste immer noch nicht bündig oben
     rechts" gemeldet. Jetzt verhält sich #title wie seine Geschwister
     #clock/#islandName/#popBadge/#coinBadge: es bleibt einzeilig, und
     #resourcesWrap (weiterhin mit `min-width: 0`) bleibt wie ursprünglich
     vorgesehen der EINZIGE schrumpfende Nachbar. */
  #title {
    font-size: 18px;
    font-weight: bold;
    letter-spacing: 1px;
    color: var(--accent);
    text-shadow: 0 2px 3px rgba(0,0,0,0.6);
    pointer-events: none;
    flex-shrink: 0;
    white-space: nowrap;
  }
  #clock, #islandName, #popBadge, #coinBadge, #weatherBadge, #fireBadge {
    background: var(--panel-bg);
    border: 1px solid var(--panel-border);
    border-radius: 8px;
    padding: 5px 10px;
    font-size: 13px;
    font-weight: bold;
    color: var(--text-light);
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }
  /* Die Ressourcenleiste zeigt seit v25 den Bestand EINER Insel - ohne diese
     deutlich hervorgehobene Beschriftung wäre nicht erkennbar, welcher. */
  #islandName {
    color: var(--accent);
    /* flex-shrink: 0 ist hier wesentlich: als Flex-Kind der Titelzeile würde
       der Name sonst zusammengequetscht und mit "…" abgeschnitten, sobald die
       Zeile eng wird - genau das ist im ersten Bildtest passiert. */
    flex: 0 0 auto;
    max-width: 42vw;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  /* Die Bewohnerzahl stand bis v27.1 als letzte Pille in der scrollenden
     Ressourcenleiste - bei mittlerweile 20 Warentypen musste man erst dorthin
     scrollen, um die aus Spielersicht wichtigste Zahl zu sehen. Jetzt sitzt
     sie fest in der Titelzeile, sichtbar UNABHÄNGIG davon, ob die Warenleiste
     darunter auf- oder zugeklappt ist (siehe #resourcesToggle). */
  #popBadge, #coinBadge {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    gap: 4px;
  }
  /* Münzen sind seit v29 das GELD des Spiels und stehen deshalb - wie die
     Bewohnerzahl - fest in der Titelzeile statt als Pille in der scrollenden
     Warenleiste. Ihr Wert gehört zu den Zahlen, die man dauernd im Blick
     haben will, sobald es etwas zu kaufen gibt. */
  #coinBadge { color: var(--coin-color); }
  /* Das Münz-Plättchen ist als EINZIGES Warensymbol rund statt eckig - eine
     Münze soll auch ohne Beschriftung als Geldstück lesbar sein und nicht als
     weiteres Warenfach. */
  #coinBadge .swatch.coin { border-radius: 50%; border: 1px solid rgba(120, 96, 20, 0.75); }
  /* Wetter-Abzeichen: erscheint NUR, solange tatsächlich ein Wetterereignis
     läuft (siehe updateWeatherUI) - bei klarem Himmel wäre eine Dauerzeile
     „Klar" nur Rauschen in einer ohnehin vollen Kopfzeile. */
  #weatherBadge { flex-shrink: 0; display: none; }
  /* Stimmung der angezeigten Insel (NEU, v34.26) */
  #moodBadge { display: none; flex-shrink: 0; align-items: center; background: var(--panel-bg); border: 1px solid var(--panel-border);
    border-radius: 8px; padding: 5px 10px; font-size: 13px; font-weight: bold; white-space: nowrap; font-variant-numeric: tabular-nums; }
  #moodBadge.mood-happy { color: #9fd88a; border-color: #6f9e5a; }
  #moodBadge.mood-neutral { color: #e8d49a; }
  #moodBadge.mood-angry { color: #ff9a86; border-color: #c9503c; }
  #weatherBadge.active { display: block; }
  /* Feuer-Abzeichen (NEU, v34.7): erscheint nur, solange irgendwo auf der
     Karte etwas brennt (siehe updateFireBadge) - genau wie #weatherBadge,
     aber bewusst in Alarmfarben statt im neutralen Titelzeilen-Grau, weil ein
     Brand anders als Wetter aktives Handeln braucht (Feuerwache bauen/
     zuweisen), nicht nur zur Kenntnisnahme dient. */
  #fireBadge {
    flex-shrink: 0;
    display: none;
    background: rgba(168, 58, 46, 0.35);
    border-color: #c9503c;
    color: #ffd9c9;
  }
  #fireBadge.active { display: block; animation: fireBadgePulse 1.1s ease-in-out infinite; }
  /* Piraten-Abzeichen (NEU, v34.22): gleiche Bauart wie das Feuer-Abzeichen,
     dunkel statt glutrot; antippen springt zum Piratenschiff. */
  #pirateBadge {
    flex-shrink: 0; display: none; cursor: pointer;
    background: rgba(20, 18, 18, 0.75); border: 1px solid #c9503c; border-radius: 8px;
    padding: 5px 10px; font-size: 13px; font-weight: bold; color: #f3e6d8; white-space: nowrap;
  }
  #pirateBadge.active { display: block; animation: fireBadgePulse 1.4s ease-in-out infinite; }
  /* Seuchen-Abzeichen (NEU, v34.24) */
  #plagueBadge {
    flex-shrink: 0; display: none; cursor: pointer;
    background: rgba(60, 96, 40, 0.55); border: 1px solid #8fce5a; border-radius: 8px;
    padding: 5px 10px; font-size: 13px; font-weight: bold; color: #eaf7d8; white-space: nowrap;
  }
  #plagueBadge.active { display: block; animation: fireBadgePulse 1.6s ease-in-out infinite; }
  @keyframes fireBadgePulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.68; } }
  #settingsMenuWrap { position: relative; }
  /* #overviewToggle war hier bis v34.4 NICHT gelistet - der Knopf hatte
     dadurch nie eigenes Styling und blieb ein unbehandelter Browser-Standard-
     Button (auffällig hell im sonst dunklen Titelzeilen-Rahmen). Jetzt Teil
     derselben Gruppe wie die anderen beiden Symbol-Knöpfe. */
  #settingsToggle, #resourcesToggle, #overviewToggle, #statsToggle, #logToggle {
    background: var(--panel-bg);
    border: 1px solid var(--panel-border);
    color: var(--text-light);
    border-radius: 8px;
    padding: 5px 9px;
    font-size: 14px;
    cursor: pointer;
    line-height: 1;
    opacity: 0.9;
    flex-shrink: 0;
  }
  #settingsToggle:hover, #resourcesToggle:hover, #overviewToggle:hover, #statsToggle:hover, #logToggle:hover { opacity: 1; background: #3a2f22; }
  /* Ereignisprotokoll (NEU, v34.26) */
  #logToggle { position: relative; }
  #logToggleCount { display: none; position: absolute; top: -5px; right: -5px; min-width: 15px; height: 15px; padding: 0 3px;
    border-radius: 8px; background: #c9503c; color: #fff; font-size: 10px; line-height: 15px; font-weight: bold; text-align: center; }
  #logPanel {
    display: none; position: absolute; left: 50%; top: 64px; transform: translateX(-50%);
    width: min(620px, calc(100% - 24px)); max-height: calc(100% - 150px); overflow: auto;
    background: var(--panel-bg); border: 1px solid var(--panel-border); border-radius: 10px;
    padding: 10px 12px; font-size: 12px; color: var(--text-light); z-index: 8;
  }
  #logPanel .stats-head { display: flex; justify-content: space-between; margin-bottom: 6px; }
  #logPanel #logClose { cursor: pointer; opacity: 0.8; padding: 0 4px; }
  #logPanel .stats-tabs { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 6px; }
  #logPanel .stats-tabs button { background: #2e251a; color: var(--text-light); border: 1px solid var(--panel-border); border-radius: 6px; padding: 3px 8px; font-size: 11px; cursor: pointer; }
  #logPanel .stats-tabs button.active { background: #5a4630; border-color: var(--accent); }
  #logPanel .log-row { display: flex; gap: 8px; align-items: baseline; padding: 4px 6px; border-bottom: 1px solid rgba(255,255,255,0.06); border-left: 3px solid transparent; }
  #logPanel .log-row.jump { cursor: pointer; }
  #logPanel .log-row.jump:hover { background: rgba(255,255,255,0.05); }
  #logPanel .log-row.cat-danger { border-left-color: #c9503c; }
  #logPanel .log-row.cat-economy { border-left-color: #d9b44a; }
  #logPanel .log-row.cat-discovery { border-left-color: #6fa8d8; }
  #logPanel .log-row.cat-mood { border-left-color: #b57ad8; }
  #logPanel .log-when { flex: 0 0 auto; opacity: 0.65; font-size: 11px; font-variant-numeric: tabular-nums; min-width: 82px; }
  #logPanel .log-text { flex: 1 1 auto; }
  #logPanel .log-go { flex: 0 0 auto; opacity: 0.6; }
  #logPanel .log-empty { opacity: 0.7; padding: 8px 4px; }
  /* Statistikfenster (NEU, v34.24) - gleiche Bauart wie die Warenübersicht */
  #statsPanel {
    display: none; position: absolute; left: 50%; top: 64px; transform: translateX(-50%);
    width: min(680px, calc(100% - 24px)); max-height: calc(100% - 150px); overflow: auto;
    background: var(--panel-bg); border: 1px solid var(--panel-border); border-radius: 10px;
    padding: 10px 12px; font-size: 12px; color: var(--text-light); z-index: 7;
  }
  #statsPanel .stats-head { display: flex; justify-content: space-between; margin-bottom: 6px; }
  #statsPanel #statsClose { cursor: pointer; opacity: 0.8; padding: 0 4px; }
  #statsPanel .stats-tabs { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 6px; align-items: center; }
  #statsPanel .stats-tabs button { background: #2e251a; color: var(--text-light); border: 1px solid var(--panel-border); border-radius: 6px; padding: 3px 8px; font-size: 11px; cursor: pointer; }
  #statsPanel .stats-tabs button.active { background: #5a4630; border-color: var(--accent); }
  #statsPanel .stats-sep { flex: 1 1 auto; }
  #statsPanel canvas { width: 100%; height: 220px; display: block; background: #1a140d; border-radius: 6px; }
  #statsPanel .stats-legend { display: flex; flex-wrap: wrap; gap: 4px 12px; margin-top: 6px; }
  #statsPanel .stats-legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }
  #statsPanel .stats-note { flex-basis: 100%; opacity: 0.7; font-size: 11px; }
  #settingsToggle.muted { opacity: 0.5; filter: grayscale(1); }
  /* Der 📊-Knopf blendet die komplette Warenleiste unter der Titelzeile
     ein/aus (siehe #resourcesWrap.collapsed unten) - die Bewohnerzahl bleibt
     davon unberührt, weil sie seit v27.1 in #popBadge fest in der Titelzeile
     steht. Der Kompass-Pfeil zeigt denselben Rotations-Trick wie die
     aufklappbaren Baumenü-Gruppen (siehe .build-group summary::after). */
  #resourcesToggle .toggle-caret {
    display: inline-block;
    margin-left: 2px;
    transition: transform 0.15s ease;
  }
  #resourcesToggle.collapsed .toggle-caret { transform: rotate(-90deg); }
  #settingsMenu {
    display: none;
    position: absolute;
    top: calc(100% + 6px);
    left: 0;
    flex-direction: column;
    gap: 10px;
    background: var(--panel-bg);
    border: 1px solid var(--panel-border);
    border-radius: 10px;
    padding: 12px 14px;
    width: 190px;
    box-shadow: 0 6px 16px rgba(0,0,0,0.4);
    z-index: 20;
  }
  #settingsMenu.open { display: flex; }
  #settingsMenu h4 {
    margin: 0 0 2px 0;
    font-size: 11.5px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--accent);
    border-bottom: 1px solid var(--panel-border);
    padding-bottom: 5px;
  }
  .audio-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    font-size: 12.5px;
    color: var(--text-light);
    cursor: pointer;
  }
  .audio-row input[type="checkbox"] {
    width: 15px; height: 15px;
    accent-color: var(--accent);
    cursor: pointer;
  }
  .audio-volume-row {
    flex-direction: column;
    align-items: stretch;
    gap: 4px;
    cursor: default;
  }
  .audio-volume-row .audio-volume-label {
    display: flex;
    justify-content: space-between;
  }
  .audio-volume-row input[type="range"] {
    width: 100%;
    accent-color: var(--accent);
    cursor: pointer;
  }
  .audio-volume-row input[type="range"]:disabled { opacity: 0.4; cursor: not-allowed; }
  /* Bis v34.3 zeigte diese Leiste alle 20+ Warentypen einzeilig, waagerecht
     scrollbar und in zwei klappbare Gruppen sortiert (🌾 Rohstoffe,
     ⚙️ Verarbeitet) - als "lange Liste" bemängelt. Seit v34.4 stehen hier nur
     noch vier feste Kernwaren (Bretter, Stein, Werkzeuge, Brot - siehe
     HTML-Kommentar bei #resourcesWrap), die vollständige Übersicht lebt in
     der 🗂️-Warenübersicht. #resourcesWrap braucht weiterhin `min-width: 0`
     (siehe unten), sonst würde der Flex-Container NICHT schrumpfen und
     stattdessen den Titel/die Uhr aus dem sichtbaren Bereich drängen - auch
     bei nur vier Pillen bleibt das relevant, sobald z. B. ein langer
     Inselname viel Platz beansprucht.
     Die ganze Leiste lässt sich weiterhin über #resourcesToggle in der
     Titelzeile ausblenden (v27.1). Die Bewohnerzahl steht bewusst NICHT
     hier, sondern in #popBadge (siehe oben) - sie soll auch bei
     zugeklappter Warenleiste sichtbar bleiben. */
  #resourcesWrap {
    position: relative;
    flex: 1 1 auto;
    min-width: 0;
    pointer-events: auto;
  }
  #resourcesWrap.collapsed #resources {
    display: none;
  }
  /* Seit v34.4 nur noch vier feste Pillen (siehe HTML-Kommentar bei
     #resourcesWrap) - kein Scrollen, keine Gruppen, keine Verlaufs-Schatten
     mehr nötig. Die frühere Gruppen-/Scroll-Fade-Infrastruktur (Rohstoffe/
     Verarbeitet einzeln zuklappbar, waagerechtes Scrollen mit Schatten an
     den Rändern) ist deshalb ersatzlos entfernt; die vollständige Liste
     lebt jetzt in der 🗂️-Warenübersicht. */
  #resources {
    display: flex;
    flex-wrap: nowrap;
    justify-content: flex-start;
    align-items: center;
    gap: 4px;
    padding: 2px 4px;
  }
  .resource {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    gap: 4px;
    background: var(--panel-bg);
    border: 1px solid var(--panel-border);
    border-radius: 8px;
    padding: 4px 7px;
    font-size: 12px;
    font-weight: bold;
    white-space: nowrap;
  }
  /* Die Größenregel muss JEDEN Ort nennen, an dem ein Warenpunkt vorkommt -
     sie hing ursprünglich allein an `.resource` und hat deshalb schon DREIMAL
     ein neues Abzeichen mit unsichtbarem Punkt erwischt (Bewohner in v28,
     Münzen in v29, Warenübersicht in v33). Wer irgendwo einen `.swatch`
     einbaut, trägt seinen Ort hier ein. */
  .resource .swatch, #popBadge .swatch, #coinBadge .swatch,
  .trade-row .swatch, #overview .swatch {
    width: 11px; height: 11px;
    border-radius: 3px;
    flex-shrink: 0;
  }
  .swatch.wood { background: var(--wood-color); }
  .swatch.plank { background: var(--plank-color); }
  .swatch.grain { background: var(--grain-color); }
  .swatch.flour { background: var(--flour-color); }
  .swatch.bread { background: var(--bread-color); }
  .swatch.iron { background: var(--iron-color); }
  .swatch.ironbar { background: var(--ironbar-color); }
  .swatch.hops { background: var(--hops-color); }
  .swatch.beer { background: var(--beer-color); }
  .swatch.stone { background: var(--stone-color); }
  .swatch.fish { background: var(--fish-color); }
  .swatch.wool { background: var(--wool-color); }
  .swatch.cloth { background: var(--cloth-color); }
  .swatch.clothes { background: var(--clothes-color); }
  .swatch.tobacco { background: var(--tobacco-color); }
  .swatch.cigar { background: var(--cigar-color); }
  .swatch.spice { background: var(--spice-color); }
  .swatch.fur { background: var(--fur-color); }
  .swatch.furcoat { background: var(--furcoat-color); }
  .swatch.oil { background: var(--oil-color); }
  .swatch.gold { background: var(--gold-color); }
  .swatch.copper { background: var(--copper-color); }
  .swatch.copperbar { background: var(--copperbar-color); }
  .swatch.weapon { background: var(--weapon-color); }
  .swatch.diamond { background: var(--diamond-color); }
  .swatch.jewelry { background: var(--jewelry-color); }
  .swatch.coin { background: var(--coin-color); }
  .swatch.meat { background: var(--meat-color); }
  .swatch.tools { background: var(--tools-color); }
  .swatch.grapes { background: var(--grapes-color); }
  .swatch.wine { background: var(--wine-color); }
  .swatch.gem { background: var(--gem-color); }
  .swatch.herbs { background: var(--herbs-color); }
  .swatch.sailcloth { background: var(--sailcloth-color); }
  .swatch.pop { background: var(--pop-color); }

  /* #buildmenu ist nur noch der äußere Rahmen (Größe/Rand/abgerundete Ecken);
     das eigentliche Scrollen übernimmt die innere #buildmenuScroll. Zwei
     Gründe für die Aufteilung: (1) die Verlaufs-"Schatten" oben/unten, die
     anzeigen, dass noch mehr Einträge folgen, müssen ÜBER dem scrollenden
     Inhalt liegen, aber SELBST nicht mitscrollen - das geht nur, wenn sie
     Geschwister der Scroll-Box sind, nicht Kinder davon. (2) WICHTIG für die
     Scroll-Box: alle ihre direkten Kinder brauchen flex-shrink:0 (siehe unten
     bei .build-group/.tool-btn/h3) - sonst quetscht Flexbox sie auf
     die verfügbare Höhe zusammen, statt dass die Box überläuft und scrollt.
     Genau das war der gemeldete Bug: bei vielen Gebäuden/aufgeklappten
     Gruppen wurden hintere Einträge unsichtbar zusammengestaucht statt über
     Scrollen erreichbar zu sein. */
  #buildmenu {
    position: absolute;
    left: 12px;
    /* + env(safe-area-inset-bottom): hält das Menü auf iPhones mit Home-
       Indicator (bzw. generell hinter `viewport-fit=cover`, siehe Meta-Tag)
       oberhalb von dessen Wisch-Zone statt direkt am unteren Bildschirmrand -
       auf Geräten ohne Safe-Area-Inset ist der Wert einfach 0. */
    bottom: calc(12px + env(safe-area-inset-bottom));
    width: 230px;
    max-height: 70vh;
    max-height: 70dvh;
    background: var(--panel-bg);
    border: 1px solid var(--panel-border);
    border-radius: 10px;
    overflow: hidden;
  }
  #buildmenuScroll {
    display: flex;
    flex-direction: column;
    gap: 6px;
    padding: 10px;
    max-height: 70vh;
    max-height: 70dvh;
    overflow-y: auto;
    overscroll-behavior: contain; /* Scrollen im Menü darf nicht die Karte "durchscrollen" lassen */
    -webkit-overflow-scrolling: touch;
    touch-action: pan-y;
  }
  /* Verlaufs-Schatten oben/unten am Rand von #buildmenu - blenden per JS
     (siehe updateBuildmenuScrollFade) nur dann ein, wenn in diese Richtung
     noch mehr zu scrollen ist. Ohne dieses Signal ist auf den ersten Blick
     nicht erkennbar, dass eine lange Liste überhaupt scrollbar ist. */
  .scroll-fade {
    position: absolute;
    left: 0; right: 0;
    height: 22px;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.15s ease;
  }
  .scroll-fade-top { top: 0; background: linear-gradient(to bottom, var(--panel-bg), transparent); }
  .scroll-fade-bottom { bottom: 0; background: linear-gradient(to top, var(--panel-bg), transparent); }
  .scroll-fade.visible { opacity: 1; }
  #buildmenu h3 {
    flex-shrink: 0;
    margin: 0 0 4px 0;
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--accent);
    border-bottom: 1px solid var(--panel-border);
    padding-bottom: 6px;
  }
  .build-group {
    flex-shrink: 0;
    border: 1px solid #4a3d29;
    border-radius: 6px;
    overflow: hidden;
  }
  .build-group summary {
    list-style: none;
    cursor: pointer;
    padding: 7px 10px;
    font-size: 13px;
    font-weight: 600;
    background: #2e2519;
    color: var(--text-light);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .build-group summary::-webkit-details-marker { display: none; }
  .build-group summary::after {
    content: '▸';
    color: var(--accent);
    transition: transform 0.15s ease;
  }
  .build-group[open] summary::after { transform: rotate(90deg); }
  .build-group summary:hover { background: #3a2f20; }
  .build-group-items {
    display: flex;
    flex-direction: column;
    gap: 6px;
    padding: 6px;
  }
  .tool-btn {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    background: #3a2f22;
    border: 1px solid #55442c;
    color: var(--text-light);
    border-radius: 6px;
    padding: 8px 10px;
    font-size: 13px;
    cursor: pointer;
    text-align: left;
    transition: background 0.12s ease, transform 0.05s ease;
  }
  /* Speichern/Laden nebeneinander in einer Zeile - seit v34.5 Teil des
     ⚙️-Einstellungsmenüs (siehe #settingsMenu), nicht mehr im Bau-Menü unter
     „Abreißen". Der Trennstrich kommt jetzt von der h4-Überschrift
     „💾 Spielstand" darüber, daher hier kein eigener border-top mehr. */
  #saveRow {
    flex-shrink: 0;
    display: flex;
    gap: 6px;
  }
  #saveRow .tool-btn { flex: 1; justify-content: center; }
  .tool-btn:hover { background: #4a3b28; }
  .tool-btn:active { transform: scale(0.98); }
  .tool-btn.active {
    background: var(--accent);
    color: #2a1f12;
    border-color: var(--accent);
  }
  .tool-btn .cost {
    font-size: 11px;
    opacity: 0.85;
  }
  .tool-btn.disabled {
    opacity: 0.45;
    cursor: not-allowed;
  }

  #status {
    position: absolute;
    left: 50%;
    bottom: calc(14px + env(safe-area-inset-bottom));
    transform: translateX(-50%);
    background: var(--panel-bg);
    border: 1px solid var(--panel-border);
    border-radius: 20px;
    padding: 8px 18px;
    font-size: 13px;
    max-width: 60vw;
    text-align: center;
    pointer-events: none;
    transition: opacity 0.3s ease;
  }

  #buildingInfo {
    display: none;
    position: absolute;
    left: 12px;
    top: 62px;
    width: 210px;
    background: var(--panel-bg);
    border: 1px solid var(--panel-border);
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 13px;
    color: var(--text-light);
  }
  /* Warenübersicht über alle Inseln (v33). Sie liegt als eigenes Fenster über
     der Karte statt in der Titelzeile: 23 Waren mal mehrere Inseln passen in
     keine Leiste, und man schaut ohnehin nur gelegentlich hinein. Beide
     Richtungen scrollen, damit die Tabelle auch auf dem Handy vollständig
     erreichbar bleibt. */
  #overview {
    display: none;
    position: absolute;
    left: 50%;
    top: 64px;
    transform: translateX(-50%);
    max-width: min(860px, calc(100% - 24px));
    max-height: calc(100% - 150px);
    overflow: auto;
    background: var(--panel-bg);
    border: 1px solid var(--panel-border);
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 12px;
    color: var(--text-light);
    z-index: 6;
  }
  #overview table { border-collapse: collapse; white-space: nowrap; }
  #overview td.mood-happy { color: #9fd88a; } #overview td.mood-angry { color: #ff9a86; } #overview td.mood-neutral { color: #e8d49a; }
  #overview th, #overview td {
    padding: 3px 7px;
    text-align: right;
    border-bottom: 1px solid rgba(255, 255, 255, 0.07);
  }
  #overview th { color: #cbb98f; font-weight: 600; position: sticky; top: 0; background: #241d13; font-size: 11px; }
  #overview th.isl, #overview td.isl { text-align: left; position: sticky; left: 0; background: #241d13; }
  /* Der Warenpunkt braucht hier zusätzlich `inline-block`: in der Warenleiste
     ist sein Elternteil ein Flex-Container und macht ihn dadurch zum Block, in
     einer Tabellenzelle bleibt er inline - und Breite und Höhe wirken an einem
     inline-Element nicht. Genau daran war er im ersten Bildtest der Übersicht
     unsichtbar (dieselbe Falle wie in v28/v29, nur mit anderer Ursache). */
  #overview .swatch { display: inline-block; vertical-align: -1px; }
  #overview td.zero { color: #6f6752; }
  #overview tr.sum td { border-top: 1px solid var(--panel-border); color: #f1e6d2; font-weight: 600; }
  /* Zeile der gerade angezeigten Insel hervorheben (NEU, v34.4) - eigene
     Regel für td.isl nötig, weil dessen `position: sticky`-Hintergrund
     (siehe oben) sonst die Zeilenfarbe beim seitwärts Sitzenbleiben verdeckt. */
  #overview tr.active-island td { background: rgba(216, 180, 106, 0.14); }
  #overview tr.active-island td.isl { background: #3a2f1a; }
  #overview .isl-active-pin { margin-right: 3px; }
  #overview .isl-name {
    width: 108px;
    background: #33291b;
    border: 1px solid var(--panel-border);
    border-radius: 5px;
    color: var(--text-light);
    font: inherit;
    padding: 2px 5px;
  }
  /* Steuerknöpfe gibt es an ZWEI Stellen: in der Warenübersicht (je Zeile) und
     im Kontor-Panel (für die eigene Insel). Eine gemeinsame Regel, damit sie
     nicht auseinanderlaufen. */
  .tax-btn {
    background: #3a2f1e;
    border: 1px solid var(--panel-border);
    border-radius: 5px;
    color: #cbb98f;
    font: inherit;
    font-size: 11px;
    padding: 2px 6px;
    cursor: pointer;
  }
  .tax-btn:hover { background: #4a3d28; }
  .tax-btn.active { background: var(--accent); color: #2a2113; border-color: var(--accent); }
  #overview .ov-hint { color: #cbb98f; margin: 6px 2px 2px; white-space: normal; max-width: 620px; }
  #overviewHeader { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  #overviewHeader b { font-size: 13px; }
  #overviewClose { margin-left: auto; cursor: pointer; color: #cbb98f; }
  /* Fortsetzen-Abfrage beim Start (v33). Sie liegt über allem, aber bewusst
     ohne abdunkelnden Hintergrund: die Karte darunter läuft bereits, und der
     Spieler soll sehen, dass das Spiel funktioniert, während er entscheidet. */
  #resumeBox {
    position: absolute;
    left: 50%;
    top: 40%;
    transform: translate(-50%, -50%);
    background: var(--panel-bg);
    border: 1px solid var(--accent);
    border-radius: 12px;
    padding: 16px 18px;
    color: var(--text-light);
    font-size: 13px;
    z-index: 20;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
  }
  #resumeBox .resume-when { color: #cbb98f; margin: 6px 0 12px; }
  #resumeBox .resume-row { display: flex; gap: 8px; }
  #resumeBox .tool-btn { margin: 0; }
  /* ---- Minikarte + Zoom-Buttons: gemeinsamer HUD-Block oben rechts (NEU, v34.4) --
     Bis v34.3 hing die Minikarte mit einem festen `top: 62px` unter der
     Titelzeile - passend nur für GENAU EINE Titelzeilen-Höhe. Da die
     Titelzeile aber je nach Bildschirmbreite, Wetter-Abzeichen und ein-/
     ausgeklappter Warenleiste unterschiedlich hoch ist, klaffte dort mal eine
     Lücke, mal überlappte es knapp - "bündig" war eher Zufall. #mapHud legt
     jetzt IMMER exakt an der tatsächlich gemessenen Unterkante der Titelzeile
     an (siehe layoutMapHud()/ResizeObserver weiter unten) und rechts am
     selben Rand wie die Titelzeile selbst (var(--hud-inset), identisch mit
     deren Padding) - "bündig" im Wortsinn, nicht mehr geschätzt. */
  #mapHud {
    position: absolute;
    top: 0; /* wird von layoutMapHud() auf topbar.bottom gesetzt */
    right: var(--hud-inset, 16px);
    display: flex;
    flex-direction: column;
    align-items: stretch;
    gap: 6px;
    z-index: 5;
  }
  #minimap {
    width: 150px;
    height: 150px;
    background: rgba(20, 16, 10, 0.8);
    border: 1px solid var(--panel-border);
    border-radius: 8px;
    cursor: pointer;
    touch-action: none;
  }
  /* Die drei Zoom-Buttons sitzen als eigene Reihe direkt unter der Minikarte -
     "in der Nähe der Minikarte" (Nutzerwunsch), nicht irgendwo sonst im HUD. */
  #zoomButtons {
    display: flex;
    justify-content: center;
    gap: 6px;
  }
  #zoomButtons button {
    flex: 1 1 0;
    background: var(--panel-bg);
    border: 1px solid var(--panel-border);
    color: var(--text-light);
    border-radius: 8px;
    padding: 6px 0;
    font-size: 15px;
    line-height: 1;
    cursor: pointer;
    opacity: 0.9;
  }
  #zoomButtons button:hover { opacity: 1; background: #3a2f22; }
  #zoomButtons button:active { transform: scale(0.94); }
  #zoomResetBtn { font-size: 12px; font-weight: bold; }
  #buildingInfoHeader {
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid var(--panel-border);
    padding-bottom: 6px;
    margin-bottom: 6px;
    font-size: 14px;
  }
  #buildingInfoClose {
    cursor: pointer;
    opacity: 0.7;
    padding: 0 4px;
  }
  #buildingInfoClose:hover { opacity: 1; color: var(--accent); }
  .bi-line {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    padding: 2px 0;
    font-size: 12.5px;
  }
  .bi-line span:first-child { color: #cbb98f; }
  /* Das Ladepanel eines Schiffs (v25) kann bei vielen Warenarten lang werden -
     deshalb bekommt das Infopanel dort eine Höhenbegrenzung mit Scrollen, statt
     über den unteren Bildschirmrand hinauszuwachsen. Dieselbe vh-dann-dvh-Kette
     wie überall (siehe Technischer Hinweis iOS-Viewport-Höhe). */
  #buildingInfo.cargo {
    /* Seit v30 steht hier auch die Handelstabelle mit 23 Warenzeilen - bei den
       alten 252px wurden Namen wie "Erzbarren" oder "Kleidung" abgeschnitten,
       und eine abgeschnittene Ware ist im Handel schlicht unbrauchbar. */
    width: 284px;
    max-height: calc(100vh - 150px);
    max-height: calc(100dvh - 150px);
    overflow-y: auto;
    overscroll-behavior: contain;
  }
  .cargo-row {
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 2px 0;
    font-size: 12px;
  }
  .cargo-row .cargo-name { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #cbb98f; }
  .cargo-row .cargo-num { flex: 0 0 auto; font-variant-numeric: tabular-nums; min-width: 46px; text-align: right; }
  .cargo-btn {
    flex: 0 0 auto;
    background: #3a2f20;
    border: 1px solid var(--panel-border);
    color: var(--text-light);
    border-radius: 5px;
    font-size: 11px;
    line-height: 1;
    padding: 4px 5px;
    cursor: pointer;
    font-family: inherit;
  }
  .cargo-btn:hover:not(:disabled) { background: #4a3d28; color: var(--accent); }
  .cargo-btn:disabled { opacity: 0.3; cursor: default; }
  .cargo-hint { font-size: 11.5px; color: #cbb98f; padding: 4px 0 2px; line-height: 1.35; }
  /* Kontor- und Frachtrouten-Oberfläche (v26). Gleiche Bausteine wie das
     Ladepanel, nur mit einer Auswahlliste für die Ware und einer eigenen
     Kopfzeile je Abschnitt. */
  .route-head {
    font-size: 12px;
    color: var(--accent);
    border-top: 1px solid var(--panel-border);
    margin-top: 8px;
    padding-top: 6px;
  }
  /* Handelsbereich im Kontor-Panel (v30). Zusammenklappbar, weil er sonst mit
     23 Warenzeilen alles andere im Panel nach unten drücken würde - dieselbe
     Geste wie bei den Warengruppen der Topbar. */
  .trade-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
    cursor: pointer;
    user-select: none;
  }
  .trade-head:hover { color: #f2d98a; }
  .trade-caret { display: inline-block; font-size: 9px; transition: transform 0.15s ease; }
  .trade-head.closed .trade-caret { transform: rotate(-90deg); }
  .trade-row {
    display: flex;
    align-items: center;
    gap: 3px;
    padding: 1px 0;
    font-size: 11px;
    white-space: nowrap;
  }
  .trade-row .swatch { width: 9px; height: 9px; border-radius: 2px; flex: 0 0 auto; }
  .trade-name { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .trade-stock { flex: 0 0 auto; min-width: 22px; text-align: right; color: #cbb98f; font-variant-numeric: tabular-nums; }
  /* Preise: Verkauf grün-gold, Kauf rötlich - so ist ohne Beschriftung klar,
     welche Zahl Geld bringt und welche Geld kostet. */
  .trade-price { flex: 0 0 auto; min-width: 56px; text-align: center; font-variant-numeric: tabular-nums; }
  .trade-price .sell { color: #9fd88a; }
  .trade-price .buy { color: #e0a07c; }
  /* Marktlage (v34.24): gesättigt ▼ / gefragt ▲ */
  .trade-price .mkt { font-size: 9px; margin-left: 2px; }
  .trade-price .mkt.down { color: #e07a6a; }
  .trade-price .mkt.up { color: #8fd07a; }
  .trade-btn {
    flex: 0 0 auto;
    background: #3a2f20;
    border: 1px solid var(--panel-border);
    color: var(--text-light);
    border-radius: 4px;
    font-size: 10px;
    line-height: 1;
    padding: 3px 3px;
    cursor: pointer;
    font-family: inherit;
  }
  .trade-btn:hover:not(:disabled) { background: #4a3d28; color: var(--accent); }
  .trade-btn:disabled { opacity: 0.28; cursor: default; }
  .route-row {
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 2px 0;
    font-size: 12px;
  }
  .route-row .route-name { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .route-row .route-amount { flex: 0 0 auto; min-width: 26px; text-align: center; font-variant-numeric: tabular-nums; }
  /* Seit v34.5 kann in dieser Zeile auch der "Station entfernen"-Knopf stehen
     (vorher stand er in der Warenzeile, die es bei "nichts laden" gar nicht
     gab) - deshalb jetzt Flex mit Rand-Ausrichtung statt reinem Text. */
  .route-leg { display: flex; align-items: center; justify-content: space-between; gap: 6px; font-size: 11px; color: #cbb98f; padding: 4px 0 0; }
  .route-leg .cargo-btn { flex: 0 0 auto; }
  .route-row select, .route-assign select {
    flex: 1 1 auto;
    min-width: 0;
    background: #3a2f20;
    border: 1px solid var(--panel-border);
    color: var(--text-light);
    border-radius: 5px;
    font-size: 11.5px;
    padding: 4px;
    font-family: inherit;
  }
  .route-assign { display: flex; align-items: center; gap: 6px; padding: 4px 0; font-size: 12px; }
  .route-assign > span { flex: 0 0 auto; color: #cbb98f; }
  .route-btn {
    display: block;
    width: 100%;
    text-align: left;
    background: #3a2f20;
    border: 1px solid var(--panel-border);
    color: var(--text-light);
    border-radius: 6px;
    font-size: 12px;
    padding: 6px 8px;
    margin-top: 5px;
    cursor: pointer;
    font-family: inherit;
  }
  .route-btn:hover { background: #4a3d28; color: var(--accent); }
  .route-btn.disabled { opacity: 0.45; pointer-events: none; }
  .route-btn .cost { float: right; color: #cbb98f; font-size: 11px; }

  /* ---- Schmale Bildschirme (Handy hochkant) --------------------------------
     Die Ressourcenleiste ist inzwischen (siehe #resources oben) auf JEDER
     Breite eine einzeilige, waagerecht wischbare Zeile - hier wird nur noch
     zusätzlich verschmälert und #topbar/Baumenü/Minimap/Infopanel kompakter
     gemacht.
     Schwelle NEU bei 730px statt 720px (v34.3): die Klartext-Labels an
     Bewohner-/Münzbadge machen #titleRow rund 8px breiter, als zwischen 721
     und 728px Fensterbreite noch Platz war - gemessen lief dort der letzte
     Knopf (Warenleisten-Umschalter) knapp über den Bildschirmrand hinaus.
     Schwelle NEU bei 770px statt 730px (v34.6): #title hat jetzt (siehe dort)
     `flex-shrink: 0; white-space: nowrap` - sein Text soll nicht mehr
     unnötig zweizeilig umbrechen, sobald #resourcesWrap (mit nur noch vier
     Kernwaren, v34.4) allein zu wenig eigene Breite mitbringt, um die ganze
     Schrumpfung der Titelzeile zu tragen. Das macht #titleRow selbst aber
     starr rund 750-762px breit; unterhalb dieser Breite lief es (gemessen ab
     740px abwärts) über den rechten Bildschirmrand hinaus, weil ihm - anders
     als #resourcesWrap, das seit v34.6 bei Platzmangel in eine zweite Zeile
     ausweicht (siehe `#topbar { flex-wrap: wrap }` oben) - kein Ausweichen
     mehr offenstand. Die Schwelle liegt jetzt oberhalb der gemessenen 762px,
     mit Sicherheitsabstand; darunter greift die Spalten-Anordnung samt
     umbrechender Titelzeile (`#titleRow { flex-wrap: wrap }` unten). */
  @media (max-width: 770px) {
    #topbar {
      flex-direction: column;
      align-items: stretch;
      padding: 8px 10px;
      gap: 6px;
    }
    /* Sechs Elemente (Titel, Audio, Uhr, Inselname, Bewohnerzahl, Warenleisten-
       Knopf) passen auf schmalen Bildschirmen nicht mehr in eine Zeile -
       flex-wrap erlaubt eine zweite Zeile, statt seitlich abzuschneiden. */
    #titleRow { justify-content: flex-start; flex-wrap: wrap; row-gap: 6px; }
    #title { font-size: 15px; letter-spacing: 0.5px; }
    /* In der Spalten-Anordnung von #topbar soll #resourcesWrap nur so hoch
       sein wie sein Inhalt (nicht `flex:1` wachsen, das ist für die
       waagerechte Anordnung auf breiten Bildschirmen gedacht). */
    #resourcesWrap { flex: 0 0 auto; }
    .resource { font-size: 11px; padding: 3px 6px; }
    /* #mapHud braucht auf dem Handy keinen festen `top` mehr (siehe
       layoutMapHud() - misst die Titelzeilenhöhe live, funktioniert auch bei
       der hier dreizeiligen Titelzeile), nur einen engeren rechten Einzug
       und eine kleinere Minikarte samt Zoom-Buttons. */
    #mapHud { right: 8px; }
    #minimap { width: 96px; height: 96px; }
    #zoomButtons button { padding: 4px 0; font-size: 13px; }
    #zoomResetBtn { font-size: 11px; }
    #buildmenu {
      width: 178px;
      left: 8px;
      bottom: calc(8px + env(safe-area-inset-bottom));
      max-height: 62vh;
      max-height: 62dvh;
    }
    #buildmenuScroll {
      max-height: 62vh;
      max-height: 62dvh;
      padding: 8px;
      gap: 5px;
    }
    .tool-btn { font-size: 12px; padding: 6px 8px; }
    .tool-btn .cost { font-size: 10px; }
    .build-group summary { font-size: 12px; padding: 6px 8px; }
    #buildingInfo { top: 92px; left: 8px; width: 168px; font-size: 12px; padding: 8px 10px; }
    /* Die Statusmeldung sitzt sonst mittig unten und verdeckt dort auf schmalen
       Bildschirmen die Speichern/Laden-Knöpfe am Fuß des Baumenüs - deshalb
       rutscht sie hier nach rechts neben das Menü. */
    #status {
      font-size: 12px;
      left: auto;
      right: 8px;
      transform: none;
      max-width: 46vw;
      bottom: calc(10px + env(safe-area-inset-bottom));
      padding: 6px 10px;
    }
    #saveRow .tool-btn { font-size: 11px; padding: 6px 4px; }
    #settingsMenu { width: 170px; }
  }
</style>
</head>
<body>
<div id="game">
  <canvas id="canvas"></canvas>

  <div id="topbar">
    <div id="titleRow">
      <div id="title">🏘️ Manfredville</div>
      <div id="settingsMenuWrap">
        <button id="settingsToggle" title="Einstellungen">⚙️</button>
        <div id="settingsMenu">
          <h4>🎵 Ton</h4>
          <label class="audio-row"><span>Musik</span><input type="checkbox" id="musicEnabledChk" checked></label>
          <div class="audio-row audio-volume-row">
            <div class="audio-volume-label"><span>Lautstärke</span><span id="musicVolumeVal">100%</span></div>
            <input type="range" id="musicVolumeSlider" min="0" max="100" value="100">
          </div>
          <label class="audio-row"><span>Soundeffekte</span><input type="checkbox" id="sfxEnabledChk" checked></label>
          <h4>💾 Spielstand</h4>
          <div id="saveRow">
            <button id="saveBtn" class="tool-btn" title="Spielstand als Datei herunterladen">💾 Speichern</button>
            <button id="loadBtn" class="tool-btn" title="Gespeicherte Datei laden">📂 Laden</button>
            <input type="file" id="loadInput" accept="application/json,.json" hidden>
          </div>
        </div>
      </div>
      <div id="clock" title="Tageszeit im Dorf">☀️ 07:12</div>
      <div id="weatherBadge" title="Aktuelles Wetter">🌧️ Regen</div>
      <div id="fireBadge" title="Aktiver Brand">🔥 Feuer</div>
      <div id="pirateBadge" title="Piraten">🏴‍☠️ Piraten</div>
      <div id="plagueBadge" title="Seuche">🤒 Seuche</div>
      <div id="islandName" title="Insel, deren Warenbestand die Leiste unten zeigt">🌿 Heimatinsel</div>
 <div id="moodBadge" title="Stimmung der angezeigten Insel">😐 50 %</div>
      <div id="popBadge" title="Bewohner der angezeigten Insel: aktuelle Zahl / maximale Kapazität aller ihrer Wohnhäuser zusammen"><span class="swatch pop"></span><span id="res-pop">0/0</span><span class="badge-label"> Bewohner</span></div>
      <div id="coinBadge" title="Münzen – das Geld des Spiels, kartenweit verfügbar (egal, auf welcher Insel geprägt)"><span class="swatch coin"></span><span id="res-coin">0</span><span class="badge-label"> Münzen</span></div>
      <button id="overviewToggle" title="Warenübersicht über alle Inseln">🗂️</button>
      <button id="statsToggle" title="Statistik: Bevölkerung, Münzen, Produktion">📈</button>
      <button id="logToggle" title="Ereignisprotokoll">📜<span id="logToggleCount"></span></button>
      <button id="resourcesToggle" title="Warenleiste ein-/ausblenden">📊<span class="toggle-caret">▾</span></button>
    </div>
    <div id="resourcesWrap">
     <!-- Verschlankt auf die vier Güter, die auf JEDER Insel unabhängig von
          Ausbaustufe/Klimazone über den nächsten Schritt entscheiden: Bretter
          und Stein (kann ich gerade bauen?), Werkzeuge (Schiffe, Aufstiege,
          Kontor-Gründung) und Brot (droht Hunger?). Alle 23 Warenarten mit
          jedem tatsächlichen Bestand stehen weiterhin vollständig UND
          tabellarisch in der 🗂️-Warenübersicht (NEU, v34.4 - siehe dort);
          hier ist bewusst nicht mehr die vollständige, sondern nur noch die
          IMMER wichtige Teilmenge auf den ersten Blick zu sehen. -->
     <div id="resources">
      <div class="resource" title="Bretter"><span class="swatch plank"></span><span id="res-plank">0</span> Bretter</div>
      <div class="resource" title="Stein"><span class="swatch stone"></span><span id="res-stone">0</span> Stein</div>
      <div class="resource" title="Werkzeuge"><span class="swatch tools"></span><span id="res-tools">0</span> Werkzeuge</div>
      <div class="resource" title="Brot"><span class="swatch bread"></span><span id="res-bread">0</span> Brot</div>
     </div>
    </div>
  </div>

  <div id="buildmenu">
   <div id="buildmenuScroll">
    <h3>Bauen</h3>
    <button class="tool-btn" data-tool="pan">✋ Verschieben</button>
    <button class="tool-btn" data-tool="road">🛤️ Straße <span class="cost">gratis</span></button>
    <button class="tool-btn" data-tool="stoneroad">🪨 Steinweg <span class="cost">2 Stein/Kachel</span></button>
    <details class="build-group" open>
      <summary>🌾 Rohstoffe</summary>
      <div class="build-group-items">
        <button class="tool-btn" data-tool="woodcutter">🪓 Holzfällerhütte <span class="cost">4 Bretter</span></button>
        <button class="tool-btn" data-tool="forester">🌲 Försterhütte <span class="cost">5 Bretter</span></button>
        <button class="tool-btn" data-tool="farm">🌾 Bauernhof <span class="cost">5 Bretter</span></button>
        <button class="tool-btn" data-tool="mine">⛏️ Mine <span class="cost">7 Bretter</span></button>
        <button class="tool-btn" data-tool="quarry">🪨 Steinbruch <span class="cost">6 Bretter</span></button>
        <button class="tool-btn" data-tool="hopfarm">🌿 Hopfenfarm <span class="cost">5 Bretter</span></button>
        <button class="tool-btn" data-tool="tobaccofarm">🍂 Tabakfarm <span class="cost">5 Bretter</span></button>
        <button class="tool-btn" data-tool="spicefarm">🌶️ Gewürzfarm <span class="cost">5 Bretter</span></button>
        <button class="tool-btn" data-tool="cottonfarm">☁️ Baumwollfarm <span class="cost">6 Bretter</span></button>
        <button class="tool-btn" data-tool="vineyard">🍇 Weinberg <span class="cost">6 Bretter</span></button>
        <button class="tool-btn" data-tool="herbgarden">🌿 Kräutergarten <span class="cost">5 Bretter</span></button>
        <button class="tool-btn" data-tool="fishery">🎣 Fischerhütte <span class="cost">5 Bretter</span></button>
        <button class="tool-btn" data-tool="sheepfarm">🐑 Schaffarm <span class="cost">6 Bretter</span></button>
        <button class="tool-btn" data-tool="hunter">🏹 Jägerhütte <span class="cost">6 Bretter</span></button>
        <button class="tool-btn" data-tool="furhunter">🦊 Pelzjägerhütte <span class="cost">6 Bretter</span></button>
        <button class="tool-btn" data-tool="whaler">🐋 Walfängerhütte <span class="cost">8 Bretter</span></button>
      </div>
    </details>
    <details class="build-group">
      <summary>⚙️ Verarbeitung</summary>
      <div class="build-group-items">
        <button class="tool-btn" data-tool="sawmill">🪚 Sägewerk <span class="cost">6 Bretter</span></button>
        <button class="tool-btn" data-tool="mill">⚙️ Mühle <span class="cost">6 Bretter</span></button>
        <button class="tool-btn" data-tool="bakery">🍞 Bäckerei <span class="cost">6 Bretter</span></button>
        <button class="tool-btn" data-tool="smelter">🔥 Schmelzhütte <span class="cost">7 Bretter</span></button>
        <button class="tool-btn" data-tool="brewery">🍺 Brauerei <span class="cost">7 Bretter</span></button>
        <button class="tool-btn" data-tool="weavery">🧶 Weberei <span class="cost">7 Bretter</span></button>
        <button class="tool-btn" data-tool="tailor">🧵 Schneiderei <span class="cost">7 Bretter</span></button>
        <button class="tool-btn" data-tool="smithy">🔨 Schmiede <span class="cost">7 Bretter</span></button>
        <button class="tool-btn" data-tool="coppersmelter">🏺 Kupferschmelze <span class="cost">8 Bretter</span></button>
        <button class="tool-btn" data-tool="weaponsmith">⚔️ Waffenschmiede <span class="cost">8 Bretter, 3 Werkzeuge</span></button>
        <button class="tool-btn" data-tool="furrier">🧥 Kürschnerei <span class="cost">7 Bretter</span></button>
        <button class="tool-btn" data-tool="cigarmaker">🍃 Zigarrenmanufaktur <span class="cost">7 Bretter</span></button>
        <button class="tool-btn" data-tool="goldsmith">💍 Goldschmiede <span class="cost">8 Bretter</span></button>
        <button class="tool-btn" data-tool="mint">🪙 Münzprägerei <span class="cost">9 Bretter</span></button>
        <button class="tool-btn" data-tool="winery">🍷 Kelterei <span class="cost">7 Bretter, 2 Werkzeuge</span></button>
        <button class="tool-btn" data-tool="jeweler">💎 Juwelier <span class="cost">8 Bretter, 4 Werkzeuge</span></button>
        <button class="tool-btn" data-tool="sailmaker">⛵ Segelmacherei <span class="cost">8 Bretter, 2 Werkzeuge</span></button>
      </div>
    </details>
    <details class="build-group">
      <summary>🏘️ Siedlung</summary>
      <div class="build-group-items">
        <button class="tool-btn" data-tool="house">🏠 Wohnhaus <span class="cost">6 Bretter</span></button>
        <button class="tool-btn" data-tool="warehouse">📦 Lagerhaus <span class="cost">25 Bretter</span></button>
        <button class="tool-btn" data-tool="chapel">⛪ Kapelle <span class="cost">10 Bretter</span></button>
        <button class="tool-btn" data-tool="tavern">🍻 Wirtshaus <span class="cost">8 Bretter</span></button>
        <button class="tool-btn" data-tool="school">🎓 Schule <span class="cost">10 Bretter, 3 Werkzeuge</span></button>
        <button class="tool-btn" data-tool="doctor">⚕️ Medicus <span class="cost">10 Bretter, 3 Werkzeuge</span></button>
        <button class="tool-btn" data-tool="theater">🎭 Theater <span class="cost">16 Bretter, 10 Stein, 4 Werkzeuge</span></button>
        <button class="tool-btn" data-tool="cathedral">🏰 Kathedrale <span class="cost">20 Bretter, 20 Stein, 6 Werkzeuge, 8 Gold</span></button>
        <button class="tool-btn" data-tool="harbor">⚓ Hafen <span class="cost">15 Bretter</span></button>
        <button class="tool-btn" data-tool="kontor">🏛️ Kontor <span class="cost">12 Bretter</span></button>
        <button class="tool-btn" data-tool="rathaus">⚖️ Rathaus <span class="cost">18 Bretter, 8 Stein, 4 Werkzeuge</span></button>
        <button class="tool-btn" data-tool="lighthouse">🗼 Leuchtturm <span class="cost">10 Bretter, 15 Stein</span></button>
        <button class="tool-btn" data-tool="firestation">🔔 Feuerwache <span class="cost">12 Bretter, 5 Werkzeuge</span></button>
      </div>
    </details>
    <button class="tool-btn" data-tool="demolish">🗑️ Abreißen</button>
   </div>
   <div class="scroll-fade scroll-fade-top" id="buildmenuFadeTop"></div>
   <div class="scroll-fade scroll-fade-bottom" id="buildmenuFadeBottom"></div>
  </div>

  <div id="buildingInfo"></div>
  <div id="overview"></div>
  <div id="statsPanel"></div>
  <div id="logPanel"></div>

  <div id="mapHud">
    <canvas id="minimap" width="150" height="150" title="Minimap - Klick/Tipp springt dorthin"></canvas>

<script>
// =====================================================================
// Manfredville – kleiner Aufbau-Prototyp (Siedler-Stil Warenlogistik)
// =====================================================================

// ---- Konfiguration -----------------------------------------------
const CFG = {
  tileW: 64,
  tileH: 32,
  // 140x140 = 19600 Kacheln (v24, vorher 80x80). Die Karte besteht jetzt aus
  // einem Archipel vieler Inseln in drei Klimazonen (siehe generateMap /
  // climateMix) - dafür braucht es spürbar mehr Fläche, sonst bleibt für die
  // Zonen zwischen den Inseln kein erkennbarer Verlauf.
  mapSize: 140,
  // Grund-Lauftempo (Kacheln/Sekunde) auf normalen Erd-Straßen bzw. abseits
  // von Straßen (Feldarbeiter). Bewusst langsamer als zuvor (war 1.3) - erst

  carrierSpeed: 1.0,

  // tileSpeedFactor/updateCarriers) - 1.0 * 1.5 = 1.5 Kacheln/Sekunde, sogar
  // etwas schneller als das alte, einheitliche Grundtempo von 1.3.
  stoneRoadSpeedFactor: 1.5
};
const STONE_ROAD_COST = 2; // Stein pro gebauter/ausgebauter Steinweg-Kachel

// Basisgröße JEDER Comicfigur im Spiel (wird zusätzlich mit camera.zoom
// skaliert). Auf Nutzerwunsch (v23.1) von 0.82 auf 0.394 gesenkt, damit die

// hinzugekommenen Arbeiter vor den Verarbeitern - vorher waren die Träger
// mehr als doppelt so groß wie die Werkstattfiguren, was im selben Bild

// damit die Größen gar nicht mehr auseinanderlaufen können.
const MONSTER_BASE_SCALE = 0.394;

const GROWTH_STAGE_DURATION = 9000; // ms pro Wachstumsstufe eines gepflanzten Baums
const CROP_STAGE_DURATION = 9500; // ms pro Wachstumsstufe eines Getreidefelds (bewusst langsamer als Bäume)
const MAX_GROWTH_STAGE_TREE = 3; // Stufe, ab der ein gepflanzter Baum ausgewachsen & erntbar ist
const MAX_GROWTH_STAGE_CROP = 5; // Stufe, ab der ein Getreidefeld reif & erntbar ist (feineres, langsameres Wachstum)
// Liefert die Ziel-Wachstumsstufe (=reif/ausgewachsen) je nach Pflanzenart.
// Feldfrüchte (Getreide, Hopfen, Tabak, Gewürze) reifen über mehr, dafür
// feinere Stufen als ein Baum. Bewusst als "alles außer 'tree'" formuliert

const CROP_KINDS = ['crop', 'hops', 'tobacco', 'spice', 'cotton', 'grape', 'herb'];
function maxGrowthStage(kind) {

}
const CHOP_DURATION = 2400; // ms, die ein Holzfäller am Baum mit der Axt verbringt
const CHOP_SWING_PERIOD = 550; // ms pro einzelnem Axtschwung
const MINE_DURATION = 2800; // ms, die ein Minenarbeiter am Erzvorkommen mit der Spitzhacke verbringt
const MINE_SWING_PERIOD = 650; // ms pro einzelnem Spitzhacken-Schwung
// Angeln dauert bewusst am längsten (man wartet auf den Fisch) und hat den
// langsamsten "Schwung" - die Rute wippt nur gemächlich, statt zu schlagen.
const FISH_DURATION = 3600; // ms, die ein Fischer am Ufer mit der Angel verbringt
const FISH_SWING_PERIOD = 1200; // ms pro Ruten-Wipper (Anbiss-Moment -> Platsch-Geräusch)
const SHEAR_DURATION = 2200; // ms, die ein Schäfer am Schaf mit der Schere verbringt
const SHEAR_SWING_PERIOD = 480; // ms pro Scheren-Schnitt (Schnipp-Geräusch)
// Jagen: der Jäger pirscht sich an, zielt und schießt erst am Ende der Dauer -
// bewusst duration===swing, damit genau EIN Bogenschuss-Geräusch fällt (der

const HUNT_DURATION = 2400;
const HUNT_SWING_PERIOD = 2400;
// Fallenstellen (v27): der Pelzjäger kniet an seiner Falle, spannt sie und nimmt

const TRAP_DURATION = 3000;
const TRAP_SWING_PERIOD = 1000; // ms pro Zuschnappen der Falle (-> Klack-Geräusch)
// Takt der Harpunenstöße auf dem Fanggrund (v29, seit v29.1 im Boot statt am

const WHALE_SWING_PERIOD = 1500;

// Bevölkerung: Bewohner verbrauchen in regelmäßigen Abständen Brot aus dem

// Wohnhaus transportiert werden. Ist genug Brot im Dorf-Vorrat vorhanden,

// ---- Verbrauchsgröße: gemessen, nicht geschätzt (v33.1) ---------------------
// Der Nutzer meldete, dass viel zu viele Betriebe nötig sind und die Stadt
// deshalb klein bleibt. Nachgemessen ergab sich der Grund:
//
//   Eine VOLLSTÄNDIGE Brotkette (Bauernhof + Mühle + Bäckerei) liefert real
//   0,033 Brot je Sekunde - und ernährte damit ganze SIEBEN Bewohner.
//

// seiner Taktrate. Wer diese Zahl nicht kennt, stellt den Verbrauch zwangs-

//

//

const POP_CONSUME_INTERVAL = 40000; // ms zwischen zwei Nahrungs-Verbrauchszyklen je Wohnhaus
const POP_GROWTH_INTERVAL = 30000; // ms zwischen zwei Zuwachs-Prüfungen (nur bei ausreichender Versorgung)
const POP_BREAD_PER_HEADS = 40; // 1 Nahrungseinheit ernährt bis zu 40 Bewohner pro Verbrauchszyklus
const POP_STARVE_STREAK = 3; // so viele aufeinanderfolgende unversorgte Zyklen, bevor ein Bewohner auszieht
// Nahrungsmittel, die den Brot-/Ernährungsbedarf der Bewohner decken können.
// Fisch (aus der Fischerhütte) ist bewusst gleichwertig zu Brot - dadurch
// bekommt eine Siedlung am Meer eine echte, alternative Nahrungsversorgung,
// ohne die vorhandene Brot-Mechanik zu verändern (verbraucht wird in der hier
// angegebenen Reihenfolge, also erst Brot, dann Fisch).
const POP_FOOD_GOODS = ['bread', 'fish', 'meat'];

// Glaube: analog zum Brot-Bedürfnis, aber als reine Abdeckungsprüfung (Luftlinie
// zu einer Kapelle im Einzugsgebiet) statt eines verbrauchten Guts. Ein Haus
// ohne Kapellen-Nähe gilt nach mehreren Prüfzyklen als "glaubenslos" und
// verliert wie bei Hungersnot einen Bewohner.
const FAITH_CHECK_INTERVAL = 40000; // ms zwischen zwei Glaubens-Prüfungen je Wohnhaus (gleicher Rhythmus wie die Nahrung, v33.1)
const FAITH_STARVE_STREAK = 3; // so viele aufeinanderfolgende Zyklen ohne Kapellen-Abdeckung, bevor ein Bewohner auszieht

// Zufriedenheit: drittes Bedürfnis, analog zu Brot UND Glaube kombiniert - ein
// Wirtshaus muss (wie die Kapelle) in Reichweite sein UND es wird (wie beim

// Ohne beides gilt ein Haus nach mehreren Prüfzyklen als "unzufrieden" und
// verliert wie bei Hungersnot/Glaubenslosigkeit einen Bewohner.
const SATISFACTION_CHECK_INTERVAL = 40000; // ms, gleicher Rhythmus wie Nahrung/Glaube (v33.1)
const SATISFACTION_STARVE_STREAK = 3;
const POP_BEER_PER_HEADS = 40; // 1 Bier versorgt bis zu 40 Bewohner pro Prüfzyklus (analog zum Nahrungsbedarf)

// Kleidung: VIERTES Bedürfnis - bewusst als reine WACHSTUMSSCHRANKE gebaut und
// NICHT (wie Nahrung/Glaube/Zufriedenheit) als Auszugsgrund. Begründung: die
// drei bestehenden Bedürfnisse decken den "Mangel kostet Bewohner"-Druck schon

// dauerhaft verbrauchenden Abnehmer, statt wie bisher beim Stoff in einer
// Sackgasse zu enden, ohne dass ein Dorf ohne Schneiderei schrumpft.
const CLOTHES_CHECK_INTERVAL = 40000; // ms, gleicher Rhythmus wie Nahrung/Glaube/Bier
const POP_CLOTHES_PER_HEADS = 40; // 1 Kleidung versorgt bis zu 40 Bewohner pro Prüfzyklus
const CLOTHES_GROWTH_THRESHOLD = 5; // ab dieser Bewohnerzahl braucht ein Haus Kleidung, um weiter zu wachsen

// Luxus (Zigarren ODER Gewürze ODER ...): die ZWEITE Wachstumsstufe nach demselben Muster
// wie die Kleidung (v25). Sie ist der Grund, überhaupt nach Süden zu segeln -
// beide Waren wachsen ausschließlich auf den heißen Inseln, gebraucht werden
// sie aber dort, wo die großen Wohnhäuser stehen. Damit hängen Insel-
// Warenwirtschaft, Schiffstransport und Klimazonen zu einer Schleife zusammen,
// statt drei nebeneinanderstehende Neuerungen zu bleiben.
//
// Bewusst ODER statt UND: eine der beiden Waren genügt. Zwei Pflichtgüter aus
// derselben Zone wären nur doppelte Arbeit ohne zusätzliche Entscheidung -
// so kann der Spieler wählen, welche Farm er baut.
const LUXURY_CHECK_INTERVAL = 40000;
const LUXURY_GROWTH_THRESHOLD = 8;
const POP_LUXURY_PER_HEADS = 40;
// Luxusgüter: eines davon genügt (wie bei der Nahrung ist EIN Gut aus der Liste
// ausreichend, siehe POP_FOOD_GOODS). Seit v27 ist der Pelzmantel das dritte -
// und das erste aus dem NORDEN. Damit hat jede der drei Klimazonen ein eigenes
// Luxusgut anzubieten: Tabak und Gewürze aus dem Süden, Pelze aus dem Eis. Der
// gemäßigte Gürtel, in dem das Dorf startet, kann keines davon selbst erzeugen
// und muss handeln - egal in welche Richtung er fährt.
//
// v29 ergänzt zwei weitere: TRAN (Lampenöl aus dem Walfang, Norden) und
// SCHMUCK (aus südlichem Gold). Die entscheidende Eigenschaft der Liste bleibt

// genügt); der Gewinn ist, dass beide neuen Warenketten sofort einen Zweck
// haben, statt als hübsche Sackgasse zu enden.
//
// v34.14: TABAK ist aus dieser Liste GEFALLEN und durch die ZIGARRE ersetzt.
// Roher Tabak war das einzige Luxusgut, das direkt vom Feld kam, ohne je eine
// Werkstatt gesehen zu haben - eine Tabakfarm allein deckte damit dieselbe
// Bedürfnisstufe ab, für die der Norden eine zweistufige Kette (Pelzjäger ->
// Kürschner) braucht. Jetzt gilt für den Süden dasselbe: Tabakfarm ->
// Zigarrenmanufaktur. Tabak bleibt handelbar und verschiffbar, zählt aber für
// die Wohnhäuser nicht mehr - wie Wolle, Stoff oder Felle eine Zwischenware.
// Folge für ältere Spielstände: ein Lager voller Rohtabak deckt den Luxus
// nicht mehr, bis die erste Manufaktur steht (siehe Statusdokument).
const LUXURY_GOODS = ['cigar', 'spice', 'furcoat', 'oil', 'jewelry'];

// ---- Wohnstufen (NEU, v31) --------------------------------------------------
// Ein Wohnhaus ist nicht mehr ein Haustyp mit einer festen Kapazität, sondern
// durchläuft drei STUFEN: Siedler -> Bürger -> Kaufleute. Jede Stufe fasst mehr
// Leute, sieht anders aus und verlangt mehr.
//
// DIE ENTWURFSENTSCHEIDUNG DAHINTER: die Stufe ist ein ZAHLENFELD am Gebäude
// (b.tier), KEIN eigener Gebäudetyp. Drei Typen ('house', 'house2', 'house3')
// hätten drei Einträge in BUILDINGS, PLACEABLE_TOOLS, dem Baumenü, der
// Speicher-Whitelist und jeder `type === 'house'`-Abfrage im ganzen Spiel
// gebraucht - und der Aufstieg hätte ein Gebäude löschen und ein neues bauen
// müssen, samt Bewohnern, Timern und Straßenanschluss. Als Feld ist der
// Aufstieg dagegen eine einzige Zuweisung, und jede bestehende Abfrage auf
// 'house' gilt weiterhin für alle drei Stufen.
//
// Die BEDÜRFNISSE stehen als Liste in der Stufe selbst (`needs`), statt als
// Sonderfälle in den Prüffunktionen. Die vorhandenen Prüfungen (Brot, Kapelle,
// Wirtshaus+Bier, Kleidung, Luxus) bleiben unverändert - sie fragen nur noch
// vorher, ob DIESE Stufe das Bedürfnis überhaupt hat. Wer eine vierte Stufe
// ergänzen will, schreibt hier einen Eintrag und zeichnet ein Haus.
const HOUSE_TIERS = [
  {
    key: 'settler', name: 'Siedlerkate', short: 'Siedler', capacity: 6,
    needs: ['food', 'faith', 'clothes'],
    // Was der Aufstieg AUF diese Stufe kostet (aus dem Vorrat der Insel).
    upgradeCost: null,
    // Zusätzliche Voraussetzung, die schon erfüllt sein muss, BEVOR ein Haus
    // auf diese Stufe steigt (siehe canUpgradeHouse) - sonst stiege ein Haus
    // zu Bürgern auf und verlöre danach sofort Bewohner, weil das Wirtshaus
    // fehlt. Ein Aufstieg, der bestraft wird, wäre eine Falle.
    entry: null, entryText: ''
  },
  {
    key: 'citizen', name: 'Bürgerhaus', short: 'Bürger', capacity: 12,
    needs: ['food', 'faith', 'clothes', 'beer', 'school'],
    upgradeCost: { plank: 4, tools: 2 },
    // Schule zusätzlich zum Wirtshaus als Einstiegsvoraussetzung (v34.11):
    // "Bedürfnis der Bürger" heißt hier wie beim Wirtshaus, dass ein Haus nicht
    // ERST zu Bürgern aufsteigt und DANACH prompt Bewohner verliert, weil die
    // Schule fehlt - dieselbe Logik wie bei entry/entryText oben.
    entry: (h) => hasTavernCoverage(h) && hasSchoolCoverage(h),
    entryText: 'Wirtshaus und Schule in Reichweite'
  },
  {
    key: 'merchant', name: 'Kaufmannshaus', short: 'Kaufleute', capacity: 20,
    needs: ['food', 'faith', 'clothes', 'beer', 'luxury', 'school'],
    upgradeCost: { plank: 6, tools: 4 },
    entry: (h) => {
      const isl = islandOfBuilding(h);
      return LUXURY_GOODS.some(g => stockOf(isl, g) > 0);
    },
    entryText: 'ein Luxusgut auf der Insel (Zigarren, Gewürze, Pelzmantel, Tran oder Schmuck)'
  },
  // Adelssitz (NEU, v34.24) - die vierte Stufe. Die Adligen verlangen statt
  // des gewöhnlichen Luxus der Kaufleute ihren EIGENEN (Schmuck, Pelzmantel
  // oder Wein) UND zusätzlich Geschmeide aus Diamanten (beides zusammen:
  // Bedürfnis 'noble', siehe resolveNobleNeeds) sowie KULTUR - ein Theater
  // oder eine Kathedrale in Reichweite (Bedürfnis 'culture', kostet wie die
  // Kapelle Bewohner, wenn es fehlt). Dafür zahlen sie das Doppelte eines
  // Kaufmanns an Steuern.
  {
    key: 'noble', name: 'Adelssitz', short: 'Adlige', capacity: 30,
    needs: ['food', 'faith', 'clothes', 'beer', 'school', 'culture', 'noble'],
    upgradeCost: { plank: 10, stone: 8, tools: 6 },
    entry: (h) => {
      const isl = islandOfBuilding(h);
      return hasCultureCoverage(h) && NOBLE_LUXURY.some(g => stockOf(isl, g) > 0) && stockOf(isl, 'gem') > 0;
    },
    entryText: 'Theater oder Kathedrale in Reichweite, Schmuck/Pelzmantel/Wein und Geschmeide auf der Insel'
  }
];
// Luxus der Adligen (v34.24): EINES davon, dazu immer Geschmeide
const NOBLE_LUXURY = ['jewelry', 'furcoat', 'wine'];
const NOBLE_LUX_PER_HEADS = 30; // eine Einheit Luxus je 30 Adlige und Zyklus
const NOBLE_GEM_PER_HEADS = 40; // ein Geschmeide je 40 Adlige und Zyklus
const CULTURE_TYPES = ['theater', 'cathedral'];
function hasCultureCoverage(house) {
  for (const b of buildings) {
    if (!CULTURE_TYPES.includes(b.type)) continue;
    if (Math.hypot(b.x - house.x, b.y - house.y) <= b.def.radius) return true;
  }
  return false;
}
function tierOf(b) { return HOUSE_TIERS[b.tier || 0] || HOUSE_TIERS[0]; }
function houseCapacity(b) { return tierOf(b).capacity; }
function tierNeeds(b, need) { return tierOf(b).needs.includes(need); }
// Aufstieg: NICHT sofort, wenn alles erfüllt ist, sondern zufällig nach einer
// Weile (so vom Nutzer gewünscht). Das Haus muss dafür durchgehend bereit sein
// - fällt eine Voraussetzung weg, beginnt die Wartezeit von vorn. Der
// Zufallsanteil sorgt dafür, dass ein gleichzeitig gebautes Viertel nicht im
// Gleichschritt aufsteigt, sondern nach und nach.
const UPGRADE_WAIT_MIN = 45000, UPGRADE_WAIT_MAX = 120000;

// ---- Steuern (NEU, v33) -----------------------------------------------------
// Bis v32 entstand Geld nur in der Münzprägerei oder durch Verkauf am Kontor -
// obwohl in den Häusern die Leute wohnen, die eigentlich zahlen. Steuern
// schließen diesen Kreis: die Bevölkerung wird zur Einnahmequelle, und der
// Aufstieg eines Hauses bekommt neben "mehr Platz" einen zweiten, klar
// wirtschaftlichen Sinn.
//
// Der Ertrag hängt an der WOHNSTUFE, nicht an der bloßen Kopfzahl: ein
// Kaufmann bringt das Fünffache eines Siedlers. Damit lohnt sich der Ausbau
// eines bestehenden Viertels mehr als das Danebensetzen weiterer Katen.
const TAX_INTERVAL = 20000; // ms zwischen zwei Steuerzyklen (wie die Bedürfnis-Zyklen)
const TAX_PER_HEAD = [0.06, 0.16, 0.36, 0.72]; // Adlige (v34.24): das Doppelte eines Kaufmanns // Münzen je Bewohner und Zyklus, je Stufe
// Der Steuersatz wird JE INSEL eingestellt - er ist damit eine echte
// Entscheidung und kein bloßer Zufluss: hohe Steuern bringen fast das Doppelte,
// frieren aber Wachstum UND Aufstieg auf dieser Insel ein; niedrige Steuern
// bringen die Hälfte, lassen die Häuser dafür spürbar schneller aufsteigen.
//
// WICHTIG: hohe Steuern kosten NIE Bewohner. Das folgt derselben Linie wie
// Kleidung und Luxus (siehe resolveClothesNeeds): eine neue Regel, die
// bestehende Dörfer rückwirkend schrumpfen lässt, wäre eine Bestrafung für
// etwas, das der Spieler beim Bauen nicht wissen konnte.
const TAX_RATES = [
  { key: 'low', label: 'niedrig', factor: 0.5, growth: true, upgradeFactor: 0.6, hint: 'halbe Einnahmen, Häuser steigen schneller auf' },
  { key: 'normal', label: 'normal', factor: 1.0, growth: true, upgradeFactor: 1.0, hint: 'ausgewogen' },
  { key: 'high', label: 'hoch', factor: 1.9, growth: false, upgradeFactor: 1.0, hint: 'fast doppelte Einnahmen, dafür kein Wachstum und kein Aufstieg' }
];
const TAX_RATE_DEFAULT = 1;
function taxRateOf(islandId) {
  const isl = islands[islandId];
  return TAX_RATES[(isl && isl.taxRate !== undefined ? isl.taxRate : TAX_RATE_DEFAULT)] || TAX_RATES[1];
}
function setTaxRate(islandId, idx) {
  if (islands[islandId]) islands[islandId].taxRate = Math.max(0, Math.min(TAX_RATES.length - 1, idx));
}
// Ob DIESE Insel ein Rathaus hat (NEU, v34.13) - das Verwaltungsgebäude, ohne
// das auf einer Insel keine Steuern erhoben werden (siehe taxIncomeOf). Wie
// beim Kontor gilt `oncePerIsland`, hier genügt aber schon EIN Vorkommen auf
// der jeweiligen Insel als Ja/Nein-Prüfung, kein Umkreis wie bei Kapelle/
// Wirtshaus/Schule - das Rathaus verwaltet die ganze Insel, nicht nur ihre
// unmittelbare Nachbarschaft (dieselbe Insel-statt-Radius-Logik wie beim
// Kontor als Warenknoten).
function hasRathaus(islandId) {
  return buildings.some(b => b.type === 'rathaus' && islandOfBuilding(b) === islandId);
}
// Was diese Insel je Steuerzyklus einbringt - auch als Vorschau fürs Panel.
// OHNE RATHAUS: 0, unabhängig vom eingestellten Steuersatz (NEU, v34.13) -
// der Satz lässt sich zwar schon vorher wählen (damit er feststeht, sobald
// das Rathaus fertig ist), bringt aber erst mit Rathaus tatsächlich Geld.
function taxIncomeOf(islandId) {
  if (!hasRathaus(islandId)) return 0;
  let sum = 0;
  for (const b of buildings) {
    if (b.type !== 'house' || islandOfBuilding(b) !== islandId) continue;
    sum += (b.population || 0) * (TAX_PER_HEAD[Math.min(TAX_PER_HEAD.length - 1, b.tier || 0)] || 0);
  }
  return sum * taxRateOf(islandId).factor;
}
let taxTimer = 0;
// Die Einnahmen fließen in die KARTENWEITE Kasse (v29.1) - Steuern sind Geld,
// und Geld ist im Spiel bewusst nicht inselgebunden. Gerechnet wird mit
// Bruchteilen; angezeigt und ausgegeben wird ohnehin nur in ganzen Münzen
// (siehe updateResourceUI/tradeBuy), sodass kein Rundungsverlust entsteht.
function updateTaxes(dt) {
  taxTimer += dt;
  if (taxTimer < TAX_INTERVAL) return;
  taxTimer -= TAX_INTERVAL;
  let gesamt = 0;
  for (const isl of islands) gesamt += taxIncomeOf(isl.id);
  if (gesamt <= 0) return;
  treasury += gesamt;
  lastTaxIncome = gesamt;
}
let lastTaxIncome = 0;

// ---- Schule (NEU, v34.11) ----------------------------------------------------
// Erstes Gebäude, dessen BETRIEB laufend Geld kostet statt nur Bretter beim Bau
// zu verlangen - bislang floss Geld nur in eine Richtung: als Steuerertrag INS
// Dorf. Vorbild ist der Leuchtturm/Tran (siehe updateLighthouses): dort
// verbraucht ein Gebäude einmal je Prüfintervall eine Insel-Ware, hier
// verbraucht es stattdessen die KARTENWEITE Kasse (treasury) - Geld ist wie
// bei den Steuern bewusst nicht inselgebunden (siehe updateTaxes-Kommentar).
// b.funded ist wie isl.lighthouseFueled reiner LAUFZEIT-Zustand (siehe
// HOUSE_FIELDS-Kommentar zu additiven Feldern) und wird beim Laden immer neu
// mit false vorbelegt, bis die erste Prüfung läuft - kein Save-Feld nötig.
const SCHOOL_CHECK_INTERVAL = 40000; // ms zwischen zwei Bezahl-Prüfungen je Schule (gleicher Rhythmus wie Nahrung/Glaube)
const SCHOOL_UPKEEP = 4; // Münzen aus der Kasse je Schule und Prüfzyklus
// Bildung ist wie Glaube eine reine Abdeckungsprüfung (kein gemeinsames,
// verbrauchbares Gut zwischen mehreren Häusern) - deshalb dieselbe
// "Streak"-Toleranz wie FAITH_STARVE_STREAK statt einer Warteschlange.
const SCHOOL_STARVE_STREAK = 3;
let schoolUpkeepTimer = 0;
// Zahlt für JEDE Schule auf der Karte ihren Unterhalt aus der Kasse, sofern
// genug Münzen da sind - reicht es nicht, bleibt sie unbezahlt (b.funded =
// false) und wirkt bis zur nächsten Prüfung nicht, GENAU wie ein Leuchtturm
// ohne Tran. Eine Schule kostet dabei NIE Bewohner direkt - sie wird einfach
// wirkungslos, und das spüren die Häuser über hasSchoolCoverage weiter unten.
function updateSchoolUpkeep(dt) {
  schoolUpkeepTimer += dt;
  if (schoolUpkeepTimer < SCHOOL_CHECK_INTERVAL) return;
  schoolUpkeepTimer -= SCHOOL_CHECK_INTERVAL;
  for (const b of buildings) {
    if (b.type !== 'school') continue;
    if (treasury >= SCHOOL_UPKEEP) {
      treasury -= SCHOOL_UPKEEP;
      b.funded = true;
    } else {
      b.funded = false;
    }
  }
}

// ---- Freischaltung von Gebäuden über die Bevölkerung (NEU, v31) -------------
// Gesperrt sind BEWUSST nur die Gebäude, die zu den Bedürfnissen höherer
// Stufen gehören - nicht der halbe Baukatalog. Wer nur Siedler hat, kann keine
// Tabakplantage bauen; alles, was zum Aufbau selbst nötig ist (Sägewerk, Mine,
// Hafen, Kontor ...), bleibt von Anfang an verfügbar.
//
// `tier` heißt "Bewohner in Häusern MINDESTENS dieser Stufe". Die Wirtshaus-
// Kette hängt deshalb an der Gesamtbevölkerung (Stufe 0), die Südfrüchte an
// den Bürgern (Stufe 1) - und nicht an den Kaufleuten selbst, denn sonst
// entstünde ein Henne-Ei-Problem: Kaufleute verlangen Luxus, den man ohne
// Plantage nirgends herbekäme.
const BUILD_UNLOCKS = {
  tavern:      { tier: 0, pop: 18 },
  brewery:     { tier: 0, pop: 18 },
  hopfarm:     { tier: 0, pop: 18 },
  tobaccofarm: { tier: 1, pop: 12 },
  spicefarm:   { tier: 1, pop: 12 },
  // Adelsstufe (v34.24): alles, was die Adligen brauchen, kommt mit den
  // Kaufleuten - vorher gibt es niemanden, der es verlangen würde.
  vineyard:    { tier: 2, pop: 10 },
  winery:      { tier: 2, pop: 10 },
  jeweler:     { tier: 2, pop: 20 },
  theater:     { tier: 2, pop: 20 },
  cathedral:   { tier: 2, pop: 40 }
};
// Einmal freigeschaltet, bleibt ein Gebäude verfügbar: gespeichert wird
// deshalb der HÖCHSTSTAND je Stufe, nicht der aktuelle. Eine Hungersnot soll
// nicht mitten im Spiel die Tabakfarm aus dem Baumenü nehmen - der Spieler
// hätte dann eine Kette in der Hand, die er nicht mehr reparieren kann.
let popPeak = [0, 0, 0, 0];
function populationInTier(minTier) {
  let sum = 0;
  for (const b of buildings) {
    if (b.type !== 'house') continue;
    if ((b.tier || 0) >= minTier) sum += b.population || 0;
  }
  return sum;
}
function refreshPopPeak() {
  for (let t = 0; t < HOUSE_TIERS.length; t++) popPeak[t] = Math.max(popPeak[t] || 0, populationInTier(t));
}
function unlockInfo(type) {
  const rule = BUILD_UNLOCKS[type];
  if (!rule) return null;
  // Bewusst NUR der gemerkte Höchststand, nicht die aktuelle Zahl: unlockInfo
  // läuft über die Bauvorschau in jedem Bild, und populationInTier geht dabei
  // jedes Mal über alle Gebäude. Der Höchststand wird dort aufgefrischt, wo
  // sich die Bevölkerung ändern kann (Wachstum, Aufstieg, Laden).
  const have = popPeak[rule.tier] || 0;
  return {
    ok: have >= rule.pop,
    have, need: rule.pop,
    text: rule.tier === 0 ? `ab ${rule.pop} Einwohnern`
      : `ab ${rule.pop} ${HOUSE_TIERS[rule.tier].short}`
  };
}
function isBuildingUnlocked(type) {
  const info = unlockInfo(type);
  return !info || info.ok;
}

// Zerfalls-Timer (b.noRoadTimer) hoch (siehe decayDisconnectedBuildings);

// Rohstoff-Erzeuger (liefern in ein Fach ihrer eigenen storage) und
// Verarbeiter (Input -> Output), datengetrieben für Produktion & Logistik.
// Ein Erzeuger-TYP kann mehr als eine Ware liefern: die Mine steht seit v29
// zweimal in dieser Liste (Eisen im Norden und in der Mitte, Gold im Süden -
// welches davon, entscheidet die Ader unter der Spitzhacke, siehe oreOfTile).
// Wer diese Liste ausliest, muss deshalb ALLE Einträge eines Typs betrachten
// und nicht nur den ersten - genau das war der Fehler in v29: `find` statt
// `filter` in runLogistics ließ das geförderte Gold für immer in der Mine
// liegen, weil die Träger dort ausschließlich nach Eisen suchten.
const PRODUCERS = [
  { type: 'woodcutter', good: 'wood' },
  { type: 'farm', good: 'grain' },
  { type: 'mine', good: 'iron' },
  { type: 'mine', good: 'gold' },

  // Genau hier lag der Fehler aus v29.2 - wer diese Tabelle mit `find` statt
  // `filter` ausliest, schickt an einer Mine nur Träger für EISEN los und das
  // geförderte Kupfer bliebe für immer im Gebäudepuffer liegen.
  { type: 'mine', good: 'copper' },
  { type: 'mine', good: 'diamond' },
  { type: 'hopfarm', good: 'hops' },
  { type: 'quarry', good: 'stone' },
  { type: 'fishery', good: 'fish' },
  { type: 'sheepfarm', good: 'wool' },
  // Zweiter Erzeuger für DASSELBE Gut (NEU, v34.15): Wolle kommt jetzt aus der
  // Schaffarm (gemäßigt) ODER der Baumwollfarm (Süden). Anders als bei der
  // Mine, die zwei verschiedene Güter liefert und deshalb `filter` statt `find`
  // erzwang (siehe v29.2), ist dieser Fall harmlos: jede Auswertung dieser
  // Liste fragt entweder nach dem TYP (producerGoodsOf) oder nach dem Paar
  // (Typ, Gut) - ein Typ mit mehreren Gütern ist die kritische Richtung,
  // mehrere Typen mit demselben Gut nicht.
  { type: 'cottonfarm', good: 'wool' },
  { type: 'hunter', good: 'meat' },
  { type: 'tobaccofarm', good: 'tobacco' },
  { type: 'spicefarm', good: 'spice' },
  { type: 'furhunter', good: 'fur' },
  { type: 'whaler', good: 'oil' },

// Alle Waren, die dieser Erzeuger-Typ liefern kann (fast immer genau eine).
function producerGoodsOf(type) {
  return PRODUCERS.filter(p => p.type === type).map(p => p.good);

// Was fördert dieses konkrete Gebäude gerade? Für die Anzeige: die Ware, die
// tatsächlich im Lager liegt - und solange es leer ist, die Ware der nächsten
// erreichbaren Ader (bei allen anderen Erzeugern schlicht ihre einzige Ware).
function currentProducerGood(b) {
  const goods = producerGoodsOf(b.type);
  if (goods.length === 0) return null;
  if (goods.length === 1) return goods[0];
  const mitBestand = goods.find(g => (b.storage[g] || 0) > 0);
  if (mitBestand) return mitBestand;
  if (b.type === 'mine') {
    const vein = findNearestOreVein(b.x, b.y, b.def.radius);
    if (vein) return vein.ore;
  }
  return goods[0];
}
